        /* ============================================================
           GOVERNMENT MANAGER — INLINE STYLES
           (replaces css/gov-manager.css; no external link)
           ============================================================ */

        /* ---- App shell ---- */
        html, body { height: 100%; margin: 0; overflow: hidden; }
        body { display: flex; flex-direction: column; }

        .topbar { position: relative; z-index: 100; flex-shrink: 0; }

        .world-app {
            display: flex;
            flex-direction: row;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        .locations-sidebar {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg2);
            border-right: 1px solid var(--border);
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--bg3);
        }

        .sidebar-header h3 {
            margin: 0;
            font-family: var(--f-display);
            font-size: 0.65rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent);
        }

        .place-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            min-height: 0;
        }

        .main-panel {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
        }

        .tab-content-wrapper {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 16px;
        }

        /* ---- Topbar buttons ---- */
        .tb-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 5px 12px;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: var(--f-body);
            font-size: 0.65rem;
            font-weight: 500;
            cursor: pointer;
            transition: border-color 0.15s ease, background-color 0.15s ease, color 0.15s ease;
        }
        .tb-btn:hover { border-color: var(--accent); background: var(--accent-dim); color: var(--accent-light); }
        .tb-btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
        .tb-btn.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }

        /* ---- Theme toggle dropdown ---- */
        .theme-toggle { position: relative; display: inline-flex; }
        .theme-toggle__btn { gap: 6px; }
        .theme-toggle__menu {
            position: absolute;
            top: calc(100% + 4px);
            right: 0;
            z-index: 9999;
            min-width: 160px;
            max-height: 60vh;
            padding: 4px;
            margin: 0;
            list-style: none;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow-y: auto;
        }
        .theme-toggle__menu[hidden] { display: none; }
        .theme-toggle__menu button {
            display: block;
            width: 100%;
            padding: 6px 12px;
            text-align: left;
            background: transparent;
            border: none;
            color: var(--text);
            font-family: var(--f-body);
            font-size: 0.7rem;
            border-radius: calc(var(--radius) - 2px);
            cursor: pointer;
            transition: background-color 0.15s ease;
        }
        .theme-toggle__menu button:hover,
        .theme-toggle__menu button:focus-visible {
            background: var(--accent-dim);
            color: var(--accent-light);
            outline: none;
        }

        /* ---- Panel-tabs hidden (sub-tabs are the real nav) ---- */
        .panel-tabs { display: none !important; }

        /* ---- Government sub-tab strip ---- */
        .gov-subtabs {
            position: sticky;
            top: 0;
            background: var(--bg);
            z-index: 10;
            display: flex;
            gap: 2px;
            padding: 0 4px;
            margin-bottom: 14px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }
        .gov-subtab {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: transparent;
            border: 1px solid transparent;
            border-bottom: 2px solid transparent;
            border-radius: 4px 4px 0 0;
            font-family: var(--f-display);
            font-size: 0.68rem;
            letter-spacing: 0.05em;
            color: var(--dim);
            cursor: pointer;
            transition: color 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
        }
        .gov-subtab:hover { color: var(--accent-light); background: var(--accent-dim); }
        .gov-subtab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
            background: var(--accent-dim);
            font-weight: 600;
        }
        .gov-subtab-icon { display: inline-flex; width: 1em; height: 1em; align-items: center; justify-content: center; color: currentColor; }
        .gov-subtab-icon svg { width: 100%; height: 100%; fill: currentColor; }
        .gov-subpanel { min-height: 200px; }

        /* ---- Inside sub-panel: details / departments / etc ---- */
        .gov-details-container, .dept-tab-container, .law-tab-container, .eco-details-container { padding: 4px; }

        .gov-details-header, .dept-tab-header, .law-tab-header, .eco-details-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }
        .gov-details-header h3, .dept-tab-header h3, .law-tab-header h3, .eco-details-header h3 {
            margin: 0;
            font-size: 0.85rem;
            color: var(--accent);
            font-family: var(--f-display);
        }

        /* Buttons inside sub-panels */
        .gov-btn, .dept-btn, .law-btn, .eco-btn, .gh-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 5px 12px;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: var(--f-body);
            font-size: 0.65rem;
            font-weight: 500;
            cursor: pointer;
            transition: border-color 0.15s ease, background-color 0.15s ease, color 0.15s ease;
        }
        .gov-btn:hover, .dept-btn:hover, .law-btn:hover, .eco-btn:hover, .gh-btn:hover {
            border-color: var(--accent);
            background: var(--accent-dim);
            color: var(--accent-light);
        }
        .gov-btn.primary, .dept-btn-add, .law-btn-add, .gh-btn-add {
            background: var(--accent); border-color: var(--accent); color: var(--accent-fg);
        }
        .gov-btn.primary:hover, .dept-btn-add:hover, .law-btn-add:hover, .gh-btn-add:hover {
            background: var(--accent-dark); border-color: var(--accent-dark);
        }
        .dept-btn-delete, .law-btn-delete, .gh-btn-end {
            color: var(--danger-lt);
            border-color: var(--danger-lt);
        }
        .dept-btn-delete:hover, .law-btn-delete:hover, .gh-btn-end:hover {
            background: var(--danger-soft); border-color: var(--danger);
            color: var(--danger-lt);
        }
        .dept-btn-small { padding: 2px 8px; font-size: 0.55rem; }

        /* Form primitives inside sub-panels */
        .form-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
        .form-group label {
            font-size: 0.7rem;
            color: var(--accent);
            font-family: var(--f-display);
            letter-spacing: 0.04em;
        }
        .form-control {
            width: 100%;
            padding: 6px 10px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: var(--f-body);
            font-size: 0.7rem;
            box-sizing: border-box;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-soft);
        }

        /* Card primitives used by departments / details / history */
        .dept-card, .eco-stat-card, .gh-leader-card, .gh-official-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 8px;
        }
        .dept-header, .eco-details-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-light);
            margin-bottom: 8px;
        }
        .dept-name, .eco-stat-value, .gh-leader-name, .gh-official-name {
            font-weight: 600;
            color: var(--accent);
            font-family: var(--f-display);
        }

        /* Stats blocks */
        .dept-stats, .law-stats-summary, .gh-stats-summary {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 8px 0;
        }
        .dept-stat, .law-stat, .gh-stat {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 90px;
        }
        .dept-stat-label, .law-stat-label, .gh-stat-label {
            font-size: 0.55rem;
            color: var(--dim);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-family: var(--f-display);
        }
        .dept-stat-value, .law-stat-value, .gh-stat-value {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text);
            font-family: var(--f-mono);
        }

        /* Empty states */
        .dept-empty, .law-empty, .gh-empty, .gov-details-empty, .eco-details-empty, .gh-details-empty {
            padding: 30px 20px;
            text-align: center;
            color: var(--dim);
            font-size: 0.75rem;
            background: var(--bg2);
            border: 1px dashed var(--border);
            border-radius: var(--radius);
        }

        /* ---- Toast / icons fix ---- */
        .toast-message { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .toast-message svg { flex-shrink: 0; }
        .icon-svg { display: inline-block; width: 1em; height: 1em; vertical-align: middle; fill: currentColor; }

        /* ---- No shadows/blurs anywhere for mobile ---- */
        .toast { box-shadow: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
        .modal-container { box-shadow: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
        .btn:hover { box-shadow: none !important; }

        /* ---- Sidebar overlay ---- */
        .sidebar-overlay { display: none; }
        .sidebar-overlay.active { display: block; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 999; }

        /* ---- Mobile layout ---- */
        @media (max-width: 768px) {
            .world-app { flex-direction: column; }
            .locations-sidebar {
                position: fixed;
                top: 0; bottom: 0; left: 0;
                height: 100vh;
                width: 85%; max-width: 280px;
                z-index: 1000;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
                box-shadow: none;
            }
            .locations-sidebar.visible { transform: translateX(0); }
            .gov-subtabs { flex-wrap: wrap; }
            .gov-subtab { flex: 1 1 100%; border-bottom: 1px solid var(--border); }
        }
    </style>
</head>

<!-- ============================================================
     SUB-TAB HOST
     ============================================================ -->
<script>
    (function () {
        'use strict';
        var GOV_SUBTABS = [
            { id: 'details', label: 'Details', icon: 'CROWN', render: function (c, p) { if (window.GovernmentDetailsTab) window.GovernmentDetailsTab.render(c, p); } },
            { id: 'departments', label: 'Departments', icon: 'HOUSEHOLD', render: function (c, p) { if (window.DepartmentsTab) window.DepartmentsTab.render(c, p); } },
            { id: 'history', label: 'History', icon: 'TIMELINE', render: function (c, p) { if (window.GovernmentHistoryTab) window.GovernmentHistoryTab.render(c, p); } },
            { id: 'laws', label: 'Civil Laws', icon: 'SHIELD', render: function (c, p) { if (window.LawsTab) window.LawsTab.render(c, p); } },
            { id: 'economy', label: 'Economy', icon: 'COIN', render: function (c, p) { if (window.EconomyDetailsTab) window.EconomyDetailsTab.render(c, p); } }
        ];
        var _activeSubtabId = 'details';
        function _icon(name) { return (window.Icons && typeof window.Icons[name] === 'string') ? window.Icons[name] : ''; }
        function _esc(s) { return typeof window.escapeHtml === 'function' ? window.escapeHtml(s) : String(s == null ? '' : s); }

        function renderSubtabStrip(containerId, placeId) {
            var container = document.getElementById(containerId);
            if (!container) return;
            var stripHtml = '<div class="gov-subtabs" role="tablist">';
            for (var i = 0; i < GOV_SUBTABS.length; i++) {
                var t = GOV_SUBTABS[i];
                var active = t.id === _activeSubtabId ? ' active' : '';
                stripHtml += '<button type="button" class="gov-subtab' + active + '" data-subtab-id="' + _esc(t.id) + '">' +
                    (_icon(t.icon) ? '<span class="gov-subtab-icon">' + _icon(t.icon) + '</span>' : '') +
                    '<span>' + _esc(t.label) + '</span></button>';
            }
            stripHtml += '</div>';
            var panelHtml = '<div id="' + _esc(containerId) + '-subpanel" class="gov-subpanel" role="tabpanel"></div>';
            container.innerHTML = stripHtml + panelHtml;
            var buttons = container.querySelectorAll('.gov-subtab');
            for (var b = 0; b < buttons.length; b++) {
                (function (btn) {
                    btn.addEventListener('click', function () {
                        var id = btn.getAttribute('data-subtab-id');
                        if (id && id !== _activeSubtabId) { _activeSubtabId = id; renderSubtabStrip(containerId, placeId); }
                    });
                })(buttons[b]);
            }
            var activeTab = null;
            for (var j = 0; j < GOV_SUBTABS.length; j++) {
                if (GOV_SUBTABS[j].id === _activeSubtabId) { activeTab = GOV_SUBTABS[j]; break; }
            }
            if (activeTab) activeTab.render(containerId + '-subpanel', placeId);
        }
        window.renderGovernmentTab = function (containerId, placeId) { renderSubtabStrip(containerId, placeId); };
    })();
</script>

<script>
(function() {
    'use strict';
    function getIcon(name) { return (window.Icons && window.Icons[name]) ? window.Icons[name] : ''; }
    function iconWithText(icon, text) {
        if (!icon) return text || '';
        return '<span style="display:inline-flex;align-items:center;gap:4px;vertical-align:middle;">' + icon + '<span>' + (text || '') + '</span></span>';
    }
    var currentPlaceId = null;
    var isInitialized = false;
    function showToast(msg, type) { if (typeof window.showToast === 'function') window.showToast(msg, type); }
    function getPlaces() { return typeof window.getPlaces === 'function' ? window.getPlaces() : []; }

    function setupUIText() {
        var title = document.getElementById('govManagerTitle');
        if (title) title.innerHTML = iconWithText(getIcon('CROWN'), ' GOVERNMENT MANAGER');
        var sidebarTitle = document.getElementById('sidebarTitle');
        if (sidebarTitle) sidebarTitle.innerHTML = iconWithText(getIcon('LOCATION'), ' GOVERNMENTS');
        var addBtn = document.getElementById('addGovBtn');
        if (addBtn) addBtn.innerHTML = iconWithText(getIcon('PLUS'), ' Government');
        var importBtn = document.getElementById('importBtn');
        if (importBtn) importBtn.innerHTML = iconWithText(getIcon('ARROW_RIGHT'), ' Import');
        var exportBtn = document.getElementById('exportBtn');
        if (exportBtn) exportBtn.innerHTML = iconWithText(getIcon('ARROW_RIGHT'), ' Export');
        var refreshBtn = document.getElementById('refreshBtn');
        if (refreshBtn) refreshBtn.innerHTML = iconWithText(getIcon('REFRESH'), ' Refresh');
        var loadingText = document.getElementById('loadingText');
        if (loadingText) loadingText.textContent = 'Loading governments...';
        var emptyState = document.getElementById('emptyStateText');
        if (emptyState) emptyState.textContent = 'Select a government from the sidebar';
    }

    function setupLocationTree() {
        var container = document.getElementById('placeList');
        if (!container) return;
        if (window.LocationUI && typeof window.LocationUI.renderLocationList === 'function') {
            try {
                window.LocationUI.renderLocationList('placeList', {
                    selectedId: currentPlaceId,
                    onSelect: function(placeOrId) {
                        // Accept both a place object and a raw id — different
                        // LocationUI versions pass different shapes.
                        var id = (typeof placeOrId === 'string') ? placeOrId
                               : (placeOrId && placeOrId.id ? placeOrId.id : null);
                        if (!id) return;
                        currentPlaceId = id;
                        renderGovernmentTab();
                        if (window.innerWidth <= 768) closeSidebar();
                    }
                });
                return;
            } catch (e) { console.error(e); }
        }
        // Fallback: read places and build a flat list.
        var places = getPlaces();
        if (places && places.length > 0) {
            var html = '<div class="place-tree">';
            for (var i = 0; i < places.length; i++) {
                var p = places[i];
                var sel = (p.id === currentPlaceId);
                html += '<div class="place-item' + (sel ? ' selected' : '') + '" data-place-id="' + p.id + '" style="padding:6px 10px;cursor:pointer;border-bottom:1px solid var(--border);' + (sel ? 'background:var(--accent-dim);' : '') + '"><span>' + (p.displayName || p.name || 'Unknown') + '</span></div>';
            }
            html += '</div>';
            container.innerHTML = html;
            var items = container.querySelectorAll('.place-item');
            for (var j = 0; j < items.length; j++) {
                (function(item) {
                    item.addEventListener('click', function() {
                        var placeId = this.dataset.placeId;
                        if (placeId) { currentPlaceId = placeId; renderGovernmentTab(); if (window.innerWidth <= 768) closeSidebar(); }
                    });
                })(items[j]);
            }
        } else {
            container.innerHTML = '<div class="empty-state">No governments found</div>';
        }
    }

    function closeSidebar() { var s = document.getElementById('locationsSidebar'); var o = document.getElementById('sidebarOverlay'); if (s) s.classList.remove('visible'); if (o) o.classList.remove('active'); }
    function openSidebar() { var s = document.getElementById('locationsSidebar'); var o = document.getElementById('sidebarOverlay'); if (s) s.classList.add('visible'); if (o) o.classList.add('active'); }
    function toggleSidebar() { if (document.getElementById('locationsSidebar').classList.contains('visible')) closeSidebar(); else openSidebar(); }

    function renderGovernmentTab() {
        var panel = document.getElementById('panelContent');
        if (!panel) return;
        if (!currentPlaceId) {
            var places = getPlaces();
            if (places && places.length > 0) {
                for (var i = 0; i < places.length; i++) { if (places[i].variableKey && places[i].variableKey !== 'world_root') { currentPlaceId = places[i].id; break; } }
                if (!currentPlaceId && places.length > 0) currentPlaceId = places[0].id;
            }
        }
        if (!currentPlaceId) { panel.innerHTML = '<div class="empty-state">Select a government from the sidebar</div>'; return; }
        if (typeof window.renderGovernmentTab === 'function') { window.renderGovernmentTab('panelContent', currentPlaceId); }
    }

    function setupTopBarActions() {
        document.getElementById('addGovBtn').onclick = function() {
            var lid = currentPlaceId || (getPlaces()[0] || {}).id;
            if (!lid) { showToast('No government selected', 'warning'); return; }
            if (typeof window.openCreateGovernmentDepartmentModal === 'function') {
                window.openCreateGovernmentDepartmentModal(lid, renderGovernmentTab);
            } else {
                showToast('Create Department modal not loaded', 'error');
            }
        };
        document.getElementById('importBtn').onclick = function() {
            if (typeof window.importData !== 'function') { showToast('Import not available', 'error'); return; }
            window.importData()
                .then(function() {
                    // Resolve only after FileReader + save complete.
                    if (window.GovernmentBootstrap && window.GovernmentBootstrap.reinit) {
                        try { window.GovernmentBootstrap.reinit(); } catch (e) { /* ignore */ }
                    }
                    setupLocationTree();
                    renderGovernmentTab();
                    showToast('Import successful', 'success');
                })
                .catch(function(err) {
                    showToast('Import failed: ' + (err && err.message ? err.message : 'unknown'), 'error');
                });
        };
        document.getElementById('exportBtn').onclick = function() {
            if (typeof window.exportData !== 'function') { showToast('Export not available', 'error'); return; }
            try {
                window.exportData();
                showToast('Export started', 'success');
            } catch (e) {
                showToast('Export failed: ' + (e.message || 'unknown'), 'error');
            }
        };
        document.getElementById('refreshBtn').onclick = function() {
            if (typeof window.loadMasterData === 'function') window.loadMasterData();
            setTimeout(function() { setupLocationTree(); renderGovernmentTab(); showToast('Refreshed', 'success'); }, 100);
        };
    }

    function init() {
        if (isInitialized) return; isInitialized = true;
        setupUIText();
        if (typeof window.loadMasterData === 'function') window.loadMasterData();
        if (window.GovernmentBootstrap) window.GovernmentBootstrap.init();
        setTimeout(function() {
            setupLocationTree();
            setupTopBarActions();
            renderGovernmentTab();
            document.getElementById('menuToggle').addEventListener('click', toggleSidebar);
            document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);
        }, 150);
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>

<script>
(function () {
    'use strict';
    var themeBtn = document.getElementById('themeBtn');
    var themeMenu = document.getElementById('themeMenu');
    var themeName = document.getElementById('themeName');
    var switcher = window.ThemeSwitcher;
    if (!switcher) return;
    function updateLabel(id) { var label = id.charAt(0).toUpperCase() + id.slice(1).replace(/-/g, ' '); if (themeName) themeName.textContent = label; }
    function buildMenu() {
        var html = '';
        for (var i = 0; i < switcher.themes.length; i++) {
            var id = switcher.themes[i];
            var label = id.charAt(0).toUpperCase() + id.slice(1).replace(/-/g, ' ');
            html += '<li role="none"><button role="menuitem" type="button" data-theme-id="' + id + '">' + label + '</button></li>';
        }
        if (themeMenu) themeMenu.innerHTML = html;
    }
    function openMenu() { if (themeMenu) { themeMenu.hidden = false; themeBtn.setAttribute('aria-expanded', 'true'); } }
    function closeMenu() { if (themeMenu) { themeMenu.hidden = true; themeBtn.setAttribute('aria-expanded', 'false'); } }
    if (themeBtn) themeBtn.addEventListener('click', function (e) { e.stopPropagation(); if (themeMenu.hidden) openMenu(); else closeMenu(); });
    if (themeMenu) themeMenu.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-theme-id]'); if (!btn) return;
        var id = btn.getAttribute('data-theme-id'); switcher.apply(id); updateLabel(id); closeMenu();
    });
    document.addEventListener('click', function (e) {
        if (themeMenu && !themeMenu.hidden) { if (themeMenu.contains(e.target)) return; if (e.target === themeBtn) return; closeMenu(); }
    });
    buildMenu();
    var saved = switcher.getSaved();
    if (saved) updateLabel(saved);
})();
</script>
