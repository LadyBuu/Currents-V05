    <style>
        /* CORE LAYOUT */
        html, body { height: 100%; margin: 0; overflow: hidden; }
        body { display: flex; flex-direction: column; }
        .topbar { flex-shrink: 0; }
        
        .world-app {
            display: flex;
            flex-direction: row;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }
        
        .locations-sidebar {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg2);
            border-right: 1px solid var(--border);
        }
        
        .main-panel {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
        }
        
        .tab-content-wrapper {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 16px;
        }

        /* TABS */
        .panel-tabs { display: none !important; } /* Hide top redundant tabs */
        .gov-subtabs {
            position: sticky;
            top: 0;
            background: var(--bg);
            z-index: 10;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }
        .gov-subtab {
            padding: 10px 16px;
            border-bottom: 2px solid transparent;
        }
        .gov-subtab.active {
            border-bottom-color: var(--accent);
            background: var(--accent-dim);
            color: var(--accent);
        }

        /* FIX SVG LEAKING AND TOASTS */
        .toast-message { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .toast-message svg { flex-shrink: 0; }
        .icon-svg { display: inline-block; width: 1em; height: 1em; vertical-align: middle; fill: currentColor; }

        /* REMOVE SHADOWS AND BLURS FOR MOBILE */
        .toast { box-shadow: none; backdrop-filter: none; }
        .modal-container { box-shadow: none; backdrop-filter: none; }
        .btn:hover { box-shadow: none; }

        /* MOBILE SPECIFIC */
        @media (max-width: 768px) {
            .world-app { flex-direction: column; }
            .locations-sidebar {
                position: fixed;
                top: 0;
                bottom: 0;
                left: 0;
                height: 100vh;
                width: 85%;
                max-width: 280px;
                z-index: 1000;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
                box-shadow: none;
            }
            .locations-sidebar.visible { transform: translateX(0); }
            .sidebar-overlay {
                display: none;
                position: fixed;
                top: 0; left: 0; right: 0; bottom: 0;
                background: rgba(0,0,0,0.8);
                z-index: 999;
            }
            .sidebar-overlay.active { display: block; }
            
            .gov-subtabs { flex-wrap: wrap; }
            .gov-subtab { flex: 1 1 100%; border-bottom: 1px solid var(--border); }
        }
    </style>
</head>

<script>
    (function () {
        'use strict';

        var GOV_SUBTABS = [
            { id: 'details', label: 'Details', icon: 'CROWN', render: function (c, p, r) { if (window.GovernmentDetailsTab) window.GovernmentDetailsTab.render(c, p); } },
            { id: 'departments', label: 'Departments', icon: 'HOUSEHOLD', render: function (c, p, r) { if (window.DepartmentsTab) window.DepartmentsTab.render(c, p); } },
            { id: 'history', label: 'History', icon: 'TIMELINE', render: function (c, p, r) { if (window.GovernmentHistoryTab) window.GovernmentHistoryTab.render(c, p); } },
            { id: 'laws', label: 'Civil Laws', icon: 'SHIELD', render: function (c, p, r) { if (window.LawsTab) window.LawsTab.render(c, p); } },
            { id: 'economy', label: 'Economy', icon: 'COIN', render: function (c, p, r) { if (window.EconomyDetailsTab) window.EconomyDetailsTab.render(c, p); } }
        ];
        var _activeSubtabId = 'details';
        function _icon(name) { return (window.Icons && typeof window.Icons[name] === 'string') ? window.Icons[name] : ''; }
        function _esc(s) { return typeof window.escapeHtml === 'function' ? window.escapeHtml(s) : String(s == null ? '' : s); }

        function renderSubtabStrip(containerId, placeId) {
            var container = document.getElementById(containerId);
            if (!container) return;

            var stripHtml = '<div class="gov-subtabs" role="tablist">';
            for (var i = 0; i < GOV_SUBTABS.length; i++) {
                var t = GOV_SUBTABS[i];
                var active = t.id === _activeSubtabId ? ' active' : '';
                stripHtml += '<button type="button" class="gov-subtab' + active + '" data-subtab-id="' + _esc(t.id) + '">' +
                    (_icon(t.icon) ? '<span class="gov-subtab-icon">' + _icon(t.icon) + '</span>' : '') +
                    '<span>' + _esc(t.label) + '</span></button>';
            }
            stripHtml += '</div>';
            
            var panelHtml = '<div id="' + _esc(containerId) + '-subpanel" class="gov-subpanel" role="tabpanel"></div>';

            container.innerHTML = stripHtml + panelHtml;

            var buttons = container.querySelectorAll('.gov-subtab');
            for (var b = 0; b < buttons.length; b++) {
                (function (btn) {
                    btn.addEventListener('click', function () {
                        var id = btn.getAttribute('data-subtab-id');
                        if (id && id !== _activeSubtabId) {
                            _activeSubtabId = id;
                            renderSubtabStrip(containerId, placeId);
                        }
                    });
                })(buttons[b]);
            }

            var activeTab = null;
            for (var j = 0; j < GOV_SUBTABS.length; j++) {
                if (GOV_SUBTABS[j].id === _activeSubtabId) { activeTab = GOV_SUBTABS[j]; break; }
            }
            if (activeTab) activeTab.render(containerId + '-subpanel', placeId, function() {
                renderSubtabStrip(containerId, placeId);
            });
        }

        window.renderGovernmentTab = function (containerId, placeId) {
            renderSubtabStrip(containerId, placeId);
        };
    })();
</script>

<script>
(function() {
    'use strict';

    function getIcon(name) {
        return (window.Icons && window.Icons[name]) ? window.Icons[name] : '';
    }
    function iconWithText(icon, text) {
        if (!icon) return text || '';
        return '<span style="display:inline-flex;align-items:center;gap:4px;vertical-align:middle;">' + icon + '<span>' + (text || '') + '</span></span>';
    }

    var currentPlaceId = null;
    var isInitialized = false;

    function showToast(msg, type) {
        if (typeof window.showToast === 'function') window.showToast(msg, type);
    }
    
    function getPlaces() { return typeof window.getPlaces === 'function' ? window.getPlaces() : []; }

    function setupUIText() {
        var title = document.getElementById('govManagerTitle');
        if (title) title.innerHTML = iconWithText(getIcon('CROWN'), ' GOVERNMENT MANAGER');
        
        var sidebarTitle = document.getElementById('sidebarTitle');
        if (sidebarTitle) sidebarTitle.innerHTML = iconWithText(getIcon('LOCATION'), ' GOVERNMENT'); // CHANGED
        
        var addDeptBtn = document.getElementById('addDeptBtn');
        if (addDeptBtn) addDeptBtn.innerHTML = iconWithText(getIcon('PLUS'), ' Department');
        var importBtn = document.getElementById('importBtn');
        if (importBtn) importBtn.innerHTML = iconWithText(getIcon('ARROW_RIGHT'), ' Import');
        var exportBtn = document.getElementById('exportBtn');
        if (exportBtn) exportBtn.innerHTML = iconWithText(getIcon('ARROW_RIGHT'), ' Export');
        var refreshBtn = document.getElementById('refreshBtn');
        if (refreshBtn) refreshBtn.innerHTML = iconWithText(getIcon('REFRESH'), ' Refresh');
        
        var loadingText = document.getElementById('loadingText');
        if (loadingText) loadingText.textContent = 'Loading locations...';
        var emptyState = document.getElementById('emptyStateText');
        if (emptyState) emptyState.textContent = 'Select a location from the sidebar';
    }

    function setupLocationTree() {
        var container = document.getElementById('placeList');
        if (!container) return;

        if (window.LocationUI && typeof window.LocationUI.renderLocationList === 'function') {
            try {
                window.LocationUI.renderLocationList('placeList', {
                    selectedId: currentPlaceId,
                    onSelect: function(place) {
                        if (place && place.id) {
                            currentPlaceId = place.id;
                            renderGovernmentTab();
                            if (window.innerWidth <= 768) closeSidebar();
                        }
                    }
                });
                return;
            } catch (e) { console.error('Tree render failed', e); }
        }

        var places = getPlaces();
        if (places && places.length > 0) {
            var html = '<div class="place-tree">';
            for (var i = 0; i < places.length; i++) {
                var p = places[i];
                var isSelected = (p.id === currentPlaceId);
                html += '<div class="place-item' + (isSelected ? ' selected' : '') + '" data-place-id="' + p.id + '" style="padding:6px 10px;cursor:pointer;border-bottom:1px solid var(--border);' + (isSelected ? 'background:var(--accent-dim);' : '') + '"><span>' + (p.displayName || p.name || 'Unknown') + '</span></div>';
            }
            html += '</div>';
            container.innerHTML = html;
            var items = container.querySelectorAll('.place-item');
            for (var j = 0; j < items.length; j++) {
                (function(item) {
                    item.addEventListener('click', function() {
                        var placeId = this.dataset.placeId;
                        if (placeId) {
                            currentPlaceId = placeId;
                            renderGovernmentTab();
                            if (window.innerWidth <= 768) closeSidebar();
                        }
                    });
                })(items[j]);
            }
        } else {
            container.innerHTML = '<div class="empty-state">No locations found</div>';
        }
    }

    function closeSidebar() {
        var sidebar = document.getElementById('locationsSidebar');
        var overlay = document.getElementById('sidebarOverlay');
        if (sidebar) sidebar.classList.remove('visible');
        if (overlay) overlay.classList.remove('active');
        document.body.style.overflow = '';
    }
    function openSidebar() {
        var sidebar = document.getElementById('locationsSidebar');
        var overlay = document.getElementById('sidebarOverlay');
        if (sidebar) sidebar.classList.add('visible');
        if (overlay) overlay.classList.add('active');
        document.body.style.overflow = 'hidden';
    }
    function toggleSidebar() {
        if (document.getElementById('locationsSidebar').classList.contains('visible')) closeSidebar(); 
        else openSidebar();
    }

    function renderGovernmentTab() {
        var panel = document.getElementById('panelContent');
        if (!panel) return;
        
        if (!currentPlaceId) {
            var places = getPlaces();
            if (places && places.length > 0) {
                for (var i = 0; i < places.length; i++) {
                    if (places[i].variableKey && places[i].variableKey !== 'world_root') { 
                        currentPlaceId = places[i].id; 
                        break; 
                    }
                }
                if (!currentPlaceId && places.length > 0) currentPlaceId = places[0].id;
            }
        }
        
        if (!currentPlaceId) {
            panel.innerHTML = '<div class="empty-state">Select a location from the sidebar</div>';
            return;
        }

        if (typeof window.renderGovernmentTab === 'function') {
            window.renderGovernmentTab('panelContent', currentPlaceId);
        } else {
            panel.innerHTML = '<div class="empty-state">Government sub-tab host not loaded</div>';
        }
    }

    function setupTopBarActions() {
        var addDeptBtn = document.getElementById('addDeptBtn');
        var importBtn = document.getElementById('importBtn');
        var exportBtn = document.getElementById('exportBtn');
        var refreshBtn = document.getElementById('refreshBtn');

        if (addDeptBtn) {
            addDeptBtn.onclick = function() {
                var locationId = currentPlaceId;
                if (!locationId) {
                    var places = getPlaces();
                    if (places.length > 0) locationId = places[0].id;
                }
                if (!locationId) {
                    showToast('No location selected', 'warning');
                    return;
                }
                if (typeof window.openCreateGovernmentDepartmentModal === 'function') {
                    window.openCreateGovernmentDepartmentModal(locationId, function() {
                        renderGovernmentTab();
                    });
                } else {
                    showToast('Department modal not loaded', 'error');
                }
            };
        }

        if (importBtn) {
            importBtn.onclick = function() {
                if (typeof window.importData === 'function') {
                    Promise.resolve(window.importData()).then(function() {
                        setTimeout(function() {
                            setupLocationTree();
                            renderGovernmentTab();
                            showToast('Import successful', 'success');
                        }, 200);
                    }).catch(function(err) {
                        showToast('Import failed: ' + (err.message || 'unknown'), 'error');
                    });
                } else {
                    showToast('Import function not available', 'error');
                }
            };
        }

        if (exportBtn) {
            exportBtn.onclick = function() {
                if (typeof window.exportData === 'function') {
                    try {
                        window.exportData();
                        showToast('Export started', 'success');
                    } catch (e) {
                        showToast('Export failed', 'error');
                    }
                } else {
                    showToast('Export function not available', 'error');
                }
            };
        }

        if (refreshBtn) {
            refreshBtn.onclick = function() {
                if (typeof window.loadMasterData === 'function') window.loadMasterData();
                setTimeout(function() {
                    setupLocationTree();
                    renderGovernmentTab();
                    showToast('Refreshed', 'success');
                }, 100);
            };
        }
    }

    function init() {
        if (isInitialized) return;
        isInitialized = true;

        setupUIText();
        if (typeof window.loadMasterData === 'function') window.loadMasterData();
        if (window.GovernmentBootstrap) window.GovernmentBootstrap.init();
        
        setTimeout(function() { 
            setupLocationTree(); 
            setupTopBarActions();
            renderGovernmentTab();
            
            document.getElementById('menuToggle').addEventListener('click', toggleSidebar);
            document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);
        }, 150);
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
})();
</script>

<!-- THEME SWITCHER -->
<script>
(function () {
    'use strict';
    var themeBtn  = document.getElementById('themeBtn');
    var themeMenu = document.getElementById('themeMenu');
    var themeName = document.getElementById('themeName');
    var switcher = window.ThemeSwitcher;
    if (!switcher) return;

    function updateLabel(id) {
        var label = id.charAt(0).toUpperCase() + id.slice(1).replace(/-/g, ' ');
        if (themeName) themeName.textContent = label;
    }

    function buildMenu() {
        var html = '';
        for (var i = 0; i < switcher.themes.length; i++) {
            var id = switcher.themes[i];
            var label = id.charAt(0).toUpperCase() + id.slice(1).replace(/-/g, ' ');
            html += '<li role="none"><button role="menuitem" type="button" data-theme-id="' +
                id + '">' + label + '</button></li>';
        }
        if (themeMenu) themeMenu.innerHTML = html;
    }

    function openMenu() { if (themeMenu) { themeMenu.hidden = false; themeBtn.setAttribute('aria-expanded', 'true'); } }
    function closeMenu() { if (themeMenu) { themeMenu.hidden = true; themeBtn.setAttribute('aria-expanded', 'false'); } }

    if (themeBtn) {
        themeBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            if (themeMenu.hidden) openMenu(); else closeMenu();
        });
    }

    if (themeMenu) {
        themeMenu.addEventListener('click', function (e) {
            var btn = e.target.closest('[data-theme-id]');
            if (!btn) return;
            var id = btn.getAttribute('data-theme-id');
            switcher.apply(id);
            updateLabel(id);
            closeMenu();
        });
    }

    document.addEventListener('click', function (e) {
        if (themeMenu && !themeMenu.hidden) {
            if (themeMenu.contains(e.target)) return;
            if (e.target === themeBtn) return;
            closeMenu();
        }
    });

    buildMenu();
    var saved = switcher.getSaved();
    if (saved) updateLabel(saved);
})();
</script>
