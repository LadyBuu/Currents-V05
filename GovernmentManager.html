    <!-- Main Panel (Flex Column: Tabs Top, Content Bottom) -->

            <button class="tab-btn active" data-tab="government" id="tabGovernment"></button>
            <button class="tab-btn" data-tab="governmentOverview" id="tabOverview"></button>

        <!-- Content Panel (Bottom) -->
        <div class="tab-content-wrapper" id="panelContent">
            <div class="empty-state" id="emptyStateText">Select a location from the sidebar</div>
        </div>
    </div>
</div>

<!-- GOVERNMENT SUB-TAB HOST (Inline)                             -->
<!-- ============================================================ -->
<script>
    (function () {
        'use strict';

        var GOV_SUBTABS = [
            { id: 'details', label: 'Details', icon: 'CROWN', render: function (c, p, r) { if (window.GovernmentDetailsTab) window.GovernmentDetailsTab.render(c, p); } },
            { id: 'departments', label: 'Departments', icon: 'HOUSEHOLD', render: function (c, p, r) { if (window.DepartmentsTab) window.DepartmentsTab.render(c, p); } },
            { id: 'history', label: 'History', icon: 'TIMELINE', render: function (c, p, r) { if (window.GovernmentHistoryTab) window.GovernmentHistoryTab.render(c, p); } },
            { id: 'laws', label: 'Civil Laws', icon: 'SHIELD', render: function (c, p, r) { if (window.LawsTab) window.LawsTab.render(c, p); } },
            { id: 'economy', label: 'Economy', icon: 'COIN', render: function (c, p, r) { if (window.EconomyDetailsTab) window.EconomyDetailsTab.render(c, p); } }
        ];

        var _activeSubtabId = 'details';

        function _icon(name) { return (window.Icons && typeof window.Icons[name] === 'string') ? window.Icons[name] : ''; }
        function _esc(s) { return typeof window.escapeHtml === 'function' ? window.escapeHtml(s) : String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

        function renderSubtabStrip(containerId, placeId, onRefresh) {
            var container = document.getElementById(containerId);
            if (!container) return;

            var stripHtml = '<div class="gov-subtabs" role="tablist">';
            for (var i = 0; i < GOV_SUBTABS.length; i++) {
                var t = GOV_SUBTABS[i];
                var active = t.id === _activeSubtabId ? ' active' : '';
                stripHtml += '<button type="button" class="gov-subtab' + active + '" data-subtab-id="' + _esc(t.id) + '">' +
                    (_icon(t.icon) ? '<span class="gov-subtab-icon">' + _icon(t.icon) + '</span>' : '') +
                    '<span>' + _esc(t.label) + '</span></button>';
            }
            stripHtml += '</div>';
            
            var panelHtml = '<div id="' + _esc(containerId) + '-subpanel" class="gov-subpanel" role="tabpanel"></div>';

            container.innerHTML = stripHtml + panelHtml;

            var buttons = container.querySelectorAll('.gov-subtab');
            for (var b = 0; b < buttons.length; b++) {
                (function (btn) {
                    btn.addEventListener('click', function () {
                        var id = btn.getAttribute('data-subtab-id');
                        if (id && id !== _activeSubtabId) {
                            _activeSubtabId = id;
                            renderSubtabStrip(containerId, placeId, onRefresh);
                        }
                    });
                })(buttons[b]);
            }

            var activeTab = null;
            for (var j = 0; j < GOV_SUBTABS.length; j++) {
                if (GOV_SUBTABS[j].id === _activeSubtabId) { activeTab = GOV_SUBTABS[j]; break; }
            }
            if (activeTab) activeTab.render(containerId + '-subpanel', placeId, onRefresh);
        }

        window.renderGovernmentTab = function (containerId, placeId, onRefresh) {
            renderSubtabStrip(containerId, placeId, onRefresh);
        };
        
        window.renderGovernmentTabSubtab = function (subtabId, containerId, placeId) {
            for(var i=0; i<GOV_SUBTABS.length; i++) {
                if(GOV_SUBTABS[i].id === subtabId) {
                    _activeSubtabId = subtabId;
                    renderSubtabStrip(containerId, placeId, null);
                    return;
                }
            }
        };
        
        window.getActiveGovernmentSubtab = function () { return _activeSubtabId; };
    })();
</script>

<script>
(function() {
    'use strict';

    function getIcon(name) {
        return (window.Icons && window.Icons[name]) ? window.Icons[name] : '<svg viewBox="0 0 20 20" width="1em" height="1em" style="display:inline-block;fill:currentColor;stroke:currentColor;vertical-align:middle;"><circle cx="10" cy="10" r="5.71" fill="currentColor"/></svg>';
    }
    function iconWithText(icon, text) {
        if (!icon) return text || '';
        return '<span style="display:inline-flex;align-items:center;gap:4px;vertical-align:middle;">' + icon + '<span>' + (text || '') + '</span></span>';
    }

    var ICONS = {
        CROWN: getIcon('CROWN'), LOCATION: getIcon('LOCATION'), IMPORT: getIcon('ARROW_RIGHT'), 
        EXPORT: getIcon('ARROW_RIGHT'), REFRESH: getIcon('REFRESH'), PLUS: getIcon('PLUS'), 
        GEAR: getIcon('GEAR'), CHECK: getIcon('CHECK_SIMPLE'), WARNING: getIcon('WARNING'), 
        MENU: getIcon('CIRCLE_DOT'), OVERVIEW: getIcon('PERSON'), STRUCTURE: getIcon('CROWN')
    };

    var currentPlaceId = null;
    var currentTab = 'government';
    var isInitialized = false;
    var currentAbortController = null;
    var isSidebarOpen = false;

    function showToast(msg, type) {
        if (typeof window.showToast === 'function') window.showToast(msg, type);
        else if (typeof window.showToastMessage === 'function') window.showToastMessage(msg, type);
        else if (typeof window._showToast === 'function') window._showToast(msg, type);
    }
    function getPlaceById(placeId) { return typeof window.getPlaceById === 'function' ? window.getPlaceById(placeId) : null; }
    function getPlaces() { return typeof window.getPlaces === 'function' ? window.getPlaces() : []; }
    function cleanupEventListeners() {
        if (currentAbortController) { currentAbortController.abort(); currentAbortController = null; }
    }
    function bootstrapGovernment() {
        if (!window.GovernmentBootstrap || typeof window.GovernmentBootstrap.init !== 'function') return;
        try { window.GovernmentBootstrap.init(); } catch (e) { console.error('Government bootstrap failed:', e); }
    }
    function reinitGovernment() {
        if (!window.GovernmentBootstrap) return;
        try {
            if (typeof window.GovernmentBootstrap.reinit === 'function') window.GovernmentBootstrap.reinit();
            else if (typeof window.GovernmentBootstrap.init === 'function') window.GovernmentBootstrap.init();
        } catch (e) { console.error('Government bootstrap reinit failed:', e); }
    }

    function setupUIText() {
        var title = document.getElementById('govManagerTitle');
        if (title) title.innerHTML = iconWithText(ICONS.CROWN, ' GOVERNMENT MANAGER');
        var sidebarTitle = document.getElementById('sidebarTitle');
        if (sidebarTitle) sidebarTitle.innerHTML = iconWithText(ICONS.LOCATION, ' LOCATION HIERARCHY');
        
        var addDeptBtn = document.getElementById('addDeptBtn');
        if (addDeptBtn) addDeptBtn.innerHTML = iconWithText(ICONS.PLUS, ' Department');
        var importBtn = document.getElementById('importBtn');
        if (importBtn) importBtn.innerHTML = iconWithText(ICONS.IMPORT, ' Import');
        var exportBtn = document.getElementById('exportBtn');
        if (exportBtn) exportBtn.innerHTML = iconWithText(ICONS.EXPORT, ' Export');
        var refreshBtn = document.getElementById('refreshBtn');
        if (refreshBtn) refreshBtn.innerHTML = iconWithText(ICONS.REFRESH, ' Refresh');
        
        var loadingText = document.getElementById('loadingText');
        if (loadingText) loadingText.textContent = 'Loading locations...';
        var emptyState = document.getElementById('emptyStateText');
        if (emptyState) emptyState.textContent = 'Select a location from the sidebar';
        
        var tabGovernment = document.getElementById('tabGovernment');
        if (tabGovernment) tabGovernment.innerHTML = iconWithText(ICONS.CROWN, ' Government');
        var tabOverview = document.getElementById('tabOverview');
        if (tabOverview) tabOverview.innerHTML = iconWithText(ICONS.OVERVIEW, ' Overview');
        var tabTypes = document.getElementById('tabTypes');
        if (tabTypes) tabTypes.innerHTML = iconWithText(ICONS.GEAR, ' Gov Types');
        var tabStructure = document.getElementById('tabStructure');
        if (tabStructure) tabStructure.innerHTML = iconWithText(ICONS.STRUCTURE, ' Structure');
    }

    function setupLocationTree() {
        var container = document.getElementById('placeList');
        if (!container) return;

        if (typeof window.renderLocationTree === 'function') {
            window.renderLocationTree('placeList', function(placeId) {
                if (placeId) {
                    currentPlaceId = placeId;
                    renderCurrentTab();
                    if (typeof window.selectPlaceInTree === 'function') window.selectPlaceInTree(placeId);
                    if (window.innerWidth <= 768) closeSidebar();
                }
            });
        } else if (typeof window.LocationUI !== 'undefined' && typeof window.LocationUI.renderLocationTree === 'function') {
            window.LocationUI.renderLocationTree('placeList', function(placeId) {
                if (placeId) {
                    currentPlaceId = placeId;
                    renderCurrentTab();
                    if (window.innerWidth <= 768) closeSidebar();
                }
            });
        } else {
            var places = getPlaces();
            if (places && places.length > 0) {
                var html = '<div class="place-tree">';
                for (var i = 0; i < places.length; i++) {
                    var p = places[i];
                    var isSelected = (p.id === currentPlaceId);
                    html += '<div class="place-item' + (isSelected ? ' selected' : '') + '" data-place-id="' + p.id + '" style="padding:6px 10px;cursor:pointer;border-bottom:1px solid var(--border);' + (isSelected ? 'background:var(--accent-dim);' : '') + '"><span>' + (p.displayName || p.name || 'Unknown') + '</span></div>';
                }
                html += '</div>';
                container.innerHTML = html;
                var items = container.querySelectorAll('.place-item');
                for (var i = 0; i < items.length; i++) {
                    (function(item) {
                        item.addEventListener('click', function() {
                            var placeId = this.dataset.placeId;
                            if (placeId) {
                                currentPlaceId = placeId;
                                renderCurrentTab();
                                if (window.innerWidth <= 768) closeSidebar();
                            }
                        });
                    })(items[i]);
                }
            } else {
                container.innerHTML = '<div class="empty-state">' + iconWithText(ICONS.WARNING, ' No locations found') + '</div>';
            }
        }
    }

    function refreshLocationTree() {
        if (typeof window.refreshLocationTree === 'function') {
            window.refreshLocationTree('placeList', function(placeId) {
                if (placeId && placeId !== currentPlaceId) {
                    currentPlaceId = placeId;
                    renderCurrentTab();
                }
            });
        } else if (typeof window.LocationUI !== 'undefined' && typeof window.LocationUI.refreshLocationTree === 'function') {
            window.LocationUI.refreshLocationTree('placeList', function(placeId) {
                if (placeId && placeId !== currentPlaceId) {
                    currentPlaceId = placeId;
                    renderCurrentTab();
                }
            });
        } else {
            setupLocationTree();
        }
    }

    function closeSidebar() {
        var sidebar = document.getElementById('locationsSidebar');
        var overlay = document.getElementById('sidebarOverlay');
        if (sidebar) sidebar.classList.remove('visible');
        if (overlay) overlay.classList.remove('active');
        document.body.style.overflow = '';
        isSidebarOpen = false;
    }
    function openSidebar() {
        var sidebar = document.getElementById('locationsSidebar');
        var overlay = document.getElementById('sidebarOverlay');
        if (sidebar) sidebar.classList.add('visible');
        if (overlay) overlay.classList.add('active');
        document.body.style.overflow = 'hidden';
        isSidebarOpen = true;
    }
    function toggleSidebar() {
        if (isSidebarOpen) closeSidebar(); else openSidebar();
    }
    function initMobileSidebar() {
        var menuToggle = document.getElementById('menuToggle');
        var sidebar = document.getElementById('locationsSidebar');
        var overlay = document.getElementById('sidebarOverlay');
        if (!menuToggle || !sidebar || !overlay) return;

        menuToggle.addEventListener('click', function(e) { e.stopPropagation(); toggleSidebar(); });
        overlay.addEventListener('click', function() { closeSidebar(); });
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeSidebar(); });
        window.addEventListener('resize', function() {
            if (window.innerWidth > 768) {
                closeSidebar();
                sidebar.style.transform = '';
                overlay.style.display = 'none';
            }
        });
    }

    function renderGovernmentTab(placeId) {
        cleanupEventListeners();
        currentAbortController = new AbortController();
        var panel = document.getElementById('panelContent');
        if (!panel) return;
        if (!placeId) placeId = currentPlaceId;
        
        if (!placeId) {
            var places = getPlaces();
            if (places && places.length > 0) {
                for (var i = 0; i < places.length; i++) {
                    if (places[i].variableKey && places[i].variableKey !== 'world_root') { placeId = places[i].id; currentPlaceId = placeId; break; }
                }
                if (!placeId && places.length > 0) { placeId = places[0].id; currentPlaceId = placeId; }
            }
        }
        if (!placeId) {
            panel.innerHTML = '<div class="empty-state">' + iconWithText(ICONS.WARNING, ' Select a location from the sidebar') + '</div>';
            return;
        }

        if (typeof window.renderGovernmentTab === 'function') {
            window.renderGovernmentTab('panelContent', placeId, function() {
                if (currentTab === 'government') renderCurrentTab();
            });
        } else {
            panel.innerHTML = '<div class="empty-state">' + iconWithText(ICONS.WARNING, ' Government sub-tab host not loaded') + '</div>';
        }
    }

    function renderGovernmentOverviewTab(placeId) {
        cleanupEventListeners();
        currentAbortController = new AbortController();
        var panel = document.getElementById('panelContent');
        if (!panel) return;
        if (!placeId) placeId = currentPlaceId;
        
        if (!placeId) {
            var places = getPlaces();
            if (places && places.length > 0) {
                for (var i = 0; i < places.length; i++) {
                    if (places[i].variableKey && places[i].variableKey !== 'world_root') { placeId = places[i].id; currentPlaceId = placeId; break; }
                }
                if (!placeId && places.length > 0) { placeId = places[0].id; currentPlaceId = placeId; }
            }
        }
        if (!placeId) {
            panel.innerHTML = '<div class="empty-state">' + iconWithText(ICONS.WARNING, ' Select a location from the sidebar') + '</div>';
            return;
        }

        if (typeof window.renderGovernmentOverviewTab === 'function') {
            window.renderGovernmentOverviewTab('panelContent', placeId);
        } else {
            panel.innerHTML = '<div class="empty-state">' + iconWithText(ICONS.WARNING, ' Government Overview tab module not loaded (js/ui/gm-government-overview-tab-ui.js)') + '</div>';
        }
    }

    function renderGovernmentTypesTab() {
        cleanupEventListeners();
        currentAbortController = new AbortController();
        var panel = document.getElementById('panelContent');
        if (typeof window.renderGovernmentTypesTab === 'function') {
            window.renderGovernmentTypesTab('panelContent', function() {
                if (currentTab === 'governmentTypes') renderCurrentTab();
            });
        } else {
            panel.innerHTML = '<div class="empty-state">' + iconWithText(ICONS.WARNING, ' Government Types UI module not loaded (js/ui/gm-government-type-tab-ui.js)') + '</div>';
        }
    }

    function renderGovernmentStructureTab(placeId) {
        cleanupEventListeners();
        currentAbortController = new AbortController();
        var panel = document.getElementById('panelContent');
        if (!panel) return;
        if (!placeId) placeId = currentPlaceId;
        
        if (!placeId) {
            var places = getPlaces();
            if (places && places.length > 0) {
                for (var i = 0; i < places.length; i++) {
                    if (places[i].variableKey && places[i].variableKey !== 'world_root') { placeId = places[i].id; currentPlaceId = placeId; break; }
                }
                if (!placeId && places.length > 0) { placeId = places[0].id; currentPlaceId = placeId; }
            }
        }
        if (!placeId) {
            panel.innerHTML = '<div class="empty-state">' + iconWithText(ICONS.WARNING, ' Select a location from the sidebar') + '</div>';
            return;
        }

        if (typeof window.renderGovernmentStructureTab === 'function') {
            window.renderGovernmentStructureTab('panelContent', placeId, function() {
                if (currentTab === 'governmentStructure') renderCurrentTab();
            });
        } else {
            panel.innerHTML = '<div class="empty-state">' + iconWithText(ICONS.WARNING, ' Government Structure tab module not loaded (js/ui/gm-government-structure-tab-ui.js)') + '</div>';
        }
    }

    function renderCurrentTab() {
        var panel = document.getElementById('panelContent');
        if (!panel) return;
        cleanupEventListeners();

        if (!currentPlaceId) {
            var places = getPlaces();
            if (places && places.length > 0) {
                for (var i = 0; i < places.length; i++) {
                    if (places[i].variableKey && places[i].variableKey !== 'world_root') { currentPlaceId = places[i].id; break; }
                }
                if (!currentPlaceId && places.length > 0) currentPlaceId = places[0].id;
            }
        }

        var needsPlace = ['government', 'governmentOverview', 'governmentStructure'];
        var isLocationTab = needsPlace.indexOf(currentTab) !== -1;

        if (isLocationTab && !currentPlaceId) {
            panel.innerHTML = '<div class="empty-state">' + iconWithText(ICONS.WARNING, ' Select a location from the sidebar') + '</div>';
            return;
        }

        switch (currentTab) {
            case 'government': renderGovernmentTab(currentPlaceId); break;
            case 'governmentOverview': renderGovernmentOverviewTab(currentPlaceId); break;
            case 'governmentTypes': renderGovernmentTypesTab(); break;
            case 'governmentStructure': renderGovernmentStructureTab(currentPlaceId); break;
            default: panel.innerHTML = '<div class="empty-state">' + iconWithText(ICONS.WARNING, ' Select a tab') + '</div>';
        }
    }

    function switchTab(tabName) {
        var needsPlace = ['government', 'governmentOverview', 'governmentStructure'];
        currentTab = tabName;

        if (needsPlace.indexOf(tabName) !== -1 && !currentPlaceId) {
            var places = getPlaces();
            if (places && places.length > 0) {
                for (var i = 0; i < places.length; i++) {
                    if (places[i].variableKey && places[i].variableKey !== 'world_root') { currentPlaceId = places[i].id; break; }
                }
                if (!currentPlaceId && places.length > 0) currentPlaceId = places[0].id;
            }
        }

        document.querySelectorAll('.panel-tabs .tab-btn').forEach(function(btn) {
            if (btn.dataset.tab === tabName) btn.classList.add('active');
            else btn.classList.remove('active');
        });

        renderCurrentTab();
    }

    function setupTabs() {
        var tabButtons = document.querySelectorAll('.panel-tabs .tab-btn');
        for (var i = 0; i < tabButtons.length; i++) {
            var btn = tabButtons[i];
            btn.onclick = null;
            btn.addEventListener('click', function(e) {
                var tabId = this.dataset.tab;
                if (tabId) switchTab(tabId);
            });
        }
    }

    function setupTopBarActions() {
        var addDeptBtn = document.getElementById('addDeptBtn');
        var importBtn = document.getElementById('importBtn');
        var exportBtn = document.getElementById('exportBtn');
        var refreshBtn = document.getElementById('refreshBtn');

        if (addDeptBtn) {
            addDeptBtn.onclick = function() {
                var locationId = currentPlaceId;
                if (!locationId) {
                    var places = getPlaces();
                    var validPlaces = places.filter(function(p) { return p.variableKey && p.variableKey !== 'world_root'; });
                    if (validPlaces.length > 0) locationId = validPlaces[0].id;
                    else if (places.length > 0) locationId = places[0].id;
                }
                if (!locationId) {
                    showToast(iconWithText(ICONS.WARNING, ' No location selected'), 'warning');
                    return;
                }
                if (typeof window.openCreateGovernmentDepartmentModal === 'function') {
                    window.openCreateGovernmentDepartmentModal(locationId, function(newDeptId) {
                        if (currentTab === 'governmentStructure') renderCurrentTab();
                        if (newDeptId) showToast(iconWithText(ICONS.CHECK, ' Department created!'), 'success');
                    });
                } else if (typeof window._openCreateGovernmentDepartmentModal === 'function') {
                    window._openCreateGovernmentDepartmentModal(locationId, function(newDeptId) {
                        if (currentTab === 'governmentStructure') renderCurrentTab();
                        if (newDeptId) showToast(iconWithText(ICONS.CHECK, ' Department created!'), 'success');
                    });
                } else {
                    showToast(iconWithText(ICONS.WARNING, ' Department creation not available'), 'error');
                }
            };
        }

        if (importBtn) {
            importBtn.onclick = async function() {
                if (typeof window.importData === 'function') {
                    try {
                        await window.importData();
                        setTimeout(function() { refreshLocationTree(); renderCurrentTab(); }, 200);
                        showToast(iconWithText(ICONS.CHECK, ' Import successful'), 'success');
                    } catch (error) {
                        showToast(iconWithText(ICONS.WARNING, ' Import failed'), 'error');
                    }
                } else {
                    showToast(iconWithText(ICONS.WARNING, ' Import function not available'), 'error');
                }
            };
        }

        if (exportBtn) {
            exportBtn.onclick = function() {
                if (typeof window.exportData === 'function') window.exportData();
                else showToast(iconWithText(ICONS.WARNING, ' Export function not available'), 'error');
            };
        }

        if (refreshBtn) {
            refreshBtn.onclick = function() {
                if (typeof window.loadMasterData === 'function') window.loadMasterData();
                setTimeout(function() {
                    refreshLocationTree();
                    renderCurrentTab();
                    showToast(iconWithText(ICONS.REFRESH, ' Refreshed'), 'success');
                }, 100);
            };
        }
    }

    function init() {
        if (isInitialized) return;
        isInitialized = true;

        setupUIText();
        if (typeof window.loadMasterData === 'function') window.loadMasterData();
        bootstrapGovernment();
        
        setTimeout(function() { setupLocationTree(); }, 150);
        setupTabs();
        setupTopBarActions();
        initMobileSidebar();

        currentTab = 'government';
        document.querySelectorAll('.panel-tabs .tab-btn').forEach(function(btn) {
            if (btn.dataset.tab === 'government') btn.classList.add('active');
            else btn.classList.remove('active');
        });

        var panel = document.getElementById('panelContent');
        if (panel) {
            if (currentPlaceId) renderCurrentTab();
            else panel.innerHTML = '<div class="empty-state">' + iconWithText(ICONS.WARNING, ' Select a location from the sidebar') + '</div>';
        }

        window.addEventListener('masterDataUpdated', function() {
            reinitGovernment();
            refreshLocationTree();
            renderCurrentTab();
        });

        console.log('✅ Government Manager initialized');
    }

    window.switchGovTab = switchTab;
    window.renderCurrentGovTab = renderCurrentTab;
    window.refreshGovTree = refreshLocationTree;
    window.selectPlaceInGovTree = function(placeId) {
        currentPlaceId = placeId;
        if (typeof window.selectPlaceInTree === 'function') window.selectPlaceInTree(placeId);
        refreshLocationTree();
    };
    window.closeMobileSidebar = closeSidebar;
    window.toggleMobileSidebar = toggleSidebar;
    window.getCurrentGovLocationId = function() { return currentPlaceId; };

    window.addEventListener('beforeunload', function() { cleanupEventListeners(); });

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
})();
</script>

<!-- ============================================================ -->
<!-- THEME SWITCHER (Shared Dropdown Logic)                       -->
<!-- ============================================================ -->
<script>
(function () {
    'use strict';

    var themeBtn  = document.getElementById('themeBtn');
    var themeMenu = document.getElementById('themeMenu');
    var themeName = document.getElementById('themeName');

    var switcher = window.ThemeSwitcher;
    if (!switcher) return;

    function updateLabel(id) {
        var label = id.charAt(0).toUpperCase() + id.slice(1).replace(/-/g, ' ');
        if (themeName) themeName.textContent = label;
    }

    function buildMenu() {
        var html = '';
        for (var i = 0; i < switcher.themes.length; i++) {
            var id = switcher.themes[i];
            var label = id.charAt(0).toUpperCase() + id.slice(1).replace(/-/g, ' ');
            html += '<li role="none"><button role="menuitem" type="button" data-theme-id="' +
                id + '">' + label + '</button></li>';
        }
        if (themeMenu) themeMenu.innerHTML = html;
    }

    function openMenu() {
        if (!themeMenu) return;
        themeMenu.hidden = false;
        themeBtn.setAttribute('aria-expanded', 'true');
    }
    function closeMenu() {
        if (!themeMenu) return;
        themeMenu.hidden = true;
        themeBtn.setAttribute('aria-expanded', 'false');
    }

    if (themeBtn) {
        themeBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            if (themeMenu.hidden) openMenu(); else closeMenu();
        });
    }

    if (themeMenu) {
        themeMenu.addEventListener('click', function (e) {
            var btn = e.target.closest('[data-theme-id]');
            if (!btn) return;
            var id = btn.getAttribute('data-theme-id');
            switcher.apply(id);
            updateLabel(id);
            closeMenu();
        });
    }

    document.addEventListener('click', function (e) {
        if (themeMenu && !themeMenu.hidden) {
            if (themeMenu.contains(e.target)) return;
            if (e.target === themeBtn) return;
            closeMenu();
        }
    });

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && themeMenu && !themeMenu.hidden) {
            closeMenu();
        }
    });

    buildMenu();
    var saved = switcher.getSaved();
    if (saved) updateLabel(saved);

})();
</script>
