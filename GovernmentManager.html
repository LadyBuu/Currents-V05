        /* ============================================================
           GOVERNMENT MANAGER — SHELL LAYOUT ONLY
           All tab-specific styles live in css/government-tabs.css.
           This block only positions the shell: topbar, sidebar,
           main panel, tab strip, pane container. Nothing here is
           specific to a tab's content.
           ============================================================ */

        html, body { height: 100%; margin: 0; overflow: hidden; }
        body { display: flex; flex-direction: column; }
        .topbar { position: relative; z-index: 100; flex-shrink: 0; }

        .world-app {
            display: flex; flex-direction: row;
            flex: 1; min-height: 0; overflow: hidden;
        }

        .locations-sidebar {
            flex-shrink: 0; display: flex; flex-direction: column;
            overflow: hidden; background: var(--bg2);
            border-right: 1px solid var(--border);
        }
        .sidebar-header {
            padding: 12px 16px; border-bottom: 1px solid var(--border);
            background: var(--bg3);
        }
        .sidebar-header h3 {
            margin: 0; font-family: var(--f-display); font-size: 0.65rem;
            letter-spacing: 0.1em; text-transform: uppercase;
            color: var(--accent);
        }
        .place-list { flex: 1; overflow-y: auto; padding: 8px; min-height: 0; }

        .main-panel {
            display: flex; flex-direction: column; flex: 1;
            min-width: 0; min-height: 0; overflow: hidden;
        }

        /* Tab strip */
        .manager-subtabs {
            position: sticky; top: 0;
            display: flex; align-items: stretch;
            gap: 4px;
            padding: 8px 24px 0;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            flex-shrink: 0;
            z-index: 10;
        }
        .manager-subtab {
            position: relative;
            display: inline-flex; align-items: center; gap: 8px;
            padding: 12px 18px 11px;
            background: transparent;
            border: 1px solid transparent;
            border-bottom: none;
            border-radius: 6px 6px 0 0;
            color: var(--dim);
            font-family: var(--f-display);
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.06em;
            line-height: 1.15;
            white-space: nowrap;
            cursor: pointer;
            transition: color 0.15s ease, background-color 0.15s ease;
        }
        .manager-subtab::after {
            content: '';
            position: absolute; left: 0; right: 0; bottom: -1px;
            height: 2px;
            background: transparent;
            border-radius: 2px 2px 0 0;
            transition: background-color 0.15s ease;
        }
        .manager-subtab:hover { color: var(--accent-light); background: var(--accent-dim); }
        .manager-subtab:hover::after { background: var(--accent); opacity: 0.35; }
        .manager-subtab.active {
            color: var(--accent);
            background: var(--bg2);
            border-color: var(--border);
            border-bottom-color: transparent;
            font-weight: 600;
        }
        .manager-subtab.active::after { background: var(--accent); opacity: 1; }

        .manager-subtab-icon {
            display: inline-flex;
            width: 16px; height: 16px;
            align-items: center; justify-content: center;
            color: currentColor;
            flex-shrink: 0;
            opacity: 0.9;
        }
        .manager-subtab-icon svg { width: 100%; height: 100%; fill: currentColor; }

        /* Pane container — one .tab-pane per tab, only .active is shown */
        .tab-content-wrapper {
            flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
            padding: 20px 24px;
        }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        /* Sidebar tree indentation */
        .place-list .location-tree-children,
        .locations-sidebar .location-tree-children {
            margin-left: 0 !important;
            padding-left: 16px !important;
            border-left: 1px solid var(--border-light) !important;
            display: none;
        }
        .place-list .location-tree-children.is-expanded,
        .locations-sidebar .location-tree-children.is-expanded {
            display: block;
        }

        /* Topbar controls */
        .tb-btn {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 6px 14px; background: var(--bg2);
            border: 1px solid var(--border); border-radius: var(--radius);
            color: var(--text); font-family: var(--f-body); font-size: 0.7rem;
            font-weight: 500; cursor: pointer; line-height: 1.2;
            flex-shrink: 0;
            transition: border-color 0.15s ease, background-color 0.15s ease, color 0.15s ease;
        }
        .tb-btn:hover { border-color: var(--accent); background: var(--accent-dim); color: var(--accent-light); }
        .tb-btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
        .tb-btn.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }

        .year-input {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 3px 10px; background: var(--bg);
            border: 1px solid var(--border); border-radius: var(--radius);
            font-family: var(--f-body); font-size: 0.7rem; line-height: 1.2;
            flex-shrink: 0; flex-grow: 0;
            min-width: max-content; max-width: 260px;
            margin-right: 6px;
        }
        .year-input label {
            font-family: var(--f-display); font-size: 0.55rem;
            letter-spacing: 0.06em; text-transform: uppercase;
            color: var(--dim); white-space: nowrap; flex-shrink: 0;
        }
        .year-input input {
            width: 64px; min-width: 52px;
            padding: 3px 6px;
            background: transparent; border: 1px solid var(--border);
            border-radius: calc(var(--radius) - 1px); color: var(--text);
            font-family: var(--f-mono); font-size: 0.7rem; text-align: right;
            flex-shrink: 0;
        }
        .year-input input:focus {
            outline: none; border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-soft);
        }
        .year-input input::-webkit-outer-spin-button,
        .year-input input::-webkit-inner-spin-button {
            -webkit-appearance: none; margin: 0;
        }
        .year-input input[type=number] { -moz-appearance: textfield; }
        .year-input .set-btn {
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: calc(var(--radius) - 1px);
            padding: 3px 10px;
            font-size: 0.65rem; font-weight: 500;
            color: var(--text); cursor: pointer; flex-shrink: 0;
            transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
        }
        .year-input .set-btn:hover {
            background: var(--accent-dim);
            border-color: var(--accent);
            color: var(--accent-light);
        }

        .theme-toggle { position: relative; display: inline-flex; flex-shrink: 0; }
        .theme-toggle__btn { gap: 6px; }
        .theme-toggle__menu {
            position: absolute; top: calc(100% + 4px); right: 0; z-index: 9999;
            min-width: 160px; max-height: 60vh; padding: 4px; margin: 0;
            list-style: none; background: var(--surface);
            border: 1px solid var(--line); border-radius: var(--radius);
            box-shadow: var(--shadow); overflow-y: auto;
        }
        .theme-toggle__menu[hidden] { display: none; }
        .theme-toggle__menu button {
            display: block; width: 100%; padding: 6px 12px; text-align: left;
            background: transparent; border: none; color: var(--text);
            font-family: var(--f-body); font-size: 0.7rem;
            border-radius: calc(var(--radius) - 2px); cursor: pointer;
            transition: background-color 0.15s ease;
        }
        .theme-toggle__menu button:hover,
        .theme-toggle__menu button:focus-visible {
            background: var(--accent-dim); color: var(--accent-light); outline: none;
        }

        .sidebar-overlay { display: none; }
        .sidebar-overlay.active {
            display: block; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8); z-index: 999;
        }

        .empty-state {
            padding: 48px 24px; text-align: center;
            color: var(--dim); font-size: 0.88rem; line-height: 1.6;
        }
        .loading {
            padding: 24px; text-align: center;
            color: var(--tmut); font-size: 0.85rem;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        @media (max-width: 768px) {
            .world-app { flex-direction: column; }
            .locations-sidebar {
                position: fixed; top: 0; bottom: 0; left: 0;
                height: 100vh; width: 85%; max-width: 280px;
                z-index: 1000; transform: translateX(-100%);
                transition: transform 0.3s ease;
            }
            .locations-sidebar.visible { transform: translateX(0); }
            .tab-content-wrapper { padding: 16px; }
            .manager-subtabs {
                padding-left: 16px; padding-right: 16px;
            }
            .manager-subtab {
                flex: 1 1 auto; min-width: 0;
                padding: 10px 14px; font-size: 0.72rem;
            }
            .year-input label { display: none; }
            .year-input input { width: 52px; min-width: 44px; }
        }
    </style>
