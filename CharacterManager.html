<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover" />
    <title>Character Manager</title>
    <link rel="icon" href="data:," />

    <script src="js/core/theme-boot.js"></script>

    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/common.css">

    <style>
        /* ============================================================
           Character Manager — inline CSS

           Only css/themes.css and css/common.css are external.
           Everything below is inline, including the character-tab-*,
           character-row*, character-friendship-*, character-romance-*,
           and character-family-* classes that the tabs emit.

           STRUCTURAL ONLY. Every visual value comes from a theme
           token in themes.css. No hex values, no rgba() values, no
           hardcoded font stacks, no hardcoded px for design values.
           Spacing uses rem.
           ============================================================ */

        html, body { height: 100%; margin: 0; overflow: hidden; }
        body {
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--text);
            font-family: var(--f-body);
            font-size: 1rem;
            line-height: var(--lh, 1.5);
            -webkit-font-smoothing: antialiased;
        }

        /* ============================================================
           TOPBAR
           ============================================================ */
        .topbar {
            position: relative;
            z-index: 100;
            flex-shrink: 0;
            background: var(--bg2);
            padding: 0.5rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.625rem;
            border-bottom: 1px solid var(--border);
            min-height: 3rem;
            flex-wrap: wrap;
        }
        .topbar .title {
            font-family: var(--f-display);
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--accent);
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
        }
        .topbar .title svg { width: 1em; height: 1em; fill: currentColor; }
        .topbar .spacer { flex: 1; min-width: 0.75rem; }
        .topbar .burger-menu {
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0.25rem 0.625rem;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            cursor: pointer;
        }

        .tb-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.3125rem;
            padding: 0.375rem 0.875rem;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: var(--f-body);
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            line-height: 1.2;
        }
        .tb-btn svg { width: 0.9em; height: 0.9em; fill: currentColor; }
        .tb-btn:hover {
            border-color: var(--accent);
            background: var(--accent-dim);
            color: var(--accent-light);
        }
        .tb-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--accent-fg);
        }
        .tb-btn.primary:hover { background: var(--accent-dark); }
        .tb-btn:disabled { opacity: 0.45; cursor: not-allowed; }

        .year-input {
            display: inline-flex;
            align-items: center;
            gap: 0.3125rem;
            padding: 0.1875rem 0.625rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-family: var(--f-body);
            font-size: 0.7rem;
            line-height: 1.2;
        }
        .year-input label {
            font-family: var(--f-display);
            font-size: 0.55rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--dim);
            white-space: nowrap;
        }
        .year-input input {
            width: 4rem;
            padding: 0.1875rem 0.375rem;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: var(--f-mono);
            font-size: 0.7rem;
            text-align: right;
        }
        .year-input input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .theme-toggle { position: relative; display: inline-flex; }
        .theme-toggle__menu {
            position: absolute;
            top: calc(100% + 0.25rem);
            right: 0;
            z-index: 9999;
            min-width: 10rem;
            max-height: 60vh;
            padding: 0.25rem;
            margin: 0;
            list-style: none;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow-y: auto;
        }
        .theme-toggle__menu[hidden] { display: none; }
        .theme-toggle__menu button {
            display: block;
            width: 100%;
            padding: 0.375rem 0.75rem;
            text-align: left;
            background: transparent;
            border: none;
            color: var(--text);
            font-family: var(--f-body);
            font-size: 0.7rem;
            border-radius: var(--radius);
            cursor: pointer;
        }
        .theme-toggle__menu button:hover {
            background: var(--accent-dim);
            color: var(--accent-light);
        }

        /* ============================================================
           LAYOUT
           ============================================================ */
        .app-layout {
            display: flex;
            flex-direction: row;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }
        .sidebar {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg2);
            border-right: 1px solid var(--border);
            width: 17.5rem;
        }
        .sidebar-header {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
            background: var(--bg3);
        }
        .sidebar-header h3 {
            margin: 0;
            font-family: var(--f-display);
            font-size: 0.65rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }
        .sidebar-search {
            padding: 0.5rem;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-search input {
            width: 100%;
            padding: 0.375rem 0.5rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: var(--f-body);
            font-size: 0.72rem;
            box-sizing: border-box;
        }
        .sidebar-search input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .sidebar-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
            min-height: 0;
        }
        .main-panel {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
        }

        /* ============================================================
           TAB STRIP
           ============================================================ */
        .manager-subtabs {
            position: sticky;
            top: 0;
            display: flex;
            align-items: stretch;
            gap: 0.25rem;
            padding: 0.5rem 1.5rem 0;
            margin: 0 0 1.25rem;
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            z-index: 10;
        }
        .manager-subtab {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.125rem 0.6875rem;
            background: transparent;
            border: 1px solid transparent;
            border-bottom: none;
            border-radius: var(--radius) var(--radius) 0 0;
            color: var(--dim);
            font-family: var(--f-display);
            font-size: 0.78rem;
            font-weight: 500;
            cursor: pointer;
        }
        .manager-subtab:hover {
            color: var(--accent-light);
            background: var(--accent-dim);
        }
        .manager-subtab.active {
            color: var(--accent);
            background: var(--bg2);
            border-color: var(--border);
            font-weight: 600;
        }
        .manager-subtab-icon {
            display: inline-flex;
            width: 1rem;
            height: 1rem;
            align-items: center;
            justify-content: center;
            color: currentColor;
        }
        .manager-subtab-icon svg { width: 100%; height: 100%; fill: currentColor; }

        .tab-content-wrapper {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 1.25rem 1.5rem;
            background: var(--bg);
        }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        /* ============================================================
           SHARED STATES
           ============================================================ */
        .loading {
            padding: 1.5rem;
            text-align: center;
            color: var(--dim);
            font-size: 0.85rem;
        }
        .empty-state,
        .error-state {
            padding: 1.5rem;
            text-align: center;
            color: var(--dim);
            font-size: 0.8rem;
        }
        .error-state { color: var(--danger-lt); }

        /* ============================================================
           SIDEBAR OVERLAY (mobile)
           ============================================================ */
        .sidebar-overlay { display: none; }
        .sidebar-overlay.active {
            display: block;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--overlay, rgba(0, 0, 0, 0.6));
            z-index: 999;
        }

        /* ============================================================
           CHARACTER ROW
           ============================================================ */
        .character-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.375rem;
            width: 100%;
            padding: 0.375rem 0.5rem;
            background: transparent;
            border: 1px solid transparent;
            border-radius: var(--radius);
            color: var(--text);
            font-family: var(--f-body);
            font-size: 0.72rem;
            text-align: left;
            cursor: pointer;
        }
        .character-row:hover {
            background: var(--bg3);
            border-color: var(--border);
        }
        .character-row--selected,
        .character-row.selected {
            background: var(--accent-dim);
            border-color: var(--accent);
            color: var(--accent-light);
        }
        .character-row--deceased { opacity: 0.72; }
        .character-row__rank {
            color: var(--accent);
            font-family: var(--f-display);
            font-size: 0.65rem;
            min-width: 1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .character-row__gender {
            display: inline-flex;
            width: 0.9em;
            height: 0.9em;
            align-items: center;
            justify-content: center;
            color: var(--dim);
        }
        .character-row__gender svg {
            width: 100%; height: 100%; fill: currentColor;
        }
        .character-row__name {
            color: var(--accent);
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            word-break: break-word;
        }
        .character-row__name:hover { text-decoration: underline; }
        .character-row__deceased-mark {
            color: var(--danger-lt);
            font-size: 0.75rem;
            margin-left: 0.125rem;
        }
        .character-row__age,
        .character-row__location,
        .character-row__detail {
            color: var(--dim);
            font-family: var(--f-mono);
            font-size: 0.6rem;
        }
        .character-row__detail { color: var(--accent-dim); }
        .character-empty-message {
            padding: 1.5rem 1rem;
            text-align: center;
            color: var(--dim);
            font-size: 0.8rem;
        }

        /* ============================================================
           CHARACTER TAB CONTENT
           ============================================================ */
        .character-tab-section {
            margin-bottom: 1rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            background: var(--bg2);
        }
        .character-tab-section__header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--bg3);
            border: none;
            border-bottom: 1px solid var(--border);
            color: var(--text);
            font-family: var(--f-display);
            font-size: 0.78rem;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
        }
        .character-tab-section__header:hover {
            background: var(--accent-dim);
            color: var(--accent-light);
        }
        .character-tab-section__toggle {
            display: inline-flex;
            width: 1rem;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            font-size: 0.65rem;
        }
        .character-tab-section__icon {
            display: inline-flex;
            width: 1rem;
            height: 1rem;
            align-items: center;
            justify-content: center;
            color: var(--accent);
        }
        .character-tab-section__icon svg {
            width: 100%; height: 100%; fill: currentColor;
        }
        .character-tab-section__title {
            flex: 1;
            min-width: 0;
        }
        .character-tab-section__body {
            display: none;
            padding: 1rem;
            background: var(--bg2);
        }
        .character-tab-section.is-expanded .character-tab-section__body {
            display: block;
        }

        .character-tab-subhead {
            margin: 0.75rem 0 0.375rem;
            padding-bottom: 0.25rem;
            border-bottom: 1px solid var(--border);
            font-family: var(--f-display);
            font-size: 0.6rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--accent);
        }
        .character-tab-subhead:first-child { margin-top: 0; }

        .character-tab-field {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: flex-start;
            margin-bottom: 0.75rem;
        }
        .character-tab-field__label {
            flex: 0 0 10rem;
            font-family: var(--f-display);
            font-size: 0.62rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--dim);
            padding-top: 0.375rem;
        }
        .character-tab-field__value {
            flex: 1;
            min-width: 0;
            font-family: var(--f-body);
            font-size: 0.75rem;
            color: var(--text);
        }

        .character-tab-input {
            width: 100%;
            padding: 0.375rem 0.5rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: var(--f-body);
            font-size: 0.75rem;
            box-sizing: border-box;
        }
        .character-tab-input:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--bg3);
        }
        textarea.character-tab-input {
            resize: vertical;
            min-height: 3rem;
        }
        .character-tab-input-row {
            display: flex;
            gap: 0.375rem;
            align-items: center;
        }
        .character-tab-input-row .character-tab-input {
            flex: 1;
        }

        .character-tab-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.3125rem;
            padding: 0.375rem 0.75rem;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: var(--f-body);
            font-size: 0.68rem;
            font-weight: 500;
            cursor: pointer;
            line-height: 1.2;
        }
        .character-tab-btn:hover {
            border-color: var(--accent);
            background: var(--accent-dim);
            color: var(--accent-light);
        }
        .character-tab-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--accent-fg);
        }
        .character-tab-btn.primary:hover {
            background: var(--accent-dark);
        }
        .character-tab-btn.danger {
            background: transparent;
            border-color: var(--danger-lt);
            color: var(--danger-lt);
        }
        .character-tab-btn.danger:hover {
            background: var(--danger-soft);
            color: var(--danger-lt);
        }
        .character-tab-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }
        .character-tab-btn-small {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.1875rem 0.5rem;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: var(--f-body);
            font-size: 0.6rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
        }
        .character-tab-btn-small:hover {
            border-color: var(--accent);
            color: var(--accent-light);
        }
        .character-tab-btn-small.danger {
            color: var(--danger-lt);
            border-color: var(--danger-lt);
        }
        .character-tab-btn-small.danger:hover {
            background: var(--danger-soft);
        }
        .character-tab-btn-small:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }
        .character-tab-actions {
            display: flex;
            gap: 0.375rem;
            flex-wrap: wrap;
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px solid var(--border);
        }

        .character-tab-note {
            color: var(--dim);
            font-size: 0.65rem;
            font-style: italic;
        }
        .character-tab-preview {
            font-family: var(--f-display);
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent);
        }

        .character-tab-empty {
            padding: 1rem;
            text-align: center;
            color: var(--dim);
            font-size: 0.7rem;
            font-style: italic;
        }
        .character-tab-unavailable {
            padding: 0.75rem 1rem;
            background: var(--warning-soft, rgba(200, 112, 64, 0.12));
            border-left: 3px solid var(--warning, #c87040);
            border-radius: 0 var(--radius) var(--radius) 0;
            color: var(--text);
            font-size: 0.7rem;
            line-height: 1.5;
        }
        .character-tab-empty--error {
            color: var(--danger-lt);
            background: var(--danger-soft);
            border-left: 3px solid var(--danger-lt);
            border-radius: 0 var(--radius) var(--radius) 0;
        }

        .character-tab-checkbox {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            font-size: 0.7rem;
            color: var(--text);
            cursor: pointer;
        }
        .character-tab-checkbox input[type="checkbox"] {
            margin: 0;
        }

        .character-tab-random-source {
            margin-bottom: 0.75rem;
            padding: 0.5rem 0.75rem;
            background: var(--bg3);
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }

        .character-tab-traits {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr));
            gap: 0.25rem;
            align-items: center;
        }
        .character-tab-traits .character-tab-trait {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            padding: 0.125rem 0.375rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 0.68rem;
            cursor: pointer;
        }
        .character-tab-traits .character-tab-trait:hover {
            border-color: var(--accent);
        }
        .character-tab-traits .character-tab-trait input[type="checkbox"] {
            margin: 0;
        }
        .character-tab-traits .character-tab-input-row {
            grid-column: 1 / -1;
            margin-top: 0.5rem;
        }

        .character-tab-history {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            margin-bottom: 0.5rem;
        }
        .character-tab-history__row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            padding: 0.375rem 0.625rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }
        .character-tab-history__row.is-current {
            border-left: 3px solid var(--accent);
            background: var(--accent-dim);
        }
        .character-tab-history__main {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
            min-width: 0;
        }
        .character-tab-history__year {
            font-family: var(--f-mono);
            font-size: 0.65rem;
            color: var(--accent);
            min-width: 3rem;
        }
        .character-tab-history__value {
            font-family: var(--f-body);
            font-size: 0.72rem;
            color: var(--text);
            word-break: break-word;
        }
        .character-tab-history__reason {
            font-size: 0.6rem;
            color: var(--dim);
            font-style: italic;
        }
        .character-tab-history__badge {
            font-size: 0.55rem;
            padding: 0.0625rem 0.375rem;
            border-radius: 0.625rem;
            background: var(--accent);
            color: var(--accent-fg);
        }
        .character-tab-history__actions {
            display: flex;
            gap: 0.25rem;
            flex-shrink: 0;
        }

        .character-tab-rank-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
            padding: 0.5rem 0.75rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-left: 3px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 0.375rem;
        }
        .character-tab-rank-row--active {
            border-left-color: var(--accent);
            background: var(--accent-dim);
        }
        .character-tab-rank-row--former { opacity: 0.75; }
        .character-tab-rank-main {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex: 1;
            min-width: 0;
        }
        .character-tab-rank-symbol {
            font-family: var(--f-display);
            font-size: 1.1rem;
            color: var(--accent);
            min-width: 1.25rem;
            text-align: center;
        }
        .character-tab-rank-name {
            font-family: var(--f-display);
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text);
            word-break: break-word;
        }
        .character-tab-rank-meta {
            width: 100%;
            font-size: 0.6rem;
            color: var(--dim);
            font-family: var(--f-mono);
            margin-top: 0.125rem;
        }
        .character-tab-rank-actions {
            display: flex;
            gap: 0.25rem;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .character-tab-savebar {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
            position: sticky;
            bottom: 0;
            z-index: 5;
            padding: 0.75rem 1rem;
            margin-top: 1.5rem;
            background: var(--bg2);
            border: 1px solid var(--border);

<div class="topbar">
    <button id="menuToggle" class="burger-menu" type="button" aria-label="Toggle menu">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
    </button>
    <div class="title" id="characterManagerTitle">Character Manager</div>
    <div class="spacer"></div>

    <div class="year-input">
        <label for="yearInput">Year</label>
        <input type="number" id="yearInput" min="1" step="1">
        <button id="setYearBtn" class="tb-btn" type="button">Set</button>
    </div>

    <button id="addCharacterBtn" class="tb-btn primary" type="button">Add</button>
    <button id="generateCharacterBtn" class="tb-btn" type="button">Random</button>
    <button id="importBtn" class="tb-btn" type="button">Import</button>
    <button id="exportBtn" class="tb-btn" type="button">Export</button>
    <button id="refreshBtn" class="tb-btn" type="button">Refresh</button>

    <div class="theme-toggle" role="group" aria-label="Theme">
        <button class="tb-btn theme-toggle__btn" id="themeBtn" type="button" aria-haspopup="menu" aria-expanded="false">
            <span aria-hidden="true">◐</span>
            <span id="themeName">Dark</span>
        </button>
        <ul class="theme-toggle__menu" id="themeMenu" role="menu" hidden></ul>
    </div>
</div>

<div class="app-layout">
    <div class="sidebar" id="characterSidebar">
        <div class="sidebar-header"><h3 id="sidebarTitle">Characters</h3></div>
        <div class="sidebar-search">
            <input type="search" id="characterSearchInput" placeholder="Search characters…" autocomplete="off">
        </div>
        <div class="sidebar-list" id="characterListContainer">
            <div class="loading">Loading characters…</div>
        </div>
    </div>
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <div class="main-panel">
        <div class="manager-subtabs" id="characterTabStrip" role="tablist">
            <button class="manager-subtab active" role="tab" type="button"
                    data-tab="identity" aria-selected="true" tabindex="0">
                <span class="manager-subtab-icon" data-icon="PERSON" aria-hidden="true"></span>
                <span>Identity</span>
            </button>
            <button class="manager-subtab" role="tab" type="button"
                    data-tab="location" aria-selected="false" tabindex="-1">
                <span class="manager-subtab-icon" data-icon="LOCATION" aria-hidden="true"></span>
                <span>Location</span>
            </button>
            <button class="manager-subtab" role="tab" type="button"
                    data-tab="family" aria-selected="false" tabindex="-1">
                <span class="manager-subtab-icon" data-icon="FAMILY_TREE" aria-hidden="true"></span>
                <span>Family</span>
            </button>
            <button class="manager-subtab" role="tab" type="button"

                <span class="manager-subtab-icon" data-icon="HEART" aria-hidden="true"></span>
                <span>Romance</span>
            </button>
            <button class="manager-subtab" role="tab" type="button"
                    data-tab="friendship" aria-selected="false" tabindex="-1">
                <span class="manager-subtab-icon" data-icon="FRIENDSHIP" aria-hidden="true"></span>
                <span>Friendship</span>
            </button>
            <button class="manager-subtab" role="tab" type="button"
                    data-tab="skills" aria-selected="false" tabindex="-1">
                <span class="manager-subtab-icon" data-icon="ROLES" aria-hidden="true"></span>
                <span>Skills</span>
            </button>
            <button class="manager-subtab" role="tab" type="button"
                    data-tab="overview" aria-selected="false" tabindex="-1">
                <span class="manager-subtab-icon" data-icon="CENSUS" aria-hidden="true"></span>
                <span>Overview</span>
            </button>
        </div>

        <div class="tab-content-wrapper" id="panelContent" role="tabpanel">
            <div class="tab-pane active" id="character-pane-identity"   data-tab-content="identity"></div>
            <div class="tab-pane"        id="character-pane-location"   data-tab-content="location"></div>
            <div class="tab-pane"        id="character-pane-family"     data-tab-content="family"></div>
            <div class="tab-pane"        id="character-pane-romance"    data-tab-content="romance"></div>
            <div class="tab-pane"        id="character-pane-friendship" data-tab-content="friendship"></div>
            <div class="tab-pane"        id="character-pane-skills"     data-tab-content="skills"></div>
            <div class="tab-pane"        id="character-pane-overview"   data-tab-content="overview"></div>
        </div>
    </div>
</div>

<!-- ================================================================
     SCRIPTS — load order is load-bearing.

     The order below reflects the dependency graph documented in
     load order.txt and household-doc.txt:

       boot  →  core constants  →  core utilities  →  core time  →
       core storage  →  accessors  →  UI primitives  →
       world + names  →  eventLogger  →  skill-utils  →
       selector-base + locationDropdown  →  character  →
       character-selector  →  roles  →  relationship core  →
       apprenticeship  →  relationship domain (remaining)  →
       location  →  religion (domain only, no modals)  →
       culture  →  relationship-bootstrap + relationship modals  →
       names  →  households  →  household-selector  →  character shell

     Religion modals are intentionally NOT loaded on this page: they
     load-time require getFilteredLocationOptions, which is provided
     by locationDropdown.js under a different export name in this
     build. The religion domain works fine without its modals (see
     religion-bootstrap's optional-modules warning).
     ================================================================ -->

<!-- ================================================================
     TOPBAR WIRING (inline)
     ================================================================ -->
<script>
(function () {
    'use strict';

    function _toast(msg, type) {
        if (typeof window.showToast === 'function') {
            try { window.showToast(msg, type || 'info'); } catch (e) {}
        } else if (typeof console !== 'undefined' && console.warn) {
            console.warn('[character-manager] ' + (type || 'info') + ': ' + msg);
        }
    }

    function _refreshAll() {
        if (window.CharacterManagerBootstrap
            && typeof window.CharacterManagerBootstrap.refreshSidebar === 'function') {
            window.CharacterManagerBootstrap.refreshSidebar();
        }
        if (window.CharacterManagerBootstrap
            && typeof window.CharacterManagerBootstrap.renderActive === 'function') {
            window.CharacterManagerBootstrap.renderActive();
        }
    }

    var yearInput = document.getElementById('yearInput');
    var setYearBtn = document.getElementById('setYearBtn');

    function _syncYearInput() {
        if (!yearInput) return;
        if (typeof window.getCurrentYear === 'function') {
            try { yearInput.value = window.getCurrentYear(); }
            catch (e) { yearInput.value = ''; }
        }
    }

    if (setYearBtn) {
        setYearBtn.addEventListener('click', function () {
            if (!yearInput) return;
            var y = parseInt(yearInput.value, 10);
            if (!Number.isInteger(y)) {
                _toast('Please enter a valid year.', 'error');
                return;
            }
            if (typeof window.isValidYear === 'function'
                && window.isValidYear(y) !== true) {
                _toast('Please enter a valid year.', 'error');
                return;
            }
            if (typeof window.setCurrentYear === 'function') {
                try { window.setCurrentYear(y); } catch (e) {}
            } else if (window.masterData && window.masterData.data) {
                window.masterData.data.currentYear = y;
                if (typeof window.markDataDirty === 'function') {
                    window.markDataDirty();
                }
            }
            _refreshAll();
            _toast('Year set to ' + y + '.', 'success');
        });
    }
    if (yearInput) {
        yearInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && setYearBtn) setYearBtn.click();
        });
    }
    _syncYearInput();

    var addBtn = document.getElementById('addCharacterBtn');
    if (addBtn) {
        addBtn.addEventListener('click', function () {
            if (typeof window.openCreateCharacterModal === 'function') {
                window.openCreateCharacterModal(function () {
                    _refreshAll();
                    _toast('Character created.', 'success');
                });
            } else {
                _toast('Create-character modal is not loaded.', 'error');
            }
        });
    }

    var generateBtn = document.getElementById('generateCharacterBtn');
    if (generateBtn) {
        generateBtn.addEventListener('click', function () {
            if (typeof window.CharacterCreationCommands === 'undefined'
                || !window.CharacterCreationCommands
                || typeof window.CharacterCreationCommands.createRandomCharacter !== 'function') {
                _toast('Random generation is not available.', 'error');
                return;
            }
            var result = window.CharacterCreationCommands.createRandomCharacter();
            if (!result || result.success !== true) {
                _toast('Random generation failed: ' +
                    (result && result.reason ? result.reason : 'unknown'), 'error');
                return;
            }
            if (result.data && result.data.id
                && window.CharacterUIState
                && typeof window.CharacterUIState.setSelectedCharacterId === 'function') {
                window.CharacterUIState.setSelectedCharacterId(result.data.id);
            }
            _refreshAll();
            _toast('Random character created.', 'success');
        });
    }

    var importBtn = document.getElementById('importBtn');
    var fileInput = document.getElementById('fileInput');
    if (importBtn && fileInput) {
        importBtn.addEventListener('click', function () {
            fileInput.click();
        });
        fileInput.addEventListener('change', function () {
            var f = fileInput.files && fileInput.files[0];
            if (!f) return;
            var reader = new FileReader();
            reader.onload = function (e) {
                var parsed = null;
                try { parsed = JSON.parse(e.target.result); }
                catch (err) {
                    _toast('Invalid JSON file.', 'error');
                    return;
                }
                var data = parsed && parsed.data ? parsed.data : parsed;
                if (!data || typeof data !== 'object') {
                    _toast('Unexpected JSON shape.', 'error');
                    return;
                }
                if (!window.masterData) window.masterData = { data: {} };
                if (!window.masterData.data) window.masterData.data = {};
                var keys = Object.keys(data);
                for (var i = 0; i < keys.length; i++) {
                    window.masterData.data[keys[i]] = data[keys[i]];
                }
                if (typeof window.markDataDirty === 'function') {
                    window.markDataDirty();
                }
                if (typeof window.CharacterState !== 'undefined'
                    && typeof window.CharacterState.refresh === 'function') {
                    try { window.CharacterState.refresh(); } catch (err) {}
                }
                try {
                    window.dispatchEvent(new CustomEvent('masterDataUpdated'));
                } catch (err) {}
                _refreshAll();
                _syncYearInput();
                _toast('Import complete.', 'success');
            };
            reader.readAsText(f);
            fileInput.value = '';
        });
    }

    var exportBtn = document.getElementById('exportBtn');
    if (exportBtn) {
        exportBtn.addEventListener('click', function () {
            var source = window.masterData && window.masterData.data
                ? window.masterData.data : {};
            var exportData = {
                type: 'master',
                version: '2.0',
                exportDate: new Date().toISOString(),
                data: source
            };
            var blob = new Blob([JSON.stringify(exportData, null, 2)],
                { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'stillwaters_export_' +
                new Date().toISOString().slice(0, 19).replace(/:/g, '-') + '.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            var n = (source.characters && source.characters.length) || 0;
            _toast('Exported ' + n + ' characters with all data.', 'success');
        });
    }

    var refreshBtn = document.getElementById('refreshBtn');
    if (refreshBtn) {
        refreshBtn.addEventListener('click', function () {
            if (typeof window.loadMasterData === 'function') {
                try { window.loadMasterData(); } catch (e) {}
            }
            if (typeof window.invalidateAccessorCaches === 'function') {
                try { window.invalidateAccessorCaches(); } catch (e) {}
            }
            if (typeof window.CharacterState !== 'undefined'
                && typeof window.CharacterState.refresh === 'function') {
                try { window.CharacterState.refresh(); } catch (e) {}
            }
            _refreshAll();
            _syncYearInput();
            _toast('Refreshed.', 'success');
        });
    }

    var burgerBtn = document.getElementById('menuToggle');
    var sidebar = document.getElementById('characterSidebar');
    var overlay = document.getElementById('sidebarOverlay');

    if (burgerBtn && sidebar && overlay) {
        burgerBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            sidebar.classList.add('visible');
            overlay.classList.add('active');
        });
        overlay.addEventListener('click', function () {
            sidebar.classList.remove('visible');
            overlay.classList.remove('active');
        });
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape'
                && sidebar.classList.contains('visible')) {
                sidebar.classList.remove('visible');
                overlay.classList.remove('active');
            }
        });
    }

    (function injectTabIcons() {
        var icons = window.Icons || {};
        var slots = document.querySelectorAll('[data-icon]');
        for (var i = 0; i < slots.length; i++) {
            var name = slots[i].getAttribute('data-icon');
            if (name && icons[name]) {
                slots[i].innerHTML = icons[name];
            }
        }
    })();

    (function () {
        var themeBtn = document.getElementById('themeBtn');
        var themeMenu = document.getElementById('themeMenu');
        var themeName = document.getElementById('themeName');
        var switcher = window.ThemeSwitcher;
        if (!switcher) return;

        function labelFor(id) {
            return id.charAt(0).toUpperCase() + id.slice(1).replace(/-/g, ' ');
        }
        function updateLabel(id) {
            if (themeName) themeName.textContent = labelFor(id);
        }
        function buildMenu() {
            var html = '';
            for (var i = 0; i < switcher.themes.length; i++) {
                var id = switcher.themes[i];
                html += '<li role="none"><button role="menuitem" type="button" data-theme-id="' +
                    id + '">' + labelFor(id) + '</button></li>';
            }
            if (themeMenu) themeMenu.innerHTML = html;
        }
        function openMenu() {
            if (!themeMenu) return;
            themeMenu.hidden = false;
            themeBtn.setAttribute('aria-expanded', 'true');
        }
        function closeMenu() {
            if (!themeMenu) return;
            themeMenu.hidden = true;
            themeBtn.setAttribute('aria-expanded', 'false');
        }

        if (themeBtn) themeBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            if (themeMenu.hidden) openMenu(); else closeMenu();
        });
        if (themeMenu) themeMenu.addEventListener('click', function (e) {
            var btn = e.target.closest('[data-theme-id]');
            if (!btn) return;
            var id = btn.getAttribute('data-theme-id');
            switcher.apply(id); updateLabel(id); closeMenu();
        });
        document.addEventListener('click', function (e) {
            if (themeMenu && !themeMenu.hidden) {
                if (themeMenu.contains(e.target)) return;
                if (e.target === themeBtn) return;
                closeMenu();
            }
        });
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && themeMenu && !themeMenu.hidden) closeMenu();
        });

        buildMenu();
        var saved = switcher.getSaved && switcher.getSaved();
        if (saved) updateLabel(saved);
    })();
})();
</script>
