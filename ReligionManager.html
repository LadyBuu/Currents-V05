    <!-- TOP BAR -->

        <button class="burger-btn" id="burgerBtn">☰</button>

        <label for="yearInput">Year</label>

        <button class="tb-btn" id="setYearBtn">✓ Set</button>
        <button class="tb-btn" id="exportBtn">⬇ Export</button>
        <button class="tb-btn" id="importBtn">⬆ Import</button>

    <!-- APP LAYOUT -->

        <!-- MAIN PANEL WITH TABS -->

                <button class="tab-btn" data-tab="followers">

                </button>
            </div>

            <div class="tab-content" id="tabContent">
                <div class="tab-pane active" id="tab-details">
                    <div class="empty-state">
                        <div class="icon" id="empty-details-icon"></div>
                        <div class="message">Select a religion from the sidebar</div>
                    </div>
                </div>
                <div class="tab-pane" id="tab-gods">
                    <div class="empty-state">
                        <div class="icon" id="empty-gods-icon"></div>
                        <div class="message">Gods will appear here</div>
                        <div class="sub-message">Select a religion first</div>
                    </div>
                </div>
                <div class="tab-pane" id="tab-laws">
                    <div class="empty-state">
                        <div class="icon" id="empty-laws-icon"></div>
                        <div class="message">Laws will appear here</div>
                        <div class="sub-message">Select a religion first</div>
                    </div>
                </div>
                <div class="tab-pane" id="tab-places">
                    <div class="empty-state">
                        <div class="icon" id="empty-places-icon"></div>
                        <div class="message">Places of worship will appear here</div>
                        <div class="sub-message">Select a religion first</div>
                    </div>
                </div>
                <div class="tab-pane" id="tab-followers">
                    <div class="empty-state">
                        <div class="icon" id="empty-followers-icon"></div>
                        <div class="message">Followers will appear here</div>
                        <div class="sub-message">Select a religion first</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- PRELOAD - MUST BE FIRST                                      -->
<!-- ============================================================ -->
<script>
    (function() {
        'use strict';
        try {
            var STORAGE_KEY = 'stillwaters_master';
            var stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                var parsed = JSON.parse(stored);
                if (parsed && parsed.data) {
                    window.masterData = parsed;
                }
            }
        } catch(e) {}

        if (!window.masterData || !window.masterData.data) {
            window.masterData = {
                version: '2.0',
                lastUpdated: new Date().toISOString(),
                data: {
                    characters: [],
                    places: [],
                    ranks: [],
                    roles: [],
                    locationTypes: [],
                    governmentTypes: [],
                    households: [],
                    residences: [],
                    religions: [],
                    nameLists: {},
                    cityNameParts: {},
                    currentYear: 1250
                }
            };
        }

        if (!window.masterData.data.religions) window.masterData.data.religions = [];
        if (!window.masterData.data.nameLists) window.masterData.data.nameLists = {};
        if (!window.masterData.data.cityNameParts) window.masterData.data.cityNameParts = {};
        if (!window.masterData.data.locationTypes) window.masterData.data.locationTypes = [];
        if (!window.masterData.data.governmentTypes) window.masterData.data.governmentTypes = [];
        if (!window.masterData.data.ranks) window.masterData.data.ranks = [];
        if (!window.masterData.data.roles) window.masterData.data.roles = [];
        if (!window.masterData.data.characters) window.masterData.data.characters = [];
        if (!window.masterData.data.places) window.masterData.data.places = [];
        if (!window.masterData.data.households) window.masterData.data.households = [];
        if (!window.masterData.data.residences) window.masterData.data.residences = [];

        try {
            localStorage.setItem('stillwaters_master', JSON.stringify(window.masterData));
        } catch(e) {}
    })();
</script>

<script>
    (function() {
        'use strict';

        var religionContainer = document.getElementById('religionListContainer');
        var sidebar = document.getElementById('sidebar');
        var burgerBtn = document.getElementById('burgerBtn');

        var selectedReligionId = null;
        var isInitialized = false;

        var tabButtons = document.querySelectorAll('.panel-tabs .tab-btn');
        var tabPanes = {
            details: document.getElementById('tab-details'),
            gods: document.getElementById('tab-gods'),
            laws: document.getElementById('tab-laws'),
            places: document.getElementById('tab-places'),
            followers: document.getElementById('tab-followers')
        };

        function injectIcons() {
            if (typeof window.Icons === 'undefined') {
                setTimeout(injectIcons, 100);
                return;
            }

            var iconMap = {
                'icon-details': window.Icons.CIRCLE_DOT || window.Icons.CIRCLE,
                'icon-gods': window.Icons.STAR_4 || window.Icons.CIRCLE,
                'icon-laws': window.Icons.SHIELD || window.Icons.CIRCLE,
                'icon-places': window.Icons.HOME || window.Icons.CIRCLE,
                'icon-places': window.Icons.LOCATION || window.Icons.CIRCLE,
                'icon-followers': window.Icons.PERSON || window.Icons.CIRCLE,
                'empty-details-icon': window.Icons.CIRCLE || window.Icons.CIRCLE,
                'empty-gods-icon': window.Icons.STAR_4 || window.Icons.CIRCLE,
                'empty-laws-icon': window.Icons.SHIELD || window.Icons.CIRCLE,
                'empty-places-icon': window.Icons.LOCATION || window.Icons.CIRCLE,
                'empty-followers-icon': window.Icons.PERSON || window.Icons.CIRCLE
            };

            for (var id in iconMap) {
                var el = document.getElementById(id);
                if (el) {
                    el.innerHTML = iconMap[id];
                }
            }
        }

        function switchTab(tabId) {
            tabButtons.forEach(function(btn) {
                btn.classList.toggle('active', btn.dataset.tab === tabId);
            });
            Object.keys(tabPanes).forEach(function(key) {
                if (tabPanes[key]) {
                    tabPanes[key].classList.toggle('active', key === tabId);
                }
            });

            var RS = window.ReligionState;
            if (RS && selectedReligionId) {
                var religion = RS.getReligion(selectedReligionId);
                if (religion) {
                    renderTabContent(tabId, religion);
                }
            }
        }

        tabButtons.forEach(function(btn) {
            btn.addEventListener('click', function() {
                switchTab(this.dataset.tab);
            });
        });

        function renderTabContent(tabId, religion) {
            if (!religion) return;

            var container = document.getElementById('tab-' + tabId);
            if (!container) return;

            try {
                if (tabId === 'details' && typeof window.ReligionDetailsTab !== 'undefined') {
                    if (typeof window.ReligionDetailsTab.render === 'function') {
                        window.ReligionDetailsTab.render(container, religion);
                        return;
                    }
                } else if (tabId === 'gods' && typeof window.ReligionGodsTab !== 'undefined') {
                    if (typeof window.ReligionGodsTab.render === 'function') {
                        window.ReligionGodsTab.render(container, religion);
                        return;
                    }
                } else if (tabId === 'laws' && typeof window.ReligionLawsTab !== 'undefined') {
                    if (typeof window.ReligionLawsTab.render === 'function') {
                        window.ReligionLawsTab.render(container, religion);
                        return;
                    }
                } else if (tabId === 'places' && typeof window.ReligionPlacesTab !== 'undefined') {
                    if (typeof window.ReligionPlacesTab.render === 'function') {
                        window.ReligionPlacesTab.render(container, religion);
                        return;
                    }
                } else if (tabId === 'followers' && typeof window.ReligionFollowersTab !== 'undefined') {
                    if (typeof window.ReligionFollowersTab.render === 'function') {
                        window.ReligionFollowersTab.render(container, religion);
                        return;
                    }
                }
            } catch(e) {}

            container.innerHTML = 
                '<div class="empty-state">' +
                '<div class="icon">' + (window.Icons ? window.Icons.CIRCLE : '') + '</div>' +
                '<div class="message">Tab "' + tabId + '" is not available</div>' +
                '<div class="sub-message">Check that the tab file is loaded correctly</div>' +
                '</div>';
        }

        function toggleSidebar() {
            sidebar.classList.toggle('open');
        }

        function closeSidebar() {
            sidebar.classList.remove('open');
        }

        if (burgerBtn) {
            burgerBtn.addEventListener('click', toggleSidebar);
        }

        document.addEventListener('click', function(e) {
            if (window.innerWidth <= 768) {
                if (!sidebar.contains(e.target) && e.target !== burgerBtn) {
                    closeSidebar();
                }
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeSidebar();
        });

        window.addEventListener('resize', function() {
            if (window.innerWidth > 768) closeSidebar();
        });

        function renderReligionList() {
            if (!religionContainer) return;

            var RS = window.ReligionState;
            var RUI = window.ReligionUI;

            if (!RS || !RUI || typeof RUI.renderReligionList !== 'function') {
                religionContainer.innerHTML = '<div class="loading-placeholder">Loading religions...</div>';
                return;
            }

            if (typeof RS.refreshFromMasterData === 'function') {
                RS.refreshFromMasterData();
            }

            var religions = RS.getAllReligions({ includeDeprecated: true });
            if (!religions || religions.length === 0) {
                religionContainer.innerHTML = 
                    '<div class="empty-state" style="padding:20px;text-align:center;">' +
                    '<div class="icon">' + (window.Icons ? window.Icons.CIRCLE : '✦') + '</div>' +
                    '<div class="message" style="font-size:0.7rem;color:var(--dim);">No religions found</div>' +
                    '<div class="sub-message" style="font-size:0.55rem;color:var(--dim);">Click "Create Religion" to add one</div>' +
                    '</div>';
                return;
            }

            try {
                RUI.renderReligionList('religionListContainer', {
                    filteredReligions: religions,
                    selectedId: selectedReligionId,
                    includeDeprecated: true,
                    onSelect: function(religion) {
                        if (religion && religion.id) {
                            selectedReligionId = religion.id;
                            renderReligionList();
                            Object.keys(tabPanes).forEach(function(key) {
                                if (tabPanes[key]) {
                                    tabPanes[key].innerHTML = 
                                        '<div class="empty-state"><div class="icon">' + 
                                        (window.Icons ? window.Icons.CIRCLE : '') + 
                                        '</div><div class="message">Loading...</div></div>';
                                }
                            });
                            switchTab('details');
                            if (window.innerWidth <= 768) closeSidebar();
                        }
                    },
                    showStats: true,
                    showActions: true
                });
            } catch(e) {
                religionContainer.innerHTML = '<div class="error-state">Error loading religions</div>';
            }
        }

        var createBtn = document.getElementById('createReligionBtn');
        if (createBtn) {
            createBtn.addEventListener('click', function() {
                if (typeof window.openCreateReligionModal === 'function') {
                    window.openCreateReligionModal({
                        onSuccess: function(religion) {
                            renderReligionList();
                            if (religion && religion.id) {
                                selectedReligionId = religion.id;
                                renderReligionList();
                                Object.keys(tabPanes).forEach(function(key) {
                                    if (tabPanes[key]) {
                                        tabPanes[key].innerHTML = 
                                            '<div class="empty-state"><div class="icon">' + 
                                            (window.Icons ? window.Icons.CIRCLE : '') + 
                                            '</div><div class="message">Loading...</div></div>';
                                    }
                                });
                                switchTab('details');
                            }
                        }
                    });
                }
            });
        }

        document.getElementById('exportBtn').addEventListener('click', function() {
            var data = window.masterData;
            if (!data) { alert('No data to export'); return; }
            var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'stillwaters_export_' + Date.now() + '.json';
            a.click();
            URL.revokeObjectURL(url);
        });

        document.getElementById('importBtn').addEventListener('click', function() {
            document.getElementById('fileInput').click();
        });

        document.getElementById('fileInput').addEventListener('change', function() {
            var file = this.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(e) {
                try {
                    var imported = JSON.parse(e.target.result);
                    var dataToImport = null;
                    if (imported.data && imported.version) dataToImport = imported;
                    else if (imported.religions || imported.characters) {
                        dataToImport = { version: '2.0', lastUpdated: new Date().toISOString(), data: imported };
                    } else if (imported.data) {
                        dataToImport = { version: '2.0', lastUpdated: new Date().toISOString(), data: imported.data };
                    }
                    if (!dataToImport) { alert('Invalid format'); return; }
                    
                    window.masterData = dataToImport;
                    if (!window.masterData.data.religions) window.masterData.data.religions = [];
                    if (!window.masterData.data.nameLists) window.masterData.data.nameLists = {};
                    if (!window.masterData.data.cityNameParts) window.masterData.data.cityNameParts = {};
                    
                    try { localStorage.setItem('stillwaters_master', JSON.stringify(window.masterData)); } catch(e) {}
                    if (typeof window.saveMasterData === 'function') window.saveMasterData(true);
                    
                    if (typeof window.ReligionState !== 'undefined' && ReligionState.invalidateCache) {
                        ReligionState.invalidateCache();
                    }
                    if (typeof window.invalidateAccessorCaches === 'function') {
                        window.invalidateAccessorCaches();
                    }
                    
                    renderReligionList();
                    selectedReligionId = null;
                    Object.keys(tabPanes).forEach(function(key) {
                        if (tabPanes[key]) {
                            tabPanes[key].innerHTML = 
                                '<div class="empty-state"><div class="icon">' + 
                                (window.Icons ? window.Icons.CIRCLE : '') + 
                                '</div><div class="message">Select a religion from the sidebar</div></div>';
                        }
                    });
                    alert('Import successful!');
                } catch(err) { alert('Invalid JSON: ' + err.message); }
            };
            reader.readAsText(file);
            this.value = '';
        });

        document.getElementById('setYearBtn').addEventListener('click', function() {
            var val = parseInt(document.getElementById('yearInput').value, 10);
            if (!isNaN(val) && window.masterData) {
                window.masterData.data.currentYear = val;
                try { localStorage.setItem('stillwaters_master', JSON.stringify(window.masterData)); } catch(e) {}
                if (typeof window.saveMasterData === 'function') window.saveMasterData(true);
            }
        });

        function init() {
            if (isInitialized) return;
            isInitialized = true;

            injectIcons();

            setTimeout(function() {
                renderReligionList();

                var RS = window.ReligionState;
                if (RS) {
                    if (typeof RS.refreshFromMasterData === 'function') {
                        RS.refreshFromMasterData();
                    }
                    
                    var religions = RS.getAllReligions({ includeDeprecated: true });
                    if (religions && religions.length > 0) {
                        if (!selectedReligionId) {
                            selectedReligionId = religions[0].id;
                        }
                        renderReligionList();
                        var religion = RS.getReligion(selectedReligionId);
                        if (religion) {
                            var container = document.getElementById('tab-details');
                            if (container && typeof window.ReligionDetailsTab !== 'undefined') {
                                if (typeof window.ReligionDetailsTab.render === 'function') {
                                    window.ReligionDetailsTab.render(container, religion);
                                }
                            }
                        }
                    }
                }
            }, 100);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            setTimeout(init, 50);
        }

        if (typeof window.addEventListener === 'function') {
            window.addEventListener('masterDataUpdated', function() {
                renderReligionList();
            });
        }

    })();
</script>

</body>
</html>
