<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover" />
    <title>Religion Manager</title>
    <link rel="icon" href="data:," />

    <script src="js/core/theme-boot.js"></script>

    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/common.css">

    <style>
        /* ============================================================
           Religion Manager — inline CSS
           STRUCTURAL ONLY. Every visual value comes from a theme token
           in themes.css. No hex values, no rgba() values, no hardcoded
           font stacks, no hardcoded px for design values. Spacing uses
           rem.

           Structure mirrors CultureManager.html so both manager pages
           share a common shell. The .rt-* rules at the bottom are the
           religion tab content styles that the five religion tab files
           emit.
           ============================================================ */

        html, body { height: 100%; margin: 0; overflow: hidden; }
        body {
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--text);
            font-family: var(--f-body);
            font-size: 1rem;
            line-height: var(--lh, 1.5);
            -webkit-font-smoothing: antialiased;
        }

        .topbar {
            position: relative;
            z-index: 100;
            flex-shrink: 0;
            background: var(--bg2);
            padding: 0.5rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.625rem;
            border-bottom: 1px solid var(--border);
            min-height: 3rem;
            flex-wrap: wrap;
        }
        .topbar .title {
            font-family: var(--f-display);
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--accent);
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
        }
        .topbar .title svg { width: 1em; height: 1em; fill: currentColor; }
        .topbar .spacer { flex: 1; min-width: 0.75rem; }
        .topbar .burger-menu {
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0.25rem 0.625rem;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            cursor: pointer;
        }

        .tb-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.3125rem;
            padding: 0.375rem 0.875rem;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: var(--f-body);
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            line-height: 1.2;
        }
        .tb-btn svg { width: 0.9em; height: 0.9em; fill: currentColor; }
        .tb-btn:hover {
            border-color: var(--accent);
            background: var(--accent-dim);
            color: var(--accent-light);
        }
        .tb-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--accent-fg);
        }
        .tb-btn.primary:hover { background: var(--accent-dark); }
        .tb-btn:disabled { opacity: 0.45; cursor: not-allowed; }

        .year-input {
            display: inline-flex;
            align-items: center;
            gap: 0.3125rem;
            padding: 0.1875rem 0.625rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-family: var(--f-body);
            font-size: 0.7rem;
            line-height: 1.2;
        }
        .year-input label {
            font-family: var(--f-display);
            font-size: 0.55rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--dim);
            white-space: nowrap;
        }
        .year-input input {
            width: 4rem;
            padding: 0.1875rem 0.375rem;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: var(--f-mono);
            font-size: 0.7rem;
            text-align: right;
        }
        .year-input input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .theme-toggle { position: relative; display: inline-flex; }
        .theme-toggle__menu {
            position: absolute;
            top: calc(100% + 0.25rem);
            right: 0;
            z-index: 9999;
            min-width: 10rem;
            max-height: 60vh;
            padding: 0.25rem;
            margin: 0;
            list-style: none;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow-y: auto;
        }
        .theme-toggle__menu[hidden] { display: none; }
        .theme-toggle__menu button {
            display: block;
            width: 100%;
            padding: 0.375rem 0.75rem;
            text-align: left;
            background: transparent;
            border: none;
            color: var(--text);
            font-family: var(--f-body);
            font-size: 0.7rem;
            border-radius: var(--radius);
            cursor: pointer;
        }
        .theme-toggle__menu button:hover {
            background: var(--accent-dim);
            color: var(--accent-light);
        }

        .app-layout {
            display: flex;
            flex-direction: row;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }
        .sidebar {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg2);
            border-right: 1px solid var(--border);
            width: 17.5rem;
        }
        .sidebar-header {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
            background: var(--bg3);
        }
        .sidebar-header h3 {
            margin: 0;
            font-family: var(--f-display);
            font-size: 0.65rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }
        .sidebar-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
            min-height: 0;
        }
        .main-panel {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
        }

        .manager-subtabs {
            position: sticky;
            top: 0;
            display: flex;
            align-items: stretch;
            gap: 0.25rem;
            padding: 0.5rem 1.5rem 0;
            margin: 0 0 1.25rem;
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            z-index: 10;
        }
        .manager-subtab {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.125rem 0.6875rem;
            background: transparent;
            border: 1px solid transparent;
            border-bottom: none;
            border-radius: var(--radius) var(--radius) 0 0;
            color: var(--dim);
            font-family: var(--f-display);
            font-size: 0.78rem;
            font-weight: 500;
            cursor: pointer;
        }
        .manager-subtab:hover {
            color: var(--accent-light);
            background: var(--accent-dim);
        }
        .manager-subtab.active {
            color: var(--accent);
            background: var(--bg2);
            border-color: var(--border);
            font-weight: 600;
        }
        .manager-subtab-icon {
            display: inline-flex;
            width: 1rem;
            height: 1rem;
            align-items: center;
            justify-content: center;
            color: currentColor;
        }
        .manager-subtab-icon svg { width: 100%; height: 100%; fill: currentColor; }

        .tab-content-wrapper {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 1.25rem 1.5rem;
            background: var(--bg);
        }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        .ct-hint {
            background: var(--bg2);
            border-left: 3px solid var(--accent);
            padding: 0.625rem 0.875rem;
            margin-bottom: 1rem;
            font-size: 0.7rem;
            color: var(--dim);
            line-height: 1.55;
            border-radius: 0 var(--radius) var(--radius) 0;
        }

        .ct-empty,
        .rt-empty {
            padding: 1.5rem;
            text-align: center;
            color: var(--dim);
            font-size: 0.8rem;
        }
        .ct-empty__sub,
        .rt-empty__sub {
            display: block;
            margin-top: 0.375rem;
            font-size: 0.7rem;
            color: var(--dim);
        }
        .rt-unavailable {
            padding: 1.5rem;
            text-align: center;
            color: var(--danger-lt);
            font-size: 0.8rem;
        }
        .loading,
        .loading-placeholder {
            padding: 1.5rem;
            text-align: center;
            color: var(--dim);
            font-size: 0.85rem;
        }
        .empty-state, .error-state {
            padding: 1.5rem;
            text-align: center;
            color: var(--dim);
            font-size: 0.8rem;
        }
        .empty-state .message { font-weight: 600; color: var(--text); }
        .empty-state .sub-message { margin-top: 0.375rem; font-size: 0.7rem; }
        .error-state { color: var(--danger-lt); }

        /* ============================================================
           RELIGION TAB CONTENT (.rt-*)
           Emitted by the five religion tab files.
           ============================================================ */

        .rt-tab { display: flex; flex-direction: column; gap: 1rem; }
        .rt-tab__header {
            display: flex; justify-content: space-between;
            align-items: center; gap: 0.75rem; flex-wrap: wrap;
        }
        .rt-tab__header-title {
            font-family: var(--f-display); font-size: 0.85rem;
            font-weight: 600; color: var(--accent-light);
            display: inline-flex; align-items: center; gap: 0.375rem;
        }
        .rt-tab__header-count {
            font-family: var(--f-mono); font-size: 0.7rem;
            color: var(--dim); font-weight: 400;
        }
        .rt-tab__header-actions {
            display: flex; gap: 0.375rem; align-items: center;
            flex-wrap: wrap;
        }
        .rt-tab__filters {
            display: flex; gap: 0.375rem; flex-wrap: wrap;
            align-items: center;
        }
        .rt-tab__body {
            display: flex; flex-direction: column; gap: 0.5rem;
        }
        .rt-tab__body--grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(17.5rem, 1fr));
        }
        .rt-tab__footer {
            display: flex; gap: 0.5rem; flex-wrap: wrap;
            padding-top: 0.75rem; border-top: 1px solid var(--border);
        }

        .rt-btn {
            display: inline-flex; align-items: center; gap: 0.25rem;
            padding: 0.3125rem 0.75rem; background: var(--bg3);
            border: 1px solid var(--border); border-radius: var(--radius);
            color: var(--text); font-family: var(--f-body);
            font-size: 0.7rem; font-weight: 500; cursor: pointer;
            line-height: 1.2;
        }
        .rt-btn:hover { border-color: var(--accent); color: var(--accent-light); }
        .rt-btn--primary {
            background: var(--accent); border-color: var(--accent);
            color: var(--accent-fg);
        }
        .rt-btn--primary:hover { background: var(--accent-dark); }
        .rt-btn--danger { border-color: var(--danger-lt); color: var(--danger-lt); }
        .rt-btn--danger:hover { background: var(--danger-soft); }
        .rt-btn--icon { padding: 0.3125rem 0.625rem; }
        .rt-btn:disabled { opacity: 0.45; cursor: not-allowed; }

        .rt-clear {
            padding: 0.3125rem 0.625rem; background: transparent;
            border: 1px solid var(--border); border-radius: var(--radius);
            color: var(--dim); font-size: 0.65rem; cursor: pointer;
        }
        .rt-clear:hover { color: var(--accent-light); border-color: var(--accent); }

        .rt-search input {
            width: 100%; min-width: 12.5rem;
            padding: 0.3125rem 0.5rem; background: var(--bg);
            border: 1px solid var(--border); border-radius: var(--radius);
            color: var(--text); font-family: var(--f-body);
            font-size: 0.72rem; box-sizing: border-box;
        }
        .rt-search input:focus { outline: none; border-color: var(--accent); }
        .rt-tab__filters select {
            padding: 0.3125rem 0.5rem; background: var(--bg);
            border: 1px solid var(--border); border-radius: var(--radius);
            color: var(--text); font-family: var(--f-body);
            font-size: 0.72rem;
        }
        .rt-tab__filters select:focus { outline: none; border-color: var(--accent); }

        .rt-status {
            display: inline-flex; align-items: center;
            padding: 0.125rem 0.5rem; border-radius: var(--radius);
            font-family: var(--f-mono); font-size: 0.6rem;
            white-space: nowrap;
        }
        .rt-status--active { background: var(--accent-dim); color: var(--accent-light); }
        .rt-status--deprecated { background: var(--danger-soft); color: var(--danger-lt); }
        .rt-badge {
            display: inline-flex; align-items: center;
            padding: 0.125rem 0.5rem; border-radius: var(--radius);
            font-family: var(--f-mono); font-size: 0.6rem;
            background: var(--bg3); color: var(--dim);
            white-space: nowrap;
        }
        .rt-badge--accent { background: var(--accent-dim); color: var(--accent-light); }

        .rt-details__hero {
            display: flex; justify-content: space-between;
            align-items: flex-start; gap: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border);
        }
        .rt-details__identity {
            display: flex; align-items: center; gap: 0.625rem;
        }
        .rt-details__glyph { font-size: 1.75rem; line-height: 1; }
        .rt-details__name {
            font-family: var(--f-display); font-size: 1.1rem;
            font-weight: 600; color: var(--accent-light);
        }
        .rt-details__slug {
            font-family: var(--f-mono); font-size: 0.65rem;
            color: var(--dim); margin-top: 0.125rem;
        }
        .rt-details__badges { display: flex; gap: 0.375rem; flex-wrap: wrap; }
        .rt-details__stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(6.25rem, 1fr));
            gap: 0.5rem;
            padding: 0.75rem;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }
        .rt-stat { display: flex; flex-direction: column; gap: 0.125rem; text-align: center; }
        .rt-stat__label {
            font-family: var(--f-display); font-size: 0.55rem;
            text-transform: uppercase; letter-spacing: 0.06em;
            color: var(--dim);
        }
        .rt-stat__value {
            font-family: var(--f-mono); font-size: 0.95rem;
            font-weight: 600; color: var(--text);
        }
        .rt-stat__value--small { font-size: 0.7rem; }
        .rt-details__note {
            padding: 0.625rem 0.875rem; background: var(--bg2);
            border-left: 3px solid var(--accent);
            border-radius: 0 var(--radius) var(--radius) 0;
            font-size: 0.72rem; color: var(--dim); line-height: 1.55;
        }
        .rt-details__grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(17.5rem, 1fr));
            gap: 1rem;
        }
        .rt-panel {
            padding: 0.875rem 1rem;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }
        .rt-panel__header {
            display: flex; justify-content: space-between;
            align-items: center; gap: 0.5rem;
            margin-bottom: 0.625rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
        }
        .rt-panel__title {
            font-family: var(--f-display); font-size: 0.72rem;
            font-weight: 600; color: var(--accent-light);
            text-transform: uppercase; letter-spacing: 0.06em;
        }
        .rt-kv {
            display: grid;
            grid-template-columns: max-content 1fr;
            gap: 0.25rem 0.625rem;
            font-size: 0.7rem;
        }
        .rt-kv__key { color: var(--dim); }
        .rt-kv__val { color: var(--text); }
        .rt-form__hint {
            font-size: 0.65rem; color: var(--dim);
            padding: 0.5rem 0; line-height: 1.5;
        }
        .rt-chipset { display: flex; flex-wrap: wrap; gap: 0.375rem; }
        .rt-chip {
            display: inline-flex; align-items: center; gap: 0.125rem;
            padding: 0.125rem 0.125rem 0.125rem 0.5rem;
            background: var(--accent-dim); color: var(--accent-light);
            border-radius: var(--radius); font-size: 0.7rem;
        }
        .rt-chip__remove {
            background: transparent; border: none; color: inherit;
            padding: 0 0.375rem; font-size: 0.9rem; line-height: 1;
            cursor: pointer; opacity: 0.7;
        }
        .rt-chip__remove:hover { opacity: 1; color: var(--danger-lt); }

        .rt-god-card {
            display: flex; flex-direction: column; gap: 0.375rem;
            padding: 0.75rem 0.875rem;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }
        .rt-god-card__header {
            display: flex; justify-content: space-between;
            align-items: flex-start; gap: 0.5rem;
        }
        .rt-god-card__identity {
            display: flex; align-items: center; gap: 0.5rem;
        }
        .rt-god-card__glyph { font-size: 1.5rem; line-height: 1; }
        .rt-god-card__name {
            font-family: var(--f-display); font-size: 0.8rem;
            font-weight: 600; color: var(--text);
        }
        .rt-god-card__slug {
            font-family: var(--f-mono); font-size: 0.6rem;
            color: var(--dim);
        }
        .rt-god-card__actions { display: flex; gap: 0.25rem; flex-shrink: 0; }
        .rt-god-card__meta {
            display: flex; gap: 0.5rem; flex-wrap: wrap;
            font-family: var(--f-mono); font-size: 0.6rem;
            color: var(--dim);
        }
        .rt-god-card__desc {
            font-size: 0.7rem; color: var(--text); line-height: 1.55;
        }
        .rt-god-card__parent {
            font-size: 0.6rem; color: var(--dim);
            font-family: var(--f-mono);
        }

        .rt-law-card {
            display: flex; flex-direction: column; gap: 0.375rem;
            padding: 0.75rem 0.875rem;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-left: 3px solid var(--border);
            border-radius: var(--radius);
        }
        .rt-law-card--minor { border-left-color: var(--accent); }
        .rt-law-card--major { border-left-color: var(--warn, #c87040); }
        .rt-law-card--mortal { border-left-color: var(--danger-lt); }
        .rt-law-card__header {
            display: flex; justify-content: space-between;
            align-items: flex-start; gap: 0.5rem;
        }
        .rt-law-card__title-row {
            display: flex; gap: 0.375rem; flex-wrap: wrap;
            align-items: center;
        }
        .rt-law-card__name {
            font-family: var(--f-display); font-size: 0.8rem;
            font-weight: 600; color: var(--text);
        }
        .rt-law-card__meta {
            display: flex; gap: 0.625rem; flex-wrap: wrap;
            font-size: 0.65rem; color: var(--dim);
        }
        .rt-law-card__meta--severity-minor { color: var(--accent-light); }
        .rt-law-card__meta--severity-major { color: var(--warn, #c87040); }
        .rt-law-card__meta--severity-mortal { color: var(--danger-lt); }
        .rt-law-card__actions { display: flex; gap: 0.25rem; flex-shrink: 0; }
        .rt-law-card__desc {
            font-size: 0.7rem; color: var(--text); line-height: 1.55;
        }
        .rt-law-card__crime {
            font-family: var(--f-mono); font-size: 0.6rem;
            color: var(--dim);
        }
        .rt-enforced-badge {
            padding: 0.125rem 0.375rem; border-radius: var(--radius);
            font-family: var(--f-mono); font-size: 0.55rem;
        }
        .rt-enforced-badge--on { background: var(--accent-dim); color: var(--accent-light); }
        .rt-enforced-badge--off { background: var(--bg3); color: var(--dim); }

        .rt-place-card {
            display: flex; flex-direction: column; gap: 0.375rem;
            padding: 0.75rem 0.875rem;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }
        .rt-place-card--inactive { opacity: 0.6; }
        .rt-place-card__header {
            display: flex; justify-content: space-between;
            align-items: flex-start; gap: 0.5rem;
        }
        .rt-place-card__title-row {
            display: flex; gap: 0.375rem; flex-wrap: wrap;
            align-items: center;
        }
        .rt-place-card__name {
            font-family: var(--f-display); font-size: 0.8rem;
            font-weight: 600; color: var(--text);
        }
        .rt-place-card__meta {
            display: flex; gap: 0.625rem; flex-wrap: wrap;
            font-size: 0.65rem; color: var(--dim);
        }
        .rt-place-card__actions { display: flex; gap: 0.25rem; flex-shrink: 0; }
        .rt-place-card__sub {
            display: flex; gap: 0.625rem; flex-wrap: wrap;
            font-size: 0.6rem; color: var(--dim);
            font-family: var(--f-mono);
        }
        .rt-place-card__notes {
            font-size: 0.7rem; color: var(--text); line-height: 1.55;
        }
        .rt-place-partial-note {
            padding: 0.5rem 0.75rem;
            background: var(--bg3);
            border-left: 3px solid var(--warn, #c87040);
            border-radius: 0 var(--radius) var(--radius) 0;
            font-size: 0.65rem; color: var(--dim); line-height: 1.5;
        }

        .rt-follower-row {
            display: flex; justify-content: space-between;
            align-items: flex-start; gap: 0.75rem;
            padding: 0.625rem 0.875rem;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            border-radius: var(--radius);
        }
        .rt-follower-row--deceased {
            border-left-color: var(--danger-lt);
            opacity: 0.75;
        }
        .rt-follower-row__body { flex: 1; min-width: 0; }
        .rt-follower-row__top {
            display: flex; gap: 0.5rem; flex-wrap: wrap;
            align-items: center; margin-bottom: 0.25rem;
        }
        .rt-follower-row__name {
            font-family: var(--f-display); font-size: 0.78rem;
            font-weight: 600; color: var(--text);
        }
        .rt-follower-row__gender,
        .rt-follower-row__age,
        .rt-follower-row__deceased,

<!-- DIAGNOSTIC HOOK — paste this AFTER all scripts and BEFORE    -->
<!-- the orchestrator. Runs at load time, logs a full picture of  -->
<!-- the storage round-trip to the console. Safe: read-only.      -->
<!-- ============================================================ -->
<script>
(function () {
    'use strict';

    window.__religionDiag = {
        // Snapshot the state. Call at any time from the console.
        snapshot: function (label) {
            label = label || 'snapshot';
            console.group('[religion-diag] ' + label);

            // 1. What masterData looks like in memory right now.
            var md = window.masterData;
            console.log('masterData present:', !!md);
            console.log('masterData.data present:', !!(md && md.data));
            var inMemoryReligions = (md && md.data && md.data.religions);
            console.log('masterData.data.religions type:',
                Array.isArray(inMemoryReligions) ? 'array' : typeof inMemoryReligions);
            console.log('masterData.data.religions length:',
                Array.isArray(inMemoryReligions) ? inMemoryReligions.length : '(not array)');
            if (Array.isArray(inMemoryReligions)) {
                console.log('masterData.data.religions content:',
                    inMemoryReligions.map(function (r) {
                        return r && r.id ? (r.name || r.id) : '(invalid)';
                    }));
            }

            // 2. What's actually in localStorage right now.
            var keys = Object.keys(localStorage);
            console.log('localStorage keys:', keys);
            var storageKey = null;
            for (var i = 0; i < keys.length; i++) {
                var k = keys[i];
                var v = null;
                try { v = localStorage.getItem(k); } catch (e) {}
                if (v && v.length > 100) {
                    var parsed = null;
                    try { parsed = JSON.parse(v); } catch (e) {}
                    if (parsed && (parsed.data || parsed.schemaVersion)) {
                        storageKey = k;
                        console.log('detected save key:', k, 'length:', v.length);
                        var storageReligions = parsed && parsed.data && parsed.data.religions;
                        console.log('  storage religions type:',
                            Array.isArray(storageReligions) ? 'array' : typeof storageReligions);
                        console.log('  storage religions length:',
                            Array.isArray(storageReligions) ? storageReligions.length : '(not array)');
                        if (Array.isArray(storageReligions)) {
                            console.log('  storage religions content:',
                                storageReligions.map(function (r) {
                                    return r && r.id ? (r.name || r.id) : '(invalid)';
                                }));
                        }
                        console.log('  schemaVersion:', parsed.schemaVersion);
                        console.log('  savedAt:', parsed.savedAt);
                    }
                }
            }
            if (!storageKey) {
                console.warn('No save key detected in localStorage. ' +
                    'Nothing has been persisted under a recognizable schema.');
            }

            // 3. Compare.
            if (storageKey && Array.isArray(inMemoryReligions)) {
                var parsed = JSON.parse(localStorage.getItem(storageKey));
                var storageReligions = parsed && parsed.data && parsed.data.religions;
                if (Array.isArray(storageReligions)) {
                    console.log('SAME COUNT?',
                        inMemoryReligions.length === storageReligions.length,
                        '(memory:', inMemoryReligions.length,
                        'storage:', storageReligions.length, ')');
                }
            }

            console.groupEnd();
            return { storageKey: storageKey };
        },

        // Force a save and immediately check what landed. Call this
        // right after creating a religion, before reload.
        saveAndInspect: function () {
            console.group('[religion-diag] saveAndInspect');

            if (typeof window.saveMasterData !== 'function') {
                console.error('saveMasterData is not a function. Storage module not loaded.');
                console.groupEnd();
                return;
            }

            var before = window.__religionDiag._countInStorage();
            console.log('storage religion count BEFORE save:', before);

            var ok = null;
            try {
                ok = window.saveMasterData();
            } catch (e) {
                console.error('saveMasterData threw:', e);
                console.groupEnd();
                return;
            }
            console.log('saveMasterData() returned:', ok);

            if (typeof window.getLastSaveError === 'function') {
                var err = window.getLastSaveError();
                console.log('getLastSaveError():', err);
            }

            var after = window.__religionDiag._countInStorage();
            console.log('storage religion count AFTER save:', after);
            console.log('count increased by save?', (after - before));

            window.__religionDiag.snapshot('after-save');
            console.groupEnd();
        },

        _countInStorage: function () {
            var keys = Object.keys(localStorage);
            for (var i = 0; i < keys.length; i++) {
                var v = null;
                try { v = localStorage.getItem(keys[i]); } catch (e) {}
                if (v && v.length > 100) {
                    var parsed = null;
                    try { parsed = JSON.parse(v); } catch (e) {}
                    if (parsed && parsed.data && Array.isArray(parsed.data.religions)) {
                        return parsed.data.religions.length;
                    }
                }
            }
            return -1;
        },

        // Print storage keys + which one looks like the save.
        keys: function () {
            var keys = Object.keys(localStorage);
            console.table(keys.map(function (k) {
                var v = localStorage.getItem(k);
                return {
                    key: k,
                    length: v ? v.length : 0,
                    preview: v ? v.slice(0, 60) : ''
                };
            }));
        }
    };

    // Log the load-time state immediately.
    console.log('[religion-diag] Diagnostic hook installed. ' +
        'Run one of these in the console:\n' +
        '  __religionDiag.snapshot()          — current memory vs storage\n' +
        '  __religionDiag.saveAndInspect()    — force save, then compare\n' +
        '  __religionDiag.keys()              — list localStorage keys\n' +
        '  __religionDiag._countInStorage()   — count religions in storage');

    // Also run a snapshot after a short delay, so if loadMasterData
    // finished by then, we capture it.
    setTimeout(function () {
        window.__religionDiag.snapshot('after-load');
    }, 500);
})();
</script>

<!-- ============================================================ -->
<!-- ORCHESTRATOR                                                 -->
<!-- ============================================================ -->
<script>
(function () {
    'use strict';

    var religionContainer = document.getElementById('religionListContainer');
    var sidebar           = document.getElementById('religionSidebar');
    var sidebarOverlay    = document.getElementById('sidebarOverlay');
    var menuToggle        = document.getElementById('menuToggle');
    var yearInput         = document.getElementById('yearInput');
    var setYearBtn        = document.getElementById('setYearBtn');
    var exportBtn         = document.getElementById('exportBtn');
    var importBtn         = document.getElementById('importBtn');
    var fileInput         = document.getElementById('fileInput');
    var createReligionBtn = document.getElementById('createReligionBtn');
    var editReligionBtn   = document.getElementById('editReligionBtn');
    var deleteReligionBtn = document.getElementById('deleteReligionBtn');
    var refreshBtn        = document.getElementById('refreshBtn');

    var tabButtons = Array.prototype.slice.call(
        document.querySelectorAll('.manager-subtabs .manager-subtab')
    );

    var selectedReligionId = null;
    var activeTabId        = 'details';
    var isInitialized      = false;

    function bootstrap() {
        if (isInitialized) return;
        isInitialized = true;

        if (typeof window.loadMasterData === 'function') {
            try { window.loadMasterData(); }
            catch (e) {
                console.error('[religion-manager] loadMasterData failed:', e);
            }
        }

        if (window.masterData && window.masterData.data) {
            if (!Array.isArray(window.masterData.data.religions)) {
                window.masterData.data.religions = [];
            }
        }

        if (window.LocationBootstrap
            && typeof window.LocationBootstrap.init === 'function') {
            try { window.LocationBootstrap.init(); } catch (e) {
                console.error('[religion-manager] location bootstrap failed:', e);
            }
        }
        if (window.ReligionBootstrap
            && typeof window.ReligionBootstrap.init === 'function') {
            try { window.ReligionBootstrap.init(); } catch (e) {
                console.error('[religion-manager] religion bootstrap failed:', e);
            }
        }
        if (window.TabManager && typeof window.TabManager.init === 'function') {
            try { window.TabManager.init(); } catch (e) {
                console.error('[religion-manager] TabManager.init failed:', e);
            }
        }

        injectIcons();
        syncYearInput();
        renderReligionList();
        pickInitialSelection();
        syncTabButtons(activeTabId);

        // Expose a manual refresh so the diagnostic can trigger a
        // re-render after a forced save.
        window.__religionManagerRefresh = function () {
            renderReligionList();
            if (selectedReligionId) renderActiveTab();
        };
    }

    function injectIcons() {
        if (typeof window.Icons === 'undefined') {
            setTimeout(injectIcons, 100);
            return;
        }
        var nodes = document.querySelectorAll('[data-icon]');
        for (var i = 0; i < nodes.length; i++) {
            var node = nodes[i];
            var name = node.getAttribute('data-icon');
            var svg = window.Icons[name] || window.Icons.CIRCLE || '';
            node.innerHTML = svg;
        }
    }

    function renderReligionList() {
        if (!religionContainer) return;

        var Queries = window.ReligionQueries;
        var VM      = window.ReligionViewModels;
        var Render  = window.ReligionRender;

        if (!Queries || !VM || !Render) {
            religionContainer.innerHTML =
                '<div class="ct-empty">Religion modules not loaded.</div>';
            return;
        }

        var religions;
        try {
            religions = Queries.getAllReligions({ includeDeprecated: true });
        } catch (e) {
            console.error('[religion-manager] getAllReligions failed:', e);
            religionContainer.innerHTML =
                '<div class="ct-empty">Error loading religions.</div>';
            return;
        }

        if (!religions || religions.length === 0) {
            religionContainer.innerHTML =
                '<div class="ct-empty">' +
                '<div>No religions found</div>' +
                '<div class="ct-empty__sub">Click "+ Religion" to add one</div>' +
                '</div>';
            return;
        }

        var rows;
        try {
            rows = VM.buildReligionRows(religions);
        } catch (e) {
            console.error('[religion-manager] buildReligionRows failed:', e);
            religionContainer.innerHTML =
                '<div class="ct-empty">Error preparing religion list.</div>';
            return;
        }

        try {
            Render.renderReligionList(religionContainer, rows, {
                selectedId: selectedReligionId,
                showStats: true,
                showActions: true
            });
        } catch (e) {
            console.error('[religion-manager] renderReligionList failed:', e);
            religionContainer.innerHTML =
                '<div class="ct-empty">Error rendering religion list.</div>';
            return;
        }

        if (!religionContainer.__religionBound) {
            religionContainer.__religionBound = true;
            Render.bindReligionListEvents(religionContainer, {
                onSelect: function (id) { selectReligion(id); },
                onView:   function (id) { selectReligion(id); },
                onEdit:   function (id) { openEditReligion(id); }
            });
        }
    }

    function pickInitialSelection() {
        if (selectedReligionId) return;
        var Queries = window.ReligionQueries;
        if (!Queries) return;
        try {
            var religions = Queries.getAllReligions({ includeDeprecated: true });
            if (religions && religions.length > 0) {
                selectReligion(religions[0].id);
            }
        } catch (e) {
            console.error('[religion-manager] initial selection failed:', e);
        }
    }

    function selectReligion(id) {
        if (!id) return;
        selectedReligionId = id;

        if (editReligionBtn)   editReligionBtn.disabled   = false;
        if (deleteReligionBtn) deleteReligionBtn.disabled = false;

        if (window.ReligionUIState
            && typeof window.ReligionUIState.setSelectedReligionId === 'function') {
            window.ReligionUIState.setSelectedReligionId(id);
        }

        if (window.ReligionTabContext) {
            var fresh = null;
            try {
                fresh = window.ReligionQueries
                    ? window.ReligionQueries.getReligion(id)
                    : null;
            } catch (e) {
                console.error('[religion-manager] getReligion failed:', e);
            }
            window.ReligionTabContext.religion = fresh || null;
        }

        var items = religionContainer.querySelectorAll('.religion-item');
        for (var i = 0; i < items.length; i++) {
            items[i].classList.toggle(
                'religion-item--selected',
                items[i].getAttribute('data-religion-id') === id
            );
        }

        renderActiveTab();
        if (window.innerWidth <= 768) closeSidebar();
    }

    function activateTab(tabId) {
        activeTabId = tabId;
        syncTabButtons(tabId);
        renderActiveTab();
    }

    function syncTabButtons(tabId) {
        for (var i = 0; i < tabButtons.length; i++) {
            var btn = tabButtons[i];
            var isActive = btn.dataset.tab === tabId;
            btn.classList.toggle('active', isActive);
            btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
            btn.setAttribute('tabindex', isActive ? '0' : '-1');
        }
        var panes = document.querySelectorAll('#tabContent .tab-pane');
        for (var j = 0; j < panes.length; j++) {
            panes[j].classList.toggle(
                'active',
                panes[j].getAttribute('data-tab-content') === tabId
            );
        }
    }

    for (var i = 0; i < tabButtons.length; i++) {
        (function (btn) {
            btn.addEventListener('click', function () {
                activateTab(btn.dataset.tab);
            });
        })(tabButtons[i]);
    }

    function renderActiveTab() {
        if (window.TabManager && typeof window.TabManager.has === 'function') {
            try {
                if (window.TabManager.has('religion', activeTabId)) {
                    window.TabManager.activate('religion', activeTabId);
                    return;
                }
                window.TabManager.render('religion', activeTabId);
                return;
            } catch (e) {
                console.error(
                    '[religion-manager] TabManager.activate failed for tab "' +
                    activeTabId + '":', e
                );
            }
        }

        var container = document.getElementById('tab-' + activeTabId);
        if (!container) return;

        if (!selectedReligionId) {
            setEmptyState(container, 'Select a religion from the sidebar');
            return;
        }

        var VM = window.ReligionViewModels;
        if (!VM) {
            setEmptyState(container, 'Religion view models not loaded');
            return;
        }

        var model;
        try {
            model = VM.buildReligionDetailsModel(selectedReligionId);
        } catch (e) {
            console.error('[religion-manager] buildReligionDetailsModel failed:', e);
            setEmptyState(container, 'Error loading religion data');
            return;
        }
        if (!model) {
            setEmptyState(container, 'Religion not found');
            return;
        }
        renderGenericTab(container, model, activeTabId);
    }

    function renderGenericTab(container, model, tabId) {
        var row = model.row;
        var html = '';
        if (tabId === 'details') {
            html = '<div class="ct-hint">' +
                '<strong>' + escapeHtml(row.displayName) + '</strong>' +
                (row.description
                    ? '<div style="margin-top:0.375rem;">' + escapeHtml(row.description) + '</div>'
                    : '') +
                '<div style="margin-top:0.375rem;font-family:var(--f-mono);font-size:0.65rem;">' +
                row.followerCount + ' followers · ' +
                row.godCount + ' gods · ' +
                row.lawCount + ' laws · ' +
                row.placeCount + ' places' +
                '</div></div>';
        } else if (tabId === 'gods') {
            if (model.gods.length === 0) {
                html = '<div class="ct-empty">No gods recorded.</div>';
            } else {
                html = '<div class="ct-hint">';
                for (var i = 0; i < model.gods.length; i++) {
                    html += '<div>' + escapeHtml(model.gods[i].displayName) + '</div>';
                }
                html += '</div>';
            }
        } else if (tabId === 'laws') {
            if (model.laws.length === 0) {
                html = '<div class="ct-empty">No laws recorded.</div>';
            } else {
                html = '<div class="ct-hint">';
                for (var j = 0; j < model.laws.length; j++) {
                    var l = model.laws[j];
                    html += '<div>' + escapeHtml(l.name) +
                        ' <span style="color:var(--dim);">(' +
                        escapeHtml(l.typeLabel) + ', ' +
                        escapeHtml(l.domainLabel) + ')</span></div>';
                }
                html += '</div>';
            }
        } else if (tabId === 'places') {
            if (model.places.length === 0) {
                html = '<div class="ct-empty">No places of worship.</div>';
            } else {
                html = '<div class="ct-hint">';
                for (var k = 0; k < model.places.length; k++) {
                    html += '<div>' + escapeHtml(model.places[k].id) + '</div>';
                }
                html += '</div>';
            }
        } else if (tabId === 'followers') {
            html = '<div class="ct-empty">' +
                row.followerCount + ' living follower(s).' +
                '</div>';
        }
        container.innerHTML = html;
    }

    function setEmptyState(container, message) {
        container.innerHTML = '<div class="ct-empty">' + escapeHtml(message) + '</div>';
    }

    function escapeHtml(value) {
        if (typeof window.escapeHtml === 'function') return window.escapeHtml(value);
        if (value === null || value === undefined) return '';
        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function openSidebar() {
        if (sidebar) sidebar.classList.add('visible');
        if (sidebarOverlay) sidebarOverlay.classList.add('active');
    }
    function closeSidebar() {
        if (sidebar) sidebar.classList.remove('visible');
        if (sidebarOverlay) sidebarOverlay.classList.remove('active');
    }
    function toggleSidebar() {
        if (!sidebar) return;
        if (sidebar.classList.contains('visible')) closeSidebar();
        else openSidebar();
    }
    if (menuToggle) menuToggle.addEventListener('click', toggleSidebar);
    if (sidebarOverlay) sidebarOverlay.addEventListener('click', closeSidebar);
    window.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeSidebar();
    });

    function syncYearInput() {
        if (!yearInput) return;
        try {
            var y = (typeof window.getCurrentYear === 'function')
                ? window.getCurrentYear()
                : (window.masterData && window.masterData.data
                    ? window.masterData.data.currentYear
                    : null);
            if (typeof y === 'number' && isFinite(y)) {
                yearInput.value = String(y);
            }
        } catch (e) { /* ignore */ }
    }

    if (setYearBtn) setYearBtn.addEventListener('click', function () {
        var val = parseInt(yearInput.value, 10);
        if (!isFinite(val)) { window.alert('Enter a valid year.'); return; }
        if (typeof window.isValidYear === 'function' && !window.isValidYear(val)) {
            window.alert('Year is outside the allowed range.');
            return;
        }
        if (window.masterData && window.masterData.data) {
            window.masterData.data.currentYear = val;
        }
        if (typeof window.markDataDirty === 'function') window.markDataDirty();
        if (typeof window.saveMasterData === 'function') window.saveMasterData();
        renderActiveTab();
    });

    if (exportBtn) exportBtn.addEventListener('click', function () {
        if (typeof window.exportData === 'function') { window.exportData(); return; }
        if (typeof window.exportToJSON === 'function' && window.masterData) {
            window.exportToJSON(window.masterData, 'stillwaters'); return;
        }
        window.alert('Export module not available.');
    });

    if (importBtn && fileInput) {
        importBtn.addEventListener('click', function () {
            fileInput.value = ''; fileInput.click();
        });
        fileInput.addEventListener('change', function () {
            var file = this.files && this.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function (ev) {
                try {
                    var parsed = JSON.parse(ev.target.result);
                    var dataToInstall = null;
                    if (parsed && parsed.data && parsed.data.religions !== undefined) dataToInstall = parsed.data;
                    else if (parsed && parsed.religions !== undefined) dataToInstall = parsed;
                    else if (parsed && parsed.data) dataToInstall = parsed.data;
                    if (!dataToInstall) { window.alert('Unrecognized import format.'); return; }

                    if (typeof window.normalizeMasterData !== 'function') {
                        window.alert('Schema module not available; cannot import.'); return;
                    }
                    window.masterData = window.normalizeMasterData({
                        schemaVersion: window.STORAGE_SCHEMA_VERSION,
                        savedAt: new Date().toISOString(),
                        data: dataToInstall
                    });
                    if (typeof window.invalidateAccessorCaches === 'function') window.invalidateAccessorCaches();
                    if (typeof window.markDataDirty === 'function') window.markDataDirty();
                    if (typeof window.saveMasterData === 'function' && !window.saveMasterData()) {
                        window.alert('Save failed after import.'); return;
                    }
                    if (window.ReligionBootstrap) window.ReligionBootstrap.init();
                    if (window.LocationBootstrap) window.LocationBootstrap.init();

                    selectedReligionId = null;
                    if (editReligionBtn)   editReligionBtn.disabled   = true;
                    if (deleteReligionBtn) deleteReligionBtn.disabled = true;
                    if (window.ReligionTabContext) window.ReligionTabContext.religion = null;
                    syncYearInput();
                    renderReligionList();
                    pickInitialSelection();
                    window.alert('Import complete.');
                } catch (err) {
                    window.alert('Invalid JSON: ' + err.message);
                }
            };
            reader.onerror = function () { window.alert('Failed to read file.'); };
            reader.readAsText(file);
            this.value = '';
        });
    }

    if (refreshBtn) refreshBtn.addEventListener('click', function () {
        if (typeof window.loadMasterData === 'function') window.loadMasterData();
        setTimeout(function () {
            if (window.ReligionBootstrap) window.ReligionBootstrap.init();
            renderReligionList();
            if (selectedReligionId) renderActiveTab();
        }, 100);
    });

    function openCreateReligion() {
        if (typeof window.openCreateReligionModal !== 'function') {
            window.alert('Create Religion modal not loaded.');
            return;
        }
        window.openCreateReligionModal({
            onSuccess: function () {
                renderReligionList();
                var Queries = window.ReligionQueries;
                if (Queries) {
                    var religions = Queries.getAllReligions({ includeDeprecated: true });
                    if (religions && religions.length > 0) {
                        selectReligion(religions[religions.length - 1].id);
                    }
                }
            }
        });
    }

    function openEditReligion(id) {
        if (typeof window.openEditReligionModal !== 'function') {
            window.alert('Edit Religion modal not loaded.');
            return;
        }
        window.openEditReligionModal(id, {
            onSuccess: function (updated) {
                renderReligionList();
                if (id === selectedReligionId && window.ReligionTabContext) {
                    var fresh = updated;
                    if (!fresh && window.ReligionQueries) {
                        try { fresh = window.ReligionQueries.getReligion(id); }
                        catch (e) { /* non-fatal */ }
                    }
                    if (fresh) {
                        window.ReligionTabContext.religion = fresh;
                        renderActiveTab();
                    }
                }
            }
        });
    }

    function openDeleteReligion(id) {
        if (typeof window.openDeleteReligionModal !== 'function') {
            window.alert('Delete Religion modal not loaded.');
            return;
        }
        window.openDeleteReligionModal(id, {
            onSuccess: function () {
                if (selectedReligionId === id) {
                    selectedReligionId = null;
                    if (editReligionBtn)   editReligionBtn.disabled   = true;
                    if (deleteReligionBtn) deleteReligionBtn.disabled = true;
                    if (window.ReligionTabContext) window.ReligionTabContext.religion = null;
                }
                renderReligionList();
                pickInitialSelection();
            }
        });
    }

    if (createReligionBtn) createReligionBtn.addEventListener('click', openCreateReligion);
    if (editReligionBtn)   editReligionBtn.addEventListener('click', function () {
        if (selectedReligionId) openEditReligion(selectedReligionId);
    });
    if (deleteReligionBtn) deleteReligionBtn.addEventListener('click', function () {
        if (selectedReligionId) openDeleteReligion(selectedReligionId);
    });

    window.addEventListener('masterDataUpdated', function () {
        renderReligionList();
        if (selectedReligionId && window.ReligionQueries) {
            var fresh = null;
            try { fresh = window.ReligionQueries.getReligion(selectedReligionId); }
            catch (e) { /* ignore */ }
            if (fresh && window.ReligionTabContext) {
                window.ReligionTabContext.religion = fresh;
            } else if (window.ReligionTabContext) {
                window.ReligionTabContext.religion = null;
            }
            renderActiveTab();
        }
    });

    function onDomReady(fn) {
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', fn);
        } else {
            fn();
        }
    }
    onDomReady(bootstrap);
})();
</script>

<!-- ============================================================ -->
<!-- THEME SWITCHER                                               -->
<!-- ============================================================ -->
<script>
(function () {
    'use strict';

    var STORAGE_KEY = 'stillwaters_theme';

    var THEMES = [
        { id: 'dark',            label: 'Dark' },
        { id: 'light',           label: 'Light' },
        { id: 'vaporwave',       label: 'Vaporwave' },
        { id: 'pastel',          label: 'Pastel' },
        { id: 'carnival',        label: 'Carnival' },
        { id: 'maximal',         label: 'Maximal' },
        { id: 'gits',            label: 'GITS' },
        { id: 'nouveau',         label: 'Nouveau' },
        { id: 'ukiyo-e',         label: 'Ukiyo-e' },
        { id: 'nature',          label: 'Nature' },
        { id: 'kmt',             label: 'KMT' },
        { id: 'gaslight',        label: 'Gaslight' },
        { id: 'grotesque',       label: 'Grotesque' },
        { id: 'illuminated',     label: 'Illuminated' },
        { id: 'discowing',       label: 'Discowing' },
        { id: 'choc-cake',       label: 'Choc Cake' },
        { id: 'dada',            label: 'Dada' },
        { id: 'brutalist',       label: 'Brutalist' },
        { id: 'orchestrion',     label: 'Orchestrion' },
        { id: 'rococo',          label: 'Rococo' },
        { id: 'nautical-tile',   label: 'Nautical Tile' }
    ];

    var byId = {};
    for (var i = 0; i < THEMES.length; i++) byId[THEMES[i].id] = THEMES[i];

    var themeBtn  = document.getElementById('themeBtn');
    var themeMenu = document.getElementById('themeMenu');
    var themeName = document.getElementById('themeName');

    function apply(id) {
        if (!byId[id]) id = 'dark';
        document.documentElement.setAttribute('data-theme', id);
        themeName.textContent = byId[id].label;
        try { localStorage.setItem(STORAGE_KEY, id); } catch (e) {}
    }

    function buildMenu() {
        var html = '';
        for (var i = 0; i < THEMES.length; i++) {
            html += '<li role="none"><button role="menuitem" type="button" data-theme-id="' +
                THEMES[i].id + '">' + THEMES[i].label + '</button></li>';
        }
        themeMenu.innerHTML = html;
    }

    function openMenu() {
        themeMenu.hidden = false;
        themeBtn.setAttribute('aria-expanded', 'true');
    }
    function closeMenu() {
        themeMenu.hidden = true;
        themeBtn.setAttribute('aria-expanded', 'false');
    }

    if (themeBtn) themeBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        if (themeMenu.hidden) openMenu(); else closeMenu();
    });

    if (themeMenu) themeMenu.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-theme-id]');
        if (!btn) return;
        apply(btn.getAttribute('data-theme-id'));
        closeMenu();
    });

    document.addEventListener('click', function (e) {
        if (!themeMenu || themeMenu.hidden) return;
        if (themeMenu.contains(e.target)) return;
        if (e.target === themeBtn) return;
        closeMenu();
    });

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && themeMenu && !themeMenu.hidden) closeMenu();
    });

    var saved = null;
    try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) {}

    buildMenu();

    if (saved && byId[saved]) {
        apply(saved);
    } else {
        var mq = window.matchMedia('(prefers-color-scheme: light)');
        apply(mq.matches ? 'light' : 'dark');
        mq.addEventListener('change', function (ev) {
            var check;
            try { check = localStorage.getItem(STORAGE_KEY); } catch (e) {}
            if (!check) apply(ev.matches ? 'light' : 'dark');
        });
    }

    window.ThemeSwitcher = { apply: apply, themes: THEMES.slice() };
})();
</script>

</body>
</html>
