<div class="topbar">
    <button id="menuToggle" class="burger-menu" type="button" aria-label="Toggle menu">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
    </button>
    <a id="dashboardBtn" class="tb-btn" href="index.html">← Dashboard</a>
    <div class="title" id="religionManagerTitle">Religion Manager</div>
    <div class="spacer"></div>

    <button id="createReligionBtn" class="tb-btn primary" type="button">+ Religion</button>

    <div class="year-input">
        <label for="yearInput">Year</label>
        <input type="number" id="yearInput" min="1" step="1">
        <button id="setYearBtn" class="tb-btn" type="button">Set</button>
    </div>

    <button id="importBtn" aria-label="Import" title="Import" class="tb-btn" type="button"><span aria-hidden="true">⤓</span></button>
    <button id="exportBtn" aria-label="Export" title="Export" class="tb-btn" type="button"><span aria-hidden="true">⤒</span></button>
    <button id="refreshBtn" aria-label="Refresh" title="Refresh" class="tb-btn" type="button"><span aria-hidden="true">↻</span></button>

    <input type="file" id="fileInput" accept=".json" class="religion-file-input" />

    <div class="theme-toggle" role="group" aria-label="Theme">
        <button class="tb-btn theme-toggle__btn" id="themeBtn" aria-label="Choose theme" title="Choose theme" type="button" aria-haspopup="menu" aria-expanded="false">
            <span aria-hidden="true">◐</span>
            <span id="themeName">Dark</span>
        </button>
        <ul class="theme-toggle__menu" id="themeMenu" role="menu" hidden></ul>
    </div>
</div>

<div class="app-layout">
    <div class="sidebar" id="religionSidebar">
        <div class="sidebar-header"><h3 id="sidebarTitle">Religions</h3></div>
        <div class="sidebar-list" id="religionListContainer">
            <div class="loading">Loading religions…</div>
        </div>
    </div>
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!--
        data-religion-editor lives here, on .main-panel, because this
        element is the lowest common ancestor of BOTH the tab strip
        (.manager-subtabs) and the pane container (#tabContent).
        TabManager's click router walks up from the clicked tab button
        and asks each configured scope whether containerRoot.contains(button).
        If containerRoot were #tabContent, strip clicks would fail to
        route because the strip is a sibling, not a descendant.
    -->
    <div class="main-panel" data-religion-editor>
        <div class="manager-subtabs" id="panelSubtabs" role="tablist">
            <button class="manager-subtab active" role="tab" type="button" data-tab="details" aria-selected="true" tabindex="0">
                <span class="manager-subtab-icon" data-icon="CIRCLE_DOT" aria-hidden="true"></span>
                <span>Details</span>
            </button>
            <button class="manager-subtab" role="tab" type="button" data-tab="gods" aria-selected="false" tabindex="-1">
                <span class="manager-subtab-icon" data-icon="STAR_4" aria-hidden="true"></span>
                <span>Gods</span>
            </button>
            <button class="manager-subtab" role="tab" type="button" data-tab="laws" aria-selected="false" tabindex="-1">
                <span class="manager-subtab-icon" data-icon="SHIELD" aria-hidden="true"></span>
                <span>Laws</span>
            </button>
            <button class="manager-subtab" role="tab" type="button" data-tab="places" aria-selected="false" tabindex="-1">
                <span class="manager-subtab-icon" data-icon="LOCATION" aria-hidden="true"></span>
                <span>Places</span>
            </button>
            <button class="manager-subtab" role="tab" type="button" data-tab="followers" aria-selected="false" tabindex="-1">
                <span class="manager-subtab-icon" data-icon="PERSON" aria-hidden="true"></span>
                <span>Followers</span>
            </button>
        </div>

        <div class="tab-content-wrapper" id="tabContent" role="tabpanel">
            <div class="tab-pane active" id="tab-details"   data-tab-content="details"></div>
            <div class="tab-pane"        id="tab-gods"      data-tab-content="gods"></div>
            <div class="tab-pane"        id="tab-laws"      data-tab-content="laws"></div>
            <div class="tab-pane"        id="tab-places"    data-tab-content="places"></div>
            <div class="tab-pane"        id="tab-followers" data-tab-content="followers"></div>
        </div>
    </div>
</div>

<!-- ORCHESTRATOR                                                 -->
<!-- ============================================================ -->
<script>
(function () {
    'use strict';

    var religionContainer = document.getElementById('religionListContainer');
    var sidebar           = document.getElementById('religionSidebar');
    var sidebarOverlay    = document.getElementById('sidebarOverlay');
    var menuToggle        = document.getElementById('menuToggle');
    var yearInput         = document.getElementById('yearInput');
    var setYearBtn        = document.getElementById('setYearBtn');
    var exportBtn         = document.getElementById('exportBtn');
    var importBtn         = document.getElementById('importBtn');
    var fileInput         = document.getElementById('fileInput');
    var createReligionBtn = document.getElementById('createReligionBtn');
    var editReligionBtn   = document.getElementById('editReligionBtn');
    var deleteReligionBtn = document.getElementById('deleteReligionBtn');
    var refreshBtn        = document.getElementById('refreshBtn');

    var selectedReligionId = null;
    var activeTabId        = 'details';
    var isInitialized      = false;

    // NOTE: The tab strip buttons are NOT bound here. TabManager's click
    // router owns strip clicks (it walks from the click target to a
    // [data-tab] button and asks each configured scope's containerRoot
    // whether it contains the button). The orchestrator only calls
    // TabManager.renderActive / .requestRender from programmatic paths
    // (selectReligion, refresh, masterDataUpdated).

    function bootstrap() {
        if (isInitialized) return;
        isInitialized = true;

        if (typeof window.loadMasterData === 'function') {
            try { window.loadMasterData(); }
            catch (e) {
                console.error('[religion-manager] loadMasterData failed:', e);
            }
        }

        if (window.masterData && window.masterData.data) {
            if (!Array.isArray(window.masterData.data.religions)) {
                window.masterData.data.religions = [];
            }
        }

        if (window.LocationBootstrap
            && typeof window.LocationBootstrap.init === 'function') {
            try { window.LocationBootstrap.init(); } catch (e) {
                console.error('[religion-manager] location bootstrap failed:', e);
            }
        }
        if (window.ReligionBootstrap
            && typeof window.ReligionBootstrap.init === 'function') {
            try { window.ReligionBootstrap.init(); } catch (e) {
                console.error('[religion-manager] religion bootstrap failed:', e);
            }
        }
        // Register the Religion tab scope before wiring the click router.
        // The tab modules self-register their renderers, but they cannot
        // supply the page-specific pane/context configuration.
        if (window.TabManager && typeof window.TabManager.configure === 'function') {
            try {
                window.TabManager.configure('religion', {
                    containerRoot: function () {
                        return document.querySelector('[data-religion-editor]');
                    },
                    resolveContainer: function (tabId) {
                        var root = document.querySelector('[data-religion-editor]');
                        return root
                            ? root.querySelector('[data-tab-content="' + tabId + '"]')
                            : null;
                    },
                    buildContext: function () {
                        if (!selectedReligionId || !window.ReligionQueries ||
                            typeof window.ReligionQueries.getReligion !== 'function') {
                            return null;
                        }
                        var religion = window.ReligionQueries.getReligion(selectedReligionId);
                        return religion ? { religion: religion } : null;
                    },
                    buildEmptyState: function (tabId, reason) {
                        if (reason === 'no-context') {
                            return '<div class="rt-empty">Select a religion to view its ' +
                                'details.</div>';
                        }
                        if (reason === 'no-renderer') {
                            return '<div class="rt-empty">This religion tab is unavailable.</div>';
                        }
                        return '<div class="rt-empty">Unable to display this religion tab.</div>';
                    },
                    getActiveTabId: function () {
                        return activeTabId;
                    },
                    setActiveTabId: function (tabId) {
                        activeTabId = tabId;
                    }
                });
            } catch (e) {
                console.error('[religion-manager] TabManager.configure failed:', e);
            }
        }

        if (window.TabManager && typeof window.TabManager.init === 'function') {
            try { window.TabManager.init(); } catch (e) {
                console.error('[religion-manager] TabManager.init failed:', e);
            }
        }

        injectIcons();
        syncYearInput();
        renderReligionList();
        pickInitialSelection();

        // Sync the strip using the shared helper. The active tab id
        // is 'details' at boot; syncTabStrip updates the strip and
        // panes.
        if (typeof window.__religionSyncTab === 'function') {
            window.__religionSyncTab(activeTabId);
        }

        window.__religionManagerRefresh = function () {
            renderReligionList();
            if (selectedReligionId) renderActiveTab();
        };
    }

    function injectIcons() {
        if (typeof window.Icons === 'undefined') {
            setTimeout(injectIcons, 100);
            return;
        }
        var nodes = document.querySelectorAll('[data-icon]');
        for (var i = 0; i < nodes.length; i++) {
            var node = nodes[i];
            var name = node.getAttribute('data-icon');
            var svg = window.Icons[name] || window.Icons.CIRCLE || '';
            node.innerHTML = svg;
        }
    }

    function renderReligionList() {
        if (!religionContainer) return;

        var Queries = window.ReligionQueries;
        var VM      = window.ReligionViewModels;
        var Render  = window.ReligionRender;

        if (!Queries || !VM || !Render) {
            religionContainer.innerHTML =
                '<div class="ct-empty">Religion modules not loaded.</div>';
            return;
        }

        var religions;
        try {
            religions = Queries.getAllReligions({ includeDeprecated: true });
        } catch (e) {
            console.error('[religion-manager] getAllReligions failed:', e);
            religionContainer.innerHTML =
                '<div class="ct-empty">Error loading religions.</div>';
            return;
        }

        if (!religions || religions.length === 0) {
            religionContainer.innerHTML =
                '<div class="ct-empty">' +
                '<div>No religions found</div>' +
                '<div class="ct-empty__sub">Click "+ Religion" to add one</div>' +
                '</div>';
            return;
        }

        var rows;
        try {
            rows = VM.buildReligionRows(religions);
        } catch (e) {
            console.error('[religion-manager] buildReligionRows failed:', e);
            religionContainer.innerHTML =
                '<div class="ct-empty">Error preparing religion list.</div>';
            return;
        }

        try {
            Render.renderReligionList(religionContainer, rows, {
                selectedId: selectedReligionId,
                showStats: true,
                showActions: true
            });
        } catch (e) {
            console.error('[religion-manager] renderReligionList failed:', e);
            religionContainer.innerHTML =
                '<div class="ct-empty">Error rendering religion list.</div>';
            return;
        }

        if (!religionContainer.__religionBound) {
            religionContainer.__religionBound = true;
            Render.bindReligionListEvents(religionContainer, {
                onSelect: function (id) { selectReligion(id); },
                onView:   function (id) { selectReligion(id); },
                onEdit:   function (id) { openEditReligion(id); }
            });
        }
    }

    function pickInitialSelection() {
        if (selectedReligionId) return;
        var Queries = window.ReligionQueries;
        if (!Queries) return;
        try {
            var religions = Queries.getAllReligions({ includeDeprecated: true });
            if (religions && religions.length > 0) {
                selectReligion(religions[0].id);
            }
        } catch (e) {
            console.error('[religion-manager] initial selection failed:', e);
        }
    }

    function selectReligion(id) {
        if (!id) return;
        selectedReligionId = id;

        if (editReligionBtn)   editReligionBtn.disabled   = false;
        if (deleteReligionBtn) deleteReligionBtn.disabled = false;

        if (window.ReligionUIState
            && typeof window.ReligionUIState.setSelectedReligionId === 'function') {
            window.ReligionUIState.setSelectedReligionId(id);
        }

        if (window.ReligionTabContext) {
            var fresh = null;
            try {
                fresh = window.ReligionQueries
                    ? window.ReligionQueries.getReligion(id)
                    : null;
            } catch (e) {
                console.error('[religion-manager] getReligion failed:', e);
            }
            window.ReligionTabContext.religion = fresh || null;
        }

        var items = religionContainer.querySelectorAll('.religion-item');
        for (var i = 0; i < items.length; i++) {
            items[i].classList.toggle(
                'religion-item--selected',
                items[i].getAttribute('data-religion-id') === id
            );
        }

        renderActiveTab();
        if (window.innerWidth <= 768) closeSidebar();
    }

    // Programmatic tab activation. Used when the orchestrator wants to
    // change tabs without a click (currently none — strip clicks are
    // owned by TabManager). Kept for future use and for the sync +
    // render ordering to be explicit.
    function activateTab(tabId) {
        if (!tabId) return;
        activeTabId = tabId;

        var TM = window.TabManager;
        if (!TM || typeof TM.requestRender !== 'function') {
            renderTabError(tabId, 'TabManager is not available.');
            return;
        }

        // Sync the strip + persisted active tab, then force-render
        // the given tab. TabManager's click router does this in one
        // step for clicks; programmatic activation has to do both.
        if (typeof window.__religionSyncTab === 'function') {
            window.__religionSyncTab(tabId);
        }
        try {
            TM.requestRender('religion', tabId);
        } catch (e) {
            console.error(
                '[religion-manager] requestRender failed for tab "' +
                tabId + '":', e
            );
            renderTabError(tabId, e.message || 'unknown');
        }
    }

    function renderActiveTab() {
        var TM = window.TabManager;

        if (!TM || typeof TM.renderActive !== 'function') {
            var msg;
            if (!TM) {
                msg = 'TabManager is not loaded. Open the console for the underlying script error. Most ' +
                      'likely the <script src="js/core/tab-manager.js"> ' +
                      'tag is missing or the file is 404.';
            } else if (typeof TM.listTabs !== 'function') {
                msg = 'window.TabManager exists but has no listTabs(). ' +
                      'The deployed tab-manager.js is stale or truncated.';
            } else {
                var reg = TM.listTabs('religion') || [];
                msg = 'TabManager is loaded and has ' + reg.length +
                      ' religion tab(s) registered: ' +
                      (reg.length > 0 ? reg.join(', ') : '(none)') +
                      '. Missing registrations = the corresponding ' +
                      'js/tabs/religion-<id>-tab.js file failed to load.';
            }
            renderTabError(activeTabId, msg);
            return;
        }

        if (!selectedReligionId) {
            var c2 = document.getElementById('tab-' + activeTabId);
            if (c2) {
                c2.innerHTML =
                    '<div class="rt-empty">Select a religion from the sidebar.</div>';
            }
            return;
        }

        try {
            // renderActive() reads the active tab id via
            // getActiveTabId('religion'), which prefers the in-memory
            // value set by TabManager's click router and falls back to
            // the scope config's getActiveTabId (which returns
            // window.__religionActiveTabId || 'details'). So after
            // __religionSyncTab(activeTabId) has run, renderActive
            // renders the tab we want.
            TM.renderActive('religion');
        } catch (e) {
            console.error(
                '[religion-manager] TabManager.renderActive failed for ' +
                'tab "' + activeTabId + '":', e
            );
            renderTabError(activeTabId, e.message || 'unknown');
        }
    }

    function renderTabError(tabId, message) {
        var c = document.getElementById('tab-' + tabId);
        if (c) {
            c.innerHTML =
                '<div class="rt-unavailable">' + escapeHtml(message) + '</div>';
        }
    }

    function escapeHtml(value) {
        if (typeof window.escapeHtml === 'function') return window.escapeHtml(value);
        if (value === null || value === undefined) return '';
        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function openSidebar() {
        if (sidebar) sidebar.classList.add('visible');
        if (sidebarOverlay) sidebarOverlay.classList.add('active');
    }
    function closeSidebar() {
        if (sidebar) sidebar.classList.remove('visible');
        if (sidebarOverlay) sidebarOverlay.classList.remove('active');
    }
    function toggleSidebar() {
        if (!sidebar) return;
        if (sidebar.classList.contains('visible')) closeSidebar();
        else openSidebar();
    }
    if (menuToggle) menuToggle.addEventListener('click', toggleSidebar);
    if (sidebarOverlay) sidebarOverlay.addEventListener('click', closeSidebar);
    window.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeSidebar();
    });

    function syncYearInput() {
        if (!yearInput) return;
        try {
            var y = (typeof window.getCurrentYear === 'function')
                ? window.getCurrentYear()
                : (window.masterData && window.masterData.data
                    ? window.masterData.data.currentYear
                    : null);
            if (typeof y === 'number' && isFinite(y)) {
                yearInput.value = String(y);
            }
        } catch (e) { /* ignore */ }
    }

    if (setYearBtn) setYearBtn.addEventListener('click', function () {
        var val = parseInt(yearInput.value, 10);
        if (!isFinite(val)) { window.alert('Enter a valid year.'); return; }
        if (typeof window.isValidYear === 'function' && !window.isValidYear(val)) {
            window.alert('Year is outside the allowed range.');
            return;
        }
        if (window.masterData && window.masterData.data) {
            window.masterData.data.currentYear = val;
        }
        if (typeof window.markDataDirty === 'function') window.markDataDirty();
        if (typeof window.saveMasterData === 'function') window.saveMasterData();
        renderActiveTab();
    });

    if (exportBtn) exportBtn.addEventListener('click', function () {
        if (typeof window.exportData === 'function') { window.exportData(); return; }
        if (typeof window.exportToJSON === 'function' && window.masterData) {
            window.exportToJSON(window.masterData, 'stillwaters'); return;
        }
        window.alert('Export module not available.');
    });

    if (importBtn && fileInput) {
        importBtn.addEventListener('click', function () {
            fileInput.value = ''; fileInput.click();
        });
        fileInput.addEventListener('change', function () {
            var file = this.files && this.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function (ev) {
                try {
                    var parsed = JSON.parse(ev.target.result);
                    var dataToInstall = null;
                    if (parsed && parsed.data && parsed.data.religions !== undefined) dataToInstall = parsed.data;
                    else if (parsed && parsed.religions !== undefined) dataToInstall = parsed;
                    else if (parsed && parsed.data) dataToInstall = parsed.data;
                    if (!dataToInstall) { window.alert('Unrecognized import format.'); return; }

                    if (typeof window.normalizeMasterData !== 'function') {
                        window.alert('Schema module not available; cannot import.'); return;
                    }
                    window.masterData = window.normalizeMasterData({
                        schemaVersion: window.STORAGE_SCHEMA_VERSION,
                        savedAt: new Date().toISOString(),
                        data: dataToInstall
                    });
                    if (typeof window.invalidateAccessorCaches === 'function') window.invalidateAccessorCaches();
                    if (typeof window.markDataDirty === 'function') window.markDataDirty();
                    if (typeof window.saveMasterData === 'function' && !window.saveMasterData()) {
                        window.alert('Save failed after import.'); return;
                    }
                    if (window.ReligionBootstrap) window.ReligionBootstrap.init();
                    if (window.LocationBootstrap) window.LocationBootstrap.init();

                    selectedReligionId = null;
                    if (editReligionBtn)   editReligionBtn.disabled   = true;
                    if (deleteReligionBtn) deleteReligionBtn.disabled = true;
                    if (window.ReligionTabContext) window.ReligionTabContext.religion = null;
                    syncYearInput();
                    renderReligionList();
                    pickInitialSelection();
                    window.alert('Import complete.');
                } catch (err) {
                    window.alert('Invalid JSON: ' + err.message);
                }
            };
            reader.onerror = function () { window.alert('Failed to read file.'); };
            reader.readAsText(file);
            this.value = '';
        });
    }

    if (refreshBtn) refreshBtn.addEventListener('click', function () {
        if (typeof window.loadMasterData === 'function') window.loadMasterData();
        setTimeout(function () {
            if (window.ReligionBootstrap) window.ReligionBootstrap.init();
            renderReligionList();

            // Reconcile selection against the reloaded data.
            var Q = window.ReligionQueries;
            if (Q && selectedReligionId) {
                var still = null;
                try { still = Q.getReligion(selectedReligionId); }
                catch (e) { /* treat as missing */ }
                if (!still) {
                    selectedReligionId = null;
                    if (editReligionBtn)   editReligionBtn.disabled   = true;
                    if (deleteReligionBtn) deleteReligionBtn.disabled = true;
                    if (window.ReligionTabContext) window.ReligionTabContext.religion = null;
                }
            }

            pickInitialSelection();
            if (selectedReligionId) renderActiveTab();
        }, 100);
    });

    function openCreateReligion() {
        if (typeof window.openCreateReligionModal !== 'function') {
            window.alert('Create Religion modal not loaded.');
            return;
        }
        window.openCreateReligionModal({
            onSuccess: function () {
                renderReligionList();
                var Queries = window.ReligionQueries;
                if (Queries) {
                    var religions = Queries.getAllReligions({ includeDeprecated: true });
                    if (religions && religions.length > 0) {
                        selectReligion(religions[religions.length - 1].id);
                    }
                }
            }
        });
    }

    function openEditReligion(id) {
        if (typeof window.openEditReligionModal !== 'function') {
            window.alert('Edit Religion modal not loaded.');
            return;
        }
        window.openEditReligionModal(id, {
            onSuccess: function (updated) {
                renderReligionList();
                if (id === selectedReligionId && window.ReligionTabContext) {
                    var fresh = updated;
                    if (!fresh && window.ReligionQueries) {
                        try { fresh = window.ReligionQueries.getReligion(id); }
                        catch (e) { /* non-fatal */ }
                    }
                    if (fresh) {
                        window.ReligionTabContext.religion = fresh;
                        renderActiveTab();
                    }
                }
            }
        });
    }

    function openDeleteReligion(id) {
        if (typeof window.openDeleteReligionModal !== 'function') {
            window.alert('Delete Religion modal not loaded.');
            return;
        }
        window.openDeleteReligionModal(id, {
            onSuccess: function () {
                if (selectedReligionId === id) {
                    selectedReligionId = null;
                    if (editReligionBtn)   editReligionBtn.disabled   = true;
                    if (deleteReligionBtn) deleteReligionBtn.disabled = true;
                    if (window.ReligionTabContext) window.ReligionTabContext.religion = null;
                }
                renderReligionList();
                pickInitialSelection();
            }
        });
    }

    if (createReligionBtn) createReligionBtn.addEventListener('click', openCreateReligion);
    if (editReligionBtn)   editReligionBtn.addEventListener('click', function () {
        if (selectedReligionId) openEditReligion(selectedReligionId);
    });
    if (deleteReligionBtn) deleteReligionBtn.addEventListener('click', function () {
        if (selectedReligionId) openDeleteReligion(selectedReligionId);
    });

    function refreshReligionManagerFromDomainChange() {
        renderReligionList();

        if (!selectedReligionId) {
            pickInitialSelection();
            return;
        }

        var fresh = null;
        try {
            fresh = window.ReligionQueries
                ? window.ReligionQueries.getReligion(selectedReligionId)
                : null;
        } catch (e) { /* treat as missing */ }

        if (fresh) {
            if (window.ReligionTabContext) window.ReligionTabContext.religion = fresh;
            renderActiveTab();
            return;
        }

        // Selection no longer exists.
        selectedReligionId = null;
        if (editReligionBtn)   editReligionBtn.disabled   = true;
        if (deleteReligionBtn) deleteReligionBtn.disabled = true;
        if (window.ReligionTabContext) window.ReligionTabContext.religion = null;
        pickInitialSelection();
        if (selectedReligionId) renderActiveTab();
        else {
            var c = document.getElementById('tab-' + activeTabId);
            if (c) {
                c.innerHTML =
                    '<div class="rt-empty">Select a religion to view its details.</div>';
            }
        }
    }

    // Full imports/reloads replace canonical data. Location commands publish
    // narrower events after their writes; subscribe to those as well so
    // religious presence and worship-place location labels never stay stale.
    window.addEventListener('masterDataUpdated', refreshReligionManagerFromDomainChange);
    window.addEventListener('placeUpdated', refreshReligionManagerFromDomainChange);
    window.addEventListener('placeDeleted', refreshReligionManagerFromDomainChange);
    // LocationCommands writes movement history through CharacterCommands,
    // which emits characterChanged after the canonical character update.
    // Listening to both event families would render the same move twice.
    window.addEventListener('characterChanged', refreshReligionManagerFromDomainChange);

    function onDomReady(fn) {
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', fn);
        } else {
            fn();
        }
    }
    onDomReady(bootstrap);
})();
</script>

<!-- THEME SWITCHER                                               -->
<!-- ============================================================ -->
<script>
(function () {
    'use strict';

    var STORAGE_KEY = 'stillwaters_theme';

    var THEMES = [
        { id: 'dark',            label: 'System Dark' },
        { id: 'light',           label: 'System Light' },
        { id: 'vaporwave',       label: 'Vaporwave' },
        { id: 'salmon-lime',      label: 'Salmon Lime' },
        { id: 'dating-sim',       label: 'Dating Sim' },
        { id: 'pastel',          label: 'Pastel' },
        { id: 'carnival',        label: 'Carnival' },
        { id: 'maximal',         label: 'Maximal' },
        { id: 'gits',            label: 'GITS' },
        { id: 'nouveau',         label: 'Nouveau' },
        { id: 'ukiyo-e',         label: 'Ukiyo-e' },
        { id: 'nature',          label: 'Nature' },
        { id: 'kmt',             label: 'KMT' },
        { id: 'gaslight',        label: 'Gaslight' },
        { id: 'grotesque',       label: 'Grotesque' },
        { id: 'illuminated',     label: 'Illuminated' },
        { id: 'discowing',       label: 'Discowing' },
        { id: 'choc-cake',       label: 'Choc Cake' },
        { id: 'dada',            label: 'Dada' },
        { id: 'brutalist',       label: 'Brutalist' },
        { id: 'orchestrion',     label: 'Orchestrion' },
        { id: 'rococo',          label: 'Rococo' },
        { id: 'nautical-tile',   label: 'Nautical Tile' }
    ];

    var byId = {};
    for (var i = 0; i < THEMES.length; i++) byId[THEMES[i].id] = THEMES[i];

    var themeBtn  = document.getElementById('themeBtn');
    var themeMenu = document.getElementById('themeMenu');
    var themeName = document.getElementById('themeName');

    function apply(id) {
        if (!byId[id]) id = 'dark';
        document.documentElement.setAttribute('data-theme', id);
        themeName.textContent = byId[id].label;
        try { localStorage.setItem(STORAGE_KEY, id); } catch (e) {}
    }

    function buildMenu() {
        var html = '';
        for (var i = 0; i < THEMES.length; i++) {
            html += '<li role="none"><button role="menuitem" type="button" data-theme-id="' +
                THEMES[i].id + '">' + THEMES[i].label + '</button></li>';
        }
        themeMenu.innerHTML = html;
    }

    function openMenu() {
        themeMenu.hidden = false;
        themeBtn.setAttribute('aria-expanded', 'true');
    }
    function closeMenu() {
        themeMenu.hidden = true;
        themeBtn.setAttribute('aria-expanded', 'false');
    }

    if (themeBtn) themeBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        if (themeMenu.hidden) openMenu(); else closeMenu();
    });

    if (themeMenu) themeMenu.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-theme-id]');
        if (!btn) return;
        apply(btn.getAttribute('data-theme-id'));
        closeMenu();
    });

    document.addEventListener('click', function (e) {
        if (!themeMenu || themeMenu.hidden) return;
        if (themeMenu.contains(e.target)) return;
        if (e.target === themeBtn) return;
        closeMenu();
    });

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && themeMenu && !themeMenu.hidden) closeMenu();
    });

    var saved = null;
    try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) {}

    buildMenu();

    if (saved && byId[saved]) {
        apply(saved);
    } else {
        var mq = window.matchMedia('(prefers-color-scheme: light)');
        apply(mq.matches ? 'light' : 'dark');
        mq.addEventListener('change', function (ev) {
            var check;
            try { check = localStorage.getItem(STORAGE_KEY); } catch (e) {}
            if (!check) apply(ev.matches ? 'light' : 'dark');
        });
    }

    window.ThemeSwitcher = { apply: apply, themes: THEMES.slice() };
})();
</script>
