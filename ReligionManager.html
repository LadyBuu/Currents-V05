<!DOCTYPE html>

    <title>Religion Manager</title>

    <!-- Theme tokens MUST load first. -->
    <link rel="stylesheet" href="css/themes.css" />

    <!-- Structural styles consume the tokens. -->
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/data-manager.css" />
    <link rel="stylesheet" href="css/religion.css" />
</head>
<body>

<div class="data-manager-app">

    <!-- TOP BAR -->
    <div class="topbar">
        <button class="burger-btn" id="burgerBtn" type="button" aria-label="Toggle sidebar">☰</button>
        <span class="title">Religion Manager</span>
        <span class="spacer" aria-hidden="true"></span>

        <label for="yearInput">Year</label>
        <input type="number" class="year-input" id="yearInput" name="yearInput" inputmode="numeric" />
        <button class="tb-btn" id="setYearBtn" type="button">Set</button>
        <button class="tb-btn" id="exportBtn" type="button">Export</button>
        <button class="tb-btn" id="importBtn" type="button">Import</button>
        <input type="file" id="fileInput" accept=".json" style="display:none;" />
        <button class="tb-btn primary" id="createReligionBtn" type="button">+ Religion</button>

        <div class="theme-toggle" role="group" aria-label="Theme">
            <button class="btn theme-toggle__btn" id="themeBtn" type="button" aria-haspopup="menu" aria-expanded="false">
                <span aria-hidden="true">◐</span>
                <span id="themeName">Dark</span>
            </button>
            <ul class="theme-toggle__menu" id="themeMenu" role="menu" hidden></ul>
        </div>
    </div>

    <!-- APP LAYOUT -->
    <div class="app-layout">

        <!-- SIDEBAR - RELIGION LIST -->
        <div class="sidebar" id="sidebar">
            <h3>Religions</h3>
            <div id="religionListContainer">
                <div class="loading-placeholder">Loading religions…</div>
            </div>
        </div>

        <!-- MAIN PANEL WITH TABS -->
        <div class="main-panel" id="mainPanel">
            <div class="panel-tabs" id="panelTabs" role="tablist">
                <button class="tab-btn active" role="tab" type="button" data-tab="details" aria-selected="true" tabindex="0">
                    <span class="tab-icon" data-icon="CIRCLE_DOT" aria-hidden="true"></span> Details
                </button>
                <button class="tab-btn" role="tab" type="button" data-tab="gods" aria-selected="false" tabindex="-1">
                    <span class="tab-icon" data-icon="STAR_4" aria-hidden="true"></span> Gods
                </button>
                <button class="tab-btn" role="tab" type="button" data-tab="laws" aria-selected="false" tabindex="-1">
                    <span class="tab-icon" data-icon="SHIELD" aria-hidden="true"></span> Laws
                </button>
                <button class="tab-btn" role="tab" type="button" data-tab="places" aria-selected="false" tabindex="-1">
                    <span class="tab-icon" data-icon="LOCATION" aria-hidden="true"></span> Places
                </button>
                <button class="tab-btn" role="tab" type="button" data-tab="followers" aria-selected="false" tabindex="-1">
                    <span class="tab-icon" data-icon="PERSON" aria-hidden="true"></span> Followers
                </button>
            </div>

            <div class="tab-content" id="tabContent" role="tabpanel">
                <div class="tab-pane active" id="tab-details"   data-tab-content="details"></div>
                <div class="tab-pane"        id="tab-gods"      data-tab-content="gods"></div>
                <div class="tab-pane"        id="tab-laws"      data-tab-content="laws"></div>
                <div class="tab-pane"        id="tab-places"    data-tab-content="places"></div>
                <div class="tab-pane"        id="tab-followers" data-tab-content="followers"></div>
            </div>
        </div>
    </div>

</div>

<!-- ============================================================ -->
<!-- THEME SWITCHER                                               -->
<!-- ============================================================ -->
<script>
(function () {
    'use strict';

    var STORAGE_KEY = 'stillwaters_theme';

    var THEMES = [
        { id: 'dark',            label: 'Dark' },
        { id: 'light',           label: 'Light' },
        { id: 'vaporwave',       label: 'Vaporwave' },
        { id: 'pastel',          label: 'Pastel' },
        { id: 'carnival',        label: 'Carnival' },
        { id: 'maximal',         label: 'Maximal' },
        { id: 'gits',            label: 'GITS' },
        { id: 'nouveau',         label: 'Nouveau' },
        { id: 'ukiyo-e',         label: 'Ukiyo-e' },
        { id: 'nature',          label: 'Nature' },
        { id: 'kmt',             label: 'KMT' },
        { id: 'gaslight',        label: 'Gaslight' },
        { id: 'grotesque',       label: 'Grotesque' },
        { id: 'illuminated',     label: 'Illuminated' },
        { id: 'discowing',       label: 'Discowing' },
        { id: 'choc-cake',       label: 'Choc Cake' },
        { id: 'dada',            label: 'Dada' },
        { id: 'brutalist',       label: 'Brutalist' },
        { id: 'orchestrion',     label: 'Orchestrion' },
        { id: 'rococo',          label: 'Rococo' },
        { id: 'nautical-tile',   label: 'Nautical Tile' }
    ];

    var byId = {};
    for (var i = 0; i < THEMES.length; i++) byId[THEMES[i].id] = THEMES[i];

    var themeBtn  = document.getElementById('themeBtn');
    var themeMenu = document.getElementById('themeMenu');
    var themeName = document.getElementById('themeName');

    function apply(id) {
        if (!byId[id]) id = 'dark';
        document.documentElement.setAttribute('data-theme', id);
        themeName.textContent = byId[id].label;
        try { localStorage.setItem(STORAGE_KEY, id); } catch (e) {}
    }

    function buildMenu() {
        var html = '';
        for (var i = 0; i < THEMES.length; i++) {
            html += '<li role="none"><button role="menuitem" type="button" data-theme-id="' +
                THEMES[i].id + '">' + THEMES[i].label + '</button></li>';
        }
        themeMenu.innerHTML = html;
    }

    function openMenu() {
        themeMenu.hidden = false;
        themeBtn.setAttribute('aria-expanded', 'true');
    }

    function closeMenu() {
        themeMenu.hidden = true;
        themeBtn.setAttribute('aria-expanded', 'false');
    }

    if (themeBtn) {
        themeBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            if (themeMenu.hidden) openMenu(); else closeMenu();
        });
    }

    if (themeMenu) {
        themeMenu.addEventListener('click', function (e) {
            var btn = e.target.closest('[data-theme-id]');
            if (!btn) return;
            apply(btn.getAttribute('data-theme-id'));
            closeMenu();
        });
    }

    document.addEventListener('click', function (e) {
        if (!themeMenu || themeMenu.hidden) return;
        if (themeMenu.contains(e.target)) return;
        if (e.target === themeBtn) return;
        closeMenu();
    });

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && themeMenu && !themeMenu.hidden) closeMenu();
    });

    var saved = null;
    try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) {}

    buildMenu();

    if (saved && byId[saved]) {
        apply(saved);
    } else {
        var mq = window.matchMedia('(prefers-color-scheme: light)');
        apply(mq.matches ? 'light' : 'dark');
        mq.addEventListener('change', function (ev) {
            var check;
            try { check = localStorage.getItem(STORAGE_KEY); } catch (e) {}
            if (!check) apply(ev.matches ? 'light' : 'dark');
        });
    }

    window.ThemeSwitcher = { apply: apply, themes: THEMES.slice() };
})();
</script>

    );

    var tabPanes = {
        details:   document.getElementById('tab-details'),
        gods:      document.getElementById('tab-gods'),
        laws:      document.getElementById('tab-laws'),
        places:    document.getElementById('tab-places'),
        followers: document.getElementById('tab-followers')
    };

    var selectedReligionId = null;
    var activeTabId        = 'details';
    var isInitialized      = false;

    // -----------------------------------------------------------------
    // Bootstrapping
    // -----------------------------------------------------------------
    function bootstrap() {
        if (isInitialized) return;
        isInitialized = true;

        // Storage init — schema + load.
        if (typeof window.initializeStorage === 'function') {
            try { window.initializeStorage(); } catch (e) {
                console.error('[religion-manager] storage init failed:', e);
            }
        }

        // Location domain: required by religion queries for follower
        // location resolution.
        if (typeof window.LocationBootstrap !== 'undefined'
            && typeof window.LocationBootstrap.init === 'function') {
            try { window.LocationBootstrap.init(); } catch (e) {
                console.error('[religion-manager] location bootstrap failed:', e);
            }
        }

        // Religion domain: bootstrap verifies + hydrates ReligionState.
        if (typeof window.ReligionBootstrap !== 'undefined'
            && typeof window.ReligionBootstrap.init === 'function') {
            try { window.ReligionBootstrap.init(); } catch (e) {
                console.error('[religion-manager] religion bootstrap failed:', e);
            }
        }

        injectIcons();
        syncYearInput();
        renderReligionList();
        pickInitialSelection();
        activateTab(activeTabId);
    }

    // -----------------------------------------------------------------
    // Icon injection (fills [data-icon] spans once Icons is available)
    // -----------------------------------------------------------------
    function injectIcons() {
        if (typeof window.Icons === 'undefined') {
            setTimeout(injectIcons, 100);
            return;
        }

        var nodes = document.querySelectorAll('[data-icon]');
        for (var i = 0; i < nodes.length; i++) {
            var node = nodes[i];
            var name = node.getAttribute('data-icon');
            var svg = window.Icons[name] || window.Icons.CIRCLE || '';
            node.innerHTML = svg;
        }

        // Also fill the empty-state icons in each pane on first render.
        fillEmptyStateIcons();
    }

    function fillEmptyStateIcons() {
        if (typeof window.Icons === 'undefined') return;
        var map = {
            details:   'CIRCLE_DOT',
            gods:      'STAR_4',
            laws:      'SHIELD',
            places:    'LOCATION',
            followers: 'PERSON'
        };
        for (var key in map) {
            if (!Object.prototype.hasOwnProperty.call(map, key)) continue;
            var pane = tabPanes[key];
            if (!pane) continue;
            if (pane.querySelector('.empty-state .icon')) continue;
            // Only fill an empty pane; do not overwrite rendered content.
            if (pane.children.length !== 0) continue;
            var iconName = map[key];
            var svg = window.Icons[iconName] || window.Icons.CIRCLE || '';
            pane.innerHTML =
                '<div class="empty-state">' +
                '<div class="icon">' + svg + '</div>' +
                '<div class="message">Select a religion from the sidebar</div>' +
                '</div>';
        }
    }

    // -----------------------------------------------------------------
    // Sidebar rendering
    // -----------------------------------------------------------------
    function renderReligionList() {
        if (!religionContainer) return;

        var Queries  = window.ReligionQueries;
        var VM       = window.ReligionViewModels;
        var Render   = window.ReligionRender;

        if (!Queries || !VM || !Render) {
            religionContainer.innerHTML =
                '<div class="empty-state">Religion modules not loaded.</div>';
            return;
        }

        var religions;
        try {
            religions = Queries.getAllReligions({ includeDeprecated: true });
        } catch (e) {
            console.error('[religion-manager] getAllReligions failed:', e);
            religionContainer.innerHTML =
                '<div class="error-state">Error loading religions.</div>';
            return;
        }

        if (!religions || religions.length === 0) {
            religionContainer.innerHTML =
                '<div class="empty-state">' +
                '<div class="message">No religions found</div>' +
                '<div class="sub-message">Click "+ Religion" to add one</div>' +
                '</div>';
            return;
        }

        var rows;
        try {
            rows = VM.buildReligionRows(religions);
        } catch (e) {
            console.error('[religion-manager] buildReligionRows failed:', e);
            religionContainer.innerHTML =
                '<div class="error-state">Error preparing religion list.</div>';
            return;
        }

        try {
            Render.renderReligionList(religionContainer, rows, {
                selectedId: selectedReligionId,
                showStats: true,
                showActions: true
            });
        } catch (e) {
            console.error('[religion-manager] renderReligionList failed:', e);
            religionContainer.innerHTML =
                '<div class="error-state">Error rendering religion list.</div>';
            return;
        }

        if (!religionContainer.__religionBound) {
            religionContainer.__religionBound = true;
            Render.bindReligionListEvents(religionContainer, {
                onSelect: function (id) { selectReligion(id); },
                onView:   function (id) { selectReligion(id); },
                onEdit:   function (id) { openEditReligion(id); }
            });
        }
    }

    function pickInitialSelection() {
        if (selectedReligionId) return;
        var Queries = window.ReligionQueries;
        if (!Queries) return;
        try {
            var religions = Queries.getAllReligions({ includeDeprecated: true });
            if (religions && religions.length > 0) {
                selectReligion(religions[0].id);
            }
        } catch (e) {
            console.error('[religion-manager] initial selection failed:', e);
        }
    }

    function selectReligion(id) {
        if (!id) return;
        selectedReligionId = id;

        if (window.ReligionUIState
            && typeof window.ReligionUIState.setSelectedReligionId === 'function') {
            window.ReligionUIState.setSelectedReligionId(id);
        }

        // Mark selected item visually.
        var items = religionContainer.querySelectorAll('.religion-item');
        for (var i = 0; i < items.length; i++) {
            items[i].classList.toggle(
                'religion-item--selected',
                items[i].getAttribute('data-religion-id') === id
            );
        }

        renderActiveTab();
    }

    // -----------------------------------------------------------------
    // Tab dispatch
    // -----------------------------------------------------------------
    function activateTab(tabId) {
        activeTabId = tabId;

        for (var i = 0; i < tabButtons.length; i++) {
            var btn = tabButtons[i];
            var isActive = btn.dataset.tab === tabId;
            btn.classList.toggle('active', isActive);
            btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
            btn.setAttribute('tabindex', isActive ? '0' : '-1');
        }

        for (var key in tabPanes) {
            if (!Object.prototype.hasOwnProperty.call(tabPanes, key)) continue;
            if (tabPanes[key]) {
                tabPanes[key].classList.toggle('active', key === tabId);
            }
        }

        renderActiveTab();
    }

    for (var i = 0; i < tabButtons.length; i++) {
        (function (btn) {
            btn.addEventListener('click', function () {
                activateTab(btn.dataset.tab);
            });
        })(tabButtons[i]);
    }

    function renderActiveTab() {
        var container = tabPanes[activeTabId];
        if (!container) return;

        if (!selectedReligionId) {
            setEmptyState(container, 'Select a religion from the sidebar');
            return;
        }

        var VM = window.ReligionViewModels;
        if (!VM) {
            setEmptyState(container, 'Religion view models not loaded');
            return;
        }

        var model;
        try {
            model = VM.buildReligionDetailsModel(selectedReligionId);
        } catch (e) {
            console.error('[religion-manager] buildReligionDetailsModel failed:', e);
            setEmptyState(container, 'Error loading religion data');
            return;
        }

        if (!model) {
            setEmptyState(container, 'Religion not found');
            return;
        }

        // Delegate to the per-tab renderer if one is registered. Each
        // tab file exposes a render(container, model) function. Fall
        // back to a plain placeholder if the tab module is missing.
        var renderer = getTabRenderer(activeTabId);
        if (!renderer) {
            setEmptyState(container, 'This tab is not available');
            return;
        }

        try {
            renderer(container, model);
        } catch (e) {
            console.error('[religion-manager] tab "' + activeTabId + '" failed:', e);
            setEmptyState(container, 'Error rendering this tab');
        }
    }

    function getTabRenderer(tabId) {
        var map = {
            details:   'ReligionDetailsTab',
            gods:      'ReligionGodsTab',
            laws:      'ReligionLawsTab',
            places:    'ReligionPlacesTab',
            followers: 'ReligionFollowersTab'
        };
        var global = map[tabId];
        if (!global) return null;
        var mod = window[global];
        if (!mod) {
            // Fall through to the generic renderer below so the tab
            // shows data even if the tab file is missing.
            return function (container, model) {
                renderGenericTab(container, model, tabId);
            };
        }
        if (typeof mod.render === 'function') {
            return function (container, model) { return mod.render(container, model); };
        }
        return function (container, model) {
            renderGenericTab(container, model, tabId);
        };
    }

    // Generic renderer — used only if the tab file is missing. Uses the
    // view model directly. Not pretty; correct.
    function renderGenericTab(container, model, tabId) {
        var row = model.row;
        var html = '';
        if (tabId === 'details') {
            html = '<div class="religion-tab-content">' +
                '<h2>' + escapeHtml(row.displayName) + '</h2>' +
                (row.description
                    ? '<p>' + escapeHtml(row.description) + '</p>'
                    : '') +
                '<div class="religion-stats">' +
                '<span>' + row.followerCount + ' followers</span>' +
                '<span>' + row.godCount + ' gods</span>' +
                '<span>' + row.lawCount + ' laws</span>' +
                '<span>' + row.placeCount + ' places</span>' +
                '</div>' +
                '</div>';
        } else if (tabId === 'gods') {
            if (model.gods.length === 0) {
                html = '<div class="empty-state">No gods recorded.</div>';
            } else {
                html = '<ul class="religion-simple-list">';
                for (var i = 0; i < model.gods.length; i++) {
                    var g = model.gods[i];
                    html += '<li>' + escapeHtml(g.displayName) + '</li>';
                }
                html += '</ul>';
            }
        } else if (tabId === 'laws') {
            if (model.laws.length === 0) {
                html = '<div class="empty-state">No laws recorded.</div>';
            } else {
                html = '<ul class="religion-simple-list">';
                for (var j = 0; j < model.laws.length; j++) {
                    var l = model.laws[j];
                    html += '<li>' + escapeHtml(l.name) +
                        ' (' + escapeHtml(l.typeLabel) + ', ' + escapeHtml(l.domainLabel) + ')</li>';
                }
                html += '</ul>';
            }
        } else if (tabId === 'places') {
            if (model.places.length === 0) {
                html = '<div class="empty-state">No places of worship.</div>';
            } else {
                html = '<ul class="religion-simple-list">';
                for (var k = 0; k < model.places.length; k++) {
                    html += '<li>' + escapeHtml(model.places[k].id) + '</li>';
                }
                html += '</ul>';
            }
        } else if (tabId === 'followers') {
            html = '<div class="empty-state">' +
                row.followerCount + ' living follower(s).' +
                '</div>';
        }
        container.innerHTML = html;
    }

    function setEmptyState(container, message) {
        container.innerHTML = '<div class="empty-state">' +
            '<div class="message">' + escapeHtml(message) + '</div>' +
            '</div>';
    }

    function escapeHtml(value) {
        if (typeof window.escapeHtml === 'function') return window.escapeHtml(value);
        if (value === null || value === undefined) return '';
        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    // -----------------------------------------------------------------
    // Sidebar toggle
    // -----------------------------------------------------------------
    function toggleSidebar() { if (sidebar) sidebar.classList.toggle('open'); }
    function closeSidebar()  { if (sidebar) sidebar.classList.remove('open'); }

    if (burgerBtn) burgerBtn.addEventListener('click', toggleSidebar);

    document.addEventListener('click', function (e) {
        if (window.innerWidth > 768) return;
        if (!sidebar) return;
        if (sidebar.contains(e.target)) return;
        if (e.target === burgerBtn) return;
        closeSidebar();
    });

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeSidebar();
    });

    window.addEventListener('resize', function () {
        if (window.innerWidth > 768) closeSidebar();
    });

    // -----------------------------------------------------------------
    // Year
    // -----------------------------------------------------------------
    function syncYearInput() {
        if (typeof window.getCurrentYear !== 'function') return;
        try { yearInput.value = String(window.getCurrentYear()); } catch (e) {}
    }

    if (setYearBtn) {
        setYearBtn.addEventListener('click', function () {
            if (typeof window.isValidYear !== 'function') return;
            var val = parseInt(yearInput.value, 10);
            if (isNaN(val)) { window.alert('Enter a valid year.'); return; }
            if (!window.isValidYear(val)) {
                window.alert('Year is outside the allowed range.');
                return;
            }
            if (window.masterData && window.masterData.data) {
                window.masterData.data.currentYear = val;
            }
            if (typeof window.markDataDirty === 'function') window.markDataDirty();
            if (typeof window.saveMasterData === 'function') window.saveMasterData();
            renderActiveTab();
        });
    }

    // -----------------------------------------------------------------
    // Export / Import
    // -----------------------------------------------------------------
    if (exportBtn) {
        exportBtn.addEventListener('click', function () {
            if (typeof window.exportToJSON !== 'function') {
                window.alert('Export module not available.'); return;
            }
            if (!window.masterData) {
                window.alert('No data to export.'); return;
            }
            try { window.exportToJSON(window.masterData, 'stillwaters'); }
            catch (e) { window.alert('Export failed: ' + (e.message || 'unknown')); }
        });
    }

    if (importBtn && fileInput) {
        importBtn.addEventListener('click', function () {
            fileInput.value = '';
            fileInput.click();
        });

        fileInput.addEventListener('change', function () {
            var file = this.files && this.files[0];
            if (!file) return;

            var reader = new FileReader();
            reader.onload = function (ev) {
                try {
                    var parsed = JSON.parse(ev.target.result);
                    var dataToInstall = null;
                    if (parsed && parsed.data && parsed.data.religions !== undefined) {
                        dataToInstall = parsed.data;
                    } else if (parsed && parsed.religions !== undefined) {
                        dataToInstall = parsed;
                    } else if (parsed && parsed.data) {
                        dataToInstall = parsed.data;
                    }
                    if (!dataToInstall) {
                        window.alert('Unrecognized import format.');
                        return;
                    }

                    if (typeof window.normalizeMasterData !== 'function') {
                        window.alert('Schema module not available; cannot import.');
                        return;
                    }

                    window.masterData = window.normalizeMasterData({
                        schemaVersion: window.STORAGE_SCHEMA_VERSION,
                        savedAt: new Date().toISOString(),
                        data: dataToInstall
                    });

                    if (typeof window.invalidateAccessorCaches === 'function') {
                        window.invalidateAccessorCaches();
                    }
                    if (typeof window.markDataDirty === 'function') window.markDataDirty();
                    if (typeof window.saveMasterData === 'function' && !window.saveMasterData()) {
                        window.alert('Save failed after import.'); return;
                    }

                    if (window.ReligionBootstrap
                        && typeof window.ReligionBootstrap.init === 'function') {
                        try { window.ReligionBootstrap.init(); } catch (e) {}
                    }
                    if (window.LocationBootstrap
                        && typeof window.LocationBootstrap.init === 'function') {
                        try { window.LocationBootstrap.init(); } catch (e) {}
                    }

                    selectedReligionId = null;
                    syncYearInput();
                    renderReligionList();
                    pickInitialSelection();
                    renderActiveTab();

                    window.alert('Import complete.');
                } catch (err) {
                    window.alert('Invalid JSON: ' + err.message);
                }
            };
            reader.onerror = function () {
                window.alert('Failed to read file.');
            };
            reader.readAsText(file);
            this.value = '';
        });
    }

    // -----------------------------------------------------------------
    // Create / Edit religion
    // -----------------------------------------------------------------
    function openCreateReligion() {
        if (typeof window.openCreateReligionModal !== 'function') {
            window.alert('Create Religion modal not loaded.');
            return;
        }
        window.openCreateReligionModal({
            onSuccess: function () {
                renderReligionList();
                // Select the newest religion (list is sorted by storage order;
                // the new one is last).
                var Queries = window.ReligionQueries;
                if (Queries) {
                    var religions = Queries.getAllReligions({ includeDeprecated: true });
                    if (religions && religions.length > 0) {
                        selectReligion(religions[religions.length - 1].id);
                    }
                }
            }
        });
    }

    function openEditReligion(id) {
        if (typeof window.openEditReligionModal !== 'function') {
            window.alert('Edit Religion modal not loaded.');
            return;
        }
        window.openEditReligionModal(id, {
            onSuccess: function () {
                renderReligionList();
                renderActiveTab();
            }
        });
    }

    if (createReligionBtn) {
        createReligionBtn.addEventListener('click', openCreateReligion);
    }

    // -----------------------------------------------------------------
    // Cross-tab reload
    // -----------------------------------------------------------------
    if (typeof window.addEventListener === 'function') {
        window.addEventListener('masterDataUpdated', function () {
            renderReligionList();
            renderActiveTab();
        });
    }

    // -----------------------------------------------------------------
    // Init
    // -----------------------------------------------------------------
    function onDomReady(fn) {
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', fn);
        } else {
            fn();
        }
    }

    onDomReady(bootstrap);

})();
</script>

</body>
</html>
