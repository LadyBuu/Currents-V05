        <label for="yearInput">Year</label>

        </aside>
        <div id="sidebarOverlay" class="sidebar-overlay"></div>

        <!-- MAIN PANEL -->
        <main class="main-panel" id="mainPanel" role="main">
            
            <!-- Horizontal Tabs (Top) -->
            <div class="panel-tabs" id="tabContainer">
                <button class="tab-btn active" data-tab="details" id="tabDetails">Details</button>
                <button class="tab-btn" data-tab="hierarchy" id="tabHierarchy">Hierarchy</button>
                <button class="tab-btn" data-tab="population" id="tabPopulation">Population</button>
                <button class="tab-btn" data-tab="movement" id="tabMovement">Movement</button>
                <button class="tab-btn" data-tab="leadership" id="tabLeadership">Leadership</button>
            </div>

            <!-- Content Area -->
            <div class="tab-content-wrapper" id="tabContent">
                <div class="empty-state" id="emptyStateText">Select a location from the sidebar</div>
            </div>
        </main>
    </div>

    <!-- ============================================================ -->
    <!-- THEME SWITCHER (Shared Dropdown Logic)                       -->
    <!-- ============================================================ -->
    <script>
    (function () {
        'use strict';
        var themeBtn  = document.getElementById('themeBtn');
        var themeMenu = document.getElementById('themeMenu');
        var themeName = document.getElementById('themeName');
        var switcher = window.ThemeSwitcher;
        if (!switcher) return;

        function updateLabel(id) {
            var label = id.charAt(0).toUpperCase() + id.slice(1).replace(/-/g, ' ');
            if (themeName) themeName.textContent = label;
        }

        function buildMenu() {
            var html = '';
            for (var i = 0; i < switcher.themes.length; i++) {
                var id = switcher.themes[i];
                var label = id.charAt(0).toUpperCase() + id.slice(1).replace(/-/g, ' ');
                html += '<li role="none"><button role="menuitem" type="button" data-theme-id="' + id + '">' + label + '</button></li>';
            }
            if (themeMenu) themeMenu.innerHTML = html;
        }

        function openMenu() { if (themeMenu) { themeMenu.hidden = false; themeBtn.setAttribute('aria-expanded', 'true'); } }
        function closeMenu() { if (themeMenu) { themeMenu.hidden = true; themeBtn.setAttribute('aria-expanded', 'false'); } }

        if (themeBtn) {
            themeBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                if (themeMenu.hidden) openMenu(); else closeMenu();
            });
        }

        if (themeMenu) {
            themeMenu.addEventListener('click', function (e) {
                var btn = e.target.closest('[data-theme-id]');
                if (!btn) return;
                var id = btn.getAttribute('data-theme-id');
                switcher.apply(id);
                updateLabel(id);
                closeMenu();
            });
        }

        document.addEventListener('click', function (e) {
            if (themeMenu && !themeMenu.hidden) {
                if (themeMenu.contains(e.target)) return;
                if (e.target === themeBtn) return;
                closeMenu();
            }
        });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && themeMenu && !themeMenu.hidden) closeMenu();
        });

        buildMenu();
        var saved = switcher.getSaved();
        if (saved) updateLabel(saved);
    })();
    </script>

    <!-- ============================================================ -->
    <!-- LOCATION MANAGER - MAIN CONTROLLER                           -->
    <!-- ============================================================ -->
    <script>
    (function () {
        'use strict';

        var treeContainer  = document.getElementById('locationTreeContainer');
        var burgerBtn      = document.getElementById('burgerBtn');
        var sidebar        = document.getElementById('sidebar');
        var sidebarOverlay = document.getElementById('sidebarOverlay');
        
        var addPlaceBtn    = document.getElementById('addPlaceBtn');
        var editPlaceBtn   = document.getElementById('editPlaceBtn');
        var deletePlaceBtn = document.getElementById('deletePlaceBtn');
        var yearInput      = document.getElementById('yearInput');
        var setYearBtn     = document.getElementById('setYearBtn');
        
        var tabButtons     = document.querySelectorAll('.panel-tabs .tab-btn');
        var tabContent     = document.getElementById('tabContent');
        var emptyState     = document.getElementById('emptyStateText');

        var selectedId     = null;
        var activeTabId    = 'details';
        var isInitialized  = false;

        // -------------------------------------------------------------
        // INITIALIZATION
        // -------------------------------------------------------------
        function bootstrap() {
            if (isInitialized) return;
            isInitialized = true;

            // 1. Location domain bootstrap
            if (window.LocationBootstrap && typeof window.LocationBootstrap.init === 'function') {
                try { window.LocationBootstrap.init(); } catch (e) { console.error('Location bootstrap failed:', e); }
            }

            syncYearInput();
            renderTree();
            pickInitialSelection();
            activateTab(activeTabId);

            // Listen for events from tabs (e.g. hierarchy navigation)
            document.addEventListener('locationSelected', function(e) {
                if (e.detail && e.detail.id) {
                    selectLocation(e.detail.id);
                }
            });

            if (window.innerWidth <= 768) closeSidebar();
        }

        // -------------------------------------------------------------
        // SIDEBAR
        // -------------------------------------------------------------
        function renderTree() {
            if (!treeContainer) return;
            var Render = window.LocationUI;
            if (!Render || typeof Render.renderLocationList !== 'function') {
                treeContainer.innerHTML = '<div class="empty-state">Location UI not loaded.</div>';
                return;
            }

            try {
                Render.renderLocationList('locationTreeContainer', {
                    selectedId: selectedId,
                    onSelect: function (place) {
                        if (!place || !place.id) return;
                        selectLocation(place.id);
                        if (window.innerWidth <= 768) closeSidebar();
                    }
                });
            } catch (e) {
                console.error('[location-manager] renderTree failed:', e);
            }
        }

        function pickInitialSelection() {
            if (selectedId) return;
            if (!window.LocationQueries) return;
            try {
                var places = window.LocationQueries.getAllPlaces({});
                if (places && places.length > 0) {
                    selectLocation(places[0].id);
                }
            } catch (e) {}
        }

        function selectLocation(id) {
            if (!id) return;
            selectedId = id;

            editPlaceBtn.disabled = false;
            deletePlaceBtn.disabled = false;

            if (window.LocationUIState && typeof window.LocationUIState.setSelectedLocationId === 'function') {
                window.LocationUIState.setSelectedLocationId(id);
            }

            renderTree();
            renderActiveTab();
        }

        // -------------------------------------------------------------
        // TABS
        // -------------------------------------------------------------
        function activateTab(tabId) {
            activeTabId = tabId;

            for (var i = 0; i < tabButtons.length; i++) {
                var btn = tabButtons[i];
                var isActive = btn.dataset.tab === tabId;
                btn.classList.toggle('active', isActive);
            }

            renderActiveTab();
        }

        for (var i = 0; i < tabButtons.length; i++) {
            (function (btn) {
                btn.addEventListener('click', function () {
                    activateTab(btn.dataset.tab);
                });
            })(tabButtons[i]);
        }

        function renderActiveTab() {
            if (!tabContent) return;

            if (!selectedId) {
                tabContent.innerHTML = '<div class="empty-state">Select a location from the sidebar.</div>';
                return;
            }

            var modules = {
                details: window.LocationDetailsTab,
                hierarchy: window.LocationHierarchyTab,
                population: window.LocationPopulationTab,
                movement: window.LocationMovementTab,
                leadership: window.LocationLeadershipTab
            };

            var mod = modules[activeTabId];
            if (mod && typeof mod.render === 'function') {
                try {
                    mod.render('tabContent', selectedId, function() {
                        // Callback to refresh current tab
                        renderActiveTab();
                    });
                } catch (e) {
                    console.error('[location-manager] tab "' + activeTabId + '" failed:', e);
                    tabContent.innerHTML = '<div class="error-state">Error rendering tab.</div>';
                }
            } else {
                tabContent.innerHTML = '<div class="error-state">Tab module not loaded (' + activeTabId + ').</div>';
            }
        }

        // -------------------------------------------------------------
        // SIDEBAR TOGGLE
        // -------------------------------------------------------------
        function toggleSidebar() { if (sidebar) sidebar.classList.toggle('visible'); if (sidebarOverlay) sidebarOverlay.classList.toggle('active'); }
        function closeSidebar() { if (sidebar) sidebar.classList.remove('visible'); if (sidebarOverlay) sidebarOverlay.classList.remove('active'); }

        if (burgerBtn) burgerBtn.addEventListener('click', toggleSidebar);
        if (sidebarOverlay) sidebarOverlay.addEventListener('click', closeSidebar);
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSidebar(); });

        // -------------------------------------------------------------
        // YEAR
        // -------------------------------------------------------------
        function syncYearInput() {
            if (typeof window.getCurrentYear !== 'function') return;
            try { if (yearInput) yearInput.value = String(window.getCurrentYear()); } catch (e) {}
        }

        if (setYearBtn) {
            setYearBtn.addEventListener('click', function () {
                if (typeof window.isValidYear !== 'function') return;
                var val = parseInt(yearInput.value, 10);
                if (isNaN(val)) { window.alert('Enter a valid year.'); return; }
                if (!window.isValidYear(val)) { window.alert('Year is outside the allowed range.'); return; }
                if (window.masterData && window.masterData.data) {
                    window.masterData.data.currentYear = val;
                }
                if (typeof window.markDataDirty === 'function') window.markDataDirty();
                if (typeof window.saveMasterData === 'function') window.saveMasterData();
                renderActiveTab();
            });
        }

        // -------------------------------------------------------------
        // TOPBAR ACTIONS
        // -------------------------------------------------------------
        if (addPlaceBtn) {
            addPlaceBtn.addEventListener('click', function () {
                if (typeof window.openAddPlaceModal !== 'function') {
                    window.alert('Add Location modal not loaded.'); return;
                }
                window.openAddPlaceModal(null, function (newId) {
                    if (!newId) return;
                    renderTree();
                    selectLocation(newId);
                });
            });
        }

        if (editPlaceBtn) {
            editPlaceBtn.addEventListener('click', function () {
                if (!selectedId) return;
                if (typeof window.openEditPlaceModal !== 'function') {
                    window.alert('Edit Location modal not loaded.'); return;
                }
                window.openEditPlaceModal(selectedId, function () {
                    renderTree();
                    renderActiveTab();
                });
            });
        }

        if (deletePlaceBtn) {
            deletePlaceBtn.addEventListener('click', function () {
                if (!selectedId) return;
                if (typeof window.openDeletePlaceModal !== 'function') {
                    window.alert('Delete Location modal not loaded.'); return;
                }
                window.openDeletePlaceModal(selectedId, function () {
                    selectedId = null;
                    editPlaceBtn.disabled = true;
                    deletePlaceBtn.disabled = true;
                    renderTree();
                    pickInitialSelection();
                });
            });
        }

        // -------------------------------------------------------------
        // INIT
        // -------------------------------------------------------------
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', bootstrap);
        } else {
            bootstrap();
        }

    })();
    </script>
