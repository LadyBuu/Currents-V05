    <!-- TOP BAR -->
    <div class="topbar">
        <button class="burger-btn" id="burgerBtn" type="button" aria-label="Toggle sidebar">☰</button>
        <h1 class="title">Still Waters · Location Manager</h1>
        <span class="spacer" aria-hidden="true"></span>

        <button class="btn" id="addPlaceBtn" type="button">+ Add Location</button>
        <button class="btn" id="editPlaceBtn" type="button" disabled>Edit</button>
        <button class="btn" id="deletePlaceBtn" type="button" disabled>Delete</button>

        <label for="yearInput">Year</label>
        <input type="number" class="year-input" id="yearInput" name="yearInput" inputmode="numeric" />
        <button class="btn" id="setYearBtn" type="button">Set</button>
        <button class="btn" id="exportBtn" type="button">Export</button>
        <button class="btn" id="importBtn" type="button">Import</button>
        <input type="file" id="fileInput" accept=".json" style="display:none;" />

        <div class="theme-toggle" role="group" aria-label="Theme">
            <button class="btn theme-toggle__btn" id="themeBtn" type="button" aria-haspopup="menu" aria-expanded="false">
                <span aria-hidden="true">◐</span>
                <span id="themeName">Dark</span>
            </button>
            <ul class="theme-toggle__menu" id="themeMenu" role="menu" hidden></ul>
        </div>
    </div>

    <!-- APP LAYOUT -->
    <div class="app-layout">

        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar" aria-label="Locations">
            <h3>Locations</h3>
            <div id="locationTreeContainer" class="location-tree">
                <div class="loading-placeholder">Loading locations…</div>
            </div>
        </aside>

        <!-- MAIN PANEL -->
        <main class="main-panel" id="mainPanel" role="main">
            <nav class="panel-tabs" id="panelTabs" role="tablist" aria-label="Location tabs">
                <button class="tab-btn active" role="tab" type="button" data-tab="details" aria-selected="true" tabindex="0">
                    <span class="tab-icon" aria-hidden="true">◈</span> Details
                </button>
                <button class="tab-btn" role="tab" type="button" data-tab="hierarchy" aria-selected="false" tabindex="-1">
                    <span class="tab-icon" aria-hidden="true">▦</span> Hierarchy
                </button>
                <button class="tab-btn" role="tab" type="button" data-tab="moves" aria-selected="false" tabindex="-1">
                    <span class="tab-icon" aria-hidden="true">◉</span> Moves
                </button>
                <button class="tab-btn" role="tab" type="button" data-tab="leader" aria-selected="false" tabindex="-1">
                    <span class="tab-icon" aria-hidden="true">⚿</span> Leadership
                </button>
                <button class="tab-btn" role="tab" type="button" data-tab="settings" aria-selected="false" tabindex="-1">
                    <span class="tab-icon" aria-hidden="true">⚙</span> Settings
                </button>
            </nav>

            <div class="tab-content" id="tabContent" role="tabpanel">
                <div class="tab-pane active" id="tab-details"   data-tab-content="details">
                    <div class="placeholder">Select a location from the sidebar</div>
                </div>
                <div class="tab-pane"        id="tab-hierarchy" data-tab-content="hierarchy"></div>
                <div class="tab-pane"        id="tab-moves"     data-tab-content="moves"></div>
                <div class="tab-pane"        id="tab-leader"    data-tab-content="leader"></div>
                <div class="tab-pane"        id="tab-settings"  data-tab-content="settings"></div>
            </div>
        </main>
    </div>

    <!-- THEME SWITCHER                                               -->
    <!-- ============================================================ -->
    <script>
    (function () {
        'use strict';

        var STORAGE_KEY = 'stillwaters_theme';

        var THEMES = [
            { id: 'dark',            label: 'Dark' },
            { id: 'light',           label: 'Light' },
            { id: 'vaporwave',       label: 'Vaporwave' },
            { id: 'pastel',          label: 'Pastel' },
            { id: 'carnival',        label: 'Carnival' },
            { id: 'maximal',         label: 'Maximal' },
            { id: 'gits',            label: 'GITS' },
            { id: 'nouveau',         label: 'Nouveau' },
            { id: 'ukiyo-e',         label: 'Ukiyo-e' },
            { id: 'nature',          label: 'Nature' },
            { id: 'kmt',             label: 'KMT' },
            { id: 'gaslight',        label: 'Gaslight' },
            { id: 'grotesque',       label: 'Grotesque' },
            { id: 'illuminated',     label: 'Illuminated' },
            { id: 'discowing',       label: 'Discowing' },
            { id: 'choc-cake',       label: 'Choc Cake' },
            { id: 'dada',            label: 'Dada' },
            { id: 'brutalist',       label: 'Brutalist' },
            { id: 'orchestrion',     label: 'Orchestrion' },
            { id: 'rococo',          label: 'Rococo' },
            { id: 'nautical-tile',   label: 'Nautical Tile' }
        ];

        var byId = {};
        for (var i = 0; i < THEMES.length; i++) byId[THEMES[i].id] = THEMES[i];

        var themeBtn  = document.getElementById('themeBtn');
        var themeMenu = document.getElementById('themeMenu');
        var themeName = document.getElementById('themeName');

        function apply(id) {
            if (!byId[id]) id = 'dark';
            document.documentElement.setAttribute('data-theme', id);
            themeName.textContent = byId[id].label;
            try { localStorage.setItem(STORAGE_KEY, id); } catch (e) {}
        }

        function buildMenu() {
            var html = '';
            for (var i = 0; i < THEMES.length; i++) {
                html += '<li role="none"><button role="menuitem" type="button" data-theme-id="' +
                    THEMES[i].id + '">' + THEMES[i].label + '</button></li>';
            }
            themeMenu.innerHTML = html;
        }

        function openMenu() {
            themeMenu.hidden = false;
            themeBtn.setAttribute('aria-expanded', 'true');
        }

        function closeMenu() {
            themeMenu.hidden = true;
            themeBtn.setAttribute('aria-expanded', 'false');
        }

        themeBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            if (themeMenu.hidden) openMenu(); else closeMenu();
        });

        themeMenu.addEventListener('click', function (e) {
            var btn = e.target.closest('[data-theme-id]');
            if (!btn) return;
            apply(btn.getAttribute('data-theme-id'));
            closeMenu();
        });

        document.addEventListener('click', function (e) {
            if (themeMenu.hidden) return;
            if (themeMenu.contains(e.target)) return;
            if (e.target === themeBtn) return;
            closeMenu();
        });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && !themeMenu.hidden) closeMenu();
        });

        var saved = null;
        try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) {}

        buildMenu();

        if (saved && byId[saved]) {
            apply(saved);
        } else {
            var mq = window.matchMedia('(prefers-color-scheme: light)');
            apply(mq.matches ? 'light' : 'dark');
            mq.addEventListener('change', function (ev) {
                var check;
                try { check = localStorage.getItem(STORAGE_KEY); } catch (e) {}
                if (!check) apply(ev.matches ? 'light' : 'dark');
            });
        }

        window.ThemeSwitcher = { apply: apply, themes: THEMES.slice() };
    })();
    </script>

    <!-- ORCHESTRATOR                                                 -->
    <!-- ============================================================ -->
    <script>
    (function () {
        'use strict';

        // -----------------------------------------------------------------
        // Element handles
        // -----------------------------------------------------------------
        var treeContainer  = document.getElementById('locationTreeContainer');
        var burgerBtn      = document.getElementById('burgerBtn');
        var sidebar        = document.getElementById('sidebar');
        var exportBtn      = document.getElementById('exportBtn');
        var importBtn      = document.getElementById('importBtn');
        var fileInput      = document.getElementById('fileInput');
        var yearInput      = document.getElementById('yearInput');
        var setYearBtn     = document.getElementById('setYearBtn');
        var addPlaceBtn    = document.getElementById('addPlaceBtn');
        var editPlaceBtn   = document.getElementById('editPlaceBtn');
        var deletePlaceBtn = document.getElementById('deletePlaceBtn');

        var tabButtons = Array.prototype.slice.call(
            document.querySelectorAll('.tab-btn')
        );

        var tabPanes = {
            details:   document.getElementById('tab-details'),
            hierarchy: document.getElementById('tab-hierarchy'),
            moves:     document.getElementById('tab-moves'),
            leader:    document.getElementById('tab-leader'),
            settings:  document.getElementById('tab-settings')
        };

        var selectedId     = null;
        var activeTabId    = 'details';
        var isInitialized  = false;

        // -----------------------------------------------------------------
        // Bootstrapping
        // -----------------------------------------------------------------
        function bootstrap() {
            if (isInitialized) return;
            isInitialized = true;

            // 1. Storage: schema + load.
            if (typeof window.initializeStorage === 'function') {
                try { window.initializeStorage(); } catch (e) {
                    console.error('[location-manager] storage init failed:', e);
                }
            }

            // 2. Location domain: verify + hydrate LocationState.
            if (typeof window.LocationBootstrap !== 'undefined'
                && typeof window.LocationBootstrap.init === 'function') {
                try { window.LocationBootstrap.init(); } catch (e) {
                    console.error('[location-manager] location bootstrap failed:', e);
                }
            }

            // 3. Settlement domain: rebuild indexes so leadership reads work.
            if (typeof window.SettlementState !== 'undefined'
                && typeof window.SettlementState.rebuildIndexes === 'function') {
                try { window.SettlementState.rebuildIndexes(); } catch (e) {
                    console.error('[location-manager] settlement index rebuild failed:', e);
                }
            }

            syncYearInput();
            renderTree();
            pickInitialSelection();
            activateTab(activeTabId);
        }

        // -----------------------------------------------------------------
        // Sidebar
        // -----------------------------------------------------------------
        function renderTree() {
            if (!treeContainer) return;

            var Render = window.LocationUI;
            if (!Render || typeof Render.renderLocationList !== 'function') {
                treeContainer.innerHTML =
                    '<div class="empty-state">Location UI not loaded.</div>';
                return;
            }

            try {
                Render.renderLocationList('locationTreeContainer', {
                    selectedId: selectedId,
                    onSelect: function (place) {
                        if (!place || !place.id) return;
                        selectLocation(place.id);
                        if (window.innerWidth <= 768) closeSidebar();
                    }
                });
            } catch (e) {
                console.error('[location-manager] renderTree failed:', e);
                treeContainer.innerHTML =
                    '<div class="error-state">Error loading locations.</div>';
            }
        }

        function pickInitialSelection() {
            if (selectedId) return;
            if (!window.LocationQueries) return;
            try {
                var places = window.LocationQueries.getAllPlaces({});
                if (places && places.length > 0) {
                    selectLocation(places[0].id);
                }
            } catch (e) {
                console.error('[location-manager] initial selection failed:', e);
            }
        }

        function selectLocation(id) {
            if (!id) return;
            selectedId = id;

            // Update topbar button availability.
            editPlaceBtn.disabled = false;
            deletePlaceBtn.disabled = false;

            // Sync LocationUIState.
            if (window.LocationUIState
                && typeof window.LocationUIState.setSelectedLocationId === 'function') {
                window.LocationUIState.setSelectedLocationId(id);
            }

            renderTree();
            renderActiveTab();
        }

        // -----------------------------------------------------------------
        // Tabs
        // -----------------------------------------------------------------
        function activateTab(tabId) {
            activeTabId = tabId;

            for (var i = 0; i < tabButtons.length; i++) {
                var btn = tabButtons[i];
                var isActive = btn.dataset.tab === tabId;
                btn.classList.toggle('active', isActive);
                btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
                btn.setAttribute('tabindex', isActive ? '0' : '-1');
            }

            for (var key in tabPanes) {
                if (!Object.prototype.hasOwnProperty.call(tabPanes, key)) continue;
                if (tabPanes[key]) {
                    tabPanes[key].classList.toggle('active', key === tabId);
                }
            }

            renderActiveTab();
        }

        for (var i = 0; i < tabButtons.length; i++) {
            (function (btn) {
                btn.addEventListener('click', function () {
                    activateTab(btn.dataset.tab);
                });
            })(tabButtons[i]);
        }

        function renderActiveTab() {
            var container = tabPanes[activeTabId];
            if (!container) return;

            if (!selectedId) {
                setEmptyState(container, 'Select a location from the sidebar.');
                return;
            }

            try {
                if (activeTabId === 'details') {
                    renderDetails(container, selectedId);
                } else if (activeTabId === 'hierarchy') {
                    renderHierarchy(container, selectedId);
                } else if (activeTabId === 'moves') {
                    renderMoves(container, selectedId);
                } else if (activeTabId === 'leader') {
                    renderLeadership(container, selectedId);
                } else if (activeTabId === 'settings') {
                    renderSettings(container, selectedId);
                }
            } catch (e) {
                console.error('[location-manager] tab "' + activeTabId + '" failed:', e);
                container.innerHTML =
                    '<div class="error-state">Error rendering this tab.</div>';
            }
        }

        // -----------------------------------------------------------------
        // Details tab
        // -----------------------------------------------------------------
        function renderDetails(container, id) {
            var LQ = window.LocationQueries;
            if (!LQ) { setEmptyState(container, 'Location queries not loaded.'); return; }

            var place = LQ.getPlace(id);
            if (!place) { setEmptyState(container, 'Location not found.'); return; }

            var typeName = LQ.getLocationTypeName(place.typeId) || 'Unknown';
            var typePriority = LQ.getLocationTypePriority(place.typeId);
            var parentName = 'None';
            if (place.parentId) {
                var parent = LQ.getPlace(place.parentId);
                if (parent) parentName = parent.displayName;
            }

            var population = LQ.getPopulationCount(id, false);
            var ownPopulation = LQ.getOwnPopulation(id, false);
            var childCount = LQ.getPlaceChildren(id, false).length;
            var descendants = LQ.getPlaceChildren(id, true).length;
            var hierarchy = LQ.getPlaceHierarchy(id);

            var breadcrumb = hierarchy.map(function (p) { return p.displayName; })
                .filter(Boolean).join(' → ') || 'Root';

            var status = place.status === undefined || place.status === null
                ? 'active'
                : place.status;

            var html =
                '<div class="location-detail">' +
                '<div class="location-detail__card">' +
                '<h2 class="location-detail__title">' + escapeHtml(place.displayName) + '</h2>' +
                '<div class="location-detail__subtitle">' +
                escapeHtml(typeName) +
                (typePriority != null ? ' (priority ' + typePriority + ')' : '') +
                (place.isCapital ? ' · Capital' : '') +
                '</div>' +
                '<div class="location-detail__grid">' +
                row('ID', escapeHtml(place.id)) +
                row('Type', escapeHtml(typeName)) +
                row('Parent', escapeHtml(parentName)) +
                row('Status', escapeHtml(status)) +
                row('Total Population', population == null ? '—' : escapeHtml(String(population))) +
                row('Direct Population', ownPopulation == null ? '—' : escapeHtml(String(ownPopulation))) +
                row('Direct Children', String(childCount)) +
                row('Total Descendants', String(descendants)) +
                row('Hierarchy Depth', String(hierarchy.length)) +
                row('Variable Key', escapeHtml(place.variableKey || '—')) +
                '</div>' +
                '<div class="location-detail__breadcrumb">' + escapeHtml(breadcrumb) + '</div>' +
                '</div>' +
                (place.notes
                    ? '<div class="location-detail__notes">' +
                      '<div class="location-detail__notes-label">Notes</div>' +
                      '<p>' + escapeHtml(place.notes) + '</p>' +
                      '</div>'
                    : '') +
                '</div>';

            container.innerHTML = html;

            function row(label, value) {
                return '<span class="location-detail__label">' + label + '</span>' +
                       '<span class="location-detail__value">' + value + '</span>';
            }
        }

        // -----------------------------------------------------------------
        // Hierarchy tab
        // -----------------------------------------------------------------
        function renderHierarchy(container, id) {
            var LQ = window.LocationQueries;
            if (!LQ) { setEmptyState(container, 'Location queries not loaded.'); return; }

            var hierarchy = LQ.getPlaceHierarchy(id);
            var descendants = LQ.getPlaceChildren(id, true);

            var chainHtml = '<div class="location-hierarchy">' +
                '<h3 class="location-hierarchy__title">Ancestors (root → self)</h3>' +
                '<ul class="location-hierarchy__list">';
            for (var i = 0; i < hierarchy.length; i++) {
                var p = hierarchy[i];
                var isSelf = p.id === id;
                chainHtml += '<li class="location-hierarchy__item' +
                    (isSelf ? ' location-hierarchy__item--current' : '') + '">' +
                    '<span class="location-hierarchy__depth">' + (i + 1) + '.</span> ' +
                    escapeHtml(p.displayName) +
                    '</li>';
            }
            chainHtml += '</ul></div>';

            var descHtml = '';
            if (descendants.length > 0) {
                descHtml = '<div class="location-hierarchy">' +
                    '<h3 class="location-hierarchy__title">Descendants (' +
                    descendants.length + ')</h3>' +
                    '<ul class="location-hierarchy__list">';
                for (var j = 0; j < descendants.length; j++) {
                    var d = descendants[j];
                    descHtml += '<li class="location-hierarchy__item">' +
                        escapeHtml(d.displayName) +
                        '</li>';
                }
                descHtml += '</ul></div>';
            } else {
                descHtml = '<div class="empty-state">No descendants.</div>';
            }

            container.innerHTML = chainHtml + descHtml;
        }

        // -----------------------------------------------------------------
        // Moves tab
        // -----------------------------------------------------------------
        function renderMoves(container, id) {
            var CQ = window.CharacterQueries;
            var W  = window;
            if (!CQ || typeof CQ.getAllCharacters !== 'function') {
                setEmptyState(container, 'Character queries not loaded.');
                return;
            }

            var chars = CQ.getAllCharacters();
            if (!Array.isArray(chars)) chars = [];

            var rows = [];
            for (var i = 0; i < chars.length; i++) {
                var c = chars[i];
                if (!c || !c.id) continue;
                var resolved = null;
                if (typeof window.LocationQueries.getCurrentLocationId === 'function') {
                    try { resolved = window.LocationQueries.getCurrentLocationId(c.id); }
                    catch (e) { resolved = null; }
                }
                if (resolved === id) {
                    var name = ((c.name || '') + ' ' + (c.surname || '')).trim();
                    rows.push(name || c.id);
                }
            }

            if (rows.length === 0) {
                setEmptyState(container, 'No characters currently at this location.');
                return;
            }

            var html = '<div class="location-moves">' +
                '<h3 class="location-moves__title">Characters here (' + rows.length + ')</h3>' +
                '<ul class="location-moves__list">';
            for (var r = 0; r < rows.length; r++) {
                html += '<li class="location-moves__item">' + escapeHtml(rows[r]) + '</li>';
            }
            html += '</ul></div>';
            container.innerHTML = html;
        }

        // -----------------------------------------------------------------
        // Leadership tab
        // -----------------------------------------------------------------
        function renderLeadership(container, id) {
            var LQ = window.LocationQueries;
            if (!LQ) { setEmptyState(container, 'Location queries not loaded.'); return; }

            var leader = LQ.getCurrentLeader(id);
            var history = LQ.getLeaderHistory(id);

            var html = '<div class="location-leadership">';

            if (leader) {
                html += '<div class="location-leadership__current">' +
                    '<h3 class="location-leadership__title">Current Leader</h3>' +
                    '<div class="location-leadership__name">' +
                    escapeHtml(leader.characterName || leader.characterId) + '</div>' +
                    (leader.title
                        ? '<div class="location-leadership__title-text">' +
                          escapeHtml(leader.title) + '</div>'
                        : '') +
                    (leader.startYear != null
                        ? '<div class="location-leadership__meta">Since year ' +
                          escapeHtml(String(leader.startYear)) + '</div>'
                        : '') +
                    '</div>';
            } else {
                html += '<div class="empty-state">No current leader.</div>';
            }

            if (history.length > 0) {
                html += '<h3 class="location-leadership__title">History</h3>' +
                    '<ul class="location-leadership__list">';
                for (var i = 0; i < history.length; i++) {
                    var h = history[i];
                    html += '<li class="location-leadership__item">' +
                        escapeHtml(h.characterName || h.characterId) +
                        (h.title ? ' — ' + escapeHtml(h.title) : '') +
                        ' (' +
                        (h.startYear != null ? escapeHtml(String(h.startYear)) : '?') +
                        ' – ' +
                        (h.endYear != null ? escapeHtml(String(h.endYear)) : 'present') +
                        ')' +
                        '</li>';
                }
                html += '</ul>';
            }

            html += '</div>';
            container.innerHTML = html;
        }

        // -----------------------------------------------------------------
        // Settings tab (variable key + notes)
        // -----------------------------------------------------------------
        function renderSettings(container, id) {
            var LQ = window.LocationQueries;
            if (!LQ) { setEmptyState(container, 'Location queries not loaded.'); return; }

            var place = LQ.getPlace(id);
            if (!place) { setEmptyState(container, 'Location not found.'); return; }

            var html =
                '<div class="location-settings">' +
                '<h3 class="location-settings__title">Settings for ' +
                escapeHtml(place.displayName) + '</h3>' +
                '<p class="location-settings__hint">' +
                'Use the Edit button in the topbar to change name, type, parent, or status.' +
                '</p>' +
                '<div class="location-settings__grid">' +
                '<div class="location-settings__field">' +
                '<label>Variable Key</label>' +
                '<div>' + escapeHtml(place.variableKey || '—') + '</div>' +
                '</div>' +
                '<div class="location-settings__field">' +
                '<label>Created</label>' +
                '<div>' + (place.createdAt ? new Date(place.createdAt).toLocaleString() : '—') + '</div>' +
                '</div>' +
                '<div class="location-settings__field location-settings__field--wide">' +
                '<label>Notes</label>' +
                '<div>' + (place.notes ? escapeHtml(place.notes) : '—') + '</div>' +
                '</div>' +
                '</div>' +
                '</div>';

            container.innerHTML = html;
        }

        // -----------------------------------------------------------------
        // Utilities
        // -----------------------------------------------------------------
        function setEmptyState(container, message) {
            container.innerHTML =
                '<div class="empty-state">' +
                '<div class="message">' + escapeHtml(message) + '</div>' +
                '</div>';
        }

        function escapeHtml(value) {
            if (typeof window.escapeHtml === 'function') return window.escapeHtml(value);
            if (value === null || value === undefined) return '';
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // -----------------------------------------------------------------
        // Sidebar toggle
        // -----------------------------------------------------------------
        function toggleSidebar() { if (sidebar) sidebar.classList.toggle('open'); }
        function closeSidebar()  { if (sidebar) sidebar.classList.remove('open'); }

        if (burgerBtn) burgerBtn.addEventListener('click', toggleSidebar);

        document.addEventListener('click', function (e) {
            if (window.innerWidth > 768) return;
            if (!sidebar) return;
            if (sidebar.contains(e.target)) return;
            if (e.target === burgerBtn) return;
            closeSidebar();
        });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') closeSidebar();
        });

        window.addEventListener('resize', function () {
            if (window.innerWidth > 768) closeSidebar();
        });

        // -----------------------------------------------------------------
        // Year
        // -----------------------------------------------------------------
        function syncYearInput() {
            if (typeof window.getCurrentYear !== 'function') return;
            try { yearInput.value = String(window.getCurrentYear()); } catch (e) {}
        }

        if (setYearBtn) {
            setYearBtn.addEventListener('click', function () {
                if (typeof window.isValidYear !== 'function') return;
                var val = parseInt(yearInput.value, 10);
                if (isNaN(val)) { window.alert('Enter a valid year.'); return; }
                if (!window.isValidYear(val)) {
                    window.alert('Year is outside the allowed range.');
                    return;
                }
                if (window.masterData && window.masterData.data) {
                    window.masterData.data.currentYear = val;
                }
                if (typeof window.markDataDirty === 'function') window.markDataDirty();
                if (typeof window.saveMasterData === 'function') window.saveMasterData();
                renderActiveTab();
            });
        }

        // -----------------------------------------------------------------
        // Add / Edit / Delete location
        // -----------------------------------------------------------------
        if (addPlaceBtn) {
            addPlaceBtn.addEventListener('click', function () {
                if (typeof window.openAddPlaceModal !== 'function') {
                    window.alert('Add Location modal not loaded.'); return;
                }
                window.openAddPlaceModal(null, function (newId) {
                    if (!newId) return;
                    renderTree();
                    selectLocation(newId);
                });
            });
        }

        if (editPlaceBtn) {
            editPlaceBtn.addEventListener('click', function () {
                if (!selectedId) return;
                if (typeof window.openEditPlaceModal !== 'function') {
                    window.alert('Edit Location modal not loaded.'); return;
                }
                window.openEditPlaceModal(selectedId, function () {
                    renderTree();
                    renderActiveTab();
                });
            });
        }

        if (deletePlaceBtn) {
            deletePlaceBtn.addEventListener('click', function () {
                if (!selectedId) return;
                if (typeof window.openDeletePlaceModal !== 'function') {
                    window.alert('Delete Location modal not loaded.'); return;
                }
                window.openDeletePlaceModal(selectedId, function () {
                    selectedId = null;
                    editPlaceBtn.disabled = true;
                    deletePlaceBtn.disabled = true;
                    renderTree();
                    pickInitialSelection();
                });
            });
        }

        // -----------------------------------------------------------------
        // Export / Import
        // -----------------------------------------------------------------
        if (exportBtn) {
            exportBtn.addEventListener('click', function () {
                if (typeof window.exportToJSON !== 'function') {
                    window.alert('Export module not available.'); return;
                }
                if (!window.masterData) {
                    window.alert('No data to export.'); return;
                }
                try { window.exportToJSON(window.masterData, 'stillwaters'); }
                catch (e) { window.alert('Export failed: ' + (e.message || 'unknown')); }
            });
        }

        if (importBtn && fileInput) {
            importBtn.addEventListener('click', function () {
                fileInput.value = '';
                fileInput.click();
            });

            fileInput.addEventListener('change', function () {
                var file = this.files && this.files[0];
                if (!file) return;

                var reader = new FileReader();
                reader.onload = function (ev) {
                    try {
                        var parsed = JSON.parse(ev.target.result);

                        var dataToInstall = null;
                        if (parsed && parsed.data && parsed.data.places !== undefined) {
                            dataToInstall = parsed.data;
                        } else if (parsed && parsed.places !== undefined) {
                            dataToInstall = parsed;
                        } else if (parsed && parsed.data) {
                            dataToInstall = parsed.data;
                        }
                        if (!dataToInstall) {
                            window.alert('Unrecognized import format.'); return;
                        }

                        if (typeof window.normalizeMasterData !== 'function') {
                            window.alert('Schema module not available.'); return;
                        }

                        window.masterData = window.normalizeMasterData({
                            schemaVersion: window.STORAGE_SCHEMA_VERSION,
                            savedAt: new Date().toISOString(),
                            data: dataToInstall
                        });

                        if (typeof window.invalidateAccessorCaches === 'function') {
                            window.invalidateAccessorCaches();
                        }
                        if (typeof window.markDataDirty === 'function') window.markDataDirty();
                        if (typeof window.saveMasterData === 'function' && !window.saveMasterData()) {
                            window.alert('Save failed after import.'); return;
                        }

                        if (window.LocationBootstrap
                            && typeof window.LocationBootstrap.init === 'function') {
                            try { window.LocationBootstrap.init(); } catch (e) {}
                        }

                        selectedId = null;
                        editPlaceBtn.disabled = true;
                        deletePlaceBtn.disabled = true;
                        syncYearInput();
                        renderTree();
                        pickInitialSelection();
                        renderActiveTab();

                        window.alert('Import complete.');
                    } catch (err) {
                        window.alert('Invalid JSON: ' + err.message);
                    }
                };
                reader.onerror = function () {
                    window.alert('Failed to read file.');
                };
                reader.readAsText(file);
                this.value = '';
            });
        }

        // -----------------------------------------------------------------
        // Cross-tab reload
        // -----------------------------------------------------------------
        if (typeof window.addEventListener === 'function') {
            window.addEventListener('masterDataUpdated', function () {
                renderTree();
                renderActiveTab();
            });
        }

        // -----------------------------------------------------------------
        // Init
        // -----------------------------------------------------------------
        function onDomReady(fn) {
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', fn);
            } else {
                fn();
            }
        }

        onDomReady(bootstrap);

    })();
    </script>

</body>
</html>
