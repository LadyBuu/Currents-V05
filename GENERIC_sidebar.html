    <style>
        /* ============================================================
           MANAGER SHELL — INLINE CSS
           ============================================================ */

        /* ---- App shell ---- */
        html, body { height: 100%; margin: 0; overflow: hidden; }
        body { display: flex; flex-direction: column; }
        .topbar { position: relative; z-index: 100; flex-shrink: 0; }

        .world-app { display: flex; flex-direction: row; flex: 1; min-height: 0; overflow: hidden; }

        .locations-sidebar {
            flex-shrink: 0; display: flex; flex-direction: column;
            overflow: hidden; background: var(--bg2); border-right: 1px solid var(--border);
        }

        .sidebar-header { padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--bg3); }
        .sidebar-header h3 {
            margin: 0; font-family: var(--f-display); font-size: 0.65rem;
            letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent);
        }

        .place-list { flex: 1; overflow-y: auto; padding: 8px; min-height: 0; }

        .main-panel {
            display: flex; flex-direction: column; flex: 1;
            min-width: 0; min-height: 0; overflow: hidden;
        }

        .tab-content-wrapper {
            flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 16px;
        }

        /* ---- Topbar buttons ---- */
        .tb-btn {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 5px 12px; background: var(--bg2);
            border: 1px solid var(--border); border-radius: var(--radius);
            color: var(--text); font-family: var(--f-body); font-size: 0.65rem;
            font-weight: 500; cursor: pointer;
            transition: border-color 0.15s ease, background-color 0.15s ease, color 0.15s ease;
        }
        .tb-btn:hover { border-color: var(--accent); background: var(--accent-dim); color: var(--accent-light); }
        .tb-btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
        .tb-btn.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }

        /* ---- Theme toggle ---- */
        .theme-toggle { position: relative; display: inline-flex; }
        .theme-toggle__btn { gap: 6px; }
        .theme-toggle__menu {
            position: absolute; top: calc(100% + 4px); right: 0; z-index: 9999;
            min-width: 160px; max-height: 60vh; padding: 4px; margin: 0;
            list-style: none; background: var(--surface);
            border: 1px solid var(--line); border-radius: var(--radius);
            box-shadow: var(--shadow); overflow-y: auto;
        }
        .theme-toggle__menu[hidden] { display: none; }
        .theme-toggle__menu button {
            display: block; width: 100%; padding: 6px 12px; text-align: left;
            background: transparent; border: none; color: var(--text);
            font-family: var(--f-body); font-size: 0.7rem;
            border-radius: calc(var(--radius) - 2px); cursor: pointer;
            transition: background-color 0.15s ease;
        }
        .theme-toggle__menu button:hover,
        .theme-toggle__menu button:focus-visible {
            background: var(--accent-dim); color: var(--accent-light); outline: none;
        }

        /* ---- Panel tabs ---- */
        .panel-tabs {
            display: none !important;
        }

        /* ---- Sub-tab strip ---- */
        .manager-subtabs {
            position: sticky; top: 0; background: var(--bg); z-index: 10;
            display: flex; gap: 2px; padding: 0 4px; margin-bottom: 14px;
            border-bottom: 1px solid var(--border); flex-wrap: wrap;
        }
        .manager-subtab {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 14px; background: transparent;
            border: 1px solid transparent; border-bottom: 2px solid transparent;
            border-radius: 4px 4px 0 0; font-family: var(--f-display);
            font-size: 0.68rem; letter-spacing: 0.05em; color: var(--dim);
            cursor: pointer;
            transition: color 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
        }
        .manager-subtab:hover { color: var(--accent-light); background: var(--accent-dim); }
        .manager-subtab.active {
            color: var(--accent); border-bottom-color: var(--accent);
            background: var(--accent-dim); font-weight: 600;
        }
        .manager-subtab-icon { display: inline-flex; width: 1em; height: 1em; align-items: center; justify-content: center; color: currentColor; }
        .manager-subtab-icon svg { width: 100%; height: 100%; fill: currentColor; }
        .manager-subpanel { min-height: 200px; }

        /* ---- Empty state ---- */
        .empty-state {
            padding: 40px 20px;
            text-align: center;
            color: var(--dim);
            font-size: 0.85rem;
        }
        .loading {
            padding: 20px;
            text-align: center;
            color: var(--tmut);
            font-size: 0.8rem;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* ---- Sidebar overlay (mobile) ---- */
        .sidebar-overlay { display: none; }
        .sidebar-overlay.active {
            display: block; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8); z-index: 999;
        }

        /* ---- Mobile ---- */
        @media (max-width: 768px) {
            .world-app { flex-direction: column; }
            .locations-sidebar {
                position: fixed; top: 0; bottom: 0; left: 0;
                height: 100vh; width: 85%; max-width: 280px;
                z-index: 1000; transform: translateX(-100%);
                transition: transform 0.3s ease; box-shadow: none;
            }
            .locations-sidebar.visible { transform: translateX(0); }
            .manager-subtabs { flex-wrap: wrap; }
            .manager-subtab { flex: 1 1 100%; border-bottom: 1px solid var(--border); }
        }

        /* ---- No shadows/blurs (mobile) ---- */
        .toast { box-shadow: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
        .modal-container { box-shadow: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
    </style>
</head>

<!-- ================================================================
     SUB-TAB HOST
     (EDIT ME: replace with the page's sub-tab definitions.)
     Each entry: { id, label, icon, render(containerId, entityId) }.
     The host renders the tab strip and delegates to the active
     tab's render function. The render function is looked up on
     window by the id of the module it dispatches to.
     ================================================================ -->
<script>
    (function () {
        'use strict';
        var SUBTABS = [
            // EDIT: replace with this page's tabs.
            // { id: 'details', label: 'Details', icon: 'CROWN',
            //   render: function (c, p) { if (window.SomeDetailsTab) window.SomeDetailsTab.render(c, p); } }
        ];
        var _activeSubtabId = SUBTABS.length > 0 ? SUBTABS[0].id : null;

        function _icon(name) {
            return (window.Icons && typeof window.Icons[name] === 'string') ? window.Icons[name] : '';
        }
        function _esc(s) {
            return typeof window.escapeHtml === 'function'
                ? window.escapeHtml(s)
                : String(s == null ? '' : s);
        }

        function renderSubtabStrip(containerId, entityId) {
            var container = document.getElementById(containerId);
            if (!container) return;

            if (SUBTABS.length === 0) {
                container.innerHTML = '<div class="empty-state">No tabs configured for this page.</div>';
                return;
            }

            var stripHtml = '<div class="manager-subtabs" role="tablist">';
            for (var i = 0; i < SUBTABS.length; i++) {
                var t = SUBTABS[i];
                var active = t.id === _activeSubtabId ? ' active' : '';
                stripHtml += '<button type="button" class="manager-subtab' + active + '" data-subtab-id="' + _esc(t.id) + '">' +
                    (_icon(t.icon) ? '<span class="manager-subtab-icon">' + _icon(t.icon) + '</span>' : '') +
                    '<span>' + _esc(t.label) + '</span></button>';
            }
            stripHtml += '</div>';
            var panelHtml = '<div id="' + _esc(containerId) + '-subpanel" class="manager-subpanel" role="tabpanel"></div>';
            container.innerHTML = stripHtml + panelHtml;

            var buttons = container.querySelectorAll('.manager-subtab');
            for (var b = 0; b < buttons.length; b++) {
                (function (btn) {
                    btn.addEventListener('click', function () {
                        var id = btn.getAttribute('data-subtab-id');
                        if (id && id !== _activeSubtabId) {
                            _activeSubtabId = id;
                            renderSubtabStrip(containerId, entityId);
                        }
                    });
                })(buttons[b]);
            }

            var activeTab = null;
            for (var j = 0; j < SUBTABS.length; j++) {
                if (SUBTABS[j].id === _activeSubtabId) { activeTab = SUBTABS[j]; break; }
            }
            if (activeTab) activeTab.render(containerId + '-subpanel', entityId);
        }

        window.renderManagerTab = function (containerId, entityId) {
            renderSubtabStrip(containerId, entityId);
        };
    })();
</script>

<script>
(function () {
    'use strict';

    // EDIT: replace with this page's icon name, title, and sidebar

    var PAGE_ICON = 'CROWN';
    var PAGE_TITLE = 'MANAGER';
    var SIDEBAR_ICON = 'LOCATION';
    var SIDEBAR_TITLE = 'ITEMS';

    var currentEntityId = null;
    var isInitialized = false;

    function getIcon(name) { return (window.Icons && window.Icons[name]) ? window.Icons[name] : ''; }
    function iconWithText(icon, text) {
        if (!icon) return text || '';
        return '<span style="display:inline-flex;align-items:center;gap:4px;vertical-align:middle;">' + icon + '<span>' + (text || '') + '</span></span>';
    }
    function showToast(msg, type) { if (typeof window.showToast === 'function') window.showToast(msg, type); }

    function setupUIText() {
        var title = document.getElementById('managerTitle');
        if (title) title.innerHTML = iconWithText(getIcon(PAGE_ICON), ' ' + PAGE_TITLE);
        var sidebarTitle = document.getElementById('sidebarTitle');
        if (sidebarTitle) sidebarTitle.innerHTML = iconWithText(getIcon(SIDEBAR_ICON), ' ' + SIDEBAR_TITLE);
        var importBtn = document.getElementById('importBtn');
        if (importBtn) importBtn.innerHTML = iconWithText(getIcon('ARROW_RIGHT'), ' Import');
        var exportBtn = document.getElementById('exportBtn');
        if (exportBtn) exportBtn.innerHTML = iconWithText(getIcon('ARROW_RIGHT'), ' Export');
        var refreshBtn = document.getElementById('refreshBtn');
        if (refreshBtn) refreshBtn.innerHTML = iconWithText(getIcon('REFRESH'), ' Refresh');
        var loadingText = document.getElementById('loadingText');
        if (loadingText) loadingText.textContent = 'Loading...';
        var emptyState = document.getElementById('emptyStateText');
        if (emptyState) emptyState.textContent = 'Select an item from the sidebar';
    }

    // EDIT: replace with this page's sidebar data source. The default
    // renders the location tree via LocationUI. If this manager is
    // keyed on something else (households, religions, ranks, etc.),
    // swap this implementation.
    function setupSidebar() {
        var container = document.getElementById('placeList');
        if (!container) return;

        if (window.LocationUI && typeof window.LocationUI.renderLocationList === 'function') {
            try {
                window.LocationUI.renderLocationList('placeList', {
                    selectedId: currentEntityId,
                    onSelect: function (placeOrId) {
                        var id = (typeof placeOrId === 'string')
                            ? placeOrId
                            : (placeOrId && placeOrId.id ? placeOrId.id : null);
                        if (!id) return;
                        currentEntityId = id;
                        renderTab();
                        if (window.innerWidth <= 768) closeSidebar();
                    }
                });
                return;
            } catch (e) { console.error(e); }
        }

        container.innerHTML = '<div class="empty-state">No items found</div>';
    }

    function closeSidebar() {
        var s = document.getElementById('locationsSidebar');
        var o = document.getElementById('sidebarOverlay');
        if (s) s.classList.remove('visible');
        if (o) o.classList.remove('active');
    }
    function openSidebar() {
        var s = document.getElementById('locationsSidebar');
        var o = document.getElementById('sidebarOverlay');
        if (s) s.classList.add('visible');
        if (o) o.classList.add('active');
    }
    function toggleSidebar() {
        if (document.getElementById('locationsSidebar').classList.contains('visible')) closeSidebar();
        else openSidebar();
    }

    // EDIT: replace with this page's default-selection logic and tab
    // render trigger. The default selects the first non-root location
    // and calls window.renderManagerTab.
    function renderTab() {
        var panel = document.getElementById('panelContent');
        if (!panel) return;

        if (!currentEntityId) {
            panel.innerHTML = '<div class="empty-state">Select an item from the sidebar</div>';
            return;
        }

        if (typeof window.renderManagerTab === 'function') {
            window.renderManagerTab('panelContent', currentEntityId);
        }
    }

    function setupTopBarActions() {
        var importBtn = document.getElementById('importBtn');
        if (importBtn) importBtn.onclick = function () {
            if (typeof window.importData !== 'function') { showToast('Import not available', 'error'); return; }
            window.importData()
                .then(function () { setupSidebar(); renderTab(); showToast('Import successful', 'success'); })
                .catch(function (err) { showToast('Import failed: ' + (err && err.message ? err.message : 'unknown'), 'error'); });
        };

        var exportBtn = document.getElementById('exportBtn');
        if (exportBtn) exportBtn.onclick = function () {
            if (typeof window.exportData !== 'function') { showToast('Export not available', 'error'); return; }
            try { window.exportData(); showToast('Export started', 'success'); }
            catch (e) { showToast('Export failed: ' + (e.message || 'unknown'), 'error'); }
        };

        var refreshBtn = document.getElementById('refreshBtn');
        if (refreshBtn) refreshBtn.onclick = function () {
            if (typeof window.loadMasterData === 'function') window.loadMasterData();
            setTimeout(function () { setupSidebar(); renderTab(); showToast('Refreshed', 'success'); }, 100);
        };
    }

    function init() {
        if (isInitialized) return;
        isInitialized = true;

        setupUIText();

        if (typeof window.loadMasterData === 'function') window.loadMasterData();

        setTimeout(function () {
            setupSidebar();
            setupTopBarActions();
            renderTab();

            var menuToggle = document.getElementById('menuToggle');
            if (menuToggle) menuToggle.addEventListener('click', toggleSidebar);
            var overlay = document.getElementById('sidebarOverlay');
            if (overlay) overlay.addEventListener('click', closeSidebar);
        }, 150);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>

<!-- ================================================================
     THEME SWITCHER
     ================================================================ -->
<script>
(function () {
    'use strict';
    var themeBtn = document.getElementById('themeBtn');
    var themeMenu = document.getElementById('themeMenu');
    var themeName = document.getElementById('themeName');
    var switcher = window.ThemeSwitcher;
    if (!switcher) return;

    function updateLabel(id) {
        var label = id.charAt(0).toUpperCase() + id.slice(1).replace(/-/g, ' ');
        if (themeName) themeName.textContent = label;
    }
    function buildMenu() {
        var html = '';
        for (var i = 0; i < switcher.themes.length; i++) {
            var id = switcher.themes[i];
            var label = id.charAt(0).toUpperCase() + id.slice(1).replace(/-/g, ' ');
            html += '<li role="none"><button role="menuitem" type="button" data-theme-id="' + id + '">' + label + '</button></li>';
        }
        if (themeMenu) themeMenu.innerHTML = html;
    }
    function openMenu() { if (themeMenu) { themeMenu.hidden = false; themeBtn.setAttribute('aria-expanded', 'true'); } }
    function closeMenu() { if (themeMenu) { themeMenu.hidden = true; themeBtn.setAttribute('aria-expanded', 'false'); } }
    if (themeBtn) themeBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        if (themeMenu.hidden) openMenu(); else closeMenu();
    });
    if (themeMenu) themeMenu.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-theme-id]'); if (!btn) return;
        var id = btn.getAttribute('data-theme-id');
        switcher.apply(id); updateLabel(id); closeMenu();
    });
    document.addEventListener('click', function (e) {
        if (themeMenu && !themeMenu.hidden) {
            if (themeMenu.contains(e.target)) return;
            if (e.target === themeBtn) return;
            closeMenu();
        }
    });
    buildMenu();
    var saved = switcher.getSaved();
    if (saved) updateLabel(saved);
})();
</script>
