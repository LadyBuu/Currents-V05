<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover" />
    <title>Culture Manager</title>

    <link rel="icon" href="data:," />

    <!-- 1. Theme bootstrapper (MUST LOAD FIRST — matches load-order Block 1) -->
    <script src="js/core/theme-boot.js"></script>

    <!-- 2. Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- 3. Shared stylesheets -->
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/common.css">

    <style>
        /* ==================================================================
           CULTURE MANAGER — INLINE STYLES
           ==================================================================
           Structural layout only. Every color, radius, shadow, and font
           value comes from themes.css. Every culture-specific class lives
           in this file so the manager is self-contained, matching
           LocationManager.html's pattern.
           ================================================================== */

        html, body { height: 100%; margin: 0; overflow: hidden; }
        body {
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--text);
            font-family: var(--f-body);
            font-size: 16px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ---- Topbar (matches LocationManager) ---- */
        .topbar {
            position: relative;
            z-index: 100;
            flex-shrink: 0;
            background: var(--bg2);
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border);
            min-height: 48px;
            flex-wrap: wrap;
        }
        .topbar .title {
            font-family: var(--f-display);
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--accent);
            white-space: nowrap;
            letter-spacing: 0.02em;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .topbar .title svg { width: 1em; height: 1em; fill: currentColor; }
        .topbar .spacer { flex: 1; min-width: 12px; }
        .topbar .burger-menu {
            display: none;
            align-items: center;
            justify-content: center;
            padding: 4px 10px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            cursor: pointer;
        }
        .topbar .burger-menu:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* ---- Topbar buttons ---- */
        .tb-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 14px;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: var(--f-body);
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            line-height: 1.2;
            transition: border-color 0.15s ease, background-color 0.15s ease, color 0.15s ease;
        }
        .tb-btn svg { width: 0.9em; height: 0.9em; fill: currentColor; }
        .tb-btn:hover {
            border-color: var(--accent);
            background: var(--accent-dim);
            color: var(--accent-light);
        }
        .tb-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--accent-fg);
        }
        .tb-btn.primary:hover {
            background: var(--accent-dark);
            border-color: var(--accent-dark);
        }
        .tb-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }
        .tb-btn:disabled:hover {
            background: var(--bg2);
            border-color: var(--border);
            color: var(--text);
        }

        /* ---- Year input (matches LocationManager) ---- */
        .year-input {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-family: var(--f-body);
            font-size: 0.7rem;
            line-height: 1.2;
        }
        .year-input label {
            font-family: var(--f-display);
            font-size: 0.55rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--dim);
            white-space: nowrap;
        }
        .year-input input {
            width: 64px;
            padding: 3px 6px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: calc(var(--radius) - 1px);
            color: var(--text);
            font-family: var(--f-mono);
            font-size: 0.7rem;
            text-align: right;
        }
        .year-input input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-soft);
        }
        .year-input input::-webkit-outer-spin-button,
        .year-input input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .year-input input[type=number] { -moz-appearance: textfield; }

        /* ---- Theme toggle (matches LocationManager) ---- */
        .theme-toggle { position: relative; display: inline-flex; }
        .theme-toggle__btn { gap: 6px; }
        .theme-toggle__menu {
            position: absolute;
            top: calc(100% + 4px);
            right: 0;
            z-index: 9999;
            min-width: 160px;
            max-height: 60vh;
            padding: 4px;
            margin: 0;
            list-style: none;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow-y: auto;
        }
        .theme-toggle__menu[hidden] { display: none; }
        .theme-toggle__menu button {
            display: block;
            width: 100%;
            padding: 6px 12px;
            text-align: left;
            background: transparent;
            border: none;
            color: var(--text);
            font-family: var(--f-body);
            font-size: 0.7rem;
            border-radius: calc(var(--radius) - 2px);
            cursor: pointer;
            transition: background-color 0.15s ease;
        }
        .theme-toggle__menu button:hover,
        .theme-toggle__menu button:focus-visible {
            background: var(--accent-dim);
            color: var(--accent-light);
            outline: none;
        }

        /* ---- App shell ---- */
        .app-layout {
            display: flex;
            flex-direction: row;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }
        .sidebar {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg2);
            border-right: 1px solid var(--border);
            width: 280px;
        }
        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--bg3);
        }
        .sidebar-header h3 {
            margin: 0;
            font-family: var(--f-display);
            font-size: 0.65rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sidebar-header h3 svg { width: 1em; height: 1em; fill: currentColor; }

        .sidebar-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            min-height: 0;
        }

        .main-panel {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
        }

        /* ---- Sub-tab strip (culture manager's main tabs, matches LocationManager) ---- */
        .manager-subtabs {
            position: sticky;
            top: 0;
            display: flex;
            align-items: stretch;
            gap: 4px;
            padding: 8px 4px 0;
            margin: 0 0 20px;
            padding-left: 24px;
            padding-right: 24px;
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            z-index: 10;
        }
        .manager-subtab {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 18px 11px;
            background: transparent;
            border: 1px solid transparent;
            border-bottom: none;
            border-radius: 6px 6px 0 0;
            color: var(--dim);
            font-family: var(--f-display);
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.06em;
            line-height: 1.15;
            white-space: nowrap;
            cursor: pointer;
            transition: color 0.15s ease, background-color 0.15s ease;
        }
        .manager-subtab::after {
            content: '';
            position: absolute;
            left: 0; right: 0; bottom: -1px;
            height: 2px;
            background: transparent;
            border-radius: 2px 2px 0 0;
            transition: background-color 0.15s ease;
        }
        .manager-subtab:hover {
            color: var(--accent-light);
            background: var(--accent-dim);
        }
        .manager-subtab:hover::after {
            background: var(--accent);
            opacity: 0.35;
        }
        .manager-subtab.active {
            color: var(--accent);
            background: var(--bg2);
            border-color: var(--border);
            border-bottom-color: transparent;
            font-weight: 600;
        }
        .manager-subtab.active::after {
            background: var(--accent);
            opacity: 1;
        }
        .manager-subtab-icon {
            display: inline-flex;
            width: 16px;
            height: 16px;
            align-items: center;
            justify-content: center;
            color: currentColor;
            flex-shrink: 0;
            opacity: 0.9;
        }
        .manager-subtab-icon svg { width: 100%; height: 100%; fill: currentColor; }

        .tab-content-wrapper {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px 24px;
            background: var(--bg);
        }

        /* ---- Details view ---- */
        .culture-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 16px;
        }
        .culture-card__header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .culture-card__icon {
            font-size: 1.6rem;
            line-height: 1;
            color: var(--accent);
            width: 2rem;
            text-align: center;
        }
        .culture-card__label {
            font-family: var(--f-display);
            font-size: 1rem;
            font-weight: 600;
            color: var(--accent-light);
        }
        .culture-card__desc {
            font-size: 0.8rem;
            color: var(--text);
            line-height: 1.55;
            margin: 0 0 12px;
        }
        .culture-card__relations {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 12px 0;
        }
        .culture-card__relation {
            display: flex;
            gap: 8px;
            align-items: baseline;
            font-size: 0.75rem;
        }
        .culture-card__relation-label {
            color: var(--dim);
            font-family: var(--f-display);
            font-size: 0.6rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            min-width: 80px;
        }
        .culture-card__relation-values { color: var(--text); }
        .culture-card__notes {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border-light);
            font-size: 0.7rem;
            color: var(--dim);
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .ct-details__list {
            margin: 0;
            padding-left: 18px;
            font-size: 0.75rem;
            color: var(--text);
            line-height: 1.7;
        }

        /* ---- Empty / loading ---- */
        .empty-state {
            padding: 48px 24px;
            text-align: center;
            color: var(--dim);
            font-size: 0.88rem;
            line-height: 1.6;
        }
        .empty-state .message { font-weight: 500; color: var(--text); }
        .empty-state .sub-message {
            display: block;
            margin-top: 6px;
            font-size: 0.75rem;
            color: var(--dim);
        }
        .loading {
            padding: 24px;
            text-align: center;
            color: var(--tmut);
            font-size: 0.85rem;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* ---- Toast / modal chrome overrides (matches LocationManager) ---- */
        .toast { box-shadow: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
        .modal-container { box-shadow: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
        .btn:hover { box-shadow: none !important; }
        .icon-svg { display: inline-block; width: 1em; height: 1em; vertical-align: middle; fill: currentColor; }

        /* ---- Sidebar overlay ---- */
        .sidebar-overlay { display: none; }
        .sidebar-overlay.active {
            display: block;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 999;
        }

        /* ---- Responsive (matches LocationManager) ---- */
        @media (max-width: 768px) {
            .topbar .burger-menu { display: inline-flex; }
            .topbar {
                padding: 6px 10px;
                gap: 6px;
                min-height: 42px;
            }
            .topbar .title { font-size: 0.75rem; }
            .topbar .tb-btn { padding: 3px 10px; font-size: 0.65rem; }
            .year-input { padding: 2px 6px; }
            .year-input label { display: none; }
            .year-input input { width: 52px; font-size: 0.65rem; }

            .app-layout { flex-direction: column; }
            .sidebar {
                position: fixed;
                top: 0; bottom: 0; left: 0;
                height: 100vh;
                width: 85%;
                max-width: 280px;
                z-index: 1000;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
                box-shadow: none;
            }
            .sidebar.visible { transform: translateX(0); }
            .tab-content-wrapper { padding: 16px; }
            .manager-subtabs {
                margin: 0 0 16px;
                padding-left: 16px;
                padding-right: 16px;
            }
            .manager-subtab {
                flex: 1 1 auto;
                min-width: 0;
                padding: 10px 14px;
                font-size: 0.72rem;
            }
        }
    </style>
</head>
<body>

<!-- ============================================================
     TOPBAR
     ============================================================ -->
<div class="topbar">
    <button id="menuToggle" class="burger-menu" type="button" aria-label="Toggle menu">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
    </button>
    <div class="title" id="cultureManagerTitle"></div>
    <div class="spacer"></div>

    <button id="createCultureBtn" class="tb-btn primary" type="button"></button>
    <button id="editCultureBtn" class="tb-btn" type="button" disabled></button>
    <button id="deleteCultureBtn" class="tb-btn" type="button" disabled></button>

    <div class="year-input">
        <label for="yearInput">Year</label>
        <input type="number" id="yearInput" min="1" step="1">
        <button id="setYearBtn" class="tb-btn" type="button">Set</button>
    </div>

    <button id="importBtn" class="tb-btn" type="button"></button>
    <button id="exportBtn" class="tb-btn" type="button"></button>
    <button id="refreshBtn" class="tb-btn" type="button"></button>

    <input type="file" id="fileInput" accept=".json" style="display:none;" />

    <div class="theme-toggle" role="group" aria-label="Theme">
        <button class="tb-btn theme-toggle__btn" id="themeBtn" type="button" aria-haspopup="menu" aria-expanded="false">
            <span aria-hidden="true">◐</span>
            <span id="themeName">Dark</span>
        </button>
        <ul class="theme-toggle__menu" id="themeMenu" role="menu" hidden></ul>
    </div>
</div>

<!-- ============================================================
     APP SHELL
     ============================================================ -->
<div class="app-layout">
    <div class="sidebar" id="cultureSidebar">
        <div class="sidebar-header"><h3 id="sidebarTitle"></h3></div>
        <div class="sidebar-list" id="cultureListContainer">
            <div class="loading">Loading cultures…</div>
        </div>
    </div>
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <div class="main-panel">
        <div class="manager-subtabs" id="panelSubtabs" role="tablist">
            <button class="manager-subtab active" role="tab" type="button" data-tab="details" aria-selected="true" tabindex="0">
                <span class="manager-subtab-icon" data-icon="CIRCLE_DOT" aria-hidden="true"></span>
                <span>Details</span>
            </button>
            <button class="manager-subtab" role="tab" type="button" data-tab="appearance" aria-selected="false" tabindex="-1">
                <span class="manager-subtab-icon" data-icon="PERSON" aria-hidden="true"></span>
                <span>Appearance</span>
            </button>
            <button class="manager-subtab" role="tab" type="button" data-tab="mythology" aria-selected="false" tabindex="-1">
                <span class="manager-subtab-icon" data-icon="BOOK" aria-hidden="true"></span>
                <span>Mythology</span>
            </button>
            <button class="manager-subtab" role="tab" type="button" data-tab="characters" aria-selected="false" tabindex="-1">
                <span class="manager-subtab-icon" data-icon="PERSON" aria-hidden="true"></span>
                <span>Characters</span>
            </button>
            <button class="manager-subtab" role="tab" type="button" data-tab="names" aria-selected="false" tabindex="-1">
                <span class="manager-subtab-icon" data-icon="BOOK" aria-hidden="true"></span>
                <span>Names</span>
            </button>
        </div>

        <div class="tab-content-wrapper" id="tabContent" role="tabpanel">
            <div class="tab-pane active" id="tab-details"    data-tab-content="details"></div>
            <div class="tab-pane"        id="tab-appearance" data-tab-content="appearance"></div>
            <div class="tab-pane"        id="tab-mythology"  data-tab-content="mythology"></div>
            <div class="tab-pane"        id="tab-characters" data-tab-content="characters"></div>
            <div class="tab-pane"        id="tab-names"      data-tab-content="names"></div>
        </div>
    </div>
</div>

<script>
    (function () {
        try {
            if (typeof window.initializeStorage === 'function') window.initializeStorage();
        } catch (e) { console.error('[boot] initializeStorage failed:', e); }
    })();
</script>
<script src="js/core/accessors.js"></script>

<script>
    (function () {
        'use strict';
        window.PlaceQueries = {
            getPlaceById: function (id) {
                if (!window.LocationState
                    || typeof window.LocationState.getPlaceById !== 'function') {
                    return null;
                }
                return window.LocationState.getPlaceById(id);
            },
            getPlaceSummaries: function () {
                return (window.LocationQueries
                    && typeof window.LocationQueries.getPlaceSummaries === 'function')
                    ? window.LocationQueries.getPlaceSummaries()
                    : [];
            },
            getAllPlaces: function () {
                return (typeof window.getPlaces === 'function') ? window.getPlaces() : [];
            }
        };
    })();
</script>

<!-- ================================================================
     ORCHESTRATOR
     ================================================================ -->
<script>
(function () {
    'use strict';

    // ---- DOM handles ----
    var cultureContainer = document.getElementById('cultureListContainer');
    var sidebar          = document.getElementById('cultureSidebar');
    var sidebarOverlay   = document.getElementById('sidebarOverlay');
    var menuToggle       = document.getElementById('menuToggle');
    var yearInput        = document.getElementById('yearInput');
    var setYearBtn       = document.getElementById('setYearBtn');
    var exportBtn        = document.getElementById('exportBtn');
    var importBtn        = document.getElementById('importBtn');
    var fileInput        = document.getElementById('fileInput');
    var createCultureBtn = document.getElementById('createCultureBtn');
    var editCultureBtn   = document.getElementById('editCultureBtn');
    var deleteCultureBtn = document.getElementById('deleteCultureBtn');
    var refreshBtn       = document.getElementById('refreshBtn');

    var tabButtons = Array.prototype.slice.call(
        document.querySelectorAll('.manager-subtabs .manager-subtab')
    );

    // ---- Per-session state ----
    var selectedCultureId = null;
    var activeTabId        = 'details';
    var isInitialized      = false;

    // =================================================================
    // Bootstrap
    // =================================================================
    function bootstrap() {
        if (isInitialized) return;
        isInitialized = true;

        setupUIText();

        if (typeof window.loadMasterData === 'function') {
            try { window.loadMasterData(); }
            catch (e) { console.error('[culture-manager] loadMasterData failed:', e); }
        }

        // Cross-domain indexes that culture reads (PlaceQueries,
        // CharacterQueries, ReligionQueries). Order matches the
        // application bootstrap block at the bottom of the load-order
        // file, minus the subsystems CultureManager does not render.
        if (window.RankBootstrap && typeof window.RankBootstrap.init === 'function') {
            try { window.RankBootstrap.init(); }
            catch (e) { console.error('[culture-manager] RankBootstrap failed:', e); }
        }
        if (window.ReligionBootstrap && typeof window.ReligionBootstrap.init === 'function') {
            try { window.ReligionBootstrap.init(); }
            catch (e) { console.error('[culture-manager] ReligionBootstrap failed:', e); }
        }
        if (window.LocationBootstrap && typeof window.LocationBootstrap.init === 'function') {
            try { window.LocationBootstrap.init(); }
            catch (e) { console.error('[culture-manager] LocationBootstrap failed:', e); }
        }
        if (window.CultureBootstrap && typeof window.CultureBootstrap.init === 'function') {
            try { window.CultureBootstrap.init(); }
            catch (e) { console.error('[culture-manager] CultureBootstrap failed:', e); }
        }

        injectIcons();
        syncYearInput();
        renderCultureList();
        pickInitialSelection();
        syncTabButtons(activeTabId);
    }

    // =================================================================
    // Icons
    // =================================================================
    function injectIcons() {
        if (typeof window.Icons === 'undefined') {
            setTimeout(injectIcons, 100);
            return;
        }
        var nodes = document.querySelectorAll('[data-icon]');
        for (var i = 0; i < nodes.length; i++) {
            var node = nodes[i];
            var name = node.getAttribute('data-icon');
            var svg = window.Icons[name] || window.Icons.CIRCLE || '';
            node.innerHTML = svg;
        }
    }

    function setupUIText() {
        var title = document.getElementById('cultureManagerTitle');
        if (title) title.innerHTML = iconWithText(getIcon('CULTURE'), ' CULTURE MANAGER');

        var sidebarTitle = document.getElementById('sidebarTitle');
        if (sidebarTitle) sidebarTitle.innerHTML = iconWithText(getIcon('CULTURE'), ' CULTURES');

        if (createCultureBtn) createCultureBtn.innerHTML = iconWithText(getIcon('PLUS'), ' Add Culture');
        if (editCultureBtn)   editCultureBtn.innerHTML   = iconWithText(getIcon('EDIT'), ' Edit');
        if (deleteCultureBtn) deleteCultureBtn.innerHTML = iconWithText(getIcon('TRASH'), ' Delete');
        if (importBtn)        importBtn.innerHTML        = iconWithText(getIcon('ARROW_RIGHT'), ' Import');
        if (exportBtn)        exportBtn.innerHTML        = iconWithText(getIcon('ARROW_RIGHT'), ' Export');
        if (refreshBtn)       refreshBtn.innerHTML       = iconWithText(getIcon('REFRESH'), ' Refresh');
    }

    function getIcon(name) {
        return (window.Icons && window.Icons[name]) ? window.Icons[name] : '';
    }
    function iconWithText(icon, text) {
        if (!icon) return text || '';
        return '<span style="display:inline-flex;align-items:center;gap:4px;vertical-align:middle;">' +
               icon + '<span>' + (text || '') + '</span></span>';
    }

    // =================================================================
    // Sidebar rendering
    // =================================================================
    function renderCultureList() {
        if (!cultureContainer) return;

        var UI = window.CultureUIList || window.CultureUI;
        var Queries = window.CultureQueries;

        var cultures = [];
        try {
            cultures = Queries ? Queries.getAllCultures() : [];
        } catch (e) {
            console.error('[culture-manager] getAllCultures failed:', e);
            cultures = [];
        }

        if (UI && typeof UI.renderCultureList === 'function') {
            try {
                // Correct signature: renderCultureList(containerId, options),
                // where options carries `cultures` and `onSelect`.
                UI.renderCultureList(cultureContainer, {
                    cultures: cultures,
                    selectedId: selectedCultureId,
                    onSelect: function (culture) {
                        if (culture && culture.id) selectCulture(culture.id);
                    }
                });
                return;
            } catch (e) {
                console.error('[culture-manager] renderCultureList failed:', e);
            }
        }
        renderCultureListFallback(cultures);
    }

    function renderCultureListFallback(cultures) {
        if (!cultureContainer) return;
        if (!cultures || cultures.length === 0) {
            cultureContainer.innerHTML =
                '<div class="empty-state">' +
                '<div class="message">No cultures found</div>' +
                '<div class="sub-message">Click "+ Culture" to add one</div>' +
                '</div>';
            return;
        }
        var html = '<div class="culture-list">';
        for (var i = 0; i < cultures.length; i++) {
            var c = cultures[i];
            var sel = c.id === selectedCultureId ? ' is-selected' : '';
            html += '<div class="culture-row' + sel + '" data-culture-id="' + c.id + '">' +
                '<div class="culture-row__icon">' + (c.icon || '✦') + '</div>' +
                '<div class="culture-row__main">' +
                '<div class="culture-row__label">' + escapeHtml(c.displayName || c.name) + '</div>' +
                (c.description
                    ? '<div class="culture-row__desc">' + escapeHtml(c.description) + '</div>'
                    : '') +
                '</div></div>';
        }
        html += '</div>';
        cultureContainer.innerHTML = html;

        var rows = cultureContainer.querySelectorAll('.culture-row');
        for (var j = 0; j < rows.length; j++) {
            (function (row) {
                row.addEventListener('click', function () {
                    var id = row.getAttribute('data-culture-id');
                    if (id) selectCulture(id);
                });
            })(rows[j]);
        }
    }

    function pickInitialSelection() {
        if (selectedCultureId) return;
        var cultures = [];
        try {
            cultures = window.CultureQueries
                ? window.CultureQueries.getAllCultures()
                : [];
        } catch (e) { /* ignore */ }
        if (cultures && cultures.length > 0) {
            selectCulture(cultures[0].id);
        }
    }

    function selectCulture(id) {
        if (!id) return;
        selectedCultureId = id;
        if (editCultureBtn)   editCultureBtn.disabled   = false;
        if (deleteCultureBtn) deleteCultureBtn.disabled = false;
        renderCultureList();
        renderActiveTab();
        if (window.innerWidth <= 768) closeSidebar();
    }

    // =================================================================
    // Tab dispatch
    // =================================================================
    function activateTab(tabId) {
        activeTabId = tabId;
        syncTabButtons(tabId);
        renderActiveTab();
    }

    function syncTabButtons(tabId) {
        for (var i = 0; i < tabButtons.length; i++) {
            var btn = tabButtons[i];
            var isActive = btn.dataset.tab === tabId;
            btn.classList.toggle('active', isActive);
            btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
            btn.setAttribute('tabindex', isActive ? '0' : '-1');
        }
        var panes = document.querySelectorAll('#tabContent .tab-pane');
        for (var j = 0; j < panes.length; j++) {
            panes[j].classList.toggle(
                'active',
                panes[j].getAttribute('data-tab-content') === tabId
            );
        }
    }

    for (var i = 0; i < tabButtons.length; i++) {
        (function (btn) {
            btn.addEventListener('click', function () {
                activateTab(btn.dataset.tab);
            });
        })(tabButtons[i]);
    }

    function renderActiveTab() {
        var container = document.getElementById('tab-' + activeTabId);
        if (!container) return;

        if (!selectedCultureId) {
            setEmptyState(container, 'Select a culture from the sidebar');
            return;
        }

        var culture = null;
        try {
            culture = window.CultureQueries
                ? window.CultureQueries.getCultureById(selectedCultureId)
                : null;
        } catch (e) {
            console.error('[culture-manager] getCultureById failed:', e);
        }
        if (!culture) {
            setEmptyState(container, 'Culture not found');
            return;
        }

        if (activeTabId === 'details') {
            renderDetailsView(container, culture);
            return;
        }
        renderTabPreview(container, culture, activeTabId);
    }

    function renderDetailsView(container, culture) {
        var desc = culture.description
            ? '<p class="culture-card__desc">' + escapeHtml(culture.description) + '</p>'
            : '';
        var notes = culture.notes
            ? '<div class="culture-card__notes">' + escapeHtml(culture.notes) + '</div>'
            : '';
        var locations = (culture.locations && culture.locations.length > 0)
            ? '<div class="culture-card__relation">' +
              '<span class="culture-card__relation-label">Locations</span>' +
              '<span class="culture-card__relation-values">' +
              culture.locations.length + ' linked</span></div>'
            : '';

        var html =
            '<div class="culture-card">' +
            '<div class="culture-card__header">' +
            '<div class="culture-card__icon">' + escapeHtml(culture.icon || '✦') + '</div>' +
            '<div class="culture-card__label">' +
            escapeHtml(culture.displayName || culture.name) + '</div>' +
            '</div>' +
            desc +
            '<div class="culture-card__relations">' + locations + '</div>' +
            notes +
            '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">' +
            '<button type="button" class="tb-btn primary" id="ct_details_edit">Edit Details</button>' +
            '<button type="button" class="tb-btn" id="ct_details_open_editor">Open Full Editor</button>' +
            '</div>' +
            '</div>';

        container.innerHTML = html;

        var editBtn = container.querySelector('#ct_details_edit');
        if (editBtn) {
            editBtn.addEventListener('click', function () {
                openEditCulture(culture.id);
            });
        }
        var openBtn = container.querySelector('#ct_details_open_editor');
        if (openBtn) {
            openBtn.addEventListener('click', function () {
                openEditor(culture.id, 'details');
            });
        }
    }

    function renderTabPreview(container, culture, tabId) {
        var labelMap = {
            appearance: 'Appearance',
            mythology:  'Mythology',
            characters: 'Characters',
            names:      'Names'
        };
        var tabLabel = labelMap[tabId] || tabId;

        var summary = '';
        if (tabId === 'appearance') {
            var ap = culture.appearance || {};
            var cats = ['skinTones', 'eyeColors', 'hairColors', 'hairTypes', 'buildTypes', 'commonFeatures'];
            var parts = [];
            for (var i = 0; i < cats.length; i++) {
                var list = ap[cats[i]];
                if (Array.isArray(list) && list.length > 0) {
                    parts.push(cats[i] + ': ' + list.length + ' options');
                }
            }
            summary = parts.length > 0
                ? '<ul class="ct-details__list">' +
                  parts.map(function (p) { return '<li>' + escapeHtml(p) + '</li>'; }).join('') +
                  '</ul>'
                : '<p class="culture-card__desc">No appearance options defined.</p>';
        } else if (tabId === 'mythology') {
            var my = culture.mythology || {};
            var sections = ['creation', 'afterlife', 'cosmology'];
            var sParts = [];
            for (var j = 0; j < sections.length; j++) {
                if (my[sections[j]]) {
                    sParts.push('<li><strong>' + sections[j] + ':</strong> ' +
                        escapeHtml(String(my[sections[j]]).substring(0, 80)) +
                        (String(my[sections[j]]).length > 80 ? '…' : '') + '</li>');
                }
            }
            summary = sParts.length > 0
                ? '<ul class="ct-details__list">' + sParts.join('') + '</ul>'
                : '<p class="culture-card__desc">No mythology defined.</p>';
        } else if (tabId === 'characters') {
            var chars = [];
            try {
                chars = window.CultureQueries
                    ? window.CultureQueries.getCharactersForCulture(culture.id)
                    : [];
            } catch (e) { /* ignore */ }
            summary = chars.length > 0
                ? '<p class="culture-card__desc">' + chars.length + ' character(s) assigned.</p>'
                : '<p class="culture-card__desc">No characters assigned.</p>';
        } else if (tabId === 'names') {
            summary = '<p class="culture-card__desc">' +
                'Names are managed through the culture editor modal. ' +
                'Open the editor to add male names, female names, surnames, ' +
                'and surname rules.</p>';
        }

        container.innerHTML =
            '<div class="culture-card">' +
            '<div class="culture-card__header">' +
            '<div class="culture-card__label">' + escapeHtml(tabLabel) + '</div>' +
            '</div>' +
            summary +
            '<div style="display:flex;gap:8px;margin-top:12px;">' +
            '<button type="button" class="tb-btn primary" id="ct_preview_edit">' +
            'Open ' + escapeHtml(tabLabel) + ' Editor</button>' +
            '</div>' +
            '</div>';

        var editBtn = container.querySelector('#ct_preview_edit');
        if (editBtn) {
            editBtn.addEventListener('click', function () {
                openEditor(culture.id, tabId);
            });
        }
    }

    function setEmptyState(container, message) {
        container.innerHTML = '<div class="empty-state">' +
            '<div class="message">' + escapeHtml(message) + '</div>' +
            '</div>';
    }

    // =================================================================
    // Composite editor launcher
    // =================================================================
    function openEditor(cultureId, initialTab) {
        if (!window.CultureEditorTabs
            || typeof window.CultureEditorTabs.openEditor !== 'function') {
            window.alert('Culture editor is not loaded. Check that ' +
                'js/tabs/culture-editor-tab.js and the four tab files loaded.');
            return;
        }
        window.CultureEditorTabs.openEditor(cultureId, {
            initialTab: initialTab || 'appearance',
            onSave: function (updated) {
                renderCultureList();
                if (updated && updated.id === selectedCultureId) {
                    renderActiveTab();
                }
            },
            onCancel: function () {
                // Editor discarded its working copy; nothing to do.
            }
        });
    }

    // =================================================================
    // Create / edit / delete culture (modals-culture.js)
    // =================================================================
    function openCreateCulture() {
        if (typeof window.openCreateCultureModal !== 'function') {
            window.alert('Create Culture modal not loaded (modals-culture.js).');
            return;
        }
        window.openCreateCultureModal({
            onSuccess: function (newCulture) {
                renderCultureList();
                if (newCulture && newCulture.id) {
                    selectCulture(newCulture.id);
                }
            }
        });
    }

    function openEditCulture(id) {
        if (typeof window.openEditCultureModal !== 'function') {
            window.alert('Edit Culture modal not loaded (modals-culture.js).');
            return;
        }
        window.openEditCultureModal(id, {
            onSuccess: function (updated) {
                renderCultureList();
                if (updated && updated.id === selectedCultureId) {
                    renderActiveTab();
                }
            }
        });
    }

    function openDeleteCulture(id) {
        if (typeof window.openDeleteCultureModal !== 'function') {
            window.alert('Delete Culture modal not loaded (modals-culture.js).');
            return;
        }
        window.openDeleteCultureModal(id, {
            onSuccess: function () {
                if (selectedCultureId === id) {
                    selectedCultureId = null;
                    if (editCultureBtn)   editCultureBtn.disabled   = true;
                    if (deleteCultureBtn) deleteCultureBtn.disabled = true;
                }
                renderCultureList();
                pickInitialSelection();
            }
        });
    }

    if (createCultureBtn) createCultureBtn.addEventListener('click', openCreateCulture);
    if (editCultureBtn)   editCultureBtn.addEventListener('click', function () {
        if (selectedCultureId) openEditCulture(selectedCultureId);
    });
    if (deleteCultureBtn) deleteCultureBtn.addEventListener('click', function () {
        if (selectedCultureId) openDeleteCulture(selectedCultureId);
    });

    // =================================================================
    // Sidebar toggle (matches LocationManager)
    // =================================================================
    function openSidebar() {
        if (sidebar) sidebar.classList.add('visible');
        if (sidebarOverlay) sidebarOverlay.classList.add('active');
    }
    function closeSidebar() {
        if (sidebar) sidebar.classList.remove('visible');
        if (sidebarOverlay) sidebarOverlay.classList.remove('active');
    }
    function toggleSidebar() {
        if (!sidebar) return;
        if (sidebar.classList.contains('visible')) closeSidebar();
        else openSidebar();
    }

    if (menuToggle) menuToggle.addEventListener('click', toggleSidebar);
    if (sidebarOverlay) sidebarOverlay.addEventListener('click', closeSidebar);
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeSidebar();
    });
    window.addEventListener('resize', function () {
        if (window.innerWidth > 768) closeSidebar();
    });

    // =================================================================
    // Year control (matches LocationManager)
    // =================================================================
    function syncYearInput() {
        if (!yearInput) return;
        try {
            var y = (typeof window.getCurrentYear === 'function')
                ? window.getCurrentYear()
                : (window.masterData && window.masterData.data
                    ? window.masterData.data.currentYear
                    : null);
            if (typeof y === 'number' && isFinite(y)) {
                yearInput.value = String(y);
            }
        } catch (e) { /* ignore */ }
    }

    function applyYear() {
        if (!yearInput) return;
        var val = parseInt(yearInput.value, 10);
        if (!isFinite(val)) {
            window.alert('Enter a valid year.');
            return;
        }
        if (typeof window.isValidYear === 'function' && window.isValidYear(val) !== true) {
            window.alert('Year is outside the allowed range.');
            return;
        }
        if (typeof window.setCurrentYear === 'function') {
            try {
                var result = window.setCurrentYear(val);
                if (result === false) {
                    window.alert('Could not set year.');
                    return;
                }
            } catch (e) {
                window.alert('Set year failed: ' + (e.message || 'unknown'));
                return;
            }
        } else {
            if (!window.masterData || !window.masterData.data) {
                window.alert('Storage not initialized.');
                return;
            }
            window.masterData.data.currentYear = val;
            if (typeof window.markDataDirty === 'function') {
                try { window.markDataDirty(); } catch (e) { /* ignore */ }
            }
            if (typeof window.saveMasterData === 'function') {
                try { window.saveMasterData(); } catch (e) { /* ignore */ }
            }
        }
        syncYearInput();
        renderActiveTab();
    }

    if (setYearBtn) setYearBtn.addEventListener('click', applyYear);
    if (yearInput) yearInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); applyYear(); }
    });

    // =================================================================
    // Export / import (matches LocationManager's flow)
    // =================================================================
    if (exportBtn) {
        exportBtn.addEventListener('click', function () {
            if (typeof window.exportData === 'function') {
                try { window.exportData(); }
                catch (e) { window.alert('Export failed: ' + (e.message || 'unknown')); }
                return;
            }
            if (typeof window.exportToJSON === 'function' && window.masterData) {
                try { window.exportToJSON(window.masterData, 'stillwaters'); }
                catch (e) { window.alert('Export failed: ' + (e.message || 'unknown')); }
                return;
            }
            window.alert('Export module not available.');
        });
    }

    if (importBtn && fileInput) {
        importBtn.addEventListener('click', function () {
            fileInput.value = '';
            fileInput.click();
        });

        fileInput.addEventListener('change', function () {
            var file = this.files && this.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function (ev) {
                try {
                    var parsed = JSON.parse(ev.target.result);
                    var dataToInstall = null;
                    if (parsed && parsed.data && parsed.data.cultures !== undefined) {
                        dataToInstall = parsed.data;
                    } else if (parsed && parsed.cultures !== undefined) {
                        dataToInstall = parsed;
                    } else if (parsed && parsed.data) {
                        dataToInstall = parsed.data;
                    }
                    if (!dataToInstall) { window.alert('Unrecognized import format.'); return; }

                    if (typeof window.normalizeMasterData !== 'function') {
                        window.alert('Schema module not available; cannot import.'); return;
                    }

                    window.masterData = window.normalizeMasterData({
                        schemaVersion: window.STORAGE_SCHEMA_VERSION,
                        savedAt: new Date().toISOString(),
                        data: dataToInstall
                    });

                    if (typeof window.invalidateAccessorCaches === 'function') {
                        window.invalidateAccessorCaches();
                    }
                    if (typeof window.markDataDirty === 'function') window.markDataDirty();
                    if (typeof window.saveMasterData === 'function' && !window.saveMasterData()) {
                        window.alert('Save failed after import.'); return;
                    }

                    if (window.CultureBootstrap && typeof window.CultureBootstrap.init === 'function') {
                        try { window.CultureBootstrap.init(); } catch (e) {}
                    }
                    if (window.ReligionBootstrap && typeof window.ReligionBootstrap.init === 'function') {
                        try { window.ReligionBootstrap.init(); } catch (e) {}
                    }
                    if (window.LocationBootstrap && typeof window.LocationBootstrap.init === 'function') {
                        try { window.LocationBootstrap.init(); } catch (e) {}
                    }

                    selectedCultureId = null;
                    syncYearInput();
                    renderCultureList();
                    pickInitialSelection();
                    window.alert('Import complete.');
                } catch (err) {
                    window.alert('Invalid JSON: ' + err.message);
                }
            };
            reader.onerror = function () { window.alert('Failed to read file.'); };
            reader.readAsText(file);
            this.value = '';
        });
    }

    if (refreshBtn) {
        refreshBtn.addEventListener('click', function () {
            if (typeof window.loadMasterData === 'function') window.loadMasterData();
            setTimeout(function () {
                if (window.CultureBootstrap && typeof window.CultureBootstrap.init === 'function') {
                    try { window.CultureBootstrap.init(); } catch (e) {}
                }
                renderCultureList();
                if (selectedCultureId) renderActiveTab();
            }, 100);
        });
    }

    // =================================================================
    // Cross-tab reload
    // =================================================================
    window.addEventListener('masterDataUpdated', function () {
        renderCultureList();
        if (selectedCultureId) renderActiveTab();
    });

    // =================================================================
    // Utilities
    // =================================================================
    function escapeHtml(value) {
        if (typeof window.escapeHtml === 'function') return window.escapeHtml(value);
        if (value === null || value === undefined) return '';
        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    // =================================================================
    // Init
    // =================================================================
    function onDomReady(fn) {
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', fn);
        } else {
            fn();
        }
    }

    onDomReady(bootstrap);
})();
</script>

<!-- ================================================================
     THEME SWITCHER (matches LocationManager)
     ================================================================ -->
<script>
(function () {
    'use strict';
    var themeBtn = document.getElementById('themeBtn');
    var themeMenu = document.getElementById('themeMenu');
    var themeName = document.getElementById('themeName');
    var switcher = window.ThemeSwitcher;
    if (!switcher) return;

    function labelFor(id) {
        return id.charAt(0).toUpperCase() + id.slice(1).replace(/-/g, ' ');
    }
    function updateLabel(id) {
        if (themeName) themeName.textContent = labelFor(id);
    }
    function buildMenu() {
        var html = '';
        for (var i = 0; i < switcher.themes.length; i++) {
            var id = switcher.themes[i];
            html += '<li role="none"><button role="menuitem" type="button" data-theme-id="' +
                id + '">' + labelFor(id) + '</button></li>';
        }
        if (themeMenu) themeMenu.innerHTML = html;
    }
    function openMenu()  { if (!themeMenu) return; themeMenu.hidden = false; themeBtn.setAttribute('aria-expanded', 'true'); }
    function closeMenu() { if (!themeMenu) return; themeMenu.hidden = true; themeBtn.setAttribute('aria-expanded', 'false'); }

    if (themeBtn) themeBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        if (themeMenu.hidden) openMenu(); else closeMenu();
    });
    if (themeMenu) themeMenu.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-theme-id]');
        if (!btn) return;
        var id = btn.getAttribute('data-theme-id');
        switcher.apply(id); updateLabel(id); closeMenu();
    });
    document.addEventListener('click', function (e) {
        if (themeMenu && !themeMenu.hidden) {
            if (themeMenu.contains(e.target)) return;
            if (e.target === themeBtn) return;
            closeMenu();
        }
    });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && themeMenu && !themeMenu.hidden) closeMenu();
    });

    buildMenu();
    var saved = switcher.getSaved && switcher.getSaved();
    if (saved) updateLabel(saved);
})();
</script>

</body>
