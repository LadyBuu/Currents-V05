<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover" />
    <title>Culture Manager</title>
    <link rel="icon" href="data:," />

    <!--
      Theme bootstrap runs first, reading data-theme from localStorage.
      It writes data-theme to <html>. common.css styles against that.
      If your tree loads themes.css as a token source, add it here;
      otherwise common.css is the only stylesheet.
    -->
    <script src="js/core/theme-boot.js"></script>

    <link rel="stylesheet" href="css/common.css">

    <style>
        /* ============================================================
           Culture Manager — inline CSS
           Every class the four tabs emit is defined here.
           Structural layout uses common.css tokens.
           ============================================================ */

        html, body { height: 100%; margin: 0; overflow: hidden; }
        body {
            display: flex;
            flex-direction: column;
            background: var(--bg, #1a1a1a);
            color: var(--text, #e5e5e5);
            font-family: var(--f-body, system-ui, sans-serif);
            font-size: 16px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* ---- Topbar ---- */
        .topbar {
            position: relative;
            z-index: 100;
            flex-shrink: 0;
            background: var(--bg2, #222);
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border, #333);
            min-height: 48px;
            flex-wrap: wrap;
        }
        .topbar .title {
            font-family: var(--f-display, var(--f-body, system-ui));
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--accent, #7aa2f7);
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .topbar .title svg { width: 1em; height: 1em; fill: currentColor; }
        .topbar .spacer { flex: 1; min-width: 12px; }
        .topbar .burger-menu {
            display: none;
            align-items: center;
            justify-content: center;
            padding: 4px 10px;
            background: transparent;
            border: 1px solid var(--border, #333);
            border-radius: var(--radius, 4px);
            color: var(--text, #e5e5e5);
            cursor: pointer;
        }

        /* ---- Topbar buttons ---- */
        .tb-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 14px;
            background: var(--bg2, #222);
            border: 1px solid var(--border, #333);
            border-radius: var(--radius, 4px);
            color: var(--text, #e5e5e5);
            font-family: var(--f-body, system-ui);
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            line-height: 1.2;
        }
        .tb-btn svg { width: 0.9em; height: 0.9em; fill: currentColor; }
        .tb-btn:hover {
            border-color: var(--accent, #7aa2f7);
            background: var(--accent-dim, rgba(122, 162, 247, 0.1));
            color: var(--accent-light, #a8c1f8);
        }
        .tb-btn.primary {
            background: var(--accent, #7aa2f7);
            border-color: var(--accent, #7aa2f7);
            color: var(--accent-fg, #111);
        }
        .tb-btn.primary:hover { background: var(--accent-dark, #5a82d7); }
        .tb-btn:disabled { opacity: 0.45; cursor: not-allowed; }

        /* ---- Generic rt-btn (tabs use this) ---- */
        .rt-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 5px 12px;
            background: var(--bg3, #2a2a2a);
            border: 1px solid var(--border, #333);
            border-radius: var(--radius, 4px);
            color: var(--text, #e5e5e5);
            font-family: var(--f-body, system-ui);
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            line-height: 1.2;
        }
        .rt-btn:hover {
            border-color: var(--accent, #7aa2f7);
            color: var(--accent-light, #a8c1f8);
        }
        .rt-btn--primary {
            background: var(--accent, #7aa2f7);
            border-color: var(--accent, #7aa2f7);
            color: var(--accent-fg, #111);
        }
        .rt-btn--primary:hover { background: var(--accent-dark, #5a82d7); }
        .rt-btn--danger {
            border-color: var(--danger-lt, #f7768e);
            color: var(--danger-lt, #f7768e);
        }
        .rt-btn--danger:hover {
            background: var(--danger-soft, rgba(247, 118, 142, 0.1));
        }

        /* ---- Year input ---- */
        .year-input {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px;
            background: var(--bg, #1a1a1a);
            border: 1px solid var(--border, #333);
            border-radius: var(--radius, 4px);
            font-family: var(--f-body, system-ui);
            font-size: 0.7rem;
            line-height: 1.2;
        }
        .year-input label {
            font-family: var(--f-display, var(--f-body, system-ui));
            font-size: 0.55rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--dim, #888);
            white-space: nowrap;
        }
        .year-input input {
            width: 64px;
            padding: 3px 6px;
            background: transparent;
            border: 1px solid var(--border, #333);
            border-radius: 3px;
            color: var(--text, #e5e5e5);
            font-family: var(--f-mono, ui-monospace, monospace);
            font-size: 0.7rem;
            text-align: right;
        }
        .year-input input:focus {
            outline: none;
            border-color: var(--accent, #7aa2f7);
        }

        /* ---- Theme toggle ---- */
        .theme-toggle { position: relative; display: inline-flex; }
        .theme-toggle__menu {
            position: absolute;
            top: calc(100% + 4px);
            right: 0;
            z-index: 9999;
            min-width: 160px;
            max-height: 60vh;
            padding: 4px;
            margin: 0;
            list-style: none;
            background: var(--surface, var(--bg2, #222));
            border: 1px solid var(--border, #333);
            border-radius: var(--radius, 4px);
            overflow-y: auto;
        }
        .theme-toggle__menu[hidden] { display: none; }
        .theme-toggle__menu button {
            display: block;
            width: 100%;
            padding: 6px 12px;
            text-align: left;
            background: transparent;
            border: none;
            color: var(--text, #e5e5e5);
            font-family: var(--f-body, system-ui);
            font-size: 0.7rem;
            border-radius: 3px;
            cursor: pointer;
        }
        .theme-toggle__menu button:hover {
            background: var(--accent-dim, rgba(122, 162, 247, 0.1));
            color: var(--accent-light, #a8c1f8);
        }

        /* ---- App shell ---- */
        .app-layout {
            display: flex;
            flex-direction: row;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }
        .sidebar {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg2, #222);
            border-right: 1px solid var(--border, #333);
            width: 280px;
        }
        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border, #333);
            background: var(--bg3, #2a2a2a);
        }
        .sidebar-header h3 {
            margin: 0;
            font-family: var(--f-display, var(--f-body, system-ui));
            font-size: 0.65rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent, #7aa2f7);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sidebar-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            min-height: 0;
        }
        .main-panel {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
        }

        /* ---- Sub-tab strip ---- */
        .manager-subtabs {
            position: sticky;
            top: 0;
            display: flex;
            align-items: stretch;
            gap: 4px;
            padding: 8px 24px 0;
            margin: 0 0 20px;
            background: var(--bg2, #222);
            border-bottom: 1px solid var(--border, #333);
            flex-wrap: wrap;
            z-index: 10;
        }
        .manager-subtab {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 18px 11px;
            background: transparent;
            border: 1px solid transparent;
            border-bottom: none;
            border-radius: 6px 6px 0 0;
            color: var(--dim, #888);
            font-family: var(--f-display, var(--f-body, system-ui));
            font-size: 0.78rem;
            font-weight: 500;
            cursor: pointer;
        }
        .manager-subtab:hover {
            color: var(--accent-light, #a8c1f8);
            background: var(--accent-dim, rgba(122, 162, 247, 0.1));
        }
        .manager-subtab.active {
            color: var(--accent, #7aa2f7);
            background: var(--bg2, #222);
            border-color: var(--border, #333);
            font-weight: 600;
        }
        .manager-subtab-icon {
            display: inline-flex;
            width: 16px;
            height: 16px;
            align-items: center;
            justify-content: center;
            color: currentColor;
        }
        .manager-subtab-icon svg { width: 100%; height: 100%; fill: currentColor; }

        .tab-content-wrapper {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px 24px;
            background: var(--bg, #1a1a1a);
        }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        /* ============================================================
           SHARED — hint, empty, loading
           ============================================================ */
        .ct-hint {
            background: var(--bg2, #222);
            border-left: 3px solid var(--accent, #7aa2f7);
            padding: 10px 14px;
            margin-bottom: 16px;
            font-size: 0.7rem;
            color: var(--dim, #888);
            line-height: 1.55;
            border-radius: 0 4px 4px 0;
        }
        .ct-hint--footer { margin-top: 16px; margin-bottom: 0; }

        .ct-empty,
        .rt-empty {
            padding: 24px;
            text-align: center;
            color: var(--dim, #888);
            font-size: 0.8rem;
        }
        .ct-empty__sub,
        .rt-empty__sub {
            display: block;
            margin-top: 6px;
            font-size: 0.7rem;
            color: var(--dim, #888);
        }
        .rt-unavailable {
            padding: 24px;
            text-align: center;
            color: var(--danger-lt, #f7768e);
            font-size: 0.8rem;
        }
        .loading {
            padding: 24px;
            text-align: center;
            color: var(--dim, #888);
            font-size: 0.85rem;
        }

        /* ============================================================
           SHARED — cards, badges, form controls
           Used across all four tabs.
           ============================================================ */
        .ct-card {
            background: var(--bg2, #222);
            border: 1px solid var(--border, #333);
            border-radius: var(--radius, 4px);
            padding: 14px 16px;
            margin-bottom: 16px;
        }
        .ct-card__header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }
        .ct-card__title {
            font-family: var(--f-display, var(--f-body, system-ui));
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent-light, #a8c1f8);
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .ct-card__hint {
            font-family: var(--f-body, system-ui);
            font-size: 0.6rem;
            color: var(--dim, #888);
            font-weight: 400;
        }
        .ct-card__count {
            font-size: 0.65rem;
            color: var(--dim, #888);
            font-family: var(--f-mono, ui-monospace, monospace);
        }

        .ct-badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.6rem;
            font-family: var(--f-mono, ui-monospace, monospace);
            background: var(--accent-dim, rgba(122, 162, 247, 0.1));
            color: var(--accent-light, #a8c1f8);
            white-space: nowrap;
        }
        .ct-badge--muted { background: var(--bg3, #2a2a2a); color: var(--dim, #888); }
        .ct-badge--accent { background: var(--accent, #7aa2f7); color: var(--accent-fg, #111); }

        .ct-form__group { margin-bottom: 12px; }
        .ct-form__label {
            display: block;
            font-size: 0.65rem;
            color: var(--dim, #888);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 4px;
            font-family: var(--f-display, var(--f-body, system-ui));
        }
        .ct-form__input,
        .ct-form__select,
        .ct-form__textarea {
            width: 100%;
            padding: 6px 10px;
            background: var(--bg, #1a1a1a);
            border: 1px solid var(--border, #333);
            border-radius: var(--radius, 4px);
            color: var(--text, #e5e5e5);
            font-family: var(--f-body, system-ui);
            font-size: 0.75rem;
            box-sizing: border-box;
        }
        .ct-form__textarea {
            font-family: var(--f-mono, ui-monospace, monospace);
            font-size: 0.72rem;
            resize: vertical;
        }
        .ct-form__input:focus,
        .ct-form__select:focus,
        .ct-form__textarea:focus {
            outline: none;
            border-color: var(--accent, #7aa2f7);
        }

        .ct-hint {
            font-size: 0.7rem;
            color: var(--dim, #888);
            line-height: 1.55;
            margin-bottom: 12px;
            padding: 8px 12px;
            background: var(--bg2, #222);
            border-left: 3px solid var(--accent, #7aa2f7);
            border-radius: 0 4px 4px 0;
        }
        .ct-hint--footer { margin-top: 12px; margin-bottom: 0; }

        .ct-search input {
            width: 100%;
            padding: 6px 10px;
            background: var(--bg, #1a1a1a);
            border: 1px solid var(--border, #333);
            border-radius: var(--radius, 4px);
            color: var(--text, #e5e5e5);
            font-family: var(--f-body, system-ui);
            font-size: 0.75rem;
            box-sizing: border-box;
        }
        .ct-search input:focus {
            outline: none;
            border-color: var(--accent, #7aa2f7);
        }

        .ct-details__list {
            margin: 6px 0 0;
            padding-left: 18px;
            font-size: 0.75rem;
            color: var(--text, #e5e5e5);
            line-height: 1.6;
        }

        /* ============================================================
           APPEARANCE TAB
           ============================================================ */
        .ct-appearance { width: 100%; }
        .ct-appearance__grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }
        .ct-appearance-card { margin-bottom: 0; }
        .ct-appearance-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 10px;
            max-height: 320px;
            overflow-y: auto;
        }
        .ct-appearance-empty {
            padding: 12px;
            text-align: center;
            color: var(--dim, #888);
            font-size: 0.7rem;
            font-style: italic;
        }
        .ct-appearance-row {
            display: grid;
            grid-template-columns: 1fr 70px auto auto;
            gap: 6px;
            align-items: center;
        }
        .ct-appearance-row__value,
        .ct-appearance-row__weight {
            padding: 5px 8px;
            background: var(--bg, #1a1a1a);
            border: 1px solid var(--border, #333);
            border-radius: var(--radius, 4px);
            color: var(--text, #e5e5e5);
            font-family: var(--f-body, system-ui);
            font-size: 0.72rem;
            box-sizing: border-box;
            width: 100%;
        }
        .ct-appearance-row__weight {
            font-family: var(--f-mono, ui-monospace, monospace);
            text-align: right;
        }
        .ct-appearance-row__value:focus,
        .ct-appearance-row__weight:focus {
            outline: none;
            border-color: var(--accent, #7aa2f7);
        }
        .ct-appearance-row__weight-label {
            font-size: 0.6rem;
            color: var(--dim, #888);
        }
        .ct-appearance-add {
            width: 100%;
            padding: 6px 10px;
            background: var(--bg3, #2a2a2a);
            border: 1px dashed var(--border, #333);
            border-radius: var(--radius, 4px);
            color: var(--dim, #888);
            font-family: var(--f-body, system-ui);
            font-size: 0.7rem;
            cursor: pointer;
        }
        .ct-appearance-add:hover {
            color: var(--accent, #7aa2f7);
            border-color: var(--accent, #7aa2f7);
        }
        .ct-appearance-count {
            font-size: 0.65rem;
            color: var(--dim, #888);
            font-family: var(--f-mono, ui-monospace, monospace);
        }

        .ct-appearance-height { grid-column: 1 / -1; }
        .ct-appearance-height-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .ct-appearance-height-group { display: flex; flex-direction: column; gap: 4px; }
        .ct-appearance-height-label {
            font-size: 0.65rem;
            color: var(--dim, #888);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-family: var(--f-display, var(--f-body, system-ui));
        }
        .ct-appearance-height-inputs {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .ct-appearance-height-inputs input {
            flex: 1;
            padding: 5px 8px;
            background: var(--bg, #1a1a1a);
            border: 1px solid var(--border, #333);
            border-radius: var(--radius, 4px);
            color: var(--text, #e5e5e5);
            font-family: var(--f-mono, ui-monospace, monospace);
            font-size: 0.72rem;
            text-align: right;
            width: 70px;
            box-sizing: border-box;
        }
        .ct-appearance-height-inputs input:focus {
            outline: none;
            border-color: var(--accent, #7aa2f7);
        }
        .ct-appearance-height-sep {
            color: var(--dim, #888);
            font-size: 0.7rem;
        }
        .ct-appearance-height-unit {
            color: var(--dim, #888);
            font-size: 0.65rem;
            font-family: var(--f-mono, ui-monospace, monospace);
        }

        /* ============================================================
           MYTHOLOGY TAB
           ============================================================ */
        .ct-mythology { width: 100%; }
        .ct-mythology__overview {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: var(--bg2, #222);
            border: 1px solid var(--border, #333);
            border-radius: var(--radius, 4px);
            margin-bottom: 16px;
        }
        .ct-mythology__overview-label {
            font-family: var(--f-display, var(--f-body, system-ui));
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--accent, #7aa2f7);
            font-weight: 600;
        }
        .ct-mythology__overview-summary {
            font-size: 0.72rem;
            color: var(--dim, #888);
        }
        .ct-mythology__text-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }
        .ct-mythology__list-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
        }
        .ct-mythology-textarea {
            width: 100%;
            padding: 8px 10px;
            background: var(--bg, #1a1a1a);
            border: 1px solid var(--border, #333);
            border-radius: var(--radius, 4px);
            color: var(--text, #e5e5e5);
            font-family: var(--f-body, system-ui);
            font-size: 0.75rem;
            line-height: 1.55;
            resize: vertical;
            box-sizing: border-box;
        }
        .ct-mythology-textarea:focus {
            outline: none;
            border-color: var(--accent, #7aa2f7);
        }
        .ct-mythology-wordcount,
        .ct-mythology-count {
            font-size: 0.6rem;
            color: var(--dim, #888);
            font-family: var(--f-mono, ui-monospace, monospace);
        }
        .ct-mythology-tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            min-height: 36px;
            padding: 8px;
            background: var(--bg, #1a1a1a);
            border: 1px solid var(--border, #333);
            border-radius: var(--radius, 4px);
            margin-bottom: 10px;
        }
        .ct-mythology-empty {
            color: var(--dim, #888);
            font-size: 0.7rem;
            font-style: italic;
            align-self: center;
        }
        .ct-mythology-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 4px 3px 10px;
            background: var(--accent-dim, rgba(122, 162, 247, 0.15));
            color: var(--accent-light, #a8c1f8);
            border-radius: 12px;
            font-size: 0.7rem;
        }
        .ct-mythology-tag__label { padding: 1px 0; }
        .ct-mythology-tag__remove {
            background: transparent;
            border: none;
            color: inherit;
            padding: 0 6px;
            font-size: 0.65rem;
            cursor: pointer;
            opacity: 0.7;
        }
        .ct-mythology-tag__remove:hover { opacity: 1; color: var(--danger-lt, #f7768e); }
        .ct-mythology-add-row {
            display: flex;
            gap: 6px;
        }
        .ct-mythology-add-input {
            flex: 1;
            padding: 6px 10px;
            background: var(--bg, #1a1a1a);
            border: 1px solid var(--border, #333);
            border-radius: var(--radius, 4px);
            color: var(--text, #e5e5e5);
            font-family: var(--f-body, system-ui);
            font-size: 0.72rem;
            box-sizing: border-box;
        }
        .ct-mythology-add-input:focus {
            outline: none;
            border-color: var(--accent, #7aa2f7);
        }

        /* ============================================================
           CHARACTERS TAB
           ============================================================ */
        .ct-characters { width: 100%; }
        .ct-characters__header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;

        .ct-characters__filters select {
            padding: 6px 10px;
            background: var(--bg, #1a1a1a);
            border: 1px solid var(--border, #333);
            border-radius: var(--radius, 4px);
            color: var(--text, #e5e5e5);
            font-family: var(--f-body, system-ui);

        .ct-characters__list {

            flex-direction: column;

        .ct-character-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: var(--bg2, #222);
            border: 1px solid var(--border, #333);
            border-left: 3px solid var(--accent, #7aa2f7);
            border-radius: var(--radius, 4px);
        }
        .ct-character-row--deceased {
            border-left-color: var(--danger-lt, #f7768e);
            opacity: 0.75;
        }
        .ct-character-row__body { flex: 1; min-width: 0; }
        .ct-character-row__top {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 4px;

        .ct-character-row__name {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text, #e5e5e5);

        .ct-character-row__meta {
            font-size: 0.65rem;
            color: var(--dim, #888);
        }
        .ct-character-row__sub {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 0.65rem;
            color: var(--dim, #888);

        .ct-character-row__appearance {
            color: var(--accent-light, #a8c1f8);

        .ct-character-row__appearance--none { color: var(--dim, #888); font-style: italic; }

            display: flex;
            gap: 6px;
            flex-shrink: 0;

        .ct-badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.6rem;
            font-family: var(--f-mono, ui-monospace, monospace);
            background: var(--accent-dim, rgba(122, 162, 247, 0.1));
            color: var(--accent-light, #a8c1f8);
            white-space: nowrap;
        }
        .ct-badge--muted { background: var(--bg3, #2a2a2a); color: var(--dim, #888); }
        .ct-badge--accent { background: var(--accent, #7aa2f7); color: var(--accent-fg, #111); }
        .ct-clear {
            padding: 6px 12px;
            background: transparent;
            border: 1px solid var(--border, #333);
            border-radius: var(--radius, 4px);
            color: var(--dim, #888);
            font-family: var(--f-body, system-ui);
            font-size: 0.72rem;
            cursor: pointer;
        }
        .ct-clear:hover { color: var(--text, #e5e5e5); border-color: var(--accent, #7aa2f7); }

        /* ============================================================
           NAMES TAB
           ============================================================ */
        .ct-names { width: 100%; }
        .ct-names__cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }
        .ct-names__card {
            background: var(--bg2, #222);
            border: 1px solid var(--border, #333);
            border-radius: var(--radius, 4px);
            padding: 14px 16px;
        }
        .ct-names__card--rules {
            grid-column: 1 / -1;
        }
        .ct-names__card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }
        .ct-names__card-title {
            font-family: var(--f-display, var(--f-body, system-ui));
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent-light, #a8c1f8);
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .ct-names__card-hint {
            font-family: var(--f-body, system-ui);
            font-size: 0.6rem;
            color: var(--dim, #888);
            font-weight: 400;
        }
        .ct-names__card-count {
            font-size: 0.65rem;
            color: var(--dim, #888);
            font-family: var(--f-mono, ui-monospace, monospace);
            white-space: nowrap;
        }
        .ct-names__field-label {
            font-size: 0.6rem;
            color: var(--dim, #888);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin: 8px 0 4px;
            font-family: var(--f-display, var(--f-body, system-ui));
        }
        .ct-names__textarea {
            width: 100%;
            padding: 8px 10px;
            background: var(--bg, #1a1a1a);
            border: 1px solid var(--border, #333);
            border-radius: var(--radius, 4px);
            color: var(--text, #e5e5e5);
            font-family: var(--f-mono, ui-monospace, monospace);
            font-size: 0.72rem;
            line-height: 1.5;
            resize: vertical;
            box-sizing: border-box;
        }
        .ct-names__textarea:focus {
            outline: none;
            border-color: var(--accent, #7aa2f7);
        }
        .ct-names__bulk-actions {
            display: flex;
            gap: 6px;
            margin: 8px 0 12px;
            flex-wrap: wrap;
        }
        .ct-names__chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            min-height: 36px;
            padding: 8px;
            background: var(--bg, #1a1a1a);
            border: 1px solid var(--border, #333);
            border-radius: var(--radius, 4px);
            margin-bottom: 10px;
        }
        .ct-names__chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 4px 3px 10px;
            background: var(--accent-dim, rgba(122, 162, 247, 0.15));
            color: var(--accent-light, #a8c1f8);
            border-radius: 12px;
            font-size: 0.7rem;
        }
        .ct-names__chip-label { padding: 1px 0; }
        .ct-names__chip-remove {
            background: transparent;
            border: none;
            color: inherit;
            padding: 0 6px;
            font-size: 0.7rem;
            cursor: pointer;
            opacity: 0.7;
        }
        .ct-names__chip-remove:hover {
            opacity: 1;
            color: var(--danger-lt, #f7768e);
        }
        .ct-names__empty {
            color: var(--dim, #888);
            font-size: 0.7rem;
            font-style: italic;
            align-self: center;
        }
        .ct-names__add-row {
            display: flex;
            gap: 6px;
        }
        .ct-names__add-input {
            flex: 1;
            padding: 6px 10px;
            background: var(--bg, #1a1a1a);
            border: 1px solid var(--border, #333);
            border-radius: var(--radius, 4px);
            color: var(--text, #e5e5e5);
            font-family: var(--f-body, system-ui);
            font-size: 0.72rem;
            box-sizing: border-box;
        }
        .ct-names__add-input:focus {
            outline: none;
            border-color: var(--accent, #7aa2f7);
        }

        .ct-names__form-row {
            display: grid;
            grid-template-columns: 180px 1fr;
            gap: 10px;
            align-items: center;
            margin-bottom: 8px;
        }
        .ct-names__form-label {
            font-size: 0.65rem;
            color: var(--dim, #888);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-family: var(--f-display, var(--f-body, system-ui));
        }
        .ct-names__form-input,
        .ct-names__form-select {
            padding: 6px 10px;
            background: var(--bg, #1a1a1a);
            border: 1px solid var(--border, #333);
            border-radius: var(--radius, 4px);
            color: var(--text, #e5e5e5);
            font-family: var(--f-body, system-ui);
            font-size: 0.75rem;
            box-sizing: border-box;
            width: 100%;
        }
        .ct-names__form-input:focus,
        .ct-names__form-select:focus {
            outline: none;
            border-color: var(--accent, #7aa2f7);
        }
        .ct-names__form-hint {
            font-size: 0.65rem;
            color: var(--dim, #888);
            margin: 4px 0 8px;
            line-height: 1.5;
        }
        .ct-names__rules-section { margin: 12px 0; }
        .ct-names__rules-section[hidden] { display: none; }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 768px) {
            .topbar .burger-menu { display: inline-flex; }
            .topbar { padding: 6px 10px; gap: 6px; min-height: 42px; }
            .topbar .title { font-size: 0.75rem; }
            .topbar .tb-btn { padding: 3px 10px; font-size: 0.65rem; }
            .year-input { padding: 2px 6px; }
            .year-input label { display: none; }
            .year-input input { width: 52px; font-size: 0.65rem; }
            .app-layout { flex-direction: column; }
            .sidebar {
                position: fixed;
                top: 0; bottom: 0; left: 0;
                height: 100vh;
                width: 85%;
                max-width: 280px;
                z-index: 1000;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }
            .sidebar.visible { transform: translateX(0); }
            .tab-content-wrapper { padding: 16px; }
            .manager-subtabs { padding-left: 16px; padding-right: 16px; }
            .manager-subtab { flex: 1 1 auto; min-width: 0; padding: 10px 14px; font-size: 0.72rem; }
            .ct-names__form-row { grid-template-columns: 1fr; }
            .ct-appearance__grid { grid-template-columns: 1fr; }
            .ct-mythology__list-grid { grid-template-columns: 1fr; }
        }

        /* ---- Sidebar overlay ---- */
        .sidebar-overlay { display: none; }
        .sidebar-overlay.active {
            display: block;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 999;
        }
    </style>
</head>

<div class="topbar">
    <button id="menuToggle" class="burger-menu" type="button" aria-label="Toggle menu">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
    </button>
    <div class="title" id="cultureManagerTitle">Culture Manager</div>
    <div class="spacer"></div>

    <button id="createCultureBtn" class="tb-btn primary" type="button">+ Culture</button>
    <button id="editCultureBtn" class="tb-btn" type="button" disabled>Edit</button>
    <button id="deleteCultureBtn" class="tb-btn" type="button" disabled>Delete</button>

    <div class="year-input">
        <label for="yearInput">Year</label>
        <input type="number" id="yearInput" min="1" step="1">
        <button id="setYearBtn" class="tb-btn" type="button">Set</button>
    </div>

    <button id="importBtn" class="tb-btn" type="button">Import</button>
    <button id="exportBtn" class="tb-btn" type="button">Export</button>
    <button id="refreshBtn" class="tb-btn" type="button">Refresh</button>

    <input type="file" id="fileInput" accept=".json" style="display:none;" />

    <div class="theme-toggle" role="group" aria-label="Theme">
        <button class="tb-btn theme-toggle__btn" id="themeBtn" type="button" aria-haspopup="menu" aria-expanded="false">
            <span aria-hidden="true">◐</span>
            <span id="themeName">Dark</span>
        </button>
        <ul class="theme-toggle__menu" id="themeMenu" role="menu" hidden></ul>
    </div>
</div>

<div class="app-layout">
    <div class="sidebar" id="cultureSidebar">
        <div class="sidebar-header"><h3 id="sidebarTitle">Cultures</h3></div>
        <div class="sidebar-list" id="cultureListContainer">
            <div class="loading">Loading cultures…</div>
        </div>
    </div>
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <div class="main-panel">
        <div class="manager-subtabs" id="panelSubtabs" role="tablist">
            <button class="manager-subtab active" role="tab" type="button" data-tab="details" aria-selected="true" tabindex="0">
                <span class="manager-subtab-icon" data-icon="CIRCLE_DOT" aria-hidden="true"></span>
                <span>Details</span>
            </button>
            <button class="manager-subtab" role="tab" type="button" data-tab="appearance" aria-selected="false" tabindex="-1">
                <span class="manager-subtab-icon" data-icon="PERSON" aria-hidden="true"></span>
                <span>Appearance</span>
            </button>
            <button class="manager-subtab" role="tab" type="button" data-tab="mythology" aria-selected="false" tabindex="-1">
                <span class="manager-subtab-icon" data-icon="BOOK" aria-hidden="true"></span>
                <span>Mythology</span>
            </button>
            <button class="manager-subtab" role="tab" type="button" data-tab="characters" aria-selected="false" tabindex="-1">
                <span class="manager-subtab-icon" data-icon="PERSON" aria-hidden="true"></span>
                <span>Characters</span>
            </button>
            <button class="manager-subtab" role="tab" type="button" data-tab="names" aria-selected="false" tabindex="-1">
                <span class="manager-subtab-icon" data-icon="BOOK" aria-hidden="true"></span>
                <span>Names</span>
            </button>
        </div>

        <div class="tab-content-wrapper" id="tabContent" role="tabpanel">
            <div class="tab-pane active" id="tab-details"    data-tab-content="details"></div>
            <div class="tab-pane"        id="tab-appearance" data-tab-content="appearance"></div>
            <div class="tab-pane"        id="tab-mythology"  data-tab-content="mythology"></div>
            <div class="tab-pane"        id="tab-characters" data-tab-content="characters"></div>
            <div class="tab-pane"        id="tab-names"      data-tab-content="names"></div>
        </div>
    </div>
</div>

<!-- Culture editor + tabs -->
<script src="js/tabs/culture-editor-tab.js"></script>
<script src="js/tabs/culture-appearance-tab.js"></script>
<script src="js/tabs/culture-mythology-tab.js"></script>
<script src="js/tabs/culture-characters-tab.js"></script>
<script src="js/tabs/culture-names-tab.js"></script>

<!-- ================================================================
     ORCHESTRATOR
     ================================================================ -->
<script>
(function () {
    'use strict';

    var cultureContainer = document.getElementById('cultureListContainer');
    var sidebar          = document.getElementById('cultureSidebar');
    var sidebarOverlay   = document.getElementById('sidebarOverlay');
    var menuToggle       = document.getElementById('menuToggle');
    var yearInput        = document.getElementById('yearInput');
    var setYearBtn       = document.getElementById('setYearBtn');
    var exportBtn        = document.getElementById('exportBtn');
    var importBtn        = document.getElementById('importBtn');
    var fileInput        = document.getElementById('fileInput');
    var createCultureBtn = document.getElementById('createCultureBtn');
    var editCultureBtn   = document.getElementById('editCultureBtn');
    var deleteCultureBtn = document.getElementById('deleteCultureBtn');
    var refreshBtn       = document.getElementById('refreshBtn');

    var tabButtons = Array.prototype.slice.call(
        document.querySelectorAll('.manager-subtabs .manager-subtab')
    );

    var selectedCultureId = null;
    var activeTabId        = 'details';
    var isInitialized      = false;

    function bootstrap() {
        if (isInitialized) return;
        isInitialized = true;

        if (typeof window.loadMasterData === 'function') {
            try { window.loadMasterData(); }
            catch (e) { console.error('[culture-manager] loadMasterData failed:', e); }
        }

        if (window.RankBootstrap && typeof window.RankBootstrap.init === 'function') {
            try { window.RankBootstrap.init(); } catch (e) { console.error(e); }
        }
        if (window.ReligionBootstrap && typeof window.ReligionBootstrap.init === 'function') {
            try { window.ReligionBootstrap.init(); } catch (e) { console.error(e); }
        }
        if (window.LocationBootstrap && typeof window.LocationBootstrap.init === 'function') {
            try { window.LocationBootstrap.init(); } catch (e) { console.error(e); }
        }
        if (window.CultureBootstrap && typeof window.CultureBootstrap.init === 'function') {
            try { window.CultureBootstrap.init(); } catch (e) { console.error(e); }
        }

        injectIcons();
        syncYearInput();
        renderCultureList();
        pickInitialSelection();
        syncTabButtons(activeTabId);
    }

    function injectIcons() {
        if (typeof window.Icons === 'undefined') {
            setTimeout(injectIcons, 100);
            return;
        }
        var nodes = document.querySelectorAll('[data-icon]');
        for (var i = 0; i < nodes.length; i++) {
            var node = nodes[i];
            var name = node.getAttribute('data-icon');
            var svg = window.Icons[name] || window.Icons.CIRCLE || '';
            node.innerHTML = svg;
        }
    }

    function renderCultureList() {
        if (!cultureContainer) return;

        var UI = window.CultureUI || window.CultureUIList;
        var Queries = window.CultureQueries;
        var cultures = [];
        try {
            cultures = Queries ? Queries.getAllCultures() : [];
        } catch (e) { cultures = []; }

        if (UI && typeof UI.renderCultureList === 'function') {
            try {
                UI.renderCultureList(cultureContainer, {
                    cultures: cultures,
                    selectedId: selectedCultureId,
                    onSelect: function (culture) {
                        if (culture && culture.id) selectCulture(culture.id);
                    }
                });
                return;
            } catch (e) { console.error(e); }
        }
        renderCultureListFallback(cultures);
    }

    function renderCultureListFallback(cultures) {
        if (!cultureContainer) return;
        if (!cultures || cultures.length === 0) {
            cultureContainer.innerHTML =
                '<div class="ct-empty">' +
                '<div>No cultures found</div>' +
                '<div class="ct-empty__sub">Click "+ Culture" to add one</div>' +
                '</div>';
            return;
        }
        var html = '';
        for (var i = 0; i < cultures.length; i++) {
            var c = cultures[i];
            var sel = c.id === selectedCultureId ? ' is-selected' : '';
            html += '<div class="culture-row' + sel + '" data-culture-id="' + c.id + '"' +
                ' style="padding:8px;border-radius:4px;cursor:pointer;margin:2px 0;background:' +
                (sel ? 'var(--accent-dim)' : 'transparent') + ';">' +
                '<div style="font-size:0.78rem;color:var(--text)">' +
                escapeHtml(c.displayName || c.name) + '</div>' +
                '</div>';
        }
        cultureContainer.innerHTML = html;
        var rows = cultureContainer.querySelectorAll('[data-culture-id]');
        for (var j = 0; j < rows.length; j++) {
            (function (row) {
                row.addEventListener('click', function () {
                    var id = row.getAttribute('data-culture-id');
                    if (id) selectCulture(id);
                });
            })(rows[j]);
        }
    }

    function pickInitialSelection() {
        if (selectedCultureId) return;
        var cultures = [];
        try {
            cultures = window.CultureQueries
                ? window.CultureQueries.getAllCultures()
                : [];
        } catch (e) { /* ignore */ }
        if (cultures && cultures.length > 0) {
            selectCulture(cultures[0].id);
        }
    }

    function selectCulture(id) {
        if (!id) return;
        selectedCultureId = id;
        if (editCultureBtn) editCultureBtn.disabled = false;
        if (deleteCultureBtn) deleteCultureBtn.disabled = false;
        renderCultureList();
        renderActiveTab();
        if (window.innerWidth <= 768) closeSidebar();
    }

    function activateTab(tabId) {
        activeTabId = tabId;
        syncTabButtons(tabId);
        renderActiveTab();
    }

    function syncTabButtons(tabId) {
        for (var i = 0; i < tabButtons.length; i++) {
            var btn = tabButtons[i];
            var isActive = btn.dataset.tab === tabId;
            btn.classList.toggle('active', isActive);
            btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
            btn.setAttribute('tabindex', isActive ? '0' : '-1');
        }
        var panes = document.querySelectorAll('#tabContent .tab-pane');
        for (var j = 0; j < panes.length; j++) {
            panes[j].classList.toggle(
                'active',
                panes[j].getAttribute('data-tab-content') === tabId
            );
        }
    }

    for (var i = 0; i < tabButtons.length; i++) {
        (function (btn) {
            btn.addEventListener('click', function () {
                activateTab(btn.dataset.tab);
            });
        })(tabButtons[i]);
    }

    function renderActiveTab() {
        var container = document.getElementById('tab-' + activeTabId);
        if (!container) return;

        if (!selectedCultureId) {
            setEmptyState(container, 'Select a culture from the sidebar');
            return;
        }

        var culture = null;
        try {
            culture = window.CultureQueries
                ? window.CultureQueries.getCultureById(selectedCultureId)
                : null;
        } catch (e) { /* ignore */ }
        if (!culture) {
            setEmptyState(container, 'Culture not found');
            return;
        }

        // Render the tab's real content, not a preview.
        // The CultureEditorTabs registry holds the render functions;
        // we call them directly against the tab pane.
        var tab = _getRegisteredTab(activeTabId);
        if (tab && typeof tab.render === 'function') {
            try { tab.render(container, culture); }
            catch (e) {
                container.innerHTML =
                    '<div class="rt-unavailable">' +
                    'Error rendering tab: ' + escapeHtml(e.message || 'unknown') +
                    '</div>';
                console.error('[culture-manager] tab render threw:', e);
            }
            return;
        }

        // Fall back to details if the tab isn't registered.
        if (activeTabId === 'details') {
            renderDetailsView(container, culture);
        } else {
            setEmptyState(container, 'Tab not available.');
        }
    }

    function _getRegisteredTab(tabId) {
        // CultureEditorTabs exposes the registry but not the render fns.
        // The tab files expose their tab objects directly on window
        // (AppearanceTab, MythologyTab, etc.) and also register them.
        // We prefer the window globals so the manager can call render
        // without opening the editor modal.
        if (tabId === 'appearance' && window.AppearanceTab) return window.AppearanceTab;
        if (tabId === 'mythology' && window.MythologyTab) return window.MythologyTab;
        if (tabId === 'characters' && window.CharactersTab) return window.CharactersTab;
        if (tabId === 'names' && window.CultureNamesTab) return window.CultureNamesTab;
        return null;
    }

    function renderDetailsView(container, culture) {
        var desc = culture.description
            ? '<p class="ct-hint">' + escapeHtml(culture.description) + '</p>'
            : '';
        var notes = culture.notes
            ? '<p class="ct-hint">' + escapeHtml(culture.notes) + '</p>'
            : '';
        var stats = '<div class="ct-card"><div class="ct-card__header">' +
            '<div class="ct-card__title">' + escapeHtml(culture.displayName || culture.name) + '</div>' +
            '</div>' + desc + notes +
            '<button type="button" class="rt-btn rt-btn--primary" id="ct_details_edit">Edit Details</button>' +
            '</div>';
        container.innerHTML = stats;
        var btn = container.querySelector('#ct_details_edit');
        if (btn) btn.addEventListener('click', function () { openEditCulture(culture.id); });
    }

    function setEmptyState(container, message) {
        container.innerHTML = '<div class="ct-empty">' + escapeHtml(message) + '</div>';
    }

    function openCreateCulture() {
        if (typeof window.openCreateCultureModal !== 'function') {
            window.alert('Create Culture modal not loaded.');
            return;
        }
        window.openCreateCultureModal({
            onSuccess: function (newCulture) {
                renderCultureList();
                if (newCulture && newCulture.id) selectCulture(newCulture.id);
            }
        });
    }

    function openEditCulture(id) {
        if (typeof window.openEditCultureModal !== 'function') {
            window.alert('Edit Culture modal not loaded.');
            return;
        }
        window.openEditCultureModal(id, {
            onSuccess: function () {
                renderCultureList();
                renderActiveTab();
            }
        });
    }

    function openDeleteCulture(id) {
        if (typeof window.openDeleteCultureModal !== 'function') {
            window.alert('Delete Culture modal not loaded.');
            return;
        }
        window.openDeleteCultureModal(id, {
            onSuccess: function () {
                if (selectedCultureId === id) {
                    selectedCultureId = null;
                    if (editCultureBtn) editCultureBtn.disabled = true;
                    if (deleteCultureBtn) deleteCultureBtn.disabled = true;
                }
                renderCultureList();
                pickInitialSelection();
            }
        });
    }

    if (createCultureBtn) createCultureBtn.addEventListener('click', openCreateCulture);
    if (editCultureBtn) editCultureBtn.addEventListener('click', function () {
        if (selectedCultureId) openEditCulture(selectedCultureId);
    });
    if (deleteCultureBtn) deleteCultureBtn.addEventListener('click', function () {
        if (selectedCultureId) openDeleteCulture(selectedCultureId);
    });

    function openSidebar() {
        if (sidebar) sidebar.classList.add('visible');
        if (sidebarOverlay) sidebarOverlay.classList.add('active');
    }
    function closeSidebar() {
        if (sidebar) sidebar.classList.remove('visible');
        if (sidebarOverlay) sidebarOverlay.classList.remove('active');
    }
    function toggleSidebar() {
        if (!sidebar) return;
        if (sidebar.classList.contains('visible')) closeSidebar();
        else openSidebar();
    }
    if (menuToggle) menuToggle.addEventListener('click', toggleSidebar);
    if (sidebarOverlay) sidebarOverlay.addEventListener('click', closeSidebar);
    window.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeSidebar();
    });

    function syncYearInput() {
        if (!yearInput) return;
        try {
            var y = (typeof window.getCurrentYear === 'function')
                ? window.getCurrentYear()
                : (window.masterData && window.masterData.data
                    ? window.masterData.data.currentYear
                    : null);
            if (typeof y === 'number' && isFinite(y)) {
                yearInput.value = String(y);
            }
        } catch (e) { /* ignore */ }
    }
    if (setYearBtn) setYearBtn.addEventListener('click', function () {
        var val = parseInt(yearInput.value, 10);
        if (!isFinite(val)) { window.alert('Enter a valid year.'); return; }
        if (typeof window.setCurrentYear === 'function') {
            try {
                if (window.setCurrentYear(val) === false) {
                    window.alert('Could not set year.'); return;
                }
            } catch (e) { window.alert('Set year failed.'); return; }
        } else if (window.masterData && window.masterData.data) {
            window.masterData.data.currentYear = val;
            if (typeof window.markDataDirty === 'function') window.markDataDirty();
            if (typeof window.saveMasterData === 'function') window.saveMasterData();
        }
        syncYearInput();
        renderActiveTab();
    });

    if (exportBtn) exportBtn.addEventListener('click', function () {
        if (typeof window.exportData === 'function') { window.exportData(); return; }
        if (typeof window.exportToJSON === 'function' && window.masterData) {
            window.exportToJSON(window.masterData, 'stillwaters'); return;
        }
        window.alert('Export module not available.');
    });

    if (importBtn && fileInput) {
        importBtn.addEventListener('click', function () { fileInput.value = ''; fileInput.click(); });
        fileInput.addEventListener('change', function () {
            var file = this.files && this.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function (ev) {
                try {
                    var parsed = JSON.parse(ev.target.result);
                    var dataToInstall = null;
                    if (parsed && parsed.data && parsed.data.cultures !== undefined) dataToInstall = parsed.data;
                    else if (parsed && parsed.cultures !== undefined) dataToInstall = parsed;
                    else if (parsed && parsed.data) dataToInstall = parsed.data;
                    if (!dataToInstall) { window.alert('Unrecognized import format.'); return; }

                    if (typeof window.normalizeMasterData !== 'function') {
                        window.alert('Schema module not available; cannot import.'); return;
                    }
                    window.masterData = window.normalizeMasterData({
                        schemaVersion: window.STORAGE_SCHEMA_VERSION,
                        savedAt: new Date().toISOString(),
                        data: dataToInstall
                    });
                    if (typeof window.invalidateAccessorCaches === 'function') window.invalidateAccessorCaches();
                    if (typeof window.markDataDirty === 'function') window.markDataDirty();
                    if (typeof window.saveMasterData === 'function' && !window.saveMasterData()) {
                        window.alert('Save failed after import.'); return;
                    }
                    if (window.CultureBootstrap) window.CultureBootstrap.init();
                    if (window.ReligionBootstrap) window.ReligionBootstrap.init();
                    if (window.LocationBootstrap) window.LocationBootstrap.init();
                    if (window.NamesState && window.NamesState.clearAllCaches) window.NamesState.clearAllCaches();

                    selectedCultureId = null;
                    syncYearInput();
                    renderCultureList();
                    pickInitialSelection();
                    window.alert('Import complete.');
                } catch (err) {
                    window.alert('Invalid JSON: ' + err.message);
                }
            };
            reader.readAsText(file);
            this.value = '';
        });
    }

    if (refreshBtn) refreshBtn.addEventListener('click', function () {
        if (typeof window.loadMasterData === 'function') window.loadMasterData();
        if (window.NamesState && window.NamesState.clearAllCaches) window.NamesState.clearAllCaches();
        setTimeout(function () {
            if (window.CultureBootstrap) window.CultureBootstrap.init();
            renderCultureList();
            if (selectedCultureId) renderActiveTab();
        }, 100);
    });

    window.addEventListener('masterDataUpdated', function () {
        if (window.NamesState && window.NamesState.clearAllCaches) window.NamesState.clearAllCaches();
        renderCultureList();
        if (selectedCultureId) renderActiveTab();
    });

    function escapeHtml(value) {
        if (typeof window.escapeHtml === 'function') return window.escapeHtml(value);
        if (value === null || value === undefined) return '';
        return String(value)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function onDomReady(fn) {
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn);
        else fn();
    }
    onDomReady(bootstrap);
})();
</script>

<!-- ================================================================
     THEME SWITCHER
     ================================================================ -->
<script>
(function () {
    'use strict';
    var themeBtn = document.getElementById('themeBtn');
    var themeMenu = document.getElementById('themeMenu');
    var themeName = document.getElementById('themeName');
    var switcher = window.ThemeSwitcher;
    if (!switcher) return;

    function labelFor(id) {
        return id.charAt(0).toUpperCase() + id.slice(1).replace(/-/g, ' ');
    }
    function updateLabel(id) {
        if (themeName) themeName.textContent = labelFor(id);
    }
    function buildMenu() {
        var html = '';
        for (var i = 0; i < switcher.themes.length; i++) {
            var id = switcher.themes[i];
            html += '<li role="none"><button role="menuitem" type="button" data-theme-id="' +
                id + '">' + labelFor(id) + '</button></li>';
        }
        if (themeMenu) themeMenu.innerHTML = html;
    }
    function openMenu()  { if (!themeMenu) return; themeMenu.hidden = false; themeBtn.setAttribute('aria-expanded', 'true'); }
    function closeMenu() { if (!themeMenu) return; themeMenu.hidden = true; themeBtn.setAttribute('aria-expanded', 'false'); }

    if (themeBtn) themeBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        if (themeMenu.hidden) openMenu(); else closeMenu();
    });
    if (themeMenu) themeMenu.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-theme-id]');
        if (!btn) return;
        var id = btn.getAttribute('data-theme-id');
        switcher.apply(id); updateLabel(id); closeMenu();
    });
    document.addEventListener('click', function (e) {
        if (themeMenu && !themeMenu.hidden) {
            if (themeMenu.contains(e.target)) return;
            if (e.target === themeBtn) return;
            closeMenu();
        }
    });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && themeMenu && !themeMenu.hidden) closeMenu();
    });

    buildMenu();
    var saved = switcher.getSaved && switcher.getSaved();
    if (saved) updateLabel(saved);
})();
</script>

</body>
