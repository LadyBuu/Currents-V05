        <span class="title" id="appTitle">Culture Manager</span>
        <span class="spacer" aria-hidden="true"></span>

        <label for="yearInput">Year</label>

        <button class="tb-btn" id="setYearBtn" type="button">Set</button>

        <button class="tb-btn primary" id="createCultureBtn" type="button">+ Culture</button>

        <div class="theme-toggle" role="group" aria-label="Theme">
            <button class="btn theme-toggle__btn" id="themeBtn" type="button" aria-haspopup="menu" aria-expanded="false">

            </div>
        </div>

            <div class="panel-tabs" id="panelTabs" role="tablist">
                <button class="tab-btn active" role="tab" type="button" data-tab="details" aria-selected="true" tabindex="0">
                    <span class="tab-icon" data-icon="CIRCLE_DOT" aria-hidden="true"></span> Details
                </button>
                <button class="tab-btn" role="tab" type="button" data-tab="appearance" aria-selected="false" tabindex="-1">
                    <span class="tab-icon" data-icon="PERSON" aria-hidden="true"></span> Appearance
                </button>
                <button class="tab-btn" role="tab" type="button" data-tab="mythology" aria-selected="false" tabindex="-1">
                    <span class="tab-icon" data-icon="BOOK" aria-hidden="true"></span> Mythology
                </button>

                    <span class="tab-icon" data-icon="PERSON" aria-hidden="true"></span> Characters
                </button>
                <button class="tab-btn" role="tab" type="button" data-tab="names" aria-selected="false" tabindex="-1">
                    <span class="tab-icon" data-icon="BOOK" aria-hidden="true"></span> Names
                </button>
            </div>

            <div class="tab-content" id="tabContent" role="tabpanel">
                <div class="tab-pane active" id="tab-details"    data-tab-content="details"></div>
                <div class="tab-pane"        id="tab-appearance" data-tab-content="appearance"></div>
                <div class="tab-pane"        id="tab-mythology"  data-tab-content="mythology"></div>

<!-- ============================================================ -->
<!-- THEME SWITCHER                                                -->
<!-- ============================================================ -->
<script>
(function () {
    'use strict';

    var STORAGE_KEY = 'stillwaters_theme';

    var THEMES = [
        { id: 'dark',            label: 'Dark' },
        { id: 'light',           label: 'Light' },
        { id: 'vaporwave',       label: 'Vaporwave' },
        { id: 'pastel',          label: 'Pastel' },
        { id: 'carnival',        label: 'Carnival' },
        { id: 'maximal',         label: 'Maximal' },
        { id: 'gits',            label: 'GITS' },
        { id: 'nouveau',         label: 'Nouveau' },
        { id: 'ukiyo-e',         label: 'Ukiyo-e' },
        { id: 'nature',          label: 'Nature' },
        { id: 'kmt',             label: 'KMT' },
        { id: 'gaslight',        label: 'Gaslight' },
        { id: 'grotesque',       label: 'Grotesque' },
        { id: 'illuminated',     label: 'Illuminated' },
        { id: 'discowing',       label: 'Discowing' },
        { id: 'choc-cake',       label: 'Choc Cake' },
        { id: 'dada',            label: 'Dada' },
        { id: 'brutalist',       label: 'Brutalist' },
        { id: 'orchestrion',     label: 'Orchestrion' },
        { id: 'rococo',          label: 'Rococo' },
        { id: 'nautical-tile',   label: 'Nautical Tile' }
    ];

    var byId = {};
    for (var i = 0; i < THEMES.length; i++) byId[THEMES[i].id] = THEMES[i];

    var themeBtn  = document.getElementById('themeBtn');
    var themeMenu = document.getElementById('themeMenu');
    var themeName = document.getElementById('themeName');

    function apply(id) {
        if (!byId[id]) id = 'dark';
        document.documentElement.setAttribute('data-theme', id);
        if (themeName) themeName.textContent = byId[id].label;
        try { localStorage.setItem(STORAGE_KEY, id); } catch (e) {}
    }

    function buildMenu() {
        var html = '';
        for (var i = 0; i < THEMES.length; i++) {
            html += '<li role="none"><button role="menuitem" type="button" data-theme-id="' +
                THEMES[i].id + '">' + THEMES[i].label + '</button></li>';
        }
        if (themeMenu) themeMenu.innerHTML = html;
    }

    function openMenu() { if (themeMenu) themeMenu.hidden = false; if (themeBtn) themeBtn.setAttribute('aria-expanded', 'true'); }
    function closeMenu() { if (themeMenu) themeMenu.hidden = true; if (themeBtn) themeBtn.setAttribute('aria-expanded', 'false'); }

    if (themeBtn) {
        themeBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            if (themeMenu.hidden) openMenu(); else closeMenu();
        });
    }
    if (themeMenu) {
        themeMenu.addEventListener('click', function (e) {
            var btn = e.target.closest('[data-theme-id]');
            if (!btn) return;
            apply(btn.getAttribute('data-theme-id'));
            closeMenu();
        });
    }
    document.addEventListener('click', function (e) {
        if (!themeMenu || themeMenu.hidden) return;
        if (themeMenu.contains(e.target)) return;
        if (e.target === themeBtn) return;
        closeMenu();
    });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && themeMenu && !themeMenu.hidden) closeMenu();
    });

    var saved = null;
    try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) {}
    buildMenu();

    if (saved && byId[saved]) {
        apply(saved);
    } else {
        var mq = window.matchMedia('(prefers-color-scheme: light)');
        apply(mq.matches ? 'light' : 'dark');
    }

    window.ThemeSwitcher = { apply: apply, themes: THEMES.slice() };
})();
</script>

<!-- ORCHESTRATOR                                                 -->
<!-- ============================================================ -->
<script>
(function () {
    'use strict';

    var religionContainer = document.getElementById('cultureListContainer');
    var sidebar           = document.getElementById('sidebar');
    var burgerBtn         = document.getElementById('burgerBtn');
    var yearInput         = document.getElementById('yearInput');
    var setYearBtn        = document.getElementById('setYearBtn');
    var exportBtn         = document.getElementById('exportBtn');
    var importBtn         = document.getElementById('importBtn');
    var fileInput         = document.getElementById('fileInput');
    var createCultureBtn  = document.getElementById('createCultureBtn');

    var tabButtons = Array.prototype.slice.call(
        document.querySelectorAll('.panel-tabs .tab-btn')
    );

    var selectedCultureId = null;
    var activeTabId        = 'details';
    var isInitialized      = false;

    // -----------------------------------------------------------------
    // Bootstrap
    // -----------------------------------------------------------------
    function bootstrap() {
        if (isInitialized) return;
        isInitialized = true;

        if (typeof window.initializeStorage === 'function') {
            try { window.initializeStorage(); } catch (e) {
                console.error('[culture-manager] storage init failed:', e);
            }
        }

        // Bootstrap the domain indexes the culture subsystem reads
        // from (character, religion, rank, location) before culture.
        if (window.RankBootstrap && typeof window.RankBootstrap.init === 'function') {
            try { window.RankBootstrap.init(); } catch (e) {
                console.error('[culture-manager] rank bootstrap failed:', e);
            }
        }
        if (window.ReligionBootstrap && typeof window.ReligionBootstrap.init === 'function') {
            try { window.ReligionBootstrap.init(); } catch (e) {
                console.error('[culture-manager] religion bootstrap failed:', e);
            }
        }
        if (window.LocationBootstrap && typeof window.LocationBootstrap.init === 'function') {
            try { window.LocationBootstrap.init(); } catch (e) {
                console.error('[culture-manager] location bootstrap failed:', e);
            }
        }
        if (window.CultureBootstrap && typeof window.CultureBootstrap.init === 'function') {
            try { window.CultureBootstrap.init(); } catch (e) {
                console.error('[culture-manager] culture bootstrap failed:', e);
            }
        }

        injectIcons();
        syncYearInput();
        renderCultureList();
        pickInitialSelection();
        syncTabButtons(activeTabId);
    }

    // -----------------------------------------------------------------
    // Icons
    // -----------------------------------------------------------------
    function injectIcons() {
        if (typeof window.Icons === 'undefined') {
            setTimeout(injectIcons, 100);
            return;
        }
        var nodes = document.querySelectorAll('[data-icon]');
        for (var i = 0; i < nodes.length; i++) {
            var node = nodes[i];
            var name = node.getAttribute('data-icon');
            var svg = window.Icons[name] || window.Icons.CIRCLE || '';
            node.innerHTML = svg;
        }
    }

    // -----------------------------------------------------------------
    // Sidebar rendering
    // -----------------------------------------------------------------
    function renderCultureList() {
        if (!religionContainer) return;

        var UI = window.CultureUIList;
        if (!UI || typeof UI.renderCultureList !== 'function') {
            // Fallback: read directly from CultureState and render
            // simple rows. This keeps the sidebar functional even if
            // culture-ui-list.js fails to load.
            renderCultureListFallback();
            return;
        }

        var Queries = window.CultureQueries;
        var cultures;
        try {
            cultures = Queries ? Queries.getAllCultures() : [];
        } catch (e) {
            console.error('[culture-manager] getAllCultures failed:', e);
            cultures = [];
        }

        try {
            UI.renderCultureList(religionContainer, cultures, {
                selectedId: selectedCultureId,
                showStats: true,
                showActions: true,
                onSelect: function (id) { selectCulture(id); },
                onView:   function (id) { selectCulture(id); },
                onEdit:   function (id) { openEditCulture(id); }
            });
        } catch (e) {
            console.error('[culture-manager] renderCultureList failed:', e);
            renderCultureListFallback();
        }
    }

    function renderCultureListFallback() {
        if (!religionContainer) return;
        var cultures = [];
        if (window.masterData && window.masterData.data
            && Array.isArray(window.masterData.data.cultures)) {
            cultures = window.masterData.data.cultures;
        }
        if (cultures.length === 0) {
            religionContainer.innerHTML =
                '<div class="empty-state">' +
                '<div class="message">No cultures found</div>' +
                '<div class="sub-message">Click "+ Culture" to add one</div>' +
                '</div>';
            return;
        }
        var html = '<div class="culture-list">';
        for (var i = 0; i < cultures.length; i++) {
            var c = cultures[i];
            var sel = c.id === selectedCultureId ? ' is-selected' : '';
            html += '<div class="culture-row' + sel + '" data-culture-id="' + c.id + '">' +
                '<div class="culture-row__icon">' + (c.icon || '✦') + '</div>' +
                '<div class="culture-row__main">' +
                '<div class="culture-row__label">' + escapeHtml(c.displayName || c.name) + '</div>' +
                (c.description
                    ? '<div class="culture-row__desc">' + escapeHtml(c.description) + '</div>'
                    : '') +
                '</div></div>';
        }
        html += '</div>';
        religionContainer.innerHTML = html;

        var rows = religionContainer.querySelectorAll('.culture-row');
        for (var j = 0; j < rows.length; j++) {
            (function (row) {
                row.addEventListener('click', function () {
                    var id = row.getAttribute('data-culture-id');
                    if (id) selectCulture(id);
                });
            })(rows[j]);
        }
    }

    function pickInitialSelection() {
        if (selectedCultureId) return;
        var cultures = [];
        try {
            cultures = window.CultureQueries
                ? window.CultureQueries.getAllCultures()
                : [];
        } catch (e) { /* ignore */ }
        if (cultures && cultures.length > 0) {
            selectCulture(cultures[0].id);
        }
    }

    function selectCulture(id) {
        if (!id) return;
        selectedCultureId = id;
        renderCultureList();
        renderActiveTab();
    }

    // -----------------------------------------------------------------
    // Tab dispatch
    // -----------------------------------------------------------------
    function activateTab(tabId) {
        activeTabId = tabId;
        syncTabButtons(tabId);
        renderActiveTab();
    }

    function syncTabButtons(tabId) {
        for (var i = 0; i < tabButtons.length; i++) {
            var btn = tabButtons[i];
            var isActive = btn.dataset.tab === tabId;
            btn.classList.toggle('active', isActive);
            btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
            btn.setAttribute('tabindex', isActive ? '0' : '-1');
        }
        var panes = document.querySelectorAll('#tabContent .tab-pane');
        for (var j = 0; j < panes.length; j++) {
            panes[j].classList.toggle(
                'active',
                panes[j].getAttribute('data-tab-content') === tabId
            );
        }
    }

    for (var i = 0; i < tabButtons.length; i++) {
        (function (btn) {
            btn.addEventListener('click', function () {
                activateTab(btn.dataset.tab);
            });
        })(tabButtons[i]);
    }

    function renderActiveTab() {
        var container = document.getElementById('tab-' + activeTabId);
        if (!container) return;

        if (!selectedCultureId) {
            setEmptyState(container, 'Select a culture from the sidebar');
            return;
        }

        var culture = null;
        try {
            culture = window.CultureQueries
                ? window.CultureQueries.getCultureById(selectedCultureId)
                : null;
        } catch (e) {
            console.error('[culture-manager] getCultureById failed:', e);
        }
        if (!culture) {
            setEmptyState(container, 'Culture not found');
            return;
        }

        if (activeTabId === 'details') {
            renderDetailsView(container, culture);
            return;
        }

        // For appearance/mythology/characters/names, the tab files
        // register themselves with CultureEditorTabs, which is a
        // MODAL host. The inline tab panes here render a read-only
        // preview with an "Edit" button that opens the modal at that
        // tab. This matches the architecture: the composite editor is
        // a modal, not an inline pane.
        renderTabPreview(container, culture, activeTabId);
    }

    function renderDetailsView(container, culture) {
        var desc = culture.description
            ? '<p class="culture-card__desc">' + escapeHtml(culture.description) + '</p>'
            : '';
        var notes = culture.notes
            ? '<div class="culture-card__notes">' + escapeHtml(culture.notes) + '</div>'
            : '';
        var locations = (culture.locations && culture.locations.length > 0)
            ? '<div class="culture-card__relation">' +
              '<span class="culture-card__relation-label">Locations</span>' +
              '<span class="culture-card__relation-values">' +
              culture.locations.length + ' linked</span></div>'
            : '';

        var html =
            '<div class="culture-card">' +
            '<div class="culture-card__header">' +
            '<div class="culture-card__icon">' + (culture.icon || '✦') + '</div>' +
            '<div class="culture-card__label">' +
            escapeHtml(culture.displayName || culture.name) + '</div>' +
            '</div>' +
            desc +
            '<div class="culture-card__relations">' + locations + '</div>' +
            notes +
            '<div style="display:flex;gap:8px;margin-top:12px;">' +
            '<button type="button" class="rt-btn rt-btn--primary" id="ct_details_edit">Edit Details</button>' +
            '<button type="button" class="rt-btn" id="ct_details_open_editor">Open Editor</button>' +
            '</div>' +
            '</div>';

        container.innerHTML = html;

        var editBtn = document.getElementById('ct_details_edit');
        if (editBtn) {
            editBtn.addEventListener('click', function () {
                openEditCulture(culture.id);
            });
        }
        var openBtn = document.getElementById('ct_details_open_editor');
        if (openBtn) {
            openBtn.addEventListener('click', function () {
                openEditor(culture.id, 'details');
            });
        }
    }

    function renderTabPreview(container, culture, tabId) {
        var labelMap = {
            appearance: 'Appearance',
            mythology:  'Mythology',
            characters: 'Characters',
            names:      'Names'
        };
        var tabLabel = labelMap[tabId] || tabId;

        var summary = '';
        if (tabId === 'appearance') {
            var ap = culture.appearance || {};
            var cats = ['skinTones', 'eyeColors', 'hairColors', 'hairTypes', 'buildTypes', 'commonFeatures'];
            var parts = [];
            for (var i = 0; i < cats.length; i++) {
                var list = ap[cats[i]];
                if (Array.isArray(list) && list.length > 0) {
                    parts.push(cats[i] + ': ' + list.length + ' options');
                }
            }
            summary = parts.length > 0
                ? '<ul class="ct-details__list">' +
                  parts.map(function (p) { return '<li>' + escapeHtml(p) + '</li>'; }).join('') +
                  '</ul>'
                : '<p class="culture-card__desc">No appearance options defined.</p>';
        } else if (tabId === 'mythology') {
            var my = culture.mythology || {};
            var sections = ['creation', 'afterlife', 'cosmology'];
            var sParts = [];
            for (var j = 0; j < sections.length; j++) {
                if (my[sections[j]]) {
                    sParts.push('<li><strong>' + sections[j] + ':</strong> ' +
                        escapeHtml(String(my[sections[j]]).substring(0, 80)) +
                        (String(my[sections[j]]).length > 80 ? '…' : '') + '</li>');
                }
            }
            summary = sParts.length > 0
                ? '<ul class="ct-details__list">' + sParts.join('') + '</ul>'
                : '<p class="culture-card__desc">No mythology defined.</p>';
        } else if (tabId === 'characters') {
            var chars = [];
            try {
                chars = window.CultureQueries
                    ? window.CultureQueries.getCharactersForCulture(culture.id)
                    : [];
            } catch (e) { /* ignore */ }
            summary = chars.length > 0
                ? '<p class="culture-card__desc">' + chars.length + ' character(s) assigned.</p>'
                : '<p class="culture-card__desc">No characters assigned.</p>';
        } else if (tabId === 'names') {
            summary = '<p class="culture-card__desc">' +
                'Names are managed through the culture editor modal. ' +
                'Open the editor to add male names, female names, surnames, ' +
                'and surname rules.</p>';
        }

        container.innerHTML =
            '<div class="culture-card">' +
            '<div class="culture-card__header">' +
            '<div class="culture-card__label">' + escapeHtml(tabLabel) + '</div>' +
            '</div>' +
            summary +
            '<div style="display:flex;gap:8px;margin-top:12px;">' +
            '<button type="button" class="rt-btn rt-btn--primary" id="ct_preview_edit">' +
            'Open ' + escapeHtml(tabLabel) + ' Editor</button>' +
            '</div>' +
            '</div>';

        var editBtn = document.getElementById('ct_preview_edit');
        if (editBtn) {
            editBtn.addEventListener('click', function () {
                openEditor(culture.id, tabId);
            });
        }
    }

    function setEmptyState(container, message) {
        container.innerHTML = '<div class="empty-state">' +
            '<div class="message">' + escapeHtml(message) + '</div>' +
            '</div>';
    }

    // -----------------------------------------------------------------
    // Open the composite editor modal
    // -----------------------------------------------------------------
    function openEditor(cultureId, initialTab) {
        if (!window.CultureEditorTabs
            || typeof window.CultureEditorTabs.openEditor !== 'function') {
            window.alert('Culture editor is not loaded. Check that ' +
                'js/tabs/culture-editor-tab.js and the four tab files loaded.');
            return;
        }
        window.CultureEditorTabs.openEditor(cultureId, {
            initialTab: initialTab || 'appearance',
            onSave: function (updated) {
                renderCultureList();
                if (updated && updated.id === selectedCultureId) {
                    renderActiveTab();
                }
            },
            onCancel: function () {
                // Nothing to do — the editor discarded its working copy.
            }
        });
    }

    // -----------------------------------------------------------------
    // Create / edit culture (uses culture-modals.js)
    // -----------------------------------------------------------------
    function openCreateCulture() {
        if (typeof window.openCreateCultureModal !== 'function') {
            window.alert('Create Culture modal not loaded (modals-culture.js).');
            return;
        }
        window.openCreateCultureModal({
            onSuccess: function (newCulture) {
                renderCultureList();
                if (newCulture && newCulture.id) {
                    selectCulture(newCulture.id);
                }
            }
        });
    }

    function openEditCulture(id) {
        if (typeof window.openEditCultureModal !== 'function') {
            window.alert('Edit Culture modal not loaded (modals-culture.js).');
            return;
        }
        window.openEditCultureModal(id, {
            onSuccess: function (updated) {
                renderCultureList();
                if (updated && updated.id === selectedCultureId) {
                    renderActiveTab();
                }
            }
        });
    }

    if (createCultureBtn) {
        createCultureBtn.addEventListener('click', openCreateCulture);
    }

    // -----------------------------------------------------------------
    // Sidebar toggle
    // -----------------------------------------------------------------
    function toggleSidebar() { if (sidebar) sidebar.classList.toggle('open'); }
    function closeSidebar()  { if (sidebar) sidebar.classList.remove('open'); }

    if (burgerBtn) burgerBtn.addEventListener('click', toggleSidebar);

    document.addEventListener('click', function (e) {
        if (window.innerWidth > 768) return;
        if (!sidebar) return;
        if (sidebar.contains(e.target)) return;
        if (e.target === burgerBtn) return;
        closeSidebar();
    });

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeSidebar();
    });

    window.addEventListener('resize', function () {
        if (window.innerWidth > 768) closeSidebar();
    });

    // -----------------------------------------------------------------
    // Year
    // -----------------------------------------------------------------
    function syncYearInput() {
        if (typeof window.getCurrentYear !== 'function') return;
        try { yearInput.value = String(window.getCurrentYear()); } catch (e) {}
    }

    if (setYearBtn) {
        setYearBtn.addEventListener('click', function () {
            if (typeof window.isValidYear !== 'function') return;
            var val = parseInt(yearInput.value, 10);
            if (isNaN(val)) { window.alert('Enter a valid year.'); return; }
            if (!window.isValidYear(val)) {
                window.alert('Year is outside the allowed range.');
                return;
            }
            if (window.masterData && window.masterData.data) {
                window.masterData.data.currentYear = val;
            }
            if (typeof window.markDataDirty === 'function') window.markDataDirty();
            if (typeof window.saveMasterData === 'function') window.saveMasterData();
            renderActiveTab();
        });
    }

    // -----------------------------------------------------------------
    // Export / Import
    // -----------------------------------------------------------------
    if (exportBtn) {
        exportBtn.addEventListener('click', function () {
            if (typeof window.exportToJSON !== 'function') {
                window.alert('Export module not available.'); return;
            }
            if (!window.masterData) {
                window.alert('No data to export.'); return;
            }
            try { window.exportToJSON(window.masterData, 'stillwaters'); }
            catch (e) { window.alert('Export failed: ' + (e.message || 'unknown')); }
        });
    }

    if (importBtn && fileInput) {
        importBtn.addEventListener('click', function () {
            fileInput.value = '';
            fileInput.click();
        });

        fileInput.addEventListener('change', function () {
            var file = this.files && this.files[0];
            if (!file) return;

            var reader = new FileReader();
            reader.onload = function (ev) {
                try {
                    var parsed = JSON.parse(ev.target.result);
                    var dataToInstall = null;
                    if (parsed && parsed.data && parsed.data.cultures !== undefined) {
                        dataToInstall = parsed.data;
                    } else if (parsed && parsed.cultures !== undefined) {
                        dataToInstall = parsed;
                    } else if (parsed && parsed.data) {
                        dataToInstall = parsed.data;
                    }
                    if (!dataToInstall) {
                        window.alert('Unrecognized import format.');
                        return;
                    }

                    if (typeof window.normalizeMasterData !== 'function') {
                        window.alert('Schema module not available; cannot import.');
                        return;
                    }

                    window.masterData = window.normalizeMasterData({
                        schemaVersion: window.STORAGE_SCHEMA_VERSION,
                        savedAt: new Date().toISOString(),
                        data: dataToInstall
                    });

                    if (typeof window.invalidateAccessorCaches === 'function') {
                        window.invalidateAccessorCaches();
                    }
                    if (typeof window.markDataDirty === 'function') window.markDataDirty();
                    if (typeof window.saveMasterData === 'function' && !window.saveMasterData()) {
                        window.alert('Save failed after import.'); return;
                    }

                    // Re-hydrate every index the culture system reads.
                    if (window.CultureBootstrap
                        && typeof window.CultureBootstrap.init === 'function') {
                        try { window.CultureBootstrap.init(); } catch (e) {}
                    }
                    if (window.ReligionBootstrap
                        && typeof window.ReligionBootstrap.init === 'function') {
                        try { window.ReligionBootstrap.init(); } catch (e) {}
                    }
                    if (window.LocationBootstrap
                        && typeof window.LocationBootstrap.init === 'function') {
                        try { window.LocationBootstrap.init(); } catch (e) {}
                    }

                    selectedCultureId = null;
                    syncYearInput();
                    renderCultureList();
                    pickInitialSelection();

                    window.alert('Import complete.');
                } catch (err) {
                    window.alert('Invalid JSON: ' + err.message);
                }
            };
            reader.onerror = function () {
                window.alert('Failed to read file.');
            };
            reader.readAsText(file);
            this.value = '';
        });
    }

    // -----------------------------------------------------------------
    // Cross-tab reload
    // -----------------------------------------------------------------
    if (typeof window.addEventListener === 'function') {
        window.addEventListener('masterDataUpdated', function () {
            renderCultureList();
            if (selectedCultureId) renderActiveTab();
        });
    }

    // -----------------------------------------------------------------
    // Utilities
    // -----------------------------------------------------------------
    function escapeHtml(value) {
        if (typeof window.escapeHtml === 'function') return window.escapeHtml(value);
        if (value === null || value === undefined) return '';
        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    // -----------------------------------------------------------------
    // Init
    // -----------------------------------------------------------------
    function onDomReady(fn) {
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', fn);
        } else {
            fn();
        }
    }

    onDomReady(bootstrap);

})();
</script>

</body>
</html>
