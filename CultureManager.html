<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover" />
    <title>Culture Manager</title>
    <link rel="icon" href="data:," />

    <script src="js/core/theme-boot.js"></script>

    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/common.css">

    <style>
        /* ============================================================
           Culture Manager — inline CSS
           STRUCTURAL ONLY. Every visual value (color, radius, shadow,
           font family, font weight, line height, transition duration)
           comes from a theme token in themes.css. No hex values, no
           rgba() values, no hardcoded font stacks, no hardcoded px
           for design values. Spacing uses rem.
           ============================================================ */

        html, body { height: 100%; margin: 0; overflow: hidden; }
        body {
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--text);
            font-family: var(--f-body);
            font-size: 1rem;
            line-height: var(--lh, 1.5);
            -webkit-font-smoothing: antialiased;
        }

        /* ---- Topbar ---- */
        .topbar {
            position: relative;
            z-index: 100;
            flex-shrink: 0;
            background: var(--bg2);
            padding: 0.5rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.625rem;
            border-bottom: 1px solid var(--border);
            min-height: 3rem;
            flex-wrap: wrap;
        }
        .topbar .title {
            font-family: var(--f-display);
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--accent);
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
        }
        .topbar .title svg { width: 1em; height: 1em; fill: currentColor; }
        .topbar .spacer { flex: 1; min-width: 0.75rem; }
        .topbar .burger-menu {
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0.25rem 0.625rem;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            cursor: pointer;
        }

        .tb-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.3125rem;
            padding: 0.375rem 0.875rem;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: var(--f-body);
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            line-height: 1.2;
        }
        .tb-btn svg { width: 0.9em; height: 0.9em; fill: currentColor; }
        .tb-btn:hover {
            border-color: var(--accent);
            background: var(--accent-dim);
            color: var(--accent-light);
        }
        .tb-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--accent-fg);
        }
        .tb-btn.primary:hover { background: var(--accent-dark); }
        .tb-btn:disabled { opacity: 0.45; cursor: not-allowed; }

        .rt-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.3125rem 0.75rem;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: var(--f-body);
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            line-height: 1.2;
        }
        .rt-btn:hover {
            border-color: var(--accent);
            color: var(--accent-light);
        }
        .rt-btn--primary {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--accent-fg);
        }
        .rt-btn--primary:hover { background: var(--accent-dark); }
        .rt-btn--danger {
            border-color: var(--danger-lt);
            color: var(--danger-lt);
        }
        .rt-btn--danger:hover { background: var(--danger-soft); }
        .rt-btn--icon { padding: 0.3125rem 0.625rem; }

        .year-input {
            display: inline-flex;
            align-items: center;
            gap: 0.3125rem;
            padding: 0.1875rem 0.625rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-family: var(--f-body);
            font-size: 0.7rem;
            line-height: 1.2;
        }
        .year-input label {
            font-family: var(--f-display);
            font-size: 0.55rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--dim);
            white-space: nowrap;
        }
        .year-input input {
            width: 4rem;
            padding: 0.1875rem 0.375rem;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: var(--f-mono);
            font-size: 0.7rem;
            text-align: right;
        }
        .year-input input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .theme-toggle { position: relative; display: inline-flex; }
        .theme-toggle__menu {
            position: absolute;
            top: calc(100% + 0.25rem);
            right: 0;
            z-index: 9999;
            min-width: 10rem;
            max-height: 60vh;
            padding: 0.25rem;
            margin: 0;
            list-style: none;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow-y: auto;
        }
        .theme-toggle__menu[hidden] { display: none; }
        .theme-toggle__menu button {
            display: block;
            width: 100%;
            padding: 0.375rem 0.75rem;
            text-align: left;
            background: transparent;
            border: none;
            color: var(--text);
            font-family: var(--f-body);
            font-size: 0.7rem;
            border-radius: var(--radius);
            cursor: pointer;
        }
        .theme-toggle__menu button:hover {
            background: var(--accent-dim);
            color: var(--accent-light);
        }

        .app-layout {
            display: flex;
            flex-direction: row;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }
        .sidebar {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg2);
            border-right: 1px solid var(--border);
            width: 17.5rem;
        }
        .sidebar-header {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
            background: var(--bg3);
        }
        .sidebar-header h3 {
            margin: 0;
            font-family: var(--f-display);
            font-size: 0.65rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }
        .sidebar-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
            min-height: 0;
        }
        .main-panel {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
        }

        .manager-subtabs {
            position: sticky;
            top: 0;
            display: flex;
            align-items: stretch;
            gap: 0.25rem;
            padding: 0.5rem 1.5rem 0;
            margin: 0 0 1.25rem;
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            z-index: 10;
        }
        .manager-subtab {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.125rem 0.6875rem;
            background: transparent;
            border: 1px solid transparent;
            border-bottom: none;
            border-radius: var(--radius) var(--radius) 0 0;
            color: var(--dim);
            font-family: var(--f-display);
            font-size: 0.78rem;
            font-weight: 500;
            cursor: pointer;
        }
        .manager-subtab:hover {
            color: var(--accent-light);
            background: var(--accent-dim);
        }
        .manager-subtab.active {
            color: var(--accent);
            background: var(--bg2);
            border-color: var(--border);
            font-weight: 600;
        }
        .manager-subtab-icon {
            display: inline-flex;
            width: 1rem;
            height: 1rem;
            align-items: center;
            justify-content: center;
            color: currentColor;
        }
        .manager-subtab-icon svg { width: 100%; height: 100%; fill: currentColor; }

        .tab-content-wrapper {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 1.25rem 1.5rem;
            background: var(--bg);
        }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        /* ============================================================
           Shared — hint, empty, loading
           ============================================================ */
        .ct-hint {
            background: var(--bg2);
            border-left: 3px solid var(--accent);
            padding: 0.625rem 0.875rem;
            margin-bottom: 1rem;
            font-size: 0.7rem;
            color: var(--dim);
            line-height: 1.55;
            border-radius: 0 var(--radius) var(--radius) 0;
        }
        .ct-hint--footer { margin-top: 1rem; margin-bottom: 0; }

        .ct-empty,
        .rt-empty {
            padding: 1.5rem;
            text-align: center;
            color: var(--dim);
            font-size: 0.8rem;
        }
        .ct-empty__sub,
        .rt-empty__sub {
            display: block;
            margin-top: 0.375rem;
            font-size: 0.7rem;
            color: var(--dim);
        }
        .rt-unavailable {
            padding: 1.5rem;
            text-align: center;
            color: var(--danger-lt);
            font-size: 0.8rem;
        }
        .loading {
            padding: 1.5rem;
            text-align: center;
            color: var(--dim);
            font-size: 0.85rem;
        }

        /* ============================================================
           Shared — cards, badges, form controls
           ============================================================ */
        .ct-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0.875rem 1rem;
            margin-bottom: 1rem;
        }
        .ct-card__header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 0.75rem;
            margin-bottom: 0.625rem;
        }
        .ct-card__title {
            font-family: var(--f-display);
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent-light);
            display: flex;
            flex-direction: column;
            gap: 0.125rem;
        }
        .ct-card__hint {
            font-family: var(--f-body);
            font-size: 0.6rem;
            color: var(--dim);
            font-weight: 400;
        }
        .ct-card__count {
            font-size: 0.65rem;
            color: var(--dim);
            font-family: var(--f-mono);
        }
        .ct-card__caret {
            color: var(--dim);
            font-size: 0.7rem;
        }

        .ct-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.125rem 0.5rem;
            border-radius: var(--radius);
            font-size: 0.6rem;
            font-family: var(--f-mono);
            background: var(--accent-dim);
            color: var(--accent-light);
            white-space: nowrap;
        }
        .ct-badge--muted { background: var(--bg3); color: var(--dim); }
        .ct-badge--accent { background: var(--accent); color: var(--accent-fg); }

        .ct-form__group { margin-bottom: 0.75rem; }
        .ct-form__label {
            display: block;
            font-size: 0.65rem;
            color: var(--dim);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 0.25rem;
            font-family: var(--f-display);
        }
        .ct-form__input,
        .ct-form__select,
        .ct-form__textarea {
            width: 100%;
            padding: 0.375rem 0.625rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: var(--f-body);
            font-size: 0.75rem;
            box-sizing: border-box;
        }
        .ct-form__textarea {
            font-family: var(--f-mono);
            font-size: 0.72rem;
            resize: vertical;
        }
        .ct-form__input:focus,
        .ct-form__select:focus,
        .ct-form__textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .ct-search input {
            width: 100%;
            padding: 0.375rem 0.625rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: var(--f-body);
            font-size: 0.75rem;
            box-sizing: border-box;
        }
        .ct-search input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .ct-details__list {
            margin: 0.375rem 0 0;
            padding-left: 1.125rem;
            font-size: 0.75rem;
            color: var(--text);
            line-height: 1.6;
        }

        /* ============================================================
           APPEARANCE TAB
           ============================================================ */
        .ct-appearance { width: 100%; }
        .ct-appearance__grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(17.5rem, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .ct-appearance-card { margin-bottom: 0; }
        .ct-appearance-list {
            display: flex;
            flex-direction: column;
            gap: 0.375rem;
            margin-bottom: 0.625rem;
            max-height: 20rem;
            overflow-y: auto;
        }
        .ct-appearance-empty {
            padding: 0.75rem;
            text-align: center;
            color: var(--dim);
            font-size: 0.7rem;
            font-style: italic;
        }
        .ct-appearance-row {
            display: grid;
            grid-template-columns: 1fr 4.375rem auto auto;
            gap: 0.375rem;
            align-items: center;
        }
        .ct-appearance-row__value,
        .ct-appearance-row__weight {
            padding: 0.3125rem 0.5rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: var(--f-body);
            font-size: 0.72rem;
            box-sizing: border-box;
            width: 100%;
        }
        .ct-appearance-row__weight {
            font-family: var(--f-mono);
            text-align: right;
        }
        .ct-appearance-row__value:focus,
        .ct-appearance-row__weight:focus {
            outline: none;
            border-color: var(--accent);
        }
        .ct-appearance-row__weight-label {
            font-size: 0.6rem;
            color: var(--dim);
        }
        .ct-appearance-add {
            width: 100%;
            padding: 0.375rem 0.625rem;
            background: var(--bg3);
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            color: var(--dim);
            font-family: var(--f-body);
            font-size: 0.7rem;
            cursor: pointer;
        }
        .ct-appearance-add:hover {
            color: var(--accent);
            border-color: var(--accent);
        }
        .ct-appearance-count {
            font-size: 0.65rem;
            color: var(--dim);
            font-family: var(--f-mono);
        }
        .ct-appearance-height { grid-column: 1 / -1; }
        .ct-appearance-height-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        .ct-appearance-height-group { display: flex; flex-direction: column; gap: 0.25rem; }
        .ct-appearance-height-label {
            font-size: 0.65rem;
            color: var(--dim);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-family: var(--f-display);
        }
        .ct-appearance-height-inputs {
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }
        .ct-appearance-height-inputs input {
            flex: 1;
            padding: 0.3125rem 0.5rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: var(--f-mono);
            font-size: 0.72rem;
            text-align: right;
            width: 4.375rem;
            box-sizing: border-box;
        }
        .ct-appearance-height-inputs input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .ct-appearance-height-sep {
            color: var(--dim);
            font-size: 0.7rem;
        }
        .ct-appearance-height-unit {
            color: var(--dim);
            font-size: 0.65rem;
            font-family: var(--f-mono);
        }

        /* ============================================================
           MYTHOLOGY TAB
           ============================================================ */
        .ct-mythology { width: 100%; }
        .ct-mythology__overview {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.625rem 0.875rem;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 1rem;
        }
        .ct-mythology__overview-label {
            font-family: var(--f-display);
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--accent);
            font-weight: 600;
        }
        .ct-mythology__overview-summary {
            font-size: 0.72rem;
            color: var(--dim);
        }
        .ct-mythology__text-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .ct-mythology__list-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(17.5rem, 1fr));
            gap: 1rem;
        }
        .ct-mythology-textarea {
            width: 100%;
            padding: 0.5rem 0.625rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: var(--f-body);
            font-size: 0.75rem;
            line-height: 1.55;
            resize: vertical;
            box-sizing: border-box;
        }
        .ct-mythology-textarea:focus {
            outline: none;
            border-color: var(--accent);
        }
        .ct-mythology-wordcount,
        .ct-mythology-count {
            font-size: 0.6rem;
            color: var(--dim);
            font-family: var(--f-mono);
        }
        .ct-mythology-tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.375rem;
            min-height: 2.25rem;
            padding: 0.5rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 0.625rem;
        }
        .ct-mythology-empty {
            color: var(--dim);
            font-size: 0.7rem;
            font-style: italic;
            align-self: center;
        }
        .ct-mythology-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.1875rem 0.25rem 0.1875rem 0.625rem;
            background: var(--accent-dim);
            color: var(--accent-light);
            border-radius: var(--radius);
            font-size: 0.7rem;
        }
        .ct-mythology-tag__label { padding: 0.0625rem 0; }
        .ct-mythology-tag__remove {
            background: transparent;
            border: none;
            color: inherit;
            padding: 0 0.375rem;
            font-size: 0.65rem;
            cursor: pointer;
            opacity: 0.7;
        }
        .ct-mythology-tag__remove:hover { opacity: 1; color: var(--danger-lt); }
        .ct-mythology-add-row {
            display: flex;
            gap: 0.375rem;
        }
        .ct-mythology-add-input {
            flex: 1;
            padding: 0.375rem 0.625rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: var(--f-body);
            font-size: 0.72rem;
            box-sizing: border-box;
        }
        .ct-mythology-add-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* ============================================================
           CHARACTERS TAB
           ============================================================ */
        .ct-characters { width: 100%; }
        .ct-characters__header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        .ct-characters__stats { display: flex; gap: 0.5rem; }
        .ct-characters__actions { display: flex; gap: 0.5rem; }
        .ct-characters__filters {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        .ct-characters__filters .ct-search { flex: 1; min-width: 12.5rem; }
        .ct-characters__filters select {
            padding: 0.375rem 0.625rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: var(--f-body);
            font-size: 0.72rem;
        }
        .ct-characters__list {
            display: flex;
            flex-direction: column;
            gap: 0.375rem;
        }
        .ct-character-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            padding: 0.625rem 0.875rem;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            border-radius: var(--radius);
        }
        .ct-character-row--deceased {
            border-left-color: var(--danger-lt);
            opacity: 0.75;
        }
        .ct-character-row__body { flex: 1; min-width: 0; }
        .ct-character-row__top {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 0.25rem;
        }
        .ct-character-row__name {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text);
        }
        .ct-character-row__meta {
            font-size: 0.65rem;
            color: var(--dim);
        }
        .ct-character-row__sub {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            font-size: 0.65rem;
            color: var(--dim);
        }
        .ct-character-row__appearance {
            color: var(--accent-light);
            font-family: var(--f-mono);
        }
        .ct-character-row__appearance--none { color: var(--dim); font-style: italic; }
        .ct-character-row__actions {
            display: flex;
            gap: 0.375rem;
            flex-shrink: 0;
        }

        /* ============================================================
           NAMES TAB
           ============================================================ */
        .ct-names { width: 100%; }
        .ct-names__cards {
            display: grid;

        .ct-names__chip-remove,

        }

            line-height: 1.45;
        }

            font-size: 0.85rem;
            line-height: 1.3;
        }

            font-size: 0.7rem;
            line-height: 1.35;
        }

            font-size: 0.7rem;

        }

            font-size: 0.7rem;
            line-height: 1.2;
        }

            font-size: 0.78rem;
            line-height: 1.45;
        }

        .ct-names__field-label,
        .ct-appearance-height-label {
            font-size: 0.65rem;
            line-height: 1.35;
            font-weight: 500;
        }
        .ct-names__card-hint {
            font-size: 0.65rem;
            line-height: 1.4;
        }
        .ct-names__card-count {
            font-size: 0.7rem;
            line-height: 1;
        }
        .ct-names__form-hint {
            font-size: 0.7rem;
            line-height: 1.5;
        }

            font-size: 0.75rem;
            line-height: 1.55;
        }

        .ct-names__form-label {
            font-size: 0.68rem;
            line-height: 1.35;

           ============================================================ */

            line-height: 1.6;

        .modal-body p {

            line-height: 1.6;
        }
        .modal .modal-body p:last-child,
        .modal-body p:last-child {

        .modal-body label {
            display: block;
            font-size: 0.72rem;
            line-height: 1.35;
            color: var(--dim);
            margin-bottom: 0.25rem;
            font-weight: 500;

        .modal .modal-body h4,
        .modal-body h4 {
            font-size: 0.85rem;
            line-height: 1.35;
            margin: 1rem 0 0.5rem;
            color: var(--accent-light);
            font-weight: 600;
        }
        .modal .modal-body h4:first-child,
        .modal-body h4:first-child {
            margin-top: 0;
        }

        .modal .modal-body ul,
        .modal .modal-body ol,
        .modal-body ul,
        .modal-body ol {
            margin: 0.5rem 0;
            padding-left: 1.25rem;
            line-height: 1.55;
        }

        .modal .modal-body code,
        .modal-body code {
            font-family: var(--f-mono);
            font-size: 0.78rem;
            padding: 0.0625rem 0.3125rem;
            background: var(--bg3);
            border-radius: var(--radius);
        }

        .modal-footer button {
            font-size: 0.78rem;
            line-height: 1.2;
        }

        .ct-editor {
            font-size: 0.85rem;
            line-height: 1.55;
        }
        .ct-editor__name {
            font-size: 0.9rem;
            line-height: 1.3;
            font-weight: 600;
        }
        .ct-editor__errors,
        .ct-errors-list li {
            font-size: 0.78rem;
            line-height: 1.5;
        }

        .ct-nav-btn {
            font-size: 0.75rem;
            line-height: 1.2;
            padding: 0.5rem 0.75rem;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 768px) {
            .topbar .burger-menu { display: inline-flex; }
            .topbar { padding: 0.375rem 0.625rem; gap: 0.375rem; min-height: 2.625rem; }
            .topbar .title { font-size: 0.75rem; }
            .topbar .tb-btn { padding: 0.1875rem 0.625rem; font-size: 0.65rem; }
            .year-input { padding: 0.125rem 0.375rem; }
            .year-input label { display: none; }
            .year-input input { width: 3.25rem; font-size: 0.65rem; }
            .app-layout { flex-direction: column; }
            .sidebar {
                position: fixed;
                top: 0; bottom: 0; left: 0;
                height: 100vh;
                width: 85%;
                max-width: 17.5rem;
                z-index: 1000;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }
            .sidebar.visible { transform: translateX(0); }
            .tab-content-wrapper { padding: 1rem; }
            .manager-subtabs { padding-left: 1rem; padding-right: 1rem; }
            .manager-subtab { flex: 1 1 auto; min-width: 0; padding: 0.625rem 0.875rem; font-size: 0.72rem; }
            .ct-names__form-row { grid-template-columns: 1fr; }
            .ct-appearance__grid { grid-template-columns: 1fr; }
            .ct-mythology__list-grid { grid-template-columns: 1fr; }
        }

        .sidebar-overlay { display: none; }
        .sidebar-overlay.active {
            display: block;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--overlay, rgba(0, 0, 0, 0.6));
            z-index: 999;
        }
    </style>
</head>
<body>

<div class="topbar">
    <button id="menuToggle" class="burger-menu" type="button" aria-label="Toggle menu">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
    </button>
    <div class="title" id="cultureManagerTitle">Culture Manager</div>
    <div class="spacer"></div>

    <button id="createCultureBtn" class="tb-btn primary" type="button">+ Culture</button>
    <button id="editCultureBtn" class="tb-btn" type="button" disabled>Edit</button>
    <button id="deleteCultureBtn" class="tb-btn" type="button" disabled>Delete</button>

    <div class="year-input">
        <label for="yearInput">Year</label>
        <input type="number" id="yearInput" min="1" step="1">
        <button id="setYearBtn" class="tb-btn" type="button">Set</button>
    </div>

    <button id="importBtn" class="tb-btn" type="button">Import</button>
    <button id="exportBtn" class="tb-btn" type="button">Export</button>
    <button id="refreshBtn" class="tb-btn" type="button">Refresh</button>

    <input type="file" id="fileInput" accept=".json" style="display:none;" />

    <div class="theme-toggle" role="group" aria-label="Theme">
        <button class="tb-btn theme-toggle__btn" id="themeBtn" type="button" aria-haspopup="menu" aria-expanded="false">
            <span aria-hidden="true">◐</span>
            <span id="themeName">Dark</span>
        </button>
        <ul class="theme-toggle__menu" id="themeMenu" role="menu" hidden></ul>
    </div>
</div>

<div class="app-layout">
    <div class="sidebar" id="cultureSidebar">
        <div class="sidebar-header"><h3 id="sidebarTitle">Cultures</h3></div>
        <div class="sidebar-list" id="cultureListContainer">
            <div class="loading">Loading cultures…</div>
        </div>
    </div>
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <div class="main-panel">
        <div class="manager-subtabs" id="panelSubtabs" role="tablist">
            <button class="manager-subtab active" role="tab" type="button" data-tab="details" aria-selected="true" tabindex="0">
                <span class="manager-subtab-icon" data-icon="CIRCLE_DOT" aria-hidden="true"></span>
                <span>Details</span>
            </button>
            <button class="manager-subtab" role="tab" type="button" data-tab="appearance" aria-selected="false" tabindex="-1">
                <span class="manager-subtab-icon" data-icon="PERSON" aria-hidden="true"></span>
                <span>Appearance</span>
            </button>
            <button class="manager-subtab" role="tab" type="button" data-tab="mythology" aria-selected="false" tabindex="-1">
                <span class="manager-subtab-icon" data-icon="BOOK" aria-hidden="true"></span>
                <span>Mythology</span>
            </button>
            <button class="manager-subtab" role="tab" type="button" data-tab="characters" aria-selected="false" tabindex="-1">
                <span class="manager-subtab-icon" data-icon="PERSON" aria-hidden="true"></span>
                <span>Characters</span>
            </button>
            <button class="manager-subtab" role="tab" type="button" data-tab="names" aria-selected="false" tabindex="-1">
                <span class="manager-subtab-icon" data-icon="BOOK" aria-hidden="true"></span>
                <span>Names</span>
            </button>
        </div>

        <div class="tab-content-wrapper" id="tabContent" role="tabpanel">
            <div class="tab-pane active" id="tab-details"    data-tab-content="details"></div>
            <div class="tab-pane"        id="tab-appearance" data-tab-content="appearance"></div>
            <div class="tab-pane"        id="tab-mythology"  data-tab-content="mythology"></div>
            <div class="tab-pane"        id="tab-characters" data-tab-content="characters"></div>
            <div class="tab-pane"        id="tab-names"      data-tab-content="names"></div>
        </div>
    </div>
</div>

                return (window.LocationQueries
