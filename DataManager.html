<script>
    (function() {
        'use strict';
        try {
            var STORAGE_KEY = 'stillwaters_master';
            var stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                var parsed = JSON.parse(stored);
                if (parsed && parsed.data) {
                    window.masterData = parsed;
                }
            }
        } catch (e) {}

        if (!window.masterData || !window.masterData.data) {
            window.masterData = {
                version: '2.0',
                lastUpdated: new Date().toISOString(),
                data: {
                    characters: [],
                    places: [],
                    ranks: [],
                    rankInheritanceRules: {},
                    roles: [],
                    locationTypes: [],
                    governmentTypes: [],
                    governmentDepartments: [],
                    governmentHistory: [],
                    households: [],
                    residences: [],
                    currentYear: 1250
                }
            };
        }
    })();
</script>

<script>
    (function () {
        if (!window.SettlementQueries) {
            window.SettlementQueries = {
                getIndustryTaxRate: function () { return null; },
                getGovernmentSalaryBudget: function () { return null; }
            };
        }
        if (!window.SettlementProsperityQueries) {
            window.SettlementProsperityQueries = {
                getProsperityValue: function () { return null; }
            };
        }
        if (!window.IndustryQueries) {
            window.IndustryQueries = {
                getIndustryTaxRevenue: function () { return 0; },
                getIndustryEnterpriseStats: function () { return null; }
            };
        }

        if (!window.RoleQueries) {
            window.RoleQueries = {
                getRoleSummary: function () { return null; },
                getRankSummary: function (rankId) {
                    if (!rankId || !window.RankState || typeof window.RankState.getRank !== 'function') {
                        return null;
                    }
                    var r = window.RankState.getRank(rankId);
                    if (!r) return null;
                    return {
                        id: r.id,
                        name: r.name,
                        priority: typeof r.priority === 'number' ? r.priority : 5,
                        symbol: r.symbol || null
                    };
                },
                getAllRankSummaries: function () {
                    if (!window.RankState || typeof window.RankState.getAllRanks !== 'function') {
                        return [];
                    }
                    var ranks = window.RankState.getAllRanks() || [];
                    var out = [];
                    for (var i = 0; i < ranks.length; i++) {
                        var r = ranks[i];
                        if (!r || !r.id) continue;
                        out.push({
                            id: r.id,
                            name: r.name,
                            priority: typeof r.priority === 'number' ? r.priority : 5,
                            symbol: r.symbol || null
                        });
                    }
                    out.sort(function (a, b) {
                        var pa = a.priority || 999;
                        var pb = b.priority || 999;
                        if (pa !== pb) return pa - pb;
                        return String(a.name || '').localeCompare(String(b.name || ''));
                    });
                    return out;
                },
                getAllRoleSummaries: function () { return []; }
            };
        }

        if (!window.SettlementGovernmentCommands) {
            window.SettlementGovernmentCommands = {
                setJusticeSeverity: function () { return { success: true }; },
                setWatch: function () { return { success: true }; }
            };
        }
        if (!window.HouseholdQueries) {
            window.HouseholdQueries = {
                getHouseholdById: function () { return null; },
                getCharacterHousehold: function () { return null; }
            };
        }
        if (!window.HouseholdCommands) {
            window.HouseholdCommands = {
                adjustWealth: function () { return { success: false, reason: 'stub' }; },
                creditWealth: function () { return { success: false, reason: 'stub' }; },
                clearLocationReferences: function () {
                    return { success: true, data: { clearedCount: 0, households: [] } };
                }
            };
        }
    })();
</script>

<script>
    (function() {
        'use strict';

        function injectIcons() {
            if (typeof window.Icons === 'undefined') {
                setTimeout(injectIcons, 100);
                return;
            }

            var iconMap = {
                'icon-locationtypes':      window.Icons.LOCATION,
                'icon-governmenttypes':    window.Icons.GEAR,
                'icon-ranks':              window.Icons.CROWN,
                'icon-census':             window.Icons.PERSON,
                'icon-history':            window.Icons.BOOK,
                'icon-relations':          window.Icons.CIRCLE_DOT,
                'icon-settings':           window.Icons.GEAR,
                'empty-census-icon':       window.Icons.PERSON,
                'empty-history-icon':      window.Icons.BOOK,
                'empty-relations-icon':    window.Icons.CIRCLE_DOT,
                'empty-settings-icon':     window.Icons.GEAR
            };

            for (var id in iconMap) {
                if (!Object.prototype.hasOwnProperty.call(iconMap, id)) continue;
                var el = document.getElementById(id);
                var svg = iconMap[id];
                if (el && typeof svg === 'string' && svg.length > 0) {
                    el.innerHTML = svg;
                }
            }
        }

        // --- Tab switching ---
        var tabButtons = document.querySelectorAll('.panel-tabs .tab-btn');
        var tabPanes = {
            locationtypes:   document.getElementById('tab-locationtypes'),
            governmenttypes: document.getElementById('tab-governmenttypes'),
            ranks:           document.getElementById('tab-ranks'),
            census:          document.getElementById('tab-census'),
            history:         document.getElementById('tab-history'),
            relations:       document.getElementById('tab-relations'),
            settings:        document.getElementById('tab-settings')
        };

        var TAB_RENDERERS = {
            locationtypes: function () {
                if (window.LocationTypeManager) {
                    window.LocationTypeManager.renderTypeList('tab-locationtypes');
                }
            },
            governmenttypes: function () {
                if (window.GovernmentTypeManager) {
                    window.GovernmentTypeManager.renderTypeList('tab-governmenttypes');
                }
            },
            ranks: function () {
                if (window.RankManager) {
                    window.RankManager.renderRankList('tab-ranks');
                }
            }
        };

        function switchTab(tabId) {
            tabButtons.forEach(function(btn) {
                btn.classList.toggle('active', btn.dataset.tab === tabId);
            });
            Object.keys(tabPanes).forEach(function(key) {
                if (tabPanes[key]) {
                    tabPanes[key].classList.toggle('active', key === tabId);
                }
            });
            var renderer = TAB_RENDERERS[tabId];
            if (typeof renderer === 'function') {
                renderer();
            }
        }

        tabButtons.forEach(function(btn) {
            btn.addEventListener('click', function() {
                switchTab(this.dataset.tab);
            });
        });

        // --- Set Year ---
        document.getElementById('setYearBtn').addEventListener('click', function() {
            var val = parseInt(document.getElementById('yearInput').value, 10);
            if (isNaN(val)) return;
            if (!window.masterData || !window.masterData.data) return;
            window.masterData.data.currentYear = val;
            if (typeof window.markDataDirty === 'function') {
                window.markDataDirty();
            } else if (typeof window.saveMasterData === 'function') {
                window.saveMasterData();
            }
        });

        // --- Export ---
        document.getElementById('exportBtn').addEventListener('click', function() {
            var data = window.masterData;
            if (!data) { alert('No data to export'); return; }
            var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'stillwaters_export_' + Date.now() + '.json';
            a.click();
            URL.revokeObjectURL(url);
        });

        // --- Import ---
        document.getElementById('importBtn').addEventListener('click', function() {
            document.getElementById('fileInput').click();
        });

        document.getElementById('fileInput').addEventListener('change', function() {
            var file = this.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(e) {
                try {
                    var imported = JSON.parse(e.target.result);
                    var dataToImport = null;
                    if (imported.data && imported.version) {
                        dataToImport = imported;
                    } else if (imported.places || imported.characters) {
                        dataToImport = {
                            version: '2.0',
                            lastUpdated: new Date().toISOString(),
                            data: imported
                        };
                    } else if (imported.data) {
                        dataToImport = {
                            version: '2.0',
                            lastUpdated: new Date().toISOString(),
                            data: imported.data
                        };
                    }
                    if (!dataToImport) { alert('Invalid format'); return; }

                    window.masterData = dataToImport;

                    var saveOk = true;
                    if (typeof window.saveMasterData === 'function') {
                        saveOk = window.saveMasterData();
                    }
                    if (saveOk === false) {
                        var err = (typeof window.getLastSaveError === 'function')
                            ? window.getLastSaveError()
                            : null;
                        alert('Import parsed but save failed: ' +
                            (err && err.message ? err.message : 'unknown error'));
                    }

                    if (window.LocationState && typeof window.LocationState.refresh === 'function') {
                        window.LocationState.refresh();
                    }
                    if (window.GovernmentState && typeof window.GovernmentState.hydrateFromMasterData === 'function') {
                        window.GovernmentState.hydrateFromMasterData();
                    }
                    if (window.RankState && typeof window.RankState.hydrateFromMasterData === 'function') {
                        var d = window.masterData.data || {};
                        window.RankState.hydrateFromMasterData(
                            Array.isArray(d.ranks) ? d.ranks : [],
                            (d.rankInheritanceRules
                                && typeof d.rankInheritanceRules === 'object'
                                && !Array.isArray(d.rankInheritanceRules))
                                ? d.rankInheritanceRules
                                : {}
                        );
                    }

                    Object.keys(TAB_RENDERERS).forEach(function(key) {
                        var btn = document.querySelector('.tab-btn[data-tab="' + key + '"]');
                        if (btn && btn.classList.contains('active')) {
                            TAB_RENDERERS[key]();
                        }
                    });

                    alert('Import successful!');
                } catch(err) {
                    alert('Invalid JSON: ' + err.message);
                }
            };
            reader.readAsText(file);
            this.value = '';
        });

        // --- Initial render ---
        injectIcons();

        if (window.LocationTypeManager) {
            window.LocationTypeManager.renderTypeList('tab-locationtypes');
        }

    })();
</script>

<!-- ============================================================ -->
<!-- THEME SWITCHER (Shared Dropdown Logic)                       -->
<!-- ============================================================ -->
<script>
(function () {
    'use strict';

    var themeBtn  = document.getElementById('themeBtn');
    var themeMenu = document.getElementById('themeMenu');
    var themeName = document.getElementById('themeName');

    var switcher = window.ThemeSwitcher;
    if (!switcher) return;

    function updateLabel(id) {
        var label = id.charAt(0).toUpperCase() + id.slice(1).replace(/-/g, ' ');
        if (themeName) themeName.textContent = label;
    }

    function buildMenu() {
        var html = '';
        for (var i = 0; i < switcher.themes.length; i++) {
            var id = switcher.themes[i];
            var label = id.charAt(0).toUpperCase() + id.slice(1).replace(/-/g, ' ');
            html += '<li role="none"><button role="menuitem" type="button" data-theme-id="' +
                id + '">' + label + '</button></li>';
        }
        if (themeMenu) themeMenu.innerHTML = html;
    }

    function openMenu() {
        if (!themeMenu) return;
        themeMenu.hidden = false;
        themeBtn.setAttribute('aria-expanded', 'true');
    }
    function closeMenu() {
        if (!themeMenu) return;
        themeMenu.hidden = true;
        themeBtn.setAttribute('aria-expanded', 'false');
    }

    if (themeBtn) {
        themeBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            if (themeMenu.hidden) openMenu(); else closeMenu();
        });
    }

    if (themeMenu) {
        themeMenu.addEventListener('click', function (e) {
            var btn = e.target.closest('[data-theme-id]');
            if (!btn) return;
            var id = btn.getAttribute('data-theme-id');
            switcher.apply(id);
            updateLabel(id);
            closeMenu();
        });
    }

    document.addEventListener('click', function (e) {
        if (themeMenu && !themeMenu.hidden) {
            if (themeMenu.contains(e.target)) return;
            if (e.target === themeBtn) return;
            closeMenu();
        }
    });

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && themeMenu && !themeMenu.hidden) {
            closeMenu();
        }
    });

    buildMenu();
    var saved = switcher.getSaved();
    if (saved) updateLabel(saved);

})();
</script>
