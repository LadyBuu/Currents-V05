<html lang="en" data-theme="dark">

    <meta charset="UTF-8" />

    <title>Settlement Manager</title>

    <!-- 1. Theme Bootstrapper (MUST LOAD FIRST) -->
    <script src="js/core/theme-boot.js"></script>

    <!-- 2. Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- 3. Shared stylesheets (external, per request) -->
    <link rel="stylesheet" href="css/themes.css" />
    <link rel="stylesheet" href="css/common.css" />

    <style>
        /* ==================================================================
           SETTLEMENT MANAGER — INLINE STYLES
           ==================================================================
           Structurally identical to Location Manager. All color/radius/
           shadow/font values come from themes.css. The only additions
           here over Location Manager are the settlement-specific
           sub-tab body classes (.sct-*) that the eleven tab renderers
           already emit; no styling block inside any tab renderer is
           required to change.
           ================================================================== */

        /* ---- App shell ---- */
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--text);
            font-family: var(--f-body);
            font-size: 16px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .topbar {
            position: relative;
            z-index: 100;
            flex-shrink: 0;
            background: var(--bg2);
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border);
            min-height: 48px;
            flex-wrap: wrap;
        }

        .world-app {
            display: flex;
            flex-direction: row;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        .locations-sidebar {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg2);
            border-right: 1px solid var(--border);
            width: 280px;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--bg3);
        }
        .sidebar-header h3 {
            margin: 0;
            font-family: var(--f-display);
            font-size: 0.65rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sidebar-header h3 svg {
            width: 1em;
            height: 1em;
            fill: currentColor;
        }

        .place-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            min-height: 0;
        }

        .main-panel {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
        }

        .tab-content-wrapper {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px 24px;
            background: var(--bg);
        }

        /* ---- Sidebar tree — indent + border guide ---- */
        .place-list .location-tree-children,
        .locations-sidebar .location-tree-children {
            margin-left: 0 !important;
            padding-left: 16px !important;
            border-left: 1px solid var(--border-light) !important;
            display: none;
        }
        .place-list .location-tree-children.is-expanded,
        .locations-sidebar .location-tree-children.is-expanded {
            display: block;
        }
        .place-list .location-tree-children .location-tree-children,
        .locations-sidebar .location-tree-children .location-tree-children {
            padding-left: 16px !important;
        }

        /* ---- Sidebar rows (fallback when LocationUI is absent) ---- */
        .place-list .place-item {
            padding: 6px 10px;
            cursor: pointer;
            border-radius: var(--radius);
            font-size: 0.78rem;
            color: var(--text);
            margin: 2px 0;
            transition: background-color 0.15s, color 0.15s;
        }
        .place-list .place-item:hover {
            background: var(--bg4);
        }
        .place-list .place-item.selected {
            background: var(--accent-dim);
            color: var(--accent-light);
            border-left: 3px solid var(--accent);
        }

        /* ---- Topbar buttons ---- */
        .tb-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 14px;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: var(--f-body);
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            line-height: 1.2;
            transition: border-color 0.15s ease, background-color 0.15s ease, color 0.15s ease;
        }
        .tb-btn svg {
            width: 0.9em;
            height: 0.9em;
            fill: currentColor;
        }
        .tb-btn:hover {
            border-color: var(--accent);
            background: var(--accent-dim);
            color: var(--accent-light);
        }
        .tb-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--accent-fg);
        }
        .tb-btn.primary:hover {
            background: var(--accent-dark);
            border-color: var(--accent-dark);
        }
        .tb-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }
        .tb-btn:disabled:hover {
            background: var(--bg2);
            border-color: var(--border);
            color: var(--text);
        }

        .topbar .title {
            font-family: var(--f-display);
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--accent);
            white-space: nowrap;
            letter-spacing: 0.02em;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .topbar .title svg {
            width: 1em;
            height: 1em;
            fill: currentColor;
        }
        .topbar .spacer {
            flex: 1;
            min-width: 12px;
        }
        .topbar .burger-menu {
            display: none;
            align-items: center;
            justify-content: center;
            padding: 4px 10px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            cursor: pointer;
        }
        .topbar .burger-menu:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* ---- Year input ---- */
        .year-input {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-family: var(--f-body);
            font-size: 0.7rem;
            line-height: 1.2;
        }
        .year-input label {
            font-family: var(--f-display);
            font-size: 0.55rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--dim);
            white-space: nowrap;
        }
        .year-input input {
            width: 64px;
            padding: 3px 6px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: calc(var(--radius) - 1px);
            color: var(--text);
            font-family: var(--f-mono);
            font-size: 0.7rem;
            text-align: right;
        }
        .year-input input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-soft);
        }
        .year-input input::-webkit-outer-spin-button,
        .year-input input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .year-input input[type=number] { -moz-appearance: textfield; }

        /* ---- Theme toggle ---- */
        .theme-toggle { position: relative; display: inline-flex; }
        .theme-toggle__btn { gap: 6px; }
        .theme-toggle__menu {
            position: absolute;
            top: calc(100% + 4px);
            right: 0;
            z-index: 9999;
            min-width: 160px;
            max-height: 60vh;
            padding: 4px;
            margin: 0;
            list-style: none;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow-y: auto;
        }
        .theme-toggle__menu[hidden] { display: none; }
        .theme-toggle__menu button {
            display: block;
            width: 100%;
            padding: 6px 12px;
            text-align: left;
            background: transparent;
            border: none;
            color: var(--text);
            font-family: var(--f-body);
            font-size: 0.7rem;
            border-radius: calc(var(--radius) - 2px);
            cursor: pointer;
            transition: background-color 0.15s ease;
        }
        .theme-toggle__menu button:hover,
        .theme-toggle__menu button:focus-visible {
            background: var(--accent-dim);
            color: var(--accent-light);
            outline: none;
        }

        /* ============================================================
           SUB-TAB STRIP — identical to Location Manager
           ============================================================ */
        .manager-subtabs {
            position: sticky;
            top: 0;
            display: flex;
            align-items: stretch;
            gap: 4px;
            padding: 8px 4px 0;
            margin: -20px -24px 20px;
            padding-left: 24px;
            padding-right: 24px;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            z-index: 10;
        }
        .manager-subtab {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 18px 11px;
            background: transparent;
            border: 1px solid transparent;
            border-bottom: none;
            border-radius: 6px 6px 0 0;
            color: var(--dim);
            font-family: var(--f-display);
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.06em;
            line-height: 1.15;
            white-space: nowrap;
            cursor: pointer;
            transition: color 0.15s ease, background-color 0.15s ease;
        }
        .manager-subtab::after {
            content: '';
            position: absolute;
            left: 0; right: 0; bottom: -1px;
            height: 2px;
            background: transparent;
            border-radius: 2px 2px 0 0;
            transition: background-color 0.15s ease;
        }
        .manager-subtab:hover {
            color: var(--accent-light);
            background: var(--accent-dim);
        }
        .manager-subtab:hover::after {
            background: var(--accent);
            opacity: 0.35;
        }
        .manager-subtab.active {
            color: var(--accent);
            background: var(--bg2);
            border-color: var(--border);
            border-bottom-color: transparent;
            font-weight: 600;
        }
        .manager-subtab.active::after {
            background: var(--accent);
            opacity: 1;
        }
        .manager-subtab-icon {
            display: inline-flex;
            width: 16px;
            height: 16px;
            align-items: center;
            justify-content: center;
            color: currentColor;
            flex-shrink: 0;
            opacity: 0.9;
        }
        .manager-subtab-icon svg {
            width: 100%;
            height: 100%;
            fill: currentColor;
        }
        .manager-subpanel {
            min-height: 200px;
            padding-top: 4px;
        }

        /* ---- Empty / loading (identical to Location Manager) ---- */
        .empty-state {
            padding: 48px 24px;
            text-align: center;
            color: var(--dim);
            font-size: 0.88rem;
            line-height: 1.6;
        }
        .loading {
            padding: 24px;
            text-align: center;
            color: var(--tmut);
            font-size: 0.85rem;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* ---- Modal chrome overrides (match Location Manager) ---- */
        .toast { box-shadow: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
        .modal-container { box-shadow: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
        .btn:hover { box-shadow: none !important; }
        .icon-svg { display: inline-block; width: 1em; height: 1em; vertical-align: middle; fill: currentColor; }

        /* ---- Sidebar overlay (mobile) ---- */
        .sidebar-overlay { display: none; }
        .sidebar-overlay.active {
            display: block;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 999;
        }

        /* ---- Responsive ---- */
        @media (max-width: 768px) {
            .topbar .burger-menu { display: inline-flex; }
            .topbar { padding: 6px 10px; gap: 6px; min-height: 42px; }
            .topbar .title { font-size: 0.75rem; }
            .topbar .tb-btn { padding: 3px 10px; font-size: 0.65rem; }
            .year-input { padding: 2px 6px; }
            .year-input label { display: none; }
            .year-input input { width: 52px; font-size: 0.65rem; }

            .world-app { flex-direction: column; }
            .locations-sidebar {
                position: fixed;
                top: 0; bottom: 0; left: 0;
                height: 100vh;
                width: 85%;
                max-width: 280px;
                z-index: 1000;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
                box-shadow: none;
            }
            .locations-sidebar.visible { transform: translateX(0); }
            .tab-content-wrapper { padding: 16px; }
            .manager-subtabs {
                margin: -16px -16px 16px;
                padding-left: 16px;
                padding-right: 16px;
            }
            .manager-subtab {
                flex: 1 1 auto;
                min-width: 0;
                padding: 10px 14px;
                font-size: 0.72rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .manager-subtab,
            .loading {
                animation: none;
                transition: none;
            }
        }
    </style>
</head>
<body>

<!-- TOPBAR                                                              -->
<!-- ================================================================== -->
<div class="topbar">
    <button id="menuToggle" class="burger-menu" type="button" aria-label="Toggle menu">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">

        <input type="number" id="yearInput" min="1" step="1" />

    </div>

    <button id="importBtn" class="tb-btn" type="button"></button>
    <button id="exportBtn" class="tb-btn" type="button"></button>

    <input type="file" id="fileInput" accept=".json" style="display:none;" />

    <div class="theme-toggle" role="group" aria-label="Theme">
        <button class="tb-btn theme-toggle__btn" id="themeBtn" type="button" aria-haspopup="menu" aria-expanded="false">
            <span aria-hidden="true">◐</span>
            <span id="themeName">Dark</span>
        </button>
        <ul class="theme-toggle__menu" id="themeMenu" role="menu" hidden></ul>
    </div>
</div>

<!-- ================================================================== -->

</div>

<!-- ================================================================
     BLOCK 31 — SUB-TAB HOST
     ================================================================
     Single registry, single dispatch entry point. Exactly the same
     shape as Location Manager's Block 25, expanded from five tabs
     to eleven. Each tab is a plain render(containerId, locationId)
     function.
     ================================================================ -->
<script>
(function () {
    'use strict';

    // ---- Registry -------------------------------------------------
    //
    // Each entry exposes render(containerId, locationId).
    // Where the underlying module exports a free function (crime,
    // residence), a thin wrapper adapts it. No global registration
    // protocol, no `SettlementTabs`, no `TabManager`.
    //
    // The `requiresSettlement` flag tells _dispatch whether a missing
    // settlement record is a legitimate UI state (render "no settlement
    // yet") or not. Every tab that reads SettlementQueries requires
    // the record; the residences tab does not (a location can have
    // residences without a settlement record) so it renders regardless.
    var SUBTABS = [
        {
            id: 'overview',
            label: 'Overview',
            icon: 'BOOK',
            requiresSettlement: true,
            render: function (containerId, locationId) {
                if (window.SettlementOverviewTab
                    && typeof window.SettlementOverviewTab.render === 'function') {
                    window.SettlementOverviewTab.render(containerId, locationId);
                }
            }
        },
        {
            id: 'features',
            label: 'Features',
            icon: 'GEAR',
            requiresSettlement: true,
            render: function (containerId, locationId) {
                if (window.SettlementFeaturesTab
                    && typeof window.SettlementFeaturesTab.render === 'function') {
                    window.SettlementFeaturesTab.render(containerId, locationId);
                }
            }
        },
        {
            id: 'economy',
            label: 'Economy',
            icon: 'COIN',
            requiresSettlement: true,
            render: function (containerId, locationId) {
                if (window.SettlementEconomyTab
                    && typeof window.SettlementEconomyTab.render === 'function') {
                    window.SettlementEconomyTab.render(containerId, locationId);
                }
            }
        },
        {
            id: 'religion',
            label: 'Religion',
            icon: 'CIRCLE_DOT',
            requiresSettlement: true,
            render: function (containerId, locationId) {
                if (window.SettlementReligionTab
                    && typeof window.SettlementReligionTab.render === 'function') {
                    window.SettlementReligionTab.render(containerId, locationId);
                }
            }
        },
        {
            id: 'industry',
            label: 'Industry',
            icon: 'GEAR',
            requiresSettlement: true,
            render: function (containerId, locationId) {
                if (window.SettlementIndustryTab
                    && typeof window.SettlementIndustryTab.render === 'function') {
                    window.SettlementIndustryTab.render(containerId, locationId);
                }
            }
        },
        {
            id: 'education',
            label: 'Education',
            icon: 'BOOK',
            requiresSettlement: true,
            render: function (containerId, locationId) {
                if (window.SettlementEducationTab
                    && typeof window.SettlementEducationTab.render === 'function') {
                    window.SettlementEducationTab.render(containerId, locationId);
                }
            }
        },
        {
            id: 'history',
            label: 'History',
            icon: 'CIRCLE_DOT',
            requiresSettlement: true,
            render: function (containerId, locationId) {
                if (window.SettlementHistoryTab
                    && typeof window.SettlementHistoryTab.render === 'function') {
                    window.SettlementHistoryTab.render(containerId, locationId);
                }
            }
        },
        {
            id: 'roles',
            label: 'Roles',
            icon: 'PERSON',
            requiresSettlement: true,
            render: function (containerId, locationId) {
                if (window.SettlementRolesTab
                    && typeof window.SettlementRolesTab.render === 'function') {
                    window.SettlementRolesTab.render(containerId, locationId);
                }
            }
        },
        {
            id: 'government',
            label: 'Government',
            icon: 'HOME',
            requiresSettlement: true,
            render: function (containerId, locationId) {
                if (window.GovernmentDetailsTab
                    && typeof window.GovernmentDetailsTab.render === 'function') {
                    window.GovernmentDetailsTab.render(containerId, locationId);
                }
            }
        },
        {
            id: 'crime',
            label: 'Crime',
            icon: 'WARNING',
            requiresSettlement: true,
            // The crime tab exports renderSettlementCrime(containerId, locationId)
            // as a free function and re-exports it as
            // window.renderSettlementCrime. The registry adapter calls
            // that free function. settlement-crime-tab.js also tries to
            // register itself with SettlementTabs; that attempt is a
            // no-op here because SettlementTabs is not defined.
            render: function (containerId, locationId) {
                if (typeof window.renderSettlementCrime === 'function') {
                    window.renderSettlementCrime(containerId, locationId);
                }
            }
        },
        {
            id: 'residences',
            label: 'Residences',
            icon: 'HOME',
            requiresSettlement: false,
            // Same pattern as crime: settlement-residence-tab.js
            // exports renderSettlementResidences(containerId, locationId)
            // as a free function. Residences can exist at a location
            // that has no settlement record, so this tab does not gate
            // on the settlement record.
            render: function (containerId, locationId) {
                if (typeof window.renderSettlementResidences === 'function') {
                    window.renderSettlementResidences(containerId, locationId);
                }
            }
        }
    ];

    var _activeSubtabId = 'overview';
    var _currentLocationId = null;

    // ---- Icon helpers (same as Location Manager) ------------------
    function _icon(name) {
        if (typeof window.getIcon === 'function') {
            try {
                var s = window.getIcon(name);
                if (typeof s === 'string') return s;
            } catch (e) { /* ignore */ }
        }
        return '';
    }
    function _esc(s) {
        return typeof window.escapeHtml === 'function'
            ? window.escapeHtml(s)
            : String(s == null ? '' : s);
    }

    // ---- Settlement presence check -------------------------------
    //
    // A single source of truth for "does this location have a
    // settlement record". Uses SettlementQueries.getSettlementData
    // (the canonical accessor). A missing record is a legitimate UI
    // state; tabs that require it render the "create a settlement"
    // message instead of throwing or rendering a hollow shell.
    function _locationHasSettlement(locationId) {
        if (!locationId) return false;
        if (!window.SettlementQueries
            || typeof window.SettlementQueries.getSettlementData !== 'function') {
            return false;
        }
        try {
            return window.SettlementQueries.getSettlementData(locationId) !== null;
        } catch (e) {
            return false;
        }
    }

    // ---- Find a sub-tab by id ------------------------------------
    function _findSubtab(id) {
        for (var i = 0; i < SUBTABS.length; i++) {
            if (SUBTABS[i].id === id) return SUBTABS[i];
        }
        return null;
    }

    // ---- Render the sub-tab strip and dispatch -------------------
    //
    // Idempotent and reentrant. Rebuilds container.innerHTML from
    // scratch on every call, so an in-flight render from a prior
    // click cannot leave DOM behind. Exactly the same shape as
    // renderLocationManagerTab.
    function renderSubtabStrip(containerId, locationId) {
        var container = document.getElementById(containerId);
        if (!container) return;

        _currentLocationId = locationId || null;

        if (!locationId) {
            container.innerHTML =
                '<div class="empty-state">Select a location from the sidebar</div>';
            return;
        }

        var hasSettlement = _locationHasSettlement(locationId);

        // ---- Strip HTML ----
        var stripHtml = '<div class="manager-subtabs" role="tablist">';
        for (var i = 0; i < SUBTABS.length; i++) {
            var t = SUBTABS[i];
            var isActive = (t.id === _activeSubtabId);
            var cls = 'manager-subtab' + (isActive ? ' active' : '');
            var iconHtml = _icon(t.icon)
                ? '<span class="manager-subtab-icon">' + _icon(t.icon) + '</span>'
                : '';
            stripHtml +=
                '<button type="button" class="' + cls + '" ' +
                'data-subtab-id="' + _esc(t.id) + '" ' +
                'role="tab" aria-selected="' + (isActive ? 'true' : 'false') + '">' +
                iconHtml +
                '<span>' + _esc(t.label) + '</span>' +
                '</button>';
        }
        stripHtml += '</div>';
        stripHtml += '<div id="' + _esc(containerId) + '-subpanel" ' +
            'class="manager-subpanel" role="tabpanel"></div>';

        container.innerHTML = stripHtml;

        // ---- Strip click wiring ----
        var buttons = container.querySelectorAll('.manager-subtab');
        for (var b = 0; b < buttons.length; b++) {
            (function (btn) {
                btn.addEventListener('click', function () {
                    var id = btn.getAttribute('data-subtab-id');
                    if (!id || id === _activeSubtabId) return;
                    _activeSubtabId = id;
                    renderSubtabStrip(containerId, _currentLocationId);
                });
            })(buttons[b]);
        }

        // ---- Dispatch the active tab ----
        var activeTab = _findSubtab(_activeSubtabId);
        var subpanel = document.getElementById(containerId + '-subpanel');
        if (!subpanel) return;

        if (!activeTab) {
            subpanel.innerHTML = '<div class="empty-state">This tab is not available.</div>';
            return;
        }

        // The only precondition is "the location has a settlement
        // record, or the tab does not need one". This mirrors the
        // Location Manager's implicit precondition (a place exists).
        if (activeTab.requiresSettlement && !hasSettlement) {
            subpanel.innerHTML =
                '<div class="empty-state">' +
                'This location has no settlement yet. ' +
                'Click <strong>Add Settlement</strong> in the topbar to create one.' +
                '</div>';
            return;
        }

        try {
            activeTab.render(containerId + '-subpanel', locationId);
        } catch (err) {
            if (typeof console !== 'undefined' && console.error) {
                console.error(
                    '[settlement-manager] tab "' + activeTab.id + '" threw:', err
                );
            }
            subpanel.innerHTML =
                '<div class="empty-state">' +
                'Could not render this tab. See console for details.' +
                '</div>';
        }
    }

    // ---- Public entry point used by the manager init block ------
    window.renderSettlementManagerTab = function (containerId, locationId) {
        renderSubtabStrip(containerId, locationId);
    };

    // ---- Public "activate a specific tab then render" -----------
    //
    // Used by the topbar Add Settlement button to jump to Overview
    // after creating a settlement.
    window.activateSettlementSubtab = function (tabId, containerId, locationId) {
        if (!_findSubtab(tabId)) return;
        _activeSubtabId = tabId;
        renderSubtabStrip(containerId, locationId);
    };
})();
</script>

<!-- ================================================================
     BLOCK 32 — MANAGER INIT
     (mirrors Location Manager's init: setupUIText, setupYearControl,
      setupSidebar, setupTopBarActions, pickInitialSelection,
      selectLocation with in-place selection toggle, theme switcher)
     ================================================================ -->
<script>
(function () {
    'use strict';

    function getIcon(name) {
        return (window.Icons && window.Icons[name]) ? window.Icons[name] : '';
    }
    function iconWithText(icon, text) {
        if (!icon) return text || '';
        return '<span style="display:inline-flex;align-items:center;gap:4px;vertical-align:middle;">' +
               icon + '<span>' + (text || '') + '</span></span>';
    }
    function showToast(msg, type) {
        if (typeof window.showToast === 'function') window.showToast(msg, type);
    }

    var currentPlaceId = null;
    var isInitialized = false;

    // =========================================================================
    // 1. TOPBAR TEXT
    // =========================================================================

    function setupUIText() {
        var title = document.getElementById('settlementManagerTitle');
        if (title) title.innerHTML = iconWithText(getIcon('HOME'), ' SETTLEMENT MANAGER');

        var sidebarTitle = document.getElementById('sidebarTitle');
        if (sidebarTitle) sidebarTitle.innerHTML = iconWithText(getIcon('LOCATION'), ' LOCATIONS');

        var addLoc = document.getElementById('addLocationBtn');
        if (addLoc) addLoc.innerHTML = iconWithText(getIcon('PLUS'), ' Add Location');

        var addSet = document.getElementById('addSettlementBtn');
        if (addSet) addSet.innerHTML = iconWithText(getIcon('PLUS'), ' Add Settlement');

        var importBtn = document.getElementById('importBtn');
        if (importBtn) importBtn.innerHTML = iconWithText(getIcon('ARROW_RIGHT'), ' Import');

        var exportBtn = document.getElementById('exportBtn');
        if (exportBtn) exportBtn.innerHTML = iconWithText(getIcon('ARROW_RIGHT'), ' Export');

        var loadingText = document.getElementById('loadingText');
        if (loadingText) loadingText.textContent = 'Loading locations…';

        var emptyState = document.getElementById('emptyStateText');
        if (emptyState) emptyState.textContent = 'Select a location from the sidebar';
    }

    // =========================================================================
    // 2. YEAR CONTROL
    // =========================================================================

    function setupYearControl() {
        var input = document.getElementById('yearInput');
        var btn = document.getElementById('setYearBtn');
        if (!input || !btn) return;

        function syncFromCanonical() {
            try {
                var y = (typeof window.getCurrentYear === 'function')
                    ? window.getCurrentYear()
                    : (window.masterData && window.masterData.data
                        ? window.masterData.data.currentYear
                        : null);
                if (typeof y === 'number' && isFinite(y)) {
                    input.value = String(y);
                }
            } catch (e) { /* ignore */ }
        }
        syncFromCanonical();

        function applyYear() {
            var raw = input.value;
            var y = parseInt(raw, 10);
            if (!isFinite(y)) {
                showToast('Enter a valid year', 'error');
                return;
            }
            if (typeof window.isValidYear === 'function' && window.isValidYear(y) !== true) {
                showToast('Year out of range', 'error');
                return;
            }

            var applied = false;
            if (typeof window.setCurrentYear === 'function') {
                try {
                    var result = window.setCurrentYear(y);
                    if (result === false) {
                        showToast('Could not set year', 'error');
                        return;
                    }
                    applied = true;
                } catch (e) {
                    showToast('Set year failed: ' + (e.message || 'unknown'), 'error');
                    return;
                }
            }

            if (!applied) {
                if (!window.masterData || !window.masterData.data) {
                    showToast('Storage not initialized', 'error');
                    return;
                }
                window.masterData.data.currentYear = y;
                if (typeof window.markDataDirty === 'function') {
                    try { window.markDataDirty(); } catch (e) { /* ignore */ }
                }
                if (typeof window.saveMasterData === 'function') {
                    try { window.saveMasterData(); } catch (e) { /* ignore */ }
                }
                applied = true;
            }

            if (applied) {
                showToast('Year set to ' + y, 'success');
                syncFromCanonical();
                if (typeof window.renderSettlementManagerTab === 'function'
                    && currentPlaceId) {
                    try { window.renderSettlementManagerTab('panelContent', currentPlaceId); }
                    catch (e) { /* ignore */ }
                }
                setupSidebar();
            }
        }

        btn.addEventListener('click', applyYear);
        input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                applyYear();
            }
        });
    }

    // =========================================================================
    // 3. SIDEBAR
    // =========================================================================

    function setupSidebar() {
        var container = document.getElementById('placeList');
        if (!container) return;

        if (window.LocationUI && typeof window.LocationUI.renderLocationList === 'function') {
            try {
                window.LocationUI.renderLocationList('placeList', {
                    selectedId: currentPlaceId,
                    onSelect: function (placeOrId) {
                        var id = (typeof placeOrId === 'string')
                            ? placeOrId
                            : (placeOrId && placeOrId.id ? placeOrId.id : null);
                        if (!id) return;
                        selectLocation(id);
                    }
                });
                return;
            } catch (e) {
                console.error('[settlement-manager] renderLocationList failed:', e);
            }
        }

        var places = (typeof window.getPlaces === 'function') ? window.getPlaces() : [];
        if (places && places.length > 0) {
            var html = '';
            for (var i = 0; i < places.length; i++) {
                var p = places[i];
                var sel = (p.id === currentPlaceId);
                html += '<div class="place-item' + (sel ? ' selected' : '') +
                        '" data-place-id="' + p.id + '">' +
                        (p.displayName || p.name || 'Unknown') +
                        '</div>';
            }
            container.innerHTML = html;
            var items = container.querySelectorAll('.place-item');
            for (var j = 0; j < items.length; j++) {
                (function (item) {
                    item.addEventListener('click', function () {
                        var placeId = this.dataset.placeId;
                        if (placeId) selectLocation(placeId);
                    });
                })(items[j]);
            }
        } else {
            container.innerHTML = '<div class="empty-state">No locations found</div>';
        }
    }

    function _applySidebarSelection(previousId, nextId) {
        var container = document.getElementById('placeList');
        if (!container) return;

        var newRow = container.querySelector(
            '.location-tree-item[data-node-id="' + _cssEscape(nextId) + '"]'
        );

        if (!newRow) {
            setupSidebar();
            return;
        }

        if (previousId) {
            var prevRow = container.querySelector(
                '.location-tree-item[data-node-id="' + _cssEscape(previousId) + '"]'
            );
            if (prevRow) prevRow.classList.remove('is-selected');
        }

        newRow.classList.add('is-selected');
    }

    function _cssEscape(s) {
        if (typeof window.CSS !== 'undefined' &&
            typeof window.CSS.escape === 'function') {
            return window.CSS.escape(s);
        }
        return String(s).replace(/([^A-Za-z0-9_-])/g, '\\$1');
    }

    // =========================================================================
    // 4. SELECT LOCATION
    // =========================================================================

    function selectLocation(id) {
        if (!id) return;

        if (id === currentPlaceId) {
            if (typeof window.renderSettlementManagerTab === 'function') {
                try { window.renderSettlementManagerTab('panelContent', id); }
                catch (e) { console.error(e); }
            }
            return;
        }

        var previousId = currentPlaceId;
        currentPlaceId = id;

        if (window.SettlementUIState &&
            typeof window.SettlementUIState.setSelectedLocationId === 'function') {
            try { window.SettlementUIState.setSelectedLocationId(id); }
            catch (e) { /* ignore */ }
        }

        _applySidebarSelection(previousId, id);

        if (typeof window.renderSettlementManagerTab === 'function') {
            try { window.renderSettlementManagerTab('panelContent', id); }
            catch (e) { console.error(e); }
        }

        if (window.innerWidth <= 768) closeSidebar();
    }

    function closeSidebar() {
        var s = document.getElementById('locationsSidebar');
        var o = document.getElementById('sidebarOverlay');
        if (s) s.classList.remove('visible');
        if (o) o.classList.remove('active');
    }
    function openSidebar() {
        var s = document.getElementById('locationsSidebar');
        var o = document.getElementById('sidebarOverlay');
        if (s) s.classList.add('visible');
        if (o) o.classList.add('active');
    }
    function toggleSidebar() {
        var s = document.getElementById('locationsSidebar');
        if (!s) return;
        if (s.classList.contains('visible')) closeSidebar();
        else openSidebar();
    }

    function pickInitialSelection() {
        if (currentPlaceId) return;
        if (!window.LocationQueries) return;
        try {
            var roots = window.LocationQueries.getRootPlaces({});
            if (roots && roots.length > 0) selectLocation(roots[0].id);
        } catch (e) {
            console.error('[settlement-manager] initial selection failed:', e);
        }
    }

    // =========================================================================
    // 5. TOPBAR ACTIONS
    // =========================================================================

    function setupTopBarActions() {
        var addLocBtn = document.getElementById('addLocationBtn');
        if (addLocBtn) addLocBtn.onclick = function () {
            if (typeof window.openAddPlaceModal !== 'function') {
                showToast('Add modal unavailable', 'error');
                return;
            }
            window.openAddPlaceModal(null, function (newId) {
                setupSidebar();
                if (newId) selectLocation(newId);
            });
        };

        var addSetBtn = document.getElementById('addSettlementBtn');
        if (addSetBtn) addSetBtn.onclick = function () {
            if (!currentPlaceId) {
                showToast('Select a location first', 'warning');
                return;
            }
            if (!window.SettlementFactory || typeof window.SettlementFactory.ensureSettlement !== 'function') {
                showToast('SettlementFactory not loaded', 'error');
                return;
            }
            try {
                var result = window.SettlementFactory.ensureSettlement(currentPlaceId);
                if (!result || result.success !== true) {
                    showToast('Could not create settlement: ' +
                        (result && result.code ? result.code : 'unknown'), 'error');
                    return;
                }
                // After creation, jump to the Overview tab. The strip
                // re-renders; the user sees the fresh overview rather
                // than whichever tab happened to be active before.
                if (typeof window.activateSettlementSubtab === 'function') {
                    window.activateSettlementSubtab('overview', 'panelContent', currentPlaceId);
                } else if (typeof window.renderSettlementManagerTab === 'function') {
                    window.renderSettlementManagerTab('panelContent', currentPlaceId);
                }
                if (result.created === true) {
                    showToast('Settlement created', 'success');
                }
            } catch (e) {
                console.error('[settlement-manager] createSettlement failed:', e);
                showToast('Could not create settlement: ' + (e.message || 'unknown'), 'error');
            }
        };

        var importBtn = document.getElementById('importBtn');
        var fileInput = document.getElementById('fileInput');
        if (importBtn && fileInput) {
            importBtn.onclick = function () {
                fileInput.value = '';
                fileInput.click();
            };
            fileInput.onchange = function () {
                var file = this.files && this.files[0];
                if (!file) return;
                var reader = new FileReader();
                reader.onload = function (ev) {
                    try {
                        var parsed = JSON.parse(ev.target.result);
                        var dataToInstall = null;
                        if (parsed && parsed.data && parsed.data.places !== undefined) dataToInstall = parsed.data;
                        else if (parsed && parsed.places !== undefined) dataToInstall = parsed;
                        else if (parsed && parsed.data) dataToInstall = parsed.data;
                        if (!dataToInstall) {
                            showToast('Unrecognized import format', 'error');
                            return;
                        }
                        if (typeof window.normalizeMasterData !== 'function') {
                            showToast('Schema module not available', 'error');
                            return;
                        }

                        window.masterData = window.normalizeMasterData({
                            schemaVersion: window.STORAGE_SCHEMA_VERSION,
                            savedAt: new Date().toISOString(),
                            data: dataToInstall
                        });
                        if (typeof window.invalidateAccessorCaches === 'function') window.invalidateAccessorCaches();
                        if (typeof window.markDataDirty === 'function') window.markDataDirty();
                        if (typeof window.saveMasterData === 'function' && !window.saveMasterData()) {
                            showToast('Save failed after import', 'error');
                            return;
                        }
                        if (window.LocationBootstrap && typeof window.LocationBootstrap.init === 'function') {
                            try { window.LocationBootstrap.init(); } catch (e) { /* ignore */ }
                        }
                        if (window.SettlementState && typeof window.SettlementState.rebuildIndexes === 'function') {
                            try { window.SettlementState.rebuildIndexes(); } catch (e) { /* ignore */ }
                        }
                        if (window.CrimeBootstrap && typeof window.CrimeBootstrap.reinit === 'function') {
                            try { window.CrimeBootstrap.reinit(); } catch (e) { /* ignore */ }
                        }
                        currentPlaceId = null;
                        setupSidebar();
                        pickInitialSelection();
                        if (typeof window.renderSettlementManagerTab === 'function') {
                            try { window.renderSettlementManagerTab('panelContent', currentPlaceId); }
                            catch (e) { /* ignore */ }
                        }
                        showToast('Import complete', 'success');
                    } catch (err) {
                        showToast('Invalid JSON: ' + err.message, 'error');
                    }
                };
                reader.onerror = function () { showToast('Failed to read file', 'error'); };
                reader.readAsText(file);
                this.value = '';
            };
        }

        var exportBtn = document.getElementById('exportBtn');
        if (exportBtn) exportBtn.onclick = function () {
            if (typeof window.exportToJSON !== 'function') {
                showToast('Export module not available', 'error');
                return;
            }
            if (!window.masterData) {
                showToast('No data to export', 'error');
                return;
            }
            try {
                window.exportToJSON(window.masterData, 'stillwaters');
                showToast('Export started', 'success');
            } catch (e) {
                showToast('Export failed: ' + (e.message || 'unknown'), 'error');
            }
        };
    }

    // =========================================================================
    // 6. BOOTSTRAP
    // =========================================================================

    function bootstrap() {
        if (isInitialized) return;
        isInitialized = true;

        setupUIText();
        setupTopBarActions();
        setupYearControl();

        if (typeof window.loadMasterData === 'function') window.loadMasterData();

        if (window.LocationBootstrap) {
            try { window.LocationBootstrap.init(); }
            catch (e) { console.error('LocationBootstrap.init failed:', e); }
        }
        if (window.SettlementState && typeof window.SettlementState.rebuildIndexes === 'function') {
            try { window.SettlementState.rebuildIndexes(); }
            catch (e) { console.error('SettlementState.rebuildIndexes failed:', e); }
        }
        if (window.ReligionBootstrap && typeof window.ReligionBootstrap.init === 'function') {
            try { window.ReligionBootstrap.init(); } catch (e) { /* ignore */ }
        }
        if (window.CrimeBootstrap && typeof window.CrimeBootstrap.init === 'function') {
            try { window.CrimeBootstrap.init(); } catch (e) { /* ignore */ }
        }
        if (window.IndustryBootstrap && typeof window.IndustryBootstrap.init === 'function') {
            try { window.IndustryBootstrap.init(); } catch (e) { /* ignore */ }
        }
        if (window.GovernmentBootstrap && typeof window.GovernmentBootstrap.init === 'function') {
            try { window.GovernmentBootstrap.init(); } catch (e) { /* ignore */ }
        }
        if (window.HouseholdBootstrap && typeof window.HouseholdBootstrap.init === 'function') {
            try { window.HouseholdBootstrap.init(); } catch (e) { /* ignore */ }
        }

        setTimeout(function () {
            setupSidebar();
            pickInitialSelection();

            if (!currentPlaceId && typeof window.renderSettlementManagerTab === 'function') {
                try { window.renderSettlementManagerTab('panelContent', null); }
                catch (e) { /* ignore */ }
            }

            var menuToggle = document.getElementById('menuToggle');
            if (menuToggle) menuToggle.addEventListener('click', toggleSidebar);
            var overlay = document.getElementById('sidebarOverlay');
            if (overlay) overlay.addEventListener('click', closeSidebar);
        }, 150);

        // React to masterData updates.
        if (typeof window.addEventListener === 'function') {
            window.addEventListener('masterDataUpdated', function () {
                setupSidebar();
                if (typeof window.renderSettlementManagerTab === 'function') {
                    try { window.renderSettlementManagerTab('panelContent', currentPlaceId); }
                    catch (e) { /* ignore */ }
                }
            });

            // Crime events refresh the tab when it's the active sub-tab.
            // The check is against the SUBTABS registry's active id,
            // which is exposed via the strip's aria-selected state.
            // Read it from the DOM to avoid adding a second state var.
            var _crimeEvents = [
                'crimeRecorded', 'crimeSolved', 'crimeDeleted',
                'vendettaCreated', 'vendettaDeath', 'vendettaEscalated',
                'vendettaResolved', 'vendettaDeleted'
            ];
            for (var ci = 0; ci < _crimeEvents.length; ci++) {
                (function (eventName) {
                    window.addEventListener(eventName, function () {
                        var active = document.querySelector('.manager-subtab.active');
                        if (!active) return;
                        var activeId = active.getAttribute('data-subtab-id');
                        if (activeId !== 'crime') return;
                        if (typeof window.renderSettlementManagerTab === 'function') {
                            try { window.renderSettlementManagerTab('panelContent', currentPlaceId); }
                            catch (e) { /* ignore */ }
                        }
                    });
                })(_crimeEvents[ci]);
            }
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bootstrap);
    } else {
        bootstrap();
    }
})();
</script>

<!-- ================================================================
     BLOCK 33 — THEME SWITCHER UI
     ================================================================ -->
<script>
(function () {
    'use strict';
    var themeBtn = document.getElementById('themeBtn');
    var themeMenu = document.getElementById('themeMenu');
    var themeName = document.getElementById('themeName');
    var switcher = window.ThemeSwitcher;
    if (!switcher) return;

    function updateLabel(id) {
        var label = id.charAt(0).toUpperCase() + id.slice(1).replace(/-/g, ' ');
        if (themeName) themeName.textContent = label;
    }
    function buildMenu() {
        var html = '';
        for (var i = 0; i < switcher.themes.length; i++) {
            var id = switcher.themes[i];
            var label = id.charAt(0).toUpperCase() + id.slice(1).replace(/-/g, ' ');
            html += '<li role="none"><button role="menuitem" type="button" data-theme-id="' + id + '">' + label + '</button></li>';
        }
        if (themeMenu) themeMenu.innerHTML = html;
    }
    function openMenu()  { if (!themeMenu) return; themeMenu.hidden = false; themeBtn.setAttribute('aria-expanded', 'true'); }
    function closeMenu() { if (!themeMenu) return; themeMenu.hidden = true; themeBtn.setAttribute('aria-expanded', 'false'); }

    if (themeBtn) themeBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        if (themeMenu.hidden) openMenu(); else closeMenu();
    });
    if (themeMenu) themeMenu.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-theme-id]');
        if (!btn) return;
        var id = btn.getAttribute('data-theme-id');
        switcher.apply(id); updateLabel(id); closeMenu();
    });
    document.addEventListener('click', function (e) {
        if (themeMenu && !themeMenu.hidden) {
            if (themeMenu.contains(e.target)) return;
            if (e.target === themeBtn) return;
            closeMenu();
        }
    });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && themeMenu && !themeMenu.hidden) closeMenu();
    });

    buildMenu();
    var saved = switcher.getSaved();
    if (saved) updateLabel(saved);
})();
</script>
