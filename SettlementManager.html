    <!-- ============================================================ -->
    <!-- THEME SWITCHER                                               -->
    <!-- ============================================================ -->
    <script>
    (function () {
        'use strict';

        var STORAGE_KEY = 'stillwaters_theme';

        var THEMES = [
            { id: 'dark',            label: 'Dark' },
            { id: 'light',           label: 'Light' },
            { id: 'vaporwave',       label: 'Vaporwave' },
            { id: 'pastel',          label: 'Pastel' },
            { id: 'carnival',        label: 'Carnival' },
            { id: 'maximal',         label: 'Maximal' },
            { id: 'gits',            label: 'GITS' },
            { id: 'nouveau',         label: 'Nouveau' },
            { id: 'ukiyo-e',         label: 'Ukiyo-e' },
            { id: 'nature',          label: 'Nature' },
            { id: 'kmt',             label: 'KMT' },
            { id: 'gaslight',        label: 'Gaslight' },
            { id: 'grotesque',       label: 'Grotesque' },
            { id: 'illuminated',     label: 'Illuminated' },
            { id: 'discowing',       label: 'Discowing' },
            { id: 'choc-cake',       label: 'Choc Cake' },
            { id: 'dada',            label: 'Dada' },
            { id: 'brutalist',       label: 'Brutalist' },
            { id: 'orchestrion',     label: 'Orchestrion' },
            { id: 'rococo',          label: 'Rococo' },
            { id: 'nautical-tile',   label: 'Nautical Tile' }
        ];

        var byId = {};
        for (var i = 0; i < THEMES.length; i++) byId[THEMES[i].id] = THEMES[i];

        var themeBtn  = document.getElementById('themeBtn');
        var themeMenu = document.getElementById('themeMenu');
        var themeName = document.getElementById('themeName');

        function apply(id) {
            if (!byId[id]) id = 'dark';
            document.documentElement.setAttribute('data-theme', id);
            themeName.textContent = byId[id].label;
            try { localStorage.setItem(STORAGE_KEY, id); } catch (e) {}
        }

        function buildMenu() {
            var html = '';
            for (var i = 0; i < THEMES.length; i++) {
                html += '<li role="none"><button role="menuitem" type="button" data-theme-id="' +
                    THEMES[i].id + '">' + THEMES[i].label + '</button></li>';
            }
            themeMenu.innerHTML = html;
        }

        function openMenu() {
            themeMenu.hidden = false;
            themeBtn.setAttribute('aria-expanded', 'true');
        }
        function closeMenu() {
            themeMenu.hidden = true;
            themeBtn.setAttribute('aria-expanded', 'false');
        }

        themeBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            if (themeMenu.hidden) openMenu(); else closeMenu();
        });
        themeMenu.addEventListener('click', function (e) {
            var btn = e.target.closest('[data-theme-id]');
            if (!btn) return;
            apply(btn.getAttribute('data-theme-id'));
            closeMenu();
        });
        document.addEventListener('click', function (e) {
            if (themeMenu.hidden) return;
            if (themeMenu.contains(e.target)) return;
            if (e.target === themeBtn) return;
            closeMenu();
        });
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && !themeMenu.hidden) closeMenu();
        });

        var saved = null;
        try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) {}
        buildMenu();

        if (saved && byId[saved]) {
            apply(saved);
        } else {
            var mq = window.matchMedia('(prefers-color-scheme: light)');
            apply(mq.matches ? 'light' : 'dark');
            mq.addEventListener('change', function (ev) {
                var check;
                try { check = localStorage.getItem(STORAGE_KEY); } catch (e) {}
                if (!check) apply(ev.matches ? 'light' : 'dark');
            });
        }

        window.ThemeSwitcher = { apply: apply, themes: THEMES.slice() };
    })();
    </script>

        var yearInput       = document.getElementById('yearInput');
        var setYearBtn      = document.getElementById('setYearBtn');
        var addLocationBtn  = document.getElementById('addLocationBtn');
        var addSettlementBtn= document.getElementById('addSettlementBtn');

        var tabPanes = {
            location:   document.getElementById('tab-location'),
            overview:   document.getElementById('tab-overview'),
            features:   document.getElementById('tab-features'),
            economy:    document.getElementById('tab-economy'),
            religion:   document.getElementById('tab-religion'),
            industry:   document.getElementById('tab-industry'),
            education:  document.getElementById('tab-education'),
            history:    document.getElementById('tab-history'),
            roles:      document.getElementById('tab-roles'),
            government: document.getElementById('tab-government'),
            crime:      document.getElementById('tab-crime')
        };

        var selectedId    = null;
        var isInitialized = false;

        // -----------------------------------------------------------------
        // Bootstrapping
        // -----------------------------------------------------------------
        function bootstrap() {
            if (isInitialized) return;
            isInitialized = true;

            if (window.LocationBootstrap && typeof window.LocationBootstrap.init === 'function') {
                try { window.LocationBootstrap.init(); } catch (e) {
                    console.error('[settlement-manager] location bootstrap failed:', e);
                }
            }
            if (window.SettlementState && typeof window.SettlementState.rebuildIndexes === 'function') {
                try { window.SettlementState.rebuildIndexes(); } catch (e) {
                    console.error('[settlement-manager] settlement index rebuild failed:', e);
                }
            }
            if (window.ReligionBootstrap && typeof window.ReligionBootstrap.init === 'function') {
                try { window.ReligionBootstrap.init(); } catch (e) {
                    console.error('[settlement-manager] religion bootstrap failed:', e);
                }
            }
            if (window.CrimeBootstrap && typeof window.CrimeBootstrap.init === 'function') {
                try { window.CrimeBootstrap.init(); } catch (e) {
                    console.error('[settlement-manager] crime bootstrap failed:', e);
                }
            }

            // Initialize SettlementTabs once. It wires tab-bar clicks and
            // renders the active tab. Its renderer registry was populated
            // by the self-registering tab files during script load.
            if (window.SettlementTabs && typeof window.SettlementTabs.init === 'function') {
                try { window.SettlementTabs.init(); } catch (e) {
                    console.error('[settlement-manager] SettlementTabs.init failed:', e);
                }
            }

            syncYearInput();
            renderTree();
            pickInitialSelection();
        }

        // -----------------------------------------------------------------
        // Tree
        // -----------------------------------------------------------------
        function renderTree() {
            if (!treeContainer) return;
            if (!window.LocationUI || typeof window.LocationUI.renderLocationList !== 'function') {
                treeContainer.innerHTML = '<div class="empty-state">Location UI not loaded.</div>';
                return;
            }
            try {
                window.LocationUI.renderLocationList('locationTreeContainer', {
                    selectedId: selectedId,
                    onSelect: function (place) {
                        if (!place || !place.id) return;
                        selectLocation(place.id);
                        if (window.innerWidth <= 768) closeSidebar();
                    }
                });
            } catch (e) {
                console.error('[settlement-manager] renderTree failed:', e);
                treeContainer.innerHTML = '<div class="error-state">Error loading locations.</div>';
            }
        }

        function pickInitialSelection() {
            if (selectedId) return;
            if (!window.LocationQueries) return;
            try {
                var roots = window.LocationQueries.getRootPlaces({});
                if (roots && roots.length > 0) {
                    selectLocation(roots[0].id);
                }
            } catch (e) {
                console.error('[settlement-manager] initial selection failed:', e);
            }
        }

        function selectLocation(id) {
            if (!id) return;
            selectedId = id;

            if (window.SettlementUIState && typeof window.SettlementUIState.setSelectedLocationId === 'function') {
                window.SettlementUIState.setSelectedLocationId(id);
            }

            renderTree();

            // Re-render whatever tab is currently active. Delegated to
            // SettlementTabs, which owns the active-tab id and the
            // renderer registry.
            if (window.SettlementTabs && typeof window.SettlementTabs.renderActiveTab === 'function') {
                try { window.SettlementTabs.renderActiveTab(); }
                catch (e) {
                    console.error('[settlement-manager] renderActiveTab failed:', e);
                }
            }
        }

        // -----------------------------------------------------------------
        // Sidebar
        // -----------------------------------------------------------------
        function toggleSidebar() { if (sidebar) sidebar.classList.toggle('open'); }
        function closeSidebar()  { if (sidebar) sidebar.classList.remove('open'); }

        if (burgerBtn) burgerBtn.addEventListener('click', toggleSidebar);

        document.addEventListener('click', function (e) {
            if (window.innerWidth > 768) return;
            if (!sidebar) return;
            if (sidebar.contains(e.target)) return;
            if (e.target === burgerBtn) return;
            closeSidebar();
        });
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') closeSidebar();
        });
        window.addEventListener('resize', function () {
            if (window.innerWidth > 768) closeSidebar();
        });

        // -----------------------------------------------------------------
        // Year
        // -----------------------------------------------------------------
        function syncYearInput() {
            if (typeof window.getCurrentYear !== 'function') return;
            try { yearInput.value = String(window.getCurrentYear()); } catch (e) {}
        }

        if (setYearBtn) {
            setYearBtn.addEventListener('click', function () {
                if (typeof window.isValidYear !== 'function') return;
                var val = parseInt(yearInput.value, 10);
                if (isNaN(val)) { window.alert('Enter a valid year.'); return; }
                if (!window.isValidYear(val)) {
                    window.alert('Year is outside the allowed range.'); return;
                }
                if (window.masterData && window.masterData.data) {
                    window.masterData.data.currentYear = val;
                }
                if (typeof window.markDataDirty === 'function') window.markDataDirty();
                if (typeof window.saveMasterData === 'function') window.saveMasterData();
                if (window.SettlementTabs && typeof window.SettlementTabs.renderActiveTab === 'function') {
                    window.SettlementTabs.renderActiveTab();
                }
            });
        }

        // -----------------------------------------------------------------
        // Add location / settlement
        // -----------------------------------------------------------------
        if (addLocationBtn) {
            addLocationBtn.addEventListener('click', function () {
                if (typeof window.openAddPlaceModal !== 'function') {
                    window.alert('Add Location modal not loaded.'); return;
                }
                window.openAddPlaceModal(null, function (newId) {
                    if (newId) {
                        renderTree();
                        selectLocation(newId);
                    }
                });
            });
        }

        if (addSettlementBtn) {
            addSettlementBtn.addEventListener('click', function () {
                if (!selectedId) { window.alert('Select a location first.'); return; }
                if (!window.SettlementFactory || typeof window.SettlementFactory.ensureSettlement !== 'function') {
                    window.alert('SettlementFactory not loaded.'); return;
                }
                try {
                    var result = window.SettlementFactory.ensureSettlement(selectedId);
                    if (!result || result.success !== true) {
                        window.alert('Could not create settlement: ' +
                            (result && result.code ? result.code : 'unknown'));
                        return;
                    }
                    if (window.SettlementTabs && typeof window.SettlementTabs.activateTab === 'function') {
                        window.SettlementTabs.activateTab('overview');
                    }
                } catch (e) {
                    console.error('[settlement-manager] createSettlement failed:', e);
                    window.alert('Could not create settlement: ' + (e.message || 'unknown'));
                }
            });
        }

        // -----------------------------------------------------------------
        // Export / Import
        // -----------------------------------------------------------------
        if (exportBtn) {
            exportBtn.addEventListener('click', function () {
                if (typeof window.exportToJSON !== 'function') {
                    window.alert('Export module not available.'); return;
                }
                if (!window.masterData) {
                    window.alert('No data to export.'); return;
                }
                try { window.exportToJSON(window.masterData, 'stillwaters'); }
                catch (e) { window.alert('Export failed: ' + (e.message || 'unknown')); }
            });
        }

        if (importBtn && fileInput) {
            importBtn.addEventListener('click', function () {
                fileInput.value = '';
                fileInput.click();
            });

            fileInput.addEventListener('change', function () {
                var file = this.files && this.files[0];
                if (!file) return;

                var reader = new FileReader();
                reader.onload = function (ev) {
                    try {
                        var parsed = JSON.parse(ev.target.result);
                        var dataToInstall = null;
                        if (parsed && parsed.data && parsed.data.places !== undefined) {
                            dataToInstall = parsed.data;
                        } else if (parsed && parsed.places !== undefined) {
                            dataToInstall = parsed;
                        } else if (parsed && parsed.data) {
                            dataToInstall = parsed.data;
                        }
                        if (!dataToInstall) {
                            window.alert('Unrecognized import format.'); return;
                        }
                        if (typeof window.normalizeMasterData !== 'function') {
                            window.alert('Schema module not available.'); return;
                        }

                        window.masterData = window.normalizeMasterData({
                            schemaVersion: window.STORAGE_SCHEMA_VERSION,
                            savedAt: new Date().toISOString(),
                            data: dataToInstall
                        });

                        if (typeof window.invalidateAccessorCaches === 'function') {
                            window.invalidateAccessorCaches();
                        }
                        if (typeof window.markDataDirty === 'function') window.markDataDirty();
                        if (typeof window.saveMasterData === 'function' && !window.saveMasterData()) {
                            window.alert('Save failed after import.'); return;
                        }

                        if (window.LocationBootstrap && typeof window.LocationBootstrap.init === 'function') {
                            try { window.LocationBootstrap.init(); } catch (e) {}
                        }
                        if (window.SettlementState && typeof window.SettlementState.rebuildIndexes === 'function') {
                            try { window.SettlementState.rebuildIndexes(); } catch (e) {}
                        }
                        if (window.CrimeBootstrap && typeof window.CrimeBootstrap.reinit === 'function') {
                            try { window.CrimeBootstrap.reinit(); } catch (e) {}
                        }

                        selectedId = null;
                        syncYearInput();
                        renderTree();
                        pickInitialSelection();

                        if (window.SettlementTabs && typeof window.SettlementTabs.renderActiveTab === 'function') {
                            window.SettlementTabs.renderActiveTab();
                        }

                        window.alert('Import complete.');
                    } catch (err) {
                        window.alert('Invalid JSON: ' + err.message);
                    }
                };
                reader.onerror = function () { window.alert('Failed to read file.'); };
                reader.readAsText(file);
                this.value = '';
            });
        }

        // -----------------------------------------------------------------
        // Cross-domain events
        // -----------------------------------------------------------------
        if (typeof window.addEventListener === 'function') {
            window.addEventListener('masterDataUpdated', function () {
                renderTree();
                if (window.SettlementTabs && typeof window.SettlementTabs.renderActiveTab === 'function') {
                    window.SettlementTabs.renderActiveTab();
                }
            });

            var _crimeEvents = [
                'crimeRecorded', 'crimeSolved', 'crimeDeleted',
                'vendettaCreated', 'vendettaDeath', 'vendettaEscalated',
                'vendettaResolved', 'vendettaDeleted'
            ];
            for (var ci = 0; ci < _crimeEvents.length; ci++) {
                (function (eventName) {
                    window.addEventListener(eventName, function () {
                        if (window.SettlementUIState
                            && window.SettlementUIState.getActiveTabId
                            && window.SettlementUIState.getActiveTabId() === 'crime'
                            && window.SettlementTabs
                            && typeof window.SettlementTabs.renderActiveTab === 'function') {
                            window.SettlementTabs.renderActiveTab();
                        }
                    });
                })(_crimeEvents[ci]);
            }
        }

        // -----------------------------------------------------------------
        // Init
        // -----------------------------------------------------------------
        function onDomReady(fn) {
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', fn);
            } else {
                fn();
            }
        }
        onDomReady(bootstrap);

    })();
    </script>

</body>
</html>
