<!DOCTYPE html>
<html lang="en" data-theme="default">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settlement Manager</title>

    <!-- Theme tokens first, then structural CSS, then per-domain CSS. -->
    <link rel="stylesheet" href="css/themes.css" />
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/settlement.css" />
    <link rel="stylesheet" href="css/location-list.css" />
    <link rel="stylesheet" href="css/location-sidebar.css" />
    <link rel="stylesheet" href="css/selectors.css" />
    <link rel="stylesheet" href="css/uiList.css" />
</head>
<body class="settlement-manager">

    <!-- TOP BAR -->
    <header class="topbar" role="banner">
        <button class="burger-btn" id="burgerBtn" type="button" aria-label="Toggle sidebar">☰</button>
        <h1 class="title">Settlement Manager</h1>
        <span class="spacer" aria-hidden="true"></span>

        <button class="btn" id="addLocationBtn" type="button">+ Add Location</button>
        <button class="btn" id="addSettlementBtn" type="button">+ Add Settlement</button>

        <label class="year-label" for="yearInput">Year</label>
        <input type="number" class="year-input" id="yearInput" name="yearInput" inputmode="numeric" />
        <button class="btn" id="setYearBtn" type="button">Set</button>
        <button class="btn" id="exportBtn" type="button">Export</button>
        <button class="btn" id="importBtn" type="button">Import</button>
        <input type="file" id="fileInput" accept=".json" class="visually-hidden" tabindex="-1" />

        <!-- Theme switcher -->
        <div class="theme-toggle" role="group" aria-label="Theme">
            <button class="btn theme-toggle__btn" id="themeBtn" type="button" aria-haspopup="menu" aria-expanded="false">
                <span class="theme-toggle__icon" aria-hidden="true">◐</span>
                <span class="theme-toggle__name" id="themeName">Default</span>
            </button>
            <ul class="theme-toggle__menu" id="themeMenu" role="menu" hidden>
                <li role="none"><button role="menuitem" data-theme-value="default">Default</button></li>
                <li role="none"><button role="menuitem" data-theme-value="parchment">Parchment</button></li>
                <li role="none"><button role="menuitem" data-theme-value="slate">Slate</button></li>
                <li role="none"><button role="menuitem" data-theme-value="high-contrast">High Contrast</button></li>
            </ul>
        </div>
    </header>

    <!-- APP LAYOUT -->
    <div class="app-layout">
        <aside class="sidebar" id="sidebar" aria-label="Locations">
            <h2 class="sidebar__heading">Locations</h2>
            <div id="locationTreeContainer" class="location-tree">
                <div class="loading-placeholder">Loading locations…</div>
            </div>
        </aside>

        <main class="main-panel" id="mainPanel" role="main">
            <nav class="panel-tabs" id="panelTabs" role="tablist" aria-label="Settlement tabs">
                <button class="tab-btn is-active" role="tab" type="button" data-tab="location" aria-selected="true" tabindex="0">
                    <span class="tab-icon" aria-hidden="true">◈</span> Location
                </button>
                <button class="tab-btn" role="tab" type="button" data-tab="overview" aria-selected="false" tabindex="-1">
                    <span class="tab-icon" aria-hidden="true">▤</span> Overview
                </button>
                <button class="tab-btn" role="tab" type="button" data-tab="features" aria-selected="false" tabindex="-1">
                    <span class="tab-icon" aria-hidden="true">⚙</span> Features
                </button>
                <button class="tab-btn" role="tab" type="button" data-tab="economy" aria-selected="false" tabindex="-1">
                    <span class="tab-icon" aria-hidden="true">◆</span> Economy
                </button>
                <button class="tab-btn" role="tab" type="button" data-tab="religion" aria-selected="false" tabindex="-1">
                    <span class="tab-icon" aria-hidden="true">✝</span> Religion
                </button>
                <button class="tab-btn" role="tab" type="button" data-tab="industry" aria-selected="false" tabindex="-1">
                    <span class="tab-icon" aria-hidden="true">▣</span> Industry
                </button>
                <button class="tab-btn" role="tab" type="button" data-tab="education" aria-selected="false" tabindex="-1">
                    <span class="tab-icon" aria-hidden="true">▤</span> Education
                </button>
                <button class="tab-btn" role="tab" type="button" data-tab="history" aria-selected="false" tabindex="-1">
                    <span class="tab-icon" aria-hidden="true">◷</span> History
                </button>
                <button class="tab-btn" role="tab" type="button" data-tab="roles" aria-selected="false" tabindex="-1">
                    <span class="tab-icon" aria-hidden="true">◯</span> Roles
                </button>
                <button class="tab-btn" role="tab" type="button" data-tab="government" aria-selected="false" tabindex="-1">
                    <span class="tab-icon" aria-hidden="true">▥</span> Government
                </button>
            </nav>

            <div class="tab-content" id="tabContent" role="tabpanel">
                <div class="tab-pane is-active" id="tab-location"     data-tab-content="location"></div>
                <div class="tab-pane"           id="tab-overview"     data-tab-content="overview"></div>
                <div class="tab-pane"           id="tab-features"     data-tab-content="features"></div>
                <div class="tab-pane"           id="tab-economy"      data-tab-content="economy"></div>
                <div class="tab-pane"           id="tab-religion"     data-tab-content="religion"></div>
                <div class="tab-pane"           id="tab-industry"     data-tab-content="industry"></div>
                <div class="tab-pane"           id="tab-education"    data-tab-content="education"></div>
                <div class="tab-pane"           id="tab-history"      data-tab-content="history"></div>
                <div class="tab-pane"           id="tab-roles"        data-tab-content="roles"></div>
                <div class="tab-pane"           id="tab-government"   data-tab-content="government"></div>
            </div>
        </main>
    </div>

    <script>
        (function () {
            'use strict';

            // -----------------------------------------------------------------
            // Element handles
            // -----------------------------------------------------------------
            var treeContainer   = document.getElementById('locationTreeContainer');
            var burgerBtn       = document.getElementById('burgerBtn');
            var sidebar         = document.getElementById('sidebar');
            var exportBtn       = document.getElementById('exportBtn');
            var importBtn       = document.getElementById('importBtn');
            var fileInput       = document.getElementById('fileInput');
            var yearInput       = document.getElementById('yearInput');
            var setYearBtn      = document.getElementById('setYearBtn');
            var addLocationBtn  = document.getElementById('addLocationBtn');
            var addSettlementBtn= document.getElementById('addSettlementBtn');
            var themeBtn        = document.getElementById('themeBtn');
            var themeMenu       = document.getElementById('themeMenu');
            var themeNameEl     = document.getElementById('themeName');

            var tabButtons = Array.prototype.slice.call(
                document.querySelectorAll('.
