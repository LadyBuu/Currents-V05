<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover" />
    <title>Settlement Manager</title>

    <link rel="icon" href="data:," />

    <!-- 1. Theme Bootstrapper (MUST LOAD FIRST) -->
    <script src="js/core/theme-boot.js"></script>

    <!-- 2. Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- 3. Shared stylesheets -->
    <link rel="stylesheet" href="css/themes.css" />
    <link rel="stylesheet" href="css/common.css" />

    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; }
        body {
            display: flex; flex-direction: column;
            background: var(--bg); color: var(--text);
            font-family: var(--f-body); font-size: 16px; line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .topbar {
            position: relative; z-index: 100; flex-shrink: 0;
            background: var(--bg2); padding: 8px 16px;
            display: flex; align-items: center; gap: 10px;
            border-bottom: 1px solid var(--border);
            min-height: 48px; flex-wrap: wrap;
        }
        .world-app { display: flex; flex-direction: row; flex: 1; min-height: 0; overflow: hidden; }
        .locations-sidebar {
            flex-shrink: 0; display: flex; flex-direction: column; overflow: hidden;
            background: var(--bg2); border-right: 1px solid var(--border); width: 280px;
        }
        .sidebar-header {
            padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--bg3);
        }
        .sidebar-header h3 {
            margin: 0; font-family: var(--f-display); font-size: 0.65rem;
            letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent);
            display: flex; align-items: center; gap: 6px;
        }
        .sidebar-header h3 svg { width: 1em; height: 1em; fill: currentColor; }
        .place-list { flex: 1; overflow-y: auto; padding: 8px; min-height: 0; }
        .main-panel {
            display: flex; flex-direction: column; flex: 1;
            min-width: 0; min-height: 0; overflow: hidden;
        }
        .tab-content-wrapper {
            flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
            padding: 20px 24px; background: var(--bg);
        }
        .place-list .location-tree-children,
        .locations-sidebar .location-tree-children {
            margin-left: 0 !important; padding-left: 16px !important;
            border-left: 1px solid var(--border-light) !important; display: none;
        }
        .place-list .location-tree-children.is-expanded,
        .locations-sidebar .location-tree-children.is-expanded { display: block; }
        .place-list .location-tree-children .location-tree-children,
        .locations-sidebar .location-tree-children .location-tree-children { padding-left: 16px !important; }
        .place-list .place-item {
            padding: 6px 10px; cursor: pointer; border-radius: var(--radius);
            font-size: 0.78rem; color: var(--text); margin: 2px 0;
            transition: background-color 0.15s, color 0.15s;
        }
        .place-list .place-item:hover { background: var(--bg4); }
        .place-list .place-item.selected {
            background: var(--accent-dim); color: var(--accent-light);
            border-left: 3px solid var(--accent);
        }
        .tb-btn {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 6px 14px; background: var(--bg2);
            border: 1px solid var(--border); border-radius: var(--radius);
            color: var(--text); font-family: var(--f-body); font-size: 0.7rem;
            font-weight: 500; cursor: pointer; line-height: 1.2;
            transition: border-color 0.15s ease, background-color 0.15s ease, color 0.15s ease;
        }
        .tb-btn svg { width: 0.9em; height: 0.9em; fill: currentColor; }
        .tb-btn:hover { border-color: var(--accent); background: var(--accent-dim); color: var(--accent-light); }
        .tb-btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
        .tb-btn.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
        .tb-btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .tb-btn:disabled:hover { background: var(--bg2); border-color: var(--border); color: var(--text); }
        .topbar .title {
            font-family: var(--f-display); font-weight: 600; font-size: 0.9rem;
            color: var(--accent); white-space: nowrap; letter-spacing: 0.02em;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .topbar .title svg { width: 1em; height: 1em; fill: currentColor; }
        .topbar .spacer { flex: 1; min-width: 12px; }
        .topbar .burger-menu {
            display: none; align-items: center; justify-content: center;
            padding: 4px 10px; background: transparent;
            border: 1px solid var(--border); border-radius: var(--radius);
            color: var(--text); cursor: pointer;
        }
        .topbar .burger-menu:hover { border-color: var(--accent); color: var(--accent); }
        .year-input {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 3px 10px; background: var(--bg);
            border: 1px solid var(--border); border-radius: var(--radius);
            font-family: var(--f-body); font-size: 0.7rem; line-height: 1.2;
        }
        .year-input label {
            font-family: var(--f-display); font-size: 0.55rem;
            letter-spacing: 0.06em; text-transform: uppercase;
            color: var(--dim); white-space: nowrap;
        }
        .year-input input {
            width: 64px; padding: 3px 6px; background: transparent;
            border: 1px solid var(--border); border-radius: calc(var(--radius) - 1px);
            color: var(--text); font-family: var(--f-mono); font-size: 0.7rem; text-align: right;
        }
        .year-input input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
        .year-input input::-webkit-outer-spin-button,
        .year-input input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .year-input input[type=number] { -moz-appearance: textfield; }
        .theme-toggle { position: relative; display: inline-flex; }
        .theme-toggle__btn { gap: 6px; }
        .theme-toggle__menu {
            position: absolute; top: calc(100% + 4px); right: 0; z-index: 9999;
            min-width: 160px; max-height: 60vh; padding: 4px; margin: 0;
            list-style: none; background: var(--surface);
            border: 1px solid var(--line); border-radius: var(--radius);
            box-shadow: var(--shadow); overflow-y: auto;
        }
        .theme-toggle__menu[hidden] { display: none; }
        .theme-toggle__menu button {
            display: block; width: 100%; padding: 6px 12px; text-align: left;
            background: transparent; border: none; color: var(--text);
            font-family: var(--f-body); font-size: 0.7rem;
            border-radius: calc(var(--radius) - 2px); cursor: pointer;
            transition: background-color 0.15s ease;
        }
        .theme-toggle__menu button:hover,
        .theme-toggle__menu button:focus-visible {
            background: var(--accent-dim); color: var(--accent-light); outline: none;
        }
        .manager-subtabs {
            position: sticky; top: 0; display: flex; align-items: stretch;
            gap: 4px; padding: 8px 4px 0; margin: -20px -24px 20px;
            padding-left: 24px; padding-right: 24px; background: var(--bg);
            border-bottom: 1px solid var(--border); flex-wrap: wrap; z-index: 10;
        }
        .manager-subtab {
            position: relative; display: inline-flex; align-items: center;
            gap: 8px; padding: 12px 18px 11px; background: transparent;
            border: 1px solid transparent; border-bottom: none;
            border-radius: 6px 6px 0 0; color: var(--dim);
            font-family: var(--f-display); font-size: 0.78rem; font-weight: 500;
            letter-spacing: 0.06em; line-height: 1.15; white-space: nowrap;
            cursor: pointer; transition: color 0.15s ease, background-color 0.15s ease;
        }
        .manager-subtab::after {
            content: ''; position: absolute; left: 0; right: 0; bottom: -1px;
            height: 2px; background: transparent; border-radius: 2px 2px 0 0;
            transition: background-color 0.15s ease;
        }
        .manager-subtab:hover { color: var(--accent-light); background: var(--accent-dim); }
        .manager-subtab:hover::after { background: var(--accent); opacity: 0.35; }
        .manager-subtab.active {
            color: var(--accent); background: var(--bg2);
            border-color: var(--border); border-bottom-color: transparent; font-weight: 600;
        }
        .manager-subtab.active::after { background: var(--accent); opacity: 1; }
        .manager-subtab-icon {
            display: inline-flex; width: 16px; height: 16px;
            align-items: center; justify-content: center;
            color: currentColor; flex-shrink: 0; opacity: 0.9;
        }
        .manager-subtab-icon svg { width: 100%; height: 100%; fill: currentColor; }
        .manager-subpanel { min-height: 200px; padding-top: 4px; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }
        .empty-state {
            padding: 48px 24px; text-align: center; color: var(--dim);
            font-size: 0.88rem; line-height: 1.6;
        }
        .loading {
            padding: 24px; text-align: center; color: var(--tmut); font-size: 0.85rem;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
        .toast { box-shadow: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
        .modal-container { box-shadow: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
        .btn:hover { box-shadow: none !important; }
        .icon-svg { display: inline-block; width: 1em; height: 1em; vertical-align: middle; fill: currentColor; }
        .sidebar-overlay { display: none; }
        .sidebar-overlay.active {
            display: block; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8); z-index: 999;
        }

        /* ==================================================================
           SETTLEMENT TAB CLASS SYSTEM
           Every settlement-*-tab.js emits these class names only.
           No tab file emits inline style attributes or <style> blocks.
           ================================================================== */

        .st-tab { display: flex; flex-direction: column; gap: 16px; padding: 4px; }

        .st-header {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 8px; padding: 12px 16px;
            background: var(--bg2); border: 1px solid var(--border);
            border-radius: var(--radius);
        }
        .st-header__title {
            font-size: 0.8rem; font-weight: bold; color: var(--accent-light);
            display: flex; align-items: center; gap: 6px;
        }
        .st-header__subtitle { font-size: 0.65rem; color: var(--dim); margin-top: 2px; }
        .st-header__actions { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }

        .st-section {
            background: var(--bg2); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 12px 16px;
            display: flex; flex-direction: column; gap: 8px;
        }
        .st-section__title {
            font-size: 0.65rem; font-weight: bold; color: var(--accent-light);
            display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
        }
        .st-section__title > span[style*="flex:1"] { flex: 1; }
        .st-section__body { display: flex; flex-direction: column; gap: 8px; }
        .st-section__empty {
            text-align: center; padding: 16px; color: var(--dim);
            font-size: 0.65rem; background: var(--bg3);
            border-radius: var(--radius);
        }

        .st-stats { display: grid; gap: 12px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .st-stats--2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .st-stats--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .st-stats--5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
        .st-stat {
            background: var(--bg); border: 1px solid var(--border-light);
            border-radius: var(--radius); padding: 10px; text-align: center;
        }
        .st-stat__label { font-size: 0.5rem; color: var(--dim); }
        .st-stat__value { font-size: 0.95rem; font-weight: bold; color: var(--text); margin-top: 2px; }
        .st-stat__value--pos { color: var(--success); }
        .st-stat__value--neg { color: var(--danger); }
        .st-stat__value--warn { color: var(--warn); }
        .st-stat__value--accent { color: var(--accent-light); }

        .st-filters {
            display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px; padding: 12px 16px; background: var(--bg2);
            border: 1px solid var(--border); border-radius: var(--radius);
        }
        .st-filters__field { display: flex; flex-direction: column; gap: 2px; }
        .st-filters__label { font-size: 0.5rem; color: var(--dim); }
        .st-filters__input, .st-filters__select {
            width: 100%; padding: 4px 6px; background: var(--bg);
            border: 1px solid var(--border); border-radius: var(--radius);
            color: var(--text); font-size: 0.6rem; font-family: var(--f-body);
        }
        .st-filters__footer {
            grid-column: 1 / -1; display: flex; justify-content: flex-end;
            gap: 4px; align-items: center;
        }

        .st-btn {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 4px 12px; background: var(--bg3); border: 1px solid var(--border);
            border-radius: var(--radius); color: var(--text); font-family: var(--f-body);
            font-size: 0.6rem; font-weight: 500; cursor: pointer; line-height: 1.2;
            transition: border-color 0.15s ease, background-color 0.15s ease;
        }
        .st-btn:hover { border-color: var(--accent); background: var(--accent-dim); }
        .st-btn--accent { border-color: var(--accent); color: var(--accent-light); background: var(--accent-dim); }
        .st-btn--accent:hover { background: var(--accent); color: var(--accent-fg); }
        .st-btn--danger { border-color: var(--danger); color: var(--danger); }
        .st-btn--danger:hover { background: var(--danger); color: var(--accent-fg); }
        .st-btn--small { padding: 2px 8px; font-size: 0.55rem; }
        .st-btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .st-btn:disabled:hover { border-color: var(--border); background: var(--bg3); color: var(--text); }

        .st-rows { display: flex; flex-direction: column; gap: 4px; }
        .st-row {
            display: flex; justify-content: space-between; align-items: flex-start;
            gap: 8px; padding: 6px 10px; background: var(--bg3);
            border-left: 3px solid var(--border); border-radius: var(--radius);
            font-size: 0.6rem;
        }
        .st-row--success { border-left-color: var(--success); }
        .st-row--warn { border-left-color: var(--warn); }
        .st-row--danger { border-left-color: var(--danger); }
        .st-row--accent { border-left-color: var(--accent); }
        .st-row--dim { border-left-color: var(--text-dim); }
        .st-row__body { flex: 1; min-width: 0; }
        .st-row__title { color: var(--text); font-weight: bold; font-size: 0.65rem; }
        .st-row__meta { color: var(--dim); font-size: 0.55rem; margin-top: 2px; }
        .st-row__actions { display: flex; gap: 4px; flex-shrink: 0; }

        .st-empty, .st-error {
            padding: 40px 24px; text-align: center; border-radius: var(--radius);
            border: 1px solid var(--border); background: var(--bg2); font-size: 0.65rem;
        }
        .st-empty { color: var(--dim); }
        .st-error { color: var(--danger); }

        .st-footer {
            padding: 8px; background: var(--bg3); border-radius: var(--radius);
            font-size: 0.55rem; color: var(--dim);
            display: flex; align-items: flex-start; gap: 6px;
        }

        .st-progress {
            width: 140px; height: 6px; background: var(--bg3); border-radius: 3px;
            overflow: hidden;
        }
        .st-progress__fill { height: 100%; background: var(--accent); border-radius: 3px; }
        .st-progress__fill--success { background: var(--success); }

        .st-badge {
            display: inline-block; font-size: 0.5rem; padding: 1px 6px;
            border: 1px solid var(--border); border-radius: 8px; color: var(--dim);
        }
        .st-badge--pos { color: var(--success); border-color: var(--success); }
        .st-badge--neg { color: var(--danger); border-color: var(--danger); }
        .st-badge--warn { color: var(--warn); border-color: var(--warn); }
        .st-badge--dim { color: var(--dim); border-color: var(--dim); }

        .st-inline { display: flex; justify-content: space-between; padding: 2px 0;
            border-bottom: 1px solid var(--border-light); font-size: 0.55rem;
            align-items: center; gap: 8px; }
        .st-inline__label { color: var(--dim); }
        .st-inline__value { color: var(--text); }

        @media (max-width: 768px) {
            .topbar .burger-menu { display: inline-flex; }
            .topbar { padding: 6px 10px; gap: 6px; min-height: 42px; }
            .topbar .title { font-size: 0.75rem; }
            .topbar .tb-btn { padding: 3px 10px; font-size: 0.65rem; }
            .year-input { padding: 2px 6px; }
            .year-input label { display: none; }
            .year-input input { width: 52px; font-size: 0.65rem; }
            .world-app { flex-direction: column; }
            .locations-sidebar {
                position: fixed; top: 0; bottom: 0; left: 0; height: 100vh;
                width: 85%; max-width: 280px; z-index: 1000;
                transform: translateX(-100%); transition: transform 0.3s ease;
                box-shadow: none;
            }
            .locations-sidebar.visible { transform: translateX(0); }
            .tab-content-wrapper { padding: 16px; }
            .manager-subtabs {
                margin: -16px -16px 16px;
                padding-left: 16px; padding-right: 16px;
            }
            .manager-subtab {
                flex: 1 1 auto; min-width: 0; padding: 10px 14px; font-size: 0.72rem;
            }
            .st-stats, .st-stats--2, .st-stats--3, .st-stats--5 {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            .st-filters { grid-template-columns: 1fr; }
            .st-header { flex-direction: column; align-items: stretch; }
            .st-header__actions { justify-content: flex-end; }
        }
        @media (prefers-reduced-motion: reduce) {
            .manager-subtab, .loading { animation: none; transition: none; }
        }
    </style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
    <button id="menuToggle" class="burger-menu" type="button" aria-label="Toggle menu">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
    </button>
    <div class="title">Settlement Manager</div>
    <div class="spacer"></div>
    <div class="year-input">
        <label for="yearInput">Year</label>
        <input type="number" id="yearInput" min="1" step="1" />
        <button id="setYearBtn" class="tb-btn" type="button">Set</button>
    </div>
    <button id="refreshBtn" class="tb-btn" type="button">Refresh</button>
    <button id="importBtn" class="tb-btn" type="button">Import</button>
    <button id="exportBtn" class="tb-btn" type="button">Export</button>
    <input type="file" id="fileInput" accept=".json" style="display:none;" />
</div>

<!-- WORLD APP -->
<div class="world-app">
    <div class="locations-sidebar" id="locationsSidebar">
        <div class="sidebar-header"><h3>Settlements</h3></div>
        <div class="place-list" id="settlementList">
            <div class="loading">Loading settlements…</div>
        </div>
    </div>
    <div id="sidebarOverlay" class="sidebar-overlay"></div>
    <div class="main-panel">
        <div class="manager-subtabs" id="settlementTabStrip" role="tablist">
            <button class="manager-subtab" role="tab" data-tab="overview" type="button">Overview</button>
            <button class="manager-subtab" role="tab" data-tab="economy" type="button">Economy</button>
            <button class="manager-subtab" role="tab" data-tab="features" type="button">Features</button>
            <button class="manager-subtab" role="tab" data-tab="roles" type="button">Roles</button>
            <button class="manager-subtab" role="tab" data-tab="industry" type="button">Industry</button>
            <button class="manager-subtab" role="tab" data-tab="residence" type="button">Residence</button>
            <button class="manager-subtab" role="tab" data-tab="education" type="button">Education</button>
            <button class="manager-subtab" role="tab" data-tab="religion" type="button">Religion</button>
            <button class="manager-subtab" role="tab" data-tab="crime" type="button">Crime</button>
            <button class="manager-subtab" role="tab" data-tab="history" type="button">History</button>
        </div>
        <div class="tab-content-wrapper" id="panelContent" role="tabpanel">
            <div class="tab-pane" id="settlement-pane-overview"  data-tab-content="overview"></div>
            <div class="tab-pane" id="settlement-pane-economy"   data-tab-content="economy"></div>
            <div class="tab-pane" id="settlement-pane-features"  data-tab-content="features"></div>
            <div class="tab-pane" id="settlement-pane-roles"     data-tab-content="roles"></div>
            <div class="tab-pane" id="settlement-pane-industry"  data-tab-content="industry"></div>
            <div class="tab-pane" id="settlement-pane-residence" data-tab-content="residence"></div>
            <div class="tab-pane" id="settlement-pane-education" data-tab-content="education"></div>
            <div class="tab-pane" id="settlement-pane-religion"  data-tab-content="religion"></div>
            <div class="tab-pane" id="settlement-pane-crime"     data-tab-content="crime"></div>
            <div class="tab-pane" id="settlement-pane-history"   data-tab-content="history"></div>
        </div>
    </div>
</div>

<!-- BLOCK 1 — CORE CONSTANTS -->
<script src="js/core/constants/constants.js"></script>
<script src="js/core/constants/age-constants.js"></script>
<script src="js/core/constants/character-constants.js"></script>
<script src="js/core/constants/character-traits.js"></script>
<script src="js/core/constants/location-constants.js"></script>
<script src="js/core/constants/relationship-constants.js"></script>

<!-- BLOCK 2 — CORE UTILITIES -->
<script src="js/core/formatting.js"></script>
<script src="js/core/icons.js"></script>
<script src="js/core/collections.js"></script>
<script src="js/core/ids.js"></script>
<script src="js/core/randomness.js"></script>

<!-- BLOCK 3 — CORE TIME -->
<script src="js/core/time.js"></script>

<!-- BLOCK 4 — CORE STORAGE -->
<script src="js/core/storage-schema.js"></script>

<script>
    (function () {

        function _ensure() {
            if (typeof window.createRelationship === 'function') return true;
            var RC = window.RelationshipCommands || null;
            if (!RC) return false;
            var fn = RC.createRelationship || RC.addRelationship
                || RC.create || RC.link || null;
            if (typeof fn !== 'function') return false;
            window.createRelationship = function (a, b, options) {
                return fn.call(RC, a, b, options);
            };
            return true;
        }
        _ensure();
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', _ensure);
        }
        window.__ensureCreateRelationship = _ensure;

        // getRelationshipsForCharacter flat alias — crime-commands reads
        // this as a global. RelationshipQueries is the source.
        function _ensureRelationshipsForCharacter() {
            if (typeof window.getRelationshipsForCharacter === 'function') return true;
            var RQ = window.RelationshipQueries || null;
            if (!RQ) return false;
            var fn = RQ.getRelationshipsForCharacter
                || RQ.getRelationshipsFor
                || RQ.getCharacterRelationships
                || null;
            if (typeof fn !== 'function') return false;
            window.getRelationshipsForCharacter = function (characterId, options) {
                return fn.call(RQ, characterId, options);
            };
            return true;
        }
        _ensureRelationshipsForCharacter();
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', _ensureRelationshipsForCharacter);
        }
        window.__ensureRelationshipsForCharacter = _ensureRelationshipsForCharacter;
    })();
</script>

<!-- APPLICATION BOOTSTRAP -->
<script>
    (function () {
        'use strict';

        // Order of bootstrap calls:
        //   - Location first (many domains read LocationQueries).
        //   - Religion, Government, Culture (each self-contained).
        //   - Relationships (after Culture — name resolution).
        //   - Crime (after Location + Relationships).
        //   - Industry (reads Location, Household).
        //   - Household (requires createRelationship shim fired).
        //   - Disaster (requires getCurrentLocation alias).
        //   - Settlement last (reads everything above).

        try { if (window.LocationBootstrap && window.LocationBootstrap.init) window.LocationBootstrap.init(); } catch (e) { console.error('LocationBootstrap:', e); }
        try { if (window.ReligionBootstrap && window.ReligionBootstrap.init) window.ReligionBootstrap.init(); } catch (e) { console.error('ReligionBootstrap:', e); }
        try { if (window.GovernmentBootstrap && window.GovernmentBootstrap.init) window.GovernmentBootstrap.init(); } catch (e) { console.error('GovernmentBootstrap:', e); }
        try { if (window.CultureBootstrap && window.CultureBootstrap.init) window.CultureBootstrap.init(); } catch (e) { console.error('CultureBootstrap:', e); }
        try { if (window.Relationships && window.Relationships.init) window.Relationships.init(); } catch (e) { console.error('Relationships:', e); }
        try { if (window.CrimeBootstrap && window.CrimeBootstrap.init) window.CrimeBootstrap.init(); } catch (e) { console.error('CrimeBootstrap:', e); }
        try { if (window.IndustryBootstrap && window.IndustryBootstrap.init) window.IndustryBootstrap.init(); } catch (e) { console.error('IndustryBootstrap:', e); }

        try {
            if (typeof window.__ensureCreateRelationship === 'function') {
                window.__ensureCreateRelationship();
            }
            if (window.HouseholdBootstrap && window.HouseholdBootstrap.init) {
                window.HouseholdBootstrap.init();
            }
        } catch (e) { console.error('HouseholdBootstrap:', e); }

        try { if (window.DisasterBootstrap && window.DisasterBootstrap.init) window.DisasterBootstrap.init(); } catch (e) { console.error('DisasterBootstrap:', e); }

        try { if (window.SettlementManagerBootstrap && window.SettlementManagerBootstrap.init) window.SettlementManagerBootstrap.init(); } catch (e) { console.error('SettlementManagerBootstrap:', e); }
    })();
</script>
