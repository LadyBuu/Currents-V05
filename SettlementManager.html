    <!-- ============================================================ -->
    <!-- LOAD LOCALSTORAGE DATA FIRST (BEFORE ANY SYSTEMS)            -->
    <!-- ============================================================ -->
    <script>
        (function() {
            'use strict';
            try {
                var STORAGE_KEY = 'stillwaters_master';
                var stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    var parsed = JSON.parse(stored);
                    if (parsed && parsed.data) {
                        window.masterData = parsed;
                        console.log('[PRELOAD] Loaded from localStorage:',
                            parsed.data.places?.length || 0, 'places,',
                            parsed.data.characters?.length || 0, 'characters');
                    }
                }
            } catch(e) {
                console.warn('[PRELOAD] Failed to load from localStorage:', e.message);
            }

            if (!window.masterData || !window.masterData.data) {
                window.masterData = {
                    version: '2.0',
                    lastUpdated: new Date().toISOString(),
                    data: {
                        characters: [],
                        places: [],
                        ranks: [],
                        roles: [],
                        locationTypes: [],
                        governmentTypes: [],
                        households: [],
                        residences: [],
                        currentYear: 1250
                    }
                };
                console.log('[PRELOAD] Created empty masterData');
            }
        })();
    </script>

    <script>
        (function() {
            'use strict';

            var treeContainer = document.getElementById('locationTreeContainer');
            var burgerBtn = document.getElementById('burgerBtn');
            var sidebar = document.getElementById('sidebar');
            var exportBtn = document.getElementById('exportBtn');
            var importBtn = document.getElementById('importBtn');
            var fileInput = document.getElementById('fileInput');
            var yearInput = document.getElementById('yearInput');
            var setYearBtn = document.getElementById('setYearBtn');
            var tabContent = document.getElementById('tabContent');
            var addLocationBtn = document.getElementById('addLocationBtn');
            var addSettlementBtn = document.getElementById('addSettlementBtn');

            var selectedId = null;
            var expandedIds = new Set();
            var isInitialized = false;

            // ============================================================
            // ADD LOCATION BUTTON
            // ============================================================
            addLocationBtn.addEventListener('click', function() {
                if (typeof window.openAddPlaceModal === 'function') {
                    window.openAddPlaceModal(null, function(newPlaceId) {
                        if (newPlaceId) {
                            renderTree();
                            selectedId = newPlaceId;
                            renderTree();
                            switchTab('location');
                        }
                    });
                } else {
                    alert('Add Location modal not available. Check that modals-location.js is loaded.');
                }
            });

            // ============================================================
            // ADD SETTLEMENT BUTTON
            // ============================================================
            addSettlementBtn.addEventListener('click', function() {
                if (!selectedId) {
                    alert('Please select a location first');
                    return;
                }

                if (typeof window.SettlementCrud !== 'undefined' && 
                    typeof window.SettlementCrud.createSettlementData === 'function') {
                    var result = window.SettlementCrud.createSettlementData(selectedId);
                    if (result) {
                        alert('Settlement created for the selected location!');
                        switchTab('overview');
                    } else {
                        alert('Failed to create settlement. It may already exist.');
                    }
                } else {
                    alert('Settlement creation not available.');
                }
            });

            // ============================================================
            // TAB SWITCHING
            // ============================================================
            var tabButtons = document.querySelectorAll('.tab-btn');
            var tabPanes = {
                location: document.getElementById('tab-location'),
                overview: document.getElementById('tab-overview'),
                features: document.getElementById('tab-features'),
                economy: document.getElementById('tab-economy'),
                religion: document.getElementById('tab-religion'),
                industry: document.getElementById('tab-industry'),
                education: document.getElementById('tab-education'),
                history: document.getElementById('tab-history'),
                roles: document.getElementById('tab-roles'),
                government: document.getElementById('tab-government')
            };

            function switchTab(tabId) {
                tabButtons.forEach(function(btn) {
                    btn.classList.toggle('active', btn.dataset.tab === tabId);
                });

                Object.keys(tabPanes).forEach(function(key) {
                    if (tabPanes[key]) {
                        tabPanes[key].classList.toggle('active', key === tabId);
                    }
                });

                if (tabId === 'location' && selectedId) {
                    renderLocationTab(selectedId);
                }

                if (tabId === 'overview' && selectedId) {
                    renderOverviewTab(selectedId);
                }

                if (tabId === 'features' && selectedId) {
                    renderFeaturesTab(selectedId);
                }

                if (tabId === 'economy' && selectedId) {
                    renderEconomyTab(selectedId);
                }

                if (tabId === 'religion' && selectedId) {
                    renderReligionTab(selectedId);
                }

                if (tabId === 'industry') {
                    renderIndustryTab(selectedId);
                }

                if (tabId === 'education' && selectedId) {
                    renderEducationTab(selectedId);
                }

                if (tabId === 'history' && selectedId) {
                    renderHistoryTab(selectedId);
                }

                if (tabId === 'roles' && selectedId) {
                    renderRolesTab(selectedId);
                }

                if (tabId === 'government' && selectedId) {
                    renderGovernmentTab(selectedId);
                }
            }

            // ============================================================
            // RENDER FUNCTIONS FOR EACH TAB
            // ============================================================

            function renderLocationTab(locationId) {
                var container = document.getElementById('tab-location');
                if (!container) return;

                if (typeof window.renderLocationDetails !== 'function') {
                    container.innerHTML = '<div style="color:var(--dim); text-align:center; padding:40px; font-size:0.9rem;">' +
                        '<span style="font-size:2rem; display:block; margin-bottom:12px;">◈</span>' +
                        'Location module not loaded.' +
                        '</div>';
                    return;
                }

                try {
                    window.renderLocationDetails('tab-location', locationId);
                } catch(e) {
                    container.innerHTML = '<div style="color:var(--dim); text-align:center; padding:40px; font-size:0.9rem;">' +
                        '<span style="font-size:2rem; display:block; margin-bottom:12px;">⚠️</span>' +
                        'Error loading location data' +
                        '</div>';
                }
            }

            function renderOverviewTab(locationId) {
                var container = document.getElementById('tab-overview');
                if (!container) return;

                if (typeof window.renderSettlementOverview !== 'function') {
                    container.innerHTML = '<div style="color:var(--dim); text-align:center; padding:40px; font-size:0.9rem;">' +
                        '<span style="font-size:2rem; display:block; margin-bottom:12px;">📋</span>' +
                        'Overview module not loaded.' +
                        '</div>';
                    return;

                try {

                } catch(e) {
                    container.innerHTML = '<div style="color:var(--dim); text-align:center; padding:40px; font-size:0.9rem;">' +
                        '<span style="font-size:2rem; display:block; margin-bottom:12px;">⚠️</span>' +
                        'Error loading overview data' +
                        '</div>';

            function renderFeaturesTab(locationId) {

            function renderEconomyTab(locationId) {

                if (typeof window.renderSettlementEconomy !== 'function') {

                        'Error loading economy data' +
                        '</div>';

            function renderReligionTab(locationId) {
                var container = document.getElementById('tab-religion');

                if (typeof window.renderSettlementReligion !== 'function') {

                        'Error loading religion data' +
                        '</div>';
                }
            }

            function renderIndustryTab(locationId) {
                var container = document.getElementById('tab-industry');
                if (!container) return;

                if (!locationId) {
                    var selectedItem = document.querySelector('.location-tree-item.selected');
                    if (selectedItem && selectedItem.dataset.id) {
                        locationId = selectedItem.dataset.id;
                    }
                }

                if (!locationId) {
                    container.innerHTML = '<div style="color:var(--dim); text-align:center; padding:40px; font-size:0.9rem;">' +
                        '<span style="font-size:2rem; display:block; margin-bottom:12px;">🏭</span>' +
                        'Please select a location from the sidebar first' +
                        '</div>';
                    return;
                }

                if (typeof window.renderSettlementIndustry !== 'function') {
                    container.innerHTML = '<div style="color:var(--dim); text-align:center; padding:40px; font-size:0.9rem;">' +
                        '<span style="font-size:2rem; display:block; margin-bottom:12px;">🏭</span>' +
                        'Industry module not loaded.' +
                        '</div>';
                    return;
                }

                try {
                    window.renderSettlementIndustry('tab-industry', locationId);
                } catch(e) {
                    console.error('Industry render error:', e);
                    container.innerHTML = '<div style="color:var(--dim); text-align:center; padding:40px; font-size:0.9rem;">' +
                        '<span style="font-size:2rem; display:block; margin-bottom:12px;">⚠️</span>' +
                        'Error loading industry data: ' + (e.message || 'Unknown error') +
                        '</div>';
                }
            }

            function renderEducationTab(locationId) {
                var container = document.getElementById('tab-education');
                if (!container) return;

                if (typeof window.renderSettlementEducation !== 'function') {
                    container.innerHTML = '<div style="color:var(--dim); text-align:center; padding:40px; font-size:0.9rem;">' +

                    return;
                }

                try {
                    window.renderSettlementEducation('tab-education', locationId);
                } catch(e) {
                    container.innerHTML = '<div style="color:var(--dim); text-align:center; padding:40px; font-size:0.9rem;">' +
                        '<span style="font-size:2rem; display:block; margin-bottom:12px;">⚠️</span>' +

            function renderHistoryTab(locationId) {
                var container = document.getElementById('tab-history');

                if (typeof window.renderSettlementHistory !== 'function') {
                    container.innerHTML = '<div style="color:var(--dim); text-align:center; padding:40px; font-size:0.9rem;">' +

                try {

                } catch(e) {
                    container.innerHTML = '<div style="color:var(--dim); text-align:center; padding:40px; font-size:0.9rem;">' +
                        '<span style="font-size:2rem; display:block; margin-bottom:12px;">⚠️</span>' +
                        'Error loading roles data' +
                        '</div>';
                }
            }

            function renderGovernmentTab(locationId) {
                var container = document.getElementById('tab-government');
                if (!container) return;

                // Check if GovernmentDetailsTab exists
                if (typeof window.GovernmentDetailsTab !== 'undefined' && 
                    typeof window.GovernmentDetailsTab.render === 'function') {
                    try {
                        window.GovernmentDetailsTab.render('tab-government', locationId);
                        return;
                    } catch(e) {
                        console.error('Government tab render error:', e);
                    }
                }

                // Fallback if GovernmentDetailsTab not loaded
                if (typeof window.renderGovernmentDetailsTab === 'function') {
                    try {
                        window.renderGovernmentDetailsTab('tab-government', locationId);
                        return;
                    } catch(e) {
                        console.error('Government tab render error:', e);
                    }
                }

                container.innerHTML = '<div style="color:var(--dim); text-align:center; padding:40px; font-size:0.9rem;">' +
                    '<span style="font-size:2rem; display:block; margin-bottom:12px;">🏛️</span>' +
                    'Government module not loaded. Make sure government-details-tab.js is included.' +
                    '</div>';
            }

            // ============================================================
            // TAB EVENT LISTENERS
            // ============================================================
            tabButtons.forEach(function(btn) {
                btn.addEventListener('click', function() {
                    switchTab(this.dataset.tab);
                });
            });

            // ============================================================
            // SIDEBAR TOGGLE
            // ============================================================
            function toggleSidebar() {
                sidebar.classList.toggle('open');
            }

            function closeSidebar() {
                sidebar.classList.remove('open');
            }

            burgerBtn.addEventListener('click', toggleSidebar);

            document.addEventListener('click', function(e) {
                if (window.innerWidth <= 768) {
                    if (!sidebar.contains(e.target) && e.target !== burgerBtn) {
                        closeSidebar();
                    }
                }
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeSidebar();
            });

            window.addEventListener('resize', function() {
                if (window.innerWidth > 768) closeSidebar();
            });

            // ============================================================
            // GET/SET FULL DATA
            // ============================================================
            function getFullData() {
                if (typeof window.masterData !== 'undefined' && window.masterData) {
                    return window.masterData;
                }
                return null;
            }

            function setFullData(data) {
                if (data && data.data) {
                    window.masterData = data;
                } else if (data && data.places) {
                    window.masterData = {
                        version: '2.0',
                        lastUpdated: new Date().toISOString(),
                        data: data
                    };
                } else {
                    return false;
                }

                try {
                    localStorage.setItem('stillwaters_master', JSON.stringify(window.masterData));
                } catch(e) {}

                if (typeof window.saveMasterData === 'function') {
                    window.saveMasterData(true);
                }
                if (typeof window.invalidateAccessorCaches === 'function') {
                    window.invalidateAccessorCaches();
                }
                if (typeof window.LocationState !== 'undefined' &&
                    typeof window.LocationState.invalidateCache === 'function') {
                    window.LocationState.invalidateCache();
                }
                if (typeof window.SettlementState !== 'undefined' &&
                    typeof window.SettlementState.invalidateCache === 'function') {
                    window.SettlementState.invalidateCache();
                }

                return true;
            }

            // ============================================================
            // RENDER LOCATION TREE
            // ============================================================
            function renderTree() {
                if (!treeContainer) return;

                var LS = window.LocationState;
                var LUI = window.LocationUI;

                if (!LS || !LUI || typeof LUI.renderLocationList !== 'function') {
                    treeContainer.innerHTML = '<div class="loading-placeholder">Loading...</div>';
                    return;
                }

                var places = LS.getAllPlaces({ includeDeprecated: false });
                if (!places || places.length === 0) {
                    treeContainer.innerHTML = '<div class="empty-state">No locations found</div>';
                    return;
                }

                try {
                    LUI.renderLocationList('locationTreeContainer', {
                        selectedId: selectedId,
                        expandedIds: expandedIds,
                        showCulture: false,
                        showPopulation: true,
                        onSelect: function(place) {
                            if (place && place.id) {
                                selectedId = place.id;
                                renderTree();
                                var activeTab = document.querySelector('.tab-btn.active');
                                if (activeTab) {
                                    switchTab(activeTab.dataset.tab);
                                } else {
                                    switchTab('location');
                                }
                                if (window.innerWidth <= 768) closeSidebar();
                            }
                        }
                    });

                    var stored = treeContainer.dataset.expanded;
                    if (stored) {
                        try {
                            expandedIds = new Set(JSON.parse(stored));
                        } catch(e) {}
                    }

                } catch(e) {
                    treeContainer.innerHTML = '<div class="error-state">Error loading locations</div>';
                }
            }

            // ============================================================
            // IMPORT / EXPORT
            // ============================================================
            exportBtn.addEventListener('click', function() {
                var data = getFullData();
                if (!data) {
                    alert('No data to export');
                    return;
                }
                var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = 'stillwaters_export_' + Date.now() + '.json';
                a.click();
                URL.revokeObjectURL(url);
            });

            importBtn.addEventListener('click', function() {
                fileInput.value = '';
                fileInput.click();
            });

            fileInput.addEventListener('change', function() {
                var file = this.files[0];
                if (!file) return;

                var reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        var imported = JSON.parse(e.target.result);
                        var dataToImport = null;

                        if (imported.data && imported.version) {
                            dataToImport = imported;
                        } else if (imported.places || imported.characters) {
                            dataToImport = {
                                version: '2.0',
                                lastUpdated: new Date().toISOString(),
                                data: imported
                            };
                        } else if (imported.data) {
                            dataToImport = {
                                version: '2.0',
                                lastUpdated: new Date().toISOString(),
                                data: imported.data
                            };
                        }

                        if (!dataToImport) {
                            alert('Invalid format: Could not recognize data structure.');
                            return;
                        }

                        if (setFullData(dataToImport)) {
                            renderTree();
                            var place = null;
                            if (selectedId) {
                                var LS = window.LocationState;
                                if (LS) place = LS.getPlace(selectedId);
                            }
                            if (place) {
                                switchTab('location');
                                renderLocationTab(selectedId);
                            } else {
                                document.getElementById('tab-location').innerHTML = '<div class="placeholder">Select a location from the sidebar</div>';
                            }
                        } else {
                            alert('Import failed');
                        }
                    } catch(err) {
                        alert('Invalid JSON: ' + err.message);
                    }
                };
                reader.readAsText(file);
                this.value = '';
            });

            // ============================================================
            // YEAR SETTER
            // ============================================================
            setYearBtn.addEventListener('click', function() {
                var val = parseInt(yearInput.value, 10);
                if (!isNaN(val) && window.masterData) {
                    window.masterData.data.currentYear = val;
                    try {
                        localStorage.setItem('stillwaters_master', JSON.stringify(window.masterData));
                    } catch(e) {}
                    if (typeof window.saveMasterData === 'function') {
                        window.saveMasterData(true);
                    }
                }
            });

            // ============================================================
            // INIT
            // ============================================================
            function init() {
                if (isInitialized) return;
                isInitialized = true;

                setTimeout(function() {
                    renderTree();

                    var LS = window.LocationState;
                    if (LS) {
                        var places = LS.getAllPlaces({ includeDeprecated: false });
                        if (places && places.length > 0) {
                            if (!selectedId) {
                                selectedId = places[0].id;
                            }
                            renderTree();
                            switchTab('location');
                        }
                    }
                }, 100);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                setTimeout(init, 50);
            }

        })();
    </script>

</body>
</html>
