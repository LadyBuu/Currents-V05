<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover" />
    <title>Settlement Manager</title>

    <link rel="icon" href="data:," />

    <!-- 1. Theme Bootstrapper (MUST LOAD FIRST) -->
    <script src="js/core/theme-boot.js"></script>

    <!-- 2. Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- 3. Shared stylesheets (external, per request) -->
    <link rel="stylesheet" href="css/themes.css" />
    <link rel="stylesheet" href="css/common.css" />

    <style>
        /* ==================================================================
           SETTLEMENT MANAGER — INLINE STYLES
           ==================================================================
           All color/radius/shadow/font values come from themes.css.
           Structural layout only. This block replaces:
             css/settlement.css
             css/location-list.css
             css/location-sidebar.css
             css/selectors.css
             css/uiList.css
           and the per-tab inline styles scattered across js/tabs/*.js
           (which will be removed later, per the plan).

           Every class below mirrors the Location Manager's inline
           styles so the two pages render identically.
           ================================================================== */

        /* ---- App shell ---- */
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--text);
            font-family: var(--f-body);
            font-size: 16px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .topbar {
            position: relative;
            z-index: 100;
            flex-shrink: 0;
            background: var(--bg2);
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border);
            min-height: 48px;
            flex-wrap: wrap;
        }

        .world-app {
            display: flex;
            flex-direction: row;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        .locations-sidebar {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg2);
            border-right: 1px solid var(--border);
            width: 280px;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--bg3);
        }
        .sidebar-header h3 {
            margin: 0;
            font-family: var(--f-display);
            font-size: 0.65rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sidebar-header h3 svg {
            width: 1em;
            height: 1em;
            fill: currentColor;
        }

        .place-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            min-height: 0;
        }

        .main-panel {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
        }

        .tab-content-wrapper {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px 24px;
            background: var(--bg);
        }

        /* ---- Sidebar tree — indent + border guide ---- */
        .place-list .location-tree-children,
        .locations-sidebar .location-tree-children {
            margin-left: 0 !important;
            padding-left: 16px !important;
            border-left: 1px solid var(--border-light) !important;
            display: none;
        }
        .place-list .location-tree-children.is-expanded,
        .locations-sidebar .location-tree-children.is-expanded {
            display: block;
        }
        .place-list .location-tree-children .location-tree-children,
        .locations-sidebar .location-tree-children .location-tree-children {
            padding-left: 16px !important;
        }

        /* ---- Sidebar rows (fallback when LocationUI is absent) ---- */
        .place-list .place-item {
            padding: 6px 10px;
            cursor: pointer;
            border-radius: var(--radius);
            font-size: 0.78rem;
            color: var(--text);
            margin: 2px 0;
            transition: background-color 0.15s, color 0.15s;
        }
        .place-list .place-item:hover {
            background: var(--bg4);
        }
        .place-list .place-item.selected {
            background: var(--accent-dim);
            color: var(--accent-light);
            border-left: 3px solid var(--accent);
        }

        /* ---- Topbar buttons ---- */
        .tb-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 14px;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: var(--f-body);
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            line-height: 1.2;
            transition: border-color 0.15s ease, background-color 0.15s ease, color 0.15s ease;
        }
        .tb-btn svg {
            width: 0.9em;
            height: 0.9em;
            fill: currentColor;
        }
        .tb-btn:hover {
            border-color: var(--accent);
            background: var(--accent-dim);
            color: var(--accent-light);
        }
        .tb-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--accent-fg);
        }
        .tb-btn.primary:hover {
            background: var(--accent-dark);
            border-color: var(--accent-dark);
        }
        .tb-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }
        .tb-btn:disabled:hover {
            background: var(--bg2);
            border-color: var(--border);
            color: var(--text);
        }

        .topbar .title {
            font-family: var(--f-display);
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--accent);
            white-space: nowrap;
            letter-spacing: 0.02em;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .topbar .title svg {
            width: 1em;
            height: 1em;
            fill: currentColor;
        }
        .topbar .spacer {
            flex: 1;
            min-width: 12px;
        }
        .topbar .burger-menu {
            display: none;
            align-items: center;
            justify-content: center;
            padding: 4px 10px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            cursor: pointer;
        }
        .topbar .burger-menu:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* ---- Year input ---- */
        .year-input {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-family: var(--f-body);
            font-size: 0.7rem;
            line-height: 1.2;
        }
        .year-input label {
            font-family: var(--f-display);
            font-size: 0.55rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--dim);
            white-space: nowrap;
        }
        .year-input input {
            width: 64px;
            padding: 3px 6px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: calc(var(--radius) - 1px);
            color: var(--text);
            font-family: var(--f-mono);
            font-size: 0.7rem;
            text-align: right;
        }
        .year-input input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-soft);
        }
        .year-input input::-webkit-outer-spin-button,
        .year-input input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .year-input input[type=number] { -moz-appearance: textfield; }

        /* ---- Theme toggle ---- */
        .theme-toggle { position: relative; display: inline-flex; }
        .theme-toggle__btn { gap: 6px; }
        .theme-toggle__menu {
            position: absolute;
            top: calc(100% + 4px);
            right: 0;
            z-index: 9999;
            min-width: 160px;
            max-height: 60vh;
            padding: 4px;
            margin: 0;
            list-style: none;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow-y: auto;
        }
        .theme-toggle__menu[hidden] { display: none; }
        .theme-toggle__menu button {
            display: block;
            width: 100%;
            padding: 6px 12px;
            text-align: left;
            background: transparent;
            border: none;
            color: var(--text);
            font-family: var(--f-body);
            font-size: 0.7rem;
            border-radius: calc(var(--radius) - 2px);
            cursor: pointer;
            transition: background-color 0.15s ease;
        }
        .theme-toggle__menu button:hover,
        .theme-toggle__menu button:focus-visible {
            background: var(--accent-dim);
            color: var(--accent-light);
            outline: none;
        }

        /* ============================================================
           SUB-TAB STRIP
           (TabManager renders the strip; these rules style it.)
           ============================================================ */
        .manager-subtabs {
            position: sticky;
            top: 0;
            display: flex;
            align-items: stretch;
            gap: 4px;
            padding: 8px 4px 0;
            margin: -20px -24px 20px;
            padding-left: 24px;
            padding-right: 24px;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            z-index: 10;
        }
        .manager-subtab {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 18px 11px;
            background: transparent;
            border: 1px solid transparent;
            border-bottom: none;
            border-radius: 6px 6px 0 0;
            color: var(--dim);
            font-family: var(--f-display);
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.06em;
            line-height: 1.15;
            white-space: nowrap;
            cursor: pointer;
            transition: color 0.15s ease, background-color 0.15s ease;
        }
        .manager-subtab::after {
            content: '';
            position: absolute;
            left: 0; right: 0; bottom: -1px;
            height: 2px;
            background: transparent;
            border-radius: 2px 2px 0 0;
            transition: background-color 0.15s ease;
        }
        .manager-subtab:hover {
            color: var(--accent-light);
            background: var(--accent-dim);
        }
        .manager-subtab:hover::after {
            background: var(--accent);
            opacity: 0.35;
        }
        .manager-subtab.active {
            color: var(--accent);
            background: var(--bg2);
            border-color: var(--border);
            border-bottom-color: transparent;
            font-weight: 600;
        }
        .manager-subtab.active::after {
            background: var(--accent);
            opacity: 1;
        }
        .manager-subtab-icon {
            display: inline-flex;
            width: 16px;
            height: 16px;
            align-items: center;
            justify-content: center;
            color: currentColor;
            flex-shrink: 0;
            opacity: 0.9;
        }
        .manager-subtab-icon svg {
            width: 100%;
            height: 100%;
            fill: currentColor;
        }
        .manager-subpanel {
            min-height: 200px;
            padding-top: 4px;
        }

        /* ============================================================
           SETTLEMENT TAB SHARED CLASSES
           (previously in css/settlement.css)
           ============================================================ */
        .settlement-card {
            background: var(--bg2);
            border-radius: calc(var(--radius) * 2);
            padding: 16px 20px;
            border: 1px solid var(--border);
            margin-bottom: 12px;
            transition: border-color 0.2s ease;
        }
        .settlement-card:hover { border-color: var(--accent); }
        .settlement-card .title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent-light);
            margin-bottom: 4px;
        }
        .settlement-card .subtitle {
            font-size: 0.65rem;
            color: var(--dim);
            margin-bottom: 10px;
        }
        .settlement-card .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 8px;
            font-size: 0.65rem;
        }
        .settlement-card .stats .stat {
            background: var(--bg);
            padding: 6px 10px;
            border-radius: var(--radius);
            text-align: center;
        }
        .settlement-card .stats .stat .label {
            color: var(--dim);
            font-size: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .settlement-card .stats .stat .value {
            font-weight: 500;
            color: var(--text);
            font-size: 0.75rem;
        }

        .settlement-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            background: var(--bg2);
            padding: 12px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }
        .settlement-info-grid .info-item { padding: 4px 8px; }
        .settlement-info-grid .info-item .label {
            color: var(--dim);
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .settlement-info-grid .info-item .value {
            color: var(--text);
            font-size: 0.7rem;
            font-weight: 500;
        }

        .upgrade-info {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 16px;
            margin: 8px 0;
        }
        .upgrade-info .current-rank { color: var(--accent-light); font-weight: 600; }
        .upgrade-info .next-rank    { color: var(--success); font-weight: 600; }
        .upgrade-info .requirement  { color: var(--dim); font-size: 0.65rem; }
        .upgrade-info .requirement.met   { color: var(--success); }
        .upgrade-info .requirement.unmet { color: var(--danger-lt); }
        .upgrade-btn {
            background: var(--accent);
            color: var(--accent-fg);
            border: none;
            padding: 8px 20px;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: 600;
            transition: background-color 0.2s ease, box-shadow 0.2s ease;
        }
        .upgrade-btn:hover {
            background: var(--accent-light);
            box-shadow: var(--glow-md);
        }
        .upgrade-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Tab-level generic buttons used by overview/economy/etc. */
        .tab-pane .action-btn,
        .tab-pane .overview-action-btn,
        .tab-pane .economy-action-btn,
        .tab-pane .religion-action-btn,
        .tab-pane .industry-action-btn,
        .tab-pane .education-action-btn,
        .tab-pane .history-action-btn {
            background: var(--bg3);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 14px;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 0.6rem;
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }
        .tab-pane .action-btn:hover,
        .tab-pane .overview-action-btn:hover,
        .tab-pane .economy-action-btn:hover,
        .tab-pane .religion-action-btn:hover,
        .tab-pane .industry-action-btn:hover,
        .tab-pane .education-action-btn:hover,
        .tab-pane .history-action-btn:hover {
            background: var(--accent-dim);
            border-color: var(--accent);
            color: var(--accent-light);
        }

        /* Crime tab chrome (previously in css/settlement.css §15) */
        .crime-tab { max-width: 1000px; margin: 0 auto; }
        .crime-tab__toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 12px 0 16px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }
        .crime-tab__toolbar .btn {
            padding: 6px 14px;
            font-size: 0.7rem;
            border-radius: var(--radius);
            background: var(--bg3);
            border: 1px solid var(--border);
            color: var(--text);
            cursor: pointer;
            transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
        }
        .crime-tab__toolbar .btn:hover {
            background: var(--bg2);
            border-color: var(--accent);
            color: var(--accent-light);
        }
        .crime-tab__toolbar .btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--accent-fg);
            font-weight: 600;
        }
        .crime-tab__toolbar .btn.primary:hover {
            background: var(--accent-light);
            color: var(--accent-fg);
        }
        .crime-tab__section { margin-bottom: 24px; }
        .crime-tab__heading {
            font-family: var(--f-display);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--accent-light);
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 12px;
        }

        /* Value/formatters used across tabs */
        .value-unknown { color: var(--tmut); font-style: italic; }

        /* ---- Empty / loading ---- */
        .empty-state {
            padding: 48px 24px;
            text-align: center;
            color: var(--dim);
            font-size: 0.88rem;
            line-height: 1.6;
        }
        .loading {
            padding: 24px;
            text-align: center;
            color: var(--tmut);
            font-size: 0.85rem;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* ---- Modal chrome overrides (match Location Manager) ---- */
        .toast { box-shadow: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
        .modal-container { box-shadow: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
        .btn:hover { box-shadow: none !important; }
        .icon-svg { display: inline-block; width: 1em; height: 1em; vertical-align: middle; fill: currentColor; }

        /* ---- Sidebar overlay (mobile) ---- */
        .sidebar-overlay { display: none; }
        .sidebar-overlay.active {
            display: block;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 999;
        }

        /* ---- Responsive ---- */
        @media (max-width: 768px) {
            .topbar .burger-menu { display: inline-flex; }
            .topbar { padding: 6px 10px; gap: 6px; min-height: 42px; }
            .topbar .title { font-size: 0.75rem; }
            .topbar .tb-btn { padding: 3px 10px; font-size: 0.65rem; }
            .year-input { padding: 2px 6px; }
            .year-input label { display: none; }
            .year-input input { width: 52px; font-size: 0.65rem; }

            .world-app { flex-direction: column; }
            .locations-sidebar {
                position: fixed;
                top: 0; bottom: 0; left: 0;
                height: 100vh;
                width: 85%;
                max-width: 280px;
                z-index: 1000;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }
            .locations-sidebar.visible { transform: translateX(0); }
            .tab-content-wrapper { padding: 16px; }
            .manager-subtabs {
                margin: -16px -16px 16px;
                padding-left: 16px;
                padding-right: 16px;
            }
            .manager-subtab {
                flex: 1 1 auto;
                min-width: 0;
                padding: 10px 14px;
                font-size: 0.72rem;
            }
        }

        @media (max-width: 480px) {
            .settlement-info-grid { grid-template-columns: 1fr; }
            .crime-tab__toolbar { flex-direction: column; }
            .crime-tab__toolbar .btn { width: 100%; }
        }

        @media (prefers-reduced-motion: reduce) {
            .manager-subtab,
            .loading,
            .settlement-card {
                animation: none;
                transition: none;
            }
        }
    </style>
</head>
<body>

<!-- ================================================================== -->
<!-- TOPBAR — identical structure to Location Manager                    -->
<!-- ================================================================== -->
<div class="topbar">
    <button id="menuToggle" class="burger-menu" type="button" aria-label="Toggle menu">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
    </button>
    <div class="title" id="settlementManagerTitle"></div>
    <div class="spacer"></div>

    <button id="addLocationBtn" class="tb-btn primary" type="button"></button>
    <button id="addSettlementBtn" class="tb-btn" type="button"></button>

    <div class="year-input">
        <label for="yearInput">Year</label>
        <input type="number" id="yearInput" min="1" step="1" />
        <button id="setYearBtn" class="tb-btn" type="button">Set</button>
    </div>

    <button id="importBtn" class="tb-btn" type="button"></button>
    <button id="exportBtn" class="tb-btn" type="button"></button>

    <input type="file" id="fileInput" accept=".json" style="display:none;" />

    <div class="theme-toggle" role="group" aria-label="Theme">
        <button class="tb-btn theme-toggle__btn" id="themeBtn" type="button" aria-haspopup="menu" aria-expanded="false">
            <span aria-hidden="true">◐</span>
            <span id="themeName">Dark</span>
        </button>
        <ul class="theme-toggle__menu" id="themeMenu" role="menu" hidden></ul>
    </div>
</div>

<!-- ================================================================== -->
<!-- WORLD APP — identical structure to Location Manager                 -->
<!-- ================================================================== -->
<div class="world-app">
    <div class="locations-sidebar" id="locationsSidebar">
        <div class="sidebar-header"><h3 id="sidebarTitle"></h3></div>
        <div class="place-list" id="placeList">
            <div class="loading" id="loadingText">Loading locations…</div>
        </div>
    </div>
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <div class="main-panel">
        <div class="tab-content-wrapper" id="panelContent">
            <div class="empty-state" id="emptyStateText">Select a location from the sidebar</div>
        </div>
    </div>
</div>

<!-- ================================================================== -->
<!-- SCRIPT LOAD ORDER — identical pattern to Location Manager           -->
<!-- ================================================================== -->

<!-- ================================================================
     BLOCK 1 — THEME BOOTSTRAP (loaded in <head> above)
     ================================================================ -->

<!-- ================================================================
     BLOCK 2 — CORE CONSTANTS
     ================================================================ -->
<script src="js/core/constants/constants.js"></script>
<script src="js/core/constants/age-constants.js"></script>
<script src="js/core/constants/character-constants.js"></script>
<script src="js/core/constants/character-traits.js"></script>
<script src="js/core/constants/location-constants.js"></script>
<script src="js/core/constants/relationship-constants.js"></script>

<!-- ================================================================

<!-- ================================================================
     BLOCK 33 — SETTLEMENT TAB RENDERERS
     These 10 files call `SettlementTabs.registerTabRenderer(...)`.
     The shim below maps that API onto TabManager('settlement', ...).
     When the tab files are later edited to call TabManager.register
     directly, the shim block can be deleted.
     ================================================================ -->
<script>
    (function () {
        'use strict';

        // --- SettlementTabs → TabManager shim -------------------------
        //
        // Each settlement tab renderer registers with:
        //     SettlementTabs.registerTabRenderer('overview', fn)
        // and calls:
        //     SettlementTabs.requestRender('overview')
        //     SettlementTabs.activateTab('overview')
        //     SettlementTabs.renderActiveTab()
        //
        // The shim forwards all of these to TabManager with scope
        // 'settlement'. No other API of SettlementTabs is used by the
        // tab renderers (verified against all 10 files).

        var SCOPE = 'settlement';

        window.SettlementTabs = {
            registerTabRenderer: function (tabId, renderer) {
                window.TabManager.register(SCOPE, tabId, renderer);
            },
            requestRender: function (tabId) {
                window.TabManager.requestRender(SCOPE, tabId);
            },
            renderActiveTab: function () {
                return window.TabManager.renderActive(SCOPE);
            },
            activateTab: function (tabId) {
                return window.TabManager.activate(SCOPE, tabId);
            },
            setActiveTabId: function (tabId) {
                window.TabManager.setActive(SCOPE, tabId);
            },
            getActiveTabId: function () {
                var cfg = window.TabManager.getStatus().scopes[SCOPE];
                return cfg ? cfg.activeTabId : null;
            },
            init: function () {
                // TabManager.init() is idempotent; calling here mirrors
                // the previous SettlementTabs.init() call site.
                window.TabManager.init();
            }
        };
    })();
</script>

<!-- ================================================================
     BLOCK 34 — TAB MANAGER CONFIGURATION + SUB-TAB STRIP HOST
     ================================================================
     The 11 settlement tabs are rendered the Location-Manager way:
     a single `.manager-subtabs` strip at the top of #panelContent,
     and one `.manager-subpanel` beneath it that holds the active
     tab's output.

     The strip is regenerated on every activate() so the `active`
     class always matches TabManager's active tab. Each [data-tab]
     button in the strip is claimed by TabManager's document click
     handler (containerRoot = #panelContent).
     ================================================================ -->
<script>
    (function () {
        'use strict';

        // Sub-tab metadata. Order matches the old .panel-tabs order.
        // Icons are icon-name strings resolved via window.getIcon.
        var SUBTABS = [
            { id: 'location',    label: 'Location',    icon: 'LOCATION' },
            { id: 'overview',    label: 'Overview',    icon: 'BOOK' },
            { id: 'features',    label: 'Features',    icon: 'GEAR' },
            { id: 'economy',     label: 'Economy',     icon: 'COIN' },
            { id: 'religion',    label: 'Religion',    icon: 'CIRCLE_DOT' },
            { id: 'industry',    label: 'Industry',    icon: 'GEAR' },
            { id: 'education',   label: 'Education',   icon: 'BOOK' },
            { id: 'history',     label: 'History',     icon: 'CIRCLE_DOT' },
            { id: 'roles',       label: 'Roles',       icon: 'PERSON' },
            { id: 'government',  label: 'Government',  icon: 'HOME' },
            { id: 'crime',       label: 'Crime',       icon: 'WARNING' }
        ];

        function _icon(name) {
            if (typeof window.getIcon === 'function') {
                try {
                    var s = window.getIcon(name);
                    if (typeof s === 'string') return s;
                } catch (e) { /* ignore */ }
            }
            return '';
        }
        function _esc(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function _buildStrip(activeId) {
            var html = '<div class="manager-subtabs" role="tablist">';
            for (var i = 0; i < SUBTABS.length; i++) {
                var t = SUBTABS[i];
                var isActive = t.id === activeId;
                var cls = 'manager-subtab' + (isActive ? ' active' : '');
                var iconHtml = _icon(t.icon)
                    ? '<span class="manager-subtab-icon">' + _icon(t.icon) + '</span>'
                    : '';
                html +=
                    '<button type="button" class="' + cls + '" ' +
                    'data-tab="' + _esc(t.id) + '" ' +
                    'role="tab" aria-selected="' + (isActive ? 'true' : 'false') + '">' +
                    iconHtml +
                    '<span>' + _esc(t.label) + '</span>' +
                    '</button>';
            }
            html += '</div>';
            return html;
        }

        // Where the active tab's renderer writes. This element is
        // created by the sub-tab host that TabManager's resolveContainer
        // returns. The host lives inside #panelContent.
        var PANEL_ID = 'tab-settlement-panel';

        function _renderStrip() {
            var host = document.getElementById('settlement-subtab-host');
            if (!host) return;
            var active = null;
            var status = window.TabManager.getStatus();
            if (status && status.scopes && status.scopes.settlement) {
                active = status.scopes.settlement.activeTabId || null;
            }
            host.innerHTML = _buildStrip(active);
        }

        // Ensure the host + panel exist inside #panelContent. Idempotent.
        function _ensureHost() {
            var panelContent = document.getElementById('panelContent');
            if (!panelContent) return null;

            var host = document.getElementById('settlement-subtab-host');
            if (!host) {
                host = document.createElement('div');
                host.id = 'settlement-subtab-host';
                panelContent.innerHTML = '';
                panelContent.appendChild(host);

                var panel = document.createElement('div');
                panel.id = PANEL_ID;
                panel.className = 'manager-subpanel';
                panel.setAttribute('role', 'tabpanel');
                panelContent.appendChild(panel);
            }
            return host;
        }

        function _resolveContainer(tabId) {
            if (tabId === 'location' || tabId === 'overview' ||
                tabId === 'features' || tabId === 'economy' ||
                tabId === 'religion' || tabId === 'industry' ||
                tabId === 'education' || tabId === 'history' ||
                tabId === 'roles' || tabId === 'government' ||
                tabId === 'crime') {
                return document.getElementById(PANEL_ID);
            }
            return document.getElementById(PANEL_ID);
        }

        function _buildContext() {
            var ui = window.SettlementUIState;
            if (!ui || typeof ui.getSelectedLocationId !== 'function') {
                return null;
            }
            var locationId = ui.getSelectedLocationId();
            if (!locationId) return null;

            var data = null;
            var viewModel = null;
            try {
                if (window.SettlementQueries
                    && typeof window.SettlementQueries.getSettlementData === 'function') {
                    data = window.SettlementQueries.getSettlementData(locationId);
                }
            } catch (e) { data = null; }

            try {
                if (window.SettlementViewModels
                    && typeof window.SettlementViewModels.buildSettlementSummary === 'function') {
                    viewModel = window.SettlementViewModels.buildSettlementSummary(locationId);
                }
            } catch (e) { viewModel = null; }

            return {
                locationId: locationId,
                data: data,
                viewModel: viewModel
            };
        }

        function _getActiveTabId() {
            var ui = window.SettlementUIState;
            if (ui && typeof ui.getActiveTabId === 'function') {
                return ui.getActiveTabId();
            }
            return 'location';
        }

        function _setActiveTabId(tabId) {
            var ui = window.SettlementUIState;
            if (ui && typeof ui.setActiveTabId === 'function') {
                ui.setActiveTabId(tabId);
            }
            _renderStrip();
        }

        function _buildEmptyState(tabId, reason) {
            if (reason === 'no-context') {
                return '<div class="empty-state">Select a location from the sidebar</div>';
            }
            if (reason === 'no-renderer') {
                return '<div class="empty-state">This tab is not available yet.</div>';
            }
            return '';
        }

        function _onActivate(tabId, context) {
            _renderStrip();
            // Keep in sync with the old SettleTabs behaviour: when the
            // user activates a tab from the strip, the tab id lives in
            // SettlementUIState so other modules (crime events, etc.)
            // can read it.
            if (window.SettlementUIState
                && typeof window.SettlementUIState.setActiveTabId === 'function') {
                window.SettlementUIState.setActiveTabId(tabId);
            }
        }

        function configure() {
            var panelContent = document.getElementById('panelContent');
            if (!panelContent) return;

            _ensureHost();

            window.TabManager.configure('settlement', {
                containerRoot: panelContent,
                resolveContainer: _resolveContainer,
                buildContext: _buildContext,
                getActiveTabId: _getActiveTabId,
                setActiveTabId: _setActiveTabId,
                buildEmptyState: _buildEmptyState,
                onActivate: _onActivate
            });

            window.TabManager.init();
            _renderStrip();
        }

        configure();
    })();
</script>

<!-- ================================================================
     BLOCK 35 — MANAGER INIT
     (mirrors Location Manager's init: setupUIText, setupYearControl,
      setupSidebar, setupTopBarActions, pickInitialSelection,
      selectLocation with in-place selection toggle, theme switcher)
     ================================================================ -->
<script>
(function () {
    'use strict';

    function getIcon(name) {
        return (window.Icons && window.Icons[name]) ? window.Icons[name] : '';
    }
    function iconWithText(icon, text) {
        if (!icon) return text || '';
        return '<span style="display:inline-flex;align-items:center;gap:4px;vertical-align:middle;">' +
               icon + '<span>' + (text || '') + '</span></span>';
    }
    function showToast(msg, type) {
        if (typeof window.showToast === 'function') window.showToast(msg, type);
    }

    var currentPlaceId = null;
    var isInitialized = false;

    // =========================================================================
    // 1. TOPBAR TEXT
    // =========================================================================

    function setupUIText() {
        var title = document.getElementById('settlementManagerTitle');
        if (title) title.innerHTML = iconWithText(getIcon('HOME'), ' SETTLEMENT MANAGER');

        var sidebarTitle = document.getElementById('sidebarTitle');
        if (sidebarTitle) sidebarTitle.innerHTML = iconWithText(getIcon('LOCATION'), ' LOCATIONS');

        var addLoc = document.getElementById('addLocationBtn');
        if (addLoc) addLoc.innerHTML = iconWithText(getIcon('PLUS'), ' Add Location');

        var addSet = document.getElementById('addSettlementBtn');
        if (addSet) addSet.innerHTML = iconWithText(getIcon('PLUS'), ' Add Settlement');

        var importBtn = document.getElementById('importBtn');
        if (importBtn) importBtn.innerHTML = iconWithText(getIcon('ARROW_RIGHT'), ' Import');

        var exportBtn = document.getElementById('exportBtn');
        if (exportBtn) exportBtn.innerHTML = iconWithText(getIcon('ARROW_RIGHT'), ' Export');

        var loadingText = document.getElementById('loadingText');
        if (loadingText) loadingText.textContent = 'Loading locations…';

        var emptyState = document.getElementById('emptyStateText');
        if (emptyState) emptyState.textContent = 'Select a location from the sidebar';
    }

    // =========================================================================
    // 2. YEAR CONTROL
    // =========================================================================

    function setupYearControl() {
        var input = document.getElementById('yearInput');
        var btn = document.getElementById('setYearBtn');
        if (!input || !btn) return;

        function syncFromCanonical() {
            try {
                var y = (typeof window.getCurrentYear === 'function')
                    ? window.getCurrentYear()
                    : (window.masterData && window.masterData.data
                        ? window.masterData.data.currentYear
                        : null);
                if (typeof y === 'number' && isFinite(y)) {
                    input.value = String(y);
                }
            } catch (e) { /* ignore */ }
        }
        syncFromCanonical();

        function applyYear() {
            var raw = input.value;
            var y = parseInt(raw, 10);
            if (!isFinite(y)) {
                showToast('Enter a valid year', 'error');
                return;
            }
            if (typeof window.isValidYear === 'function' && window.isValidYear(y) !== true) {
                showToast('Year out of range', 'error');
                return;
            }

            var applied = false;
            if (typeof window.setCurrentYear === 'function') {
                try {
                    var result = window.setCurrentYear(y);
                    if (result === false) {
                        showToast('Could not set year', 'error');
                        return;
                    }
                    applied = true;
                } catch (e) {
                    showToast('Set year failed: ' + (e.message || 'unknown'), 'error');
                    return;
                }
            }

            if (!applied) {
                if (!window.masterData || !window.masterData.data) {
                    showToast('Storage not initialized', 'error');
                    return;
                }
                window.masterData.data.currentYear = y;
                if (typeof window.markDataDirty === 'function') {
                    try { window.markDataDirty(); } catch (e) { /* ignore */ }
                }
                if (typeof window.saveMasterData === 'function') {
                    try { window.saveMasterData(); } catch (e) { /* ignore */ }
                }
                applied = true;
            }

            if (applied) {
                showToast('Year set to ' + y, 'success');
                syncFromCanonical();
                if (window.SettlementUIState && window.SettlementTabs) {
                    try { window.SettlementTabs.renderActiveTab(); } catch (e) { /* ignore */ }
                }
                setupSidebar();
            }
        }

        btn.addEventListener('click', applyYear);
        input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                applyYear();
            }
        });
    }

    // =========================================================================
    // 3. SIDEBAR
    // =========================================================================

    function setupSidebar() {
        var container = document.getElementById('placeList');
        if (!container) return;

        if (window.LocationUI && typeof window.LocationUI.renderLocationList === 'function') {
            try {
                window.LocationUI.renderLocationList('placeList', {
                    selectedId: currentPlaceId,
                    onSelect: function (placeOrId) {
                        var id = (typeof placeOrId === 'string')
                            ? placeOrId
                            : (placeOrId && placeOrId.id ? placeOrId.id : null);
                        if (!id) return;
                        selectLocation(id);
                    }
                });
                return;
            } catch (e) {
                console.error('[settlement-manager] renderLocationList failed:', e);
            }
        }

        var places = (typeof window.getPlaces === 'function') ? window.getPlaces() : [];
        if (places && places.length > 0) {
            var html = '';
            for (var i = 0; i < places.length; i++) {
                var p = places[i];
                var sel = (p.id === currentPlaceId);
                html += '<div class="place-item' + (sel ? ' selected' : '') +
                        '" data-place-id="' + p.id + '">' +
                        (p.displayName || p.name || 'Unknown') +
                        '</div>';
            }
            container.innerHTML = html;
            var items = container.querySelectorAll('.place-item');
            for (var j = 0; j < items.length; j++) {
                (function (item) {
                    item.addEventListener('click', function () {
                        var placeId = this.dataset.placeId;
                        if (placeId) selectLocation(placeId);
                    });
                })(items[j]);
            }
        } else {
            container.innerHTML = '<div class="empty-state">No locations found</div>';
        }
    }

    function _applySidebarSelection(previousId, nextId) {
        var container = document.getElementById('placeList');
        if (!container) return;

        var newRow = container.querySelector(
            '.location-tree-item[data-node-id="' + _cssEscape(nextId) + '"]'
        );

        if (!newRow) {
            setupSidebar();
            return;
        }

        if (previousId) {
            var prevRow = container.querySelector(
                '.location-tree-item[data-node-id="' + _cssEscape(previousId) + '"]'
            );
            if (prevRow) prevRow.classList.remove('is-selected');
        }

        newRow.classList.add('is-selected');
    }

    function _cssEscape(s) {
        if (typeof window.CSS !== 'undefined' &&
            typeof window.CSS.escape === 'function') {
            return window.CSS.escape(s);
        }
        return String(s).replace(/([^A-Za-z0-9_-])/g, '\\$1');
    }

    // =========================================================================
    // 4. SELECT LOCATION
    // =========================================================================

    function selectLocation(id) {
        if (!id) return;

        if (id === currentPlaceId) {
            if (window.TabManager) {
                try { window.TabManager.renderActive('settlement'); }
                catch (e) { console.error(e); }
            }
            return;
        }

        var previousId = currentPlaceId;
        currentPlaceId = id;

        if (window.SettlementUIState &&
            typeof window.SettlementUIState.setSelectedLocationId === 'function') {
            try { window.SettlementUIState.setSelectedLocationId(id); }
            catch (e) { /* ignore */ }
        }

        _applySidebarSelection(previousId, id);

        if (window.TabManager) {
            try { window.TabManager.renderActive('settlement'); }
            catch (e) { console.error(e); }
        }

        if (window.innerWidth <= 768) closeSidebar();
    }

    function closeSidebar() {
        var s = document.getElementById('locationsSidebar');
        var o = document.getElementById('sidebarOverlay');
        if (s) s.classList.remove('visible');
        if (o) o.classList.remove('active');
    }
    function openSidebar() {
        var s = document.getElementById('locationsSidebar');
        var o = document.getElementById('sidebarOverlay');
        if (s) s.classList.add('visible');
        if (o) o.classList.add('active');
    }
    function toggleSidebar() {
        var s = document.getElementById('locationsSidebar');
        if (!s) return;
        if (s.classList.contains('visible')) closeSidebar();
        else openSidebar();
    }

    function pickInitialSelection() {
        if (currentPlaceId) return;
        if (!window.LocationQueries) return;
        try {
            var roots = window.LocationQueries.getRootPlaces({});
            if (roots && roots.length > 0) selectLocation(roots[0].id);
        } catch (e) {
            console.error('[settlement-manager] initial selection failed:', e);
        }
    }

    // =========================================================================
    // 5. TOPBAR ACTIONS
    // =========================================================================

    function setupTopBarActions() {
        var addLocBtn = document.getElementById('addLocationBtn');
        if (addLocBtn) addLocBtn.onclick = function () {
            if (typeof window.openAddPlaceModal !== 'function') {
                showToast('Add modal unavailable', 'error');
                return;
            }
            window.openAddPlaceModal(null, function (newId) {
                setupSidebar();
                if (newId) selectLocation(newId);
            });
        };

        var addSetBtn = document.getElementById('addSettlementBtn');
        if (addSetBtn) addSetBtn.onclick = function () {
            if (!currentPlaceId) {
                showToast('Select a location first', 'warning');
                return;
            }
            if (!window.SettlementFactory || typeof window.SettlementFactory.ensureSettlement !== 'function') {
                showToast('SettlementFactory not loaded', 'error');
                return;
            }
            try {
                var result = window.SettlementFactory.ensureSettlement(currentPlaceId);
                if (!result || result.success !== true) {
                    showToast('Could not create settlement: ' +
                        (result && result.code ? result.code : 'unknown'), 'error');
                    return;
                }
                if (window.TabManager) {
                    window.TabManager.activate('settlement', 'overview');
                }
                window.TabManager && window.TabManager.renderActive('settlement');
            } catch (e) {
                console.error('[settlement-manager] createSettlement failed:', e);
                showToast('Could not create settlement: ' + (e.message || 'unknown'), 'error');
            }
        };

        var importBtn = document.getElementById('importBtn');
        var fileInput = document.getElementById('fileInput');
        if (importBtn && fileInput) {
            importBtn.onclick = function () {
                fileInput.value = '';
                fileInput.click();
            };
            fileInput.onchange = function () {
                var file = this.files && this.files[0];
                if (!file) return;
                var reader = new FileReader();
                reader.onload = function (ev) {
                    try {
                        var parsed = JSON.parse(ev.target.result);
                        var dataToInstall = null;
                        if (parsed && parsed.data && parsed.data.places !== undefined) dataToInstall = parsed.data;
                        else if (parsed && parsed.places !== undefined) dataToInstall = parsed;
                        else if (parsed && parsed.data) dataToInstall = parsed.data;
                        if (!dataToInstall) {
                            showToast('Unrecognized import format', 'error');
                            return;
                        }
                        if (typeof window.normalizeMasterData !== 'function') {
                            showToast('Schema module not available', 'error');
                            return;
                        }

                        window.masterData = window.normalizeMasterData({
                            schemaVersion: window.STORAGE_SCHEMA_VERSION,
                            savedAt: new Date().toISOString(),
                            data: dataToInstall
                        });
                        if (typeof window.invalidateAccessorCaches === 'function') window.invalidateAccessorCaches();
                        if (typeof window.markDataDirty === 'function') window.markDataDirty();
                        if (typeof window.saveMasterData === 'function' && !window.saveMasterData()) {
                            showToast('Save failed after import', 'error');
                            return;
                        }
                        if (window.LocationBootstrap && typeof window.LocationBootstrap.init === 'function') {
                            try { window.LocationBootstrap.init(); } catch (e) { /* ignore */ }
                        }
                        if (window.SettlementState && typeof window.SettlementState.rebuildIndexes === 'function') {
                            try { window.SettlementState.rebuildIndexes(); } catch (e) { /* ignore */ }
                        }
                        if (window.CrimeBootstrap && typeof window.CrimeBootstrap.reinit === 'function') {
                            try { window.CrimeBootstrap.reinit(); } catch (e) { /* ignore */ }
                        }
                        currentPlaceId = null;
                        setupSidebar();
                        pickInitialSelection();
                        if (window.TabManager) {
                            try { window.TabManager.renderActive('settlement'); } catch (e) { /* ignore */ }
                        }
                        showToast('Import complete', 'success');
                    } catch (err) {
                        showToast('Invalid JSON: ' + err.message, 'error');
                    }
                };
                reader.onerror = function () { showToast('Failed to read file', 'error'); };
                reader.readAsText(file);
                this.value = '';
            };
        }

        var exportBtn = document.getElementById('exportBtn');
        if (exportBtn) exportBtn.onclick = function () {
            if (typeof window.exportToJSON !== 'function') {
                showToast('Export module not available', 'error');
                return;
            }
            if (!window.masterData) {
                showToast('No data to export', 'error');
                return;
            }
            try {
                window.exportToJSON(window.masterData, 'stillwaters');
                showToast('Export started', 'success');
            } catch (e) {
                showToast('Export failed: ' + (e.message || 'unknown'), 'error');
            }
        };
    }

    // =========================================================================
    // 6. BOOTSTRAP
    // =========================================================================

    function bootstrap() {
        if (isInitialized) return;
        isInitialized = true;

        setupUIText();
        setupTopBarActions();
        setupYearControl();

        if (typeof window.loadMasterData === 'function') window.loadMasterData();

        if (window.LocationBootstrap) {
            try { window.LocationBootstrap.init(); }
            catch (e) { console.error('LocationBootstrap.init failed:', e); }
        }
        if (window.SettlementState && typeof window.SettlementState.rebuildIndexes === 'function') {
            try { window.SettlementState.rebuildIndexes(); }
            catch (e) { console.error('SettlementState.rebuildIndexes failed:', e); }
        }
        if (window.ReligionBootstrap && typeof window.ReligionBootstrap.init === 'function') {
            try { window.ReligionBootstrap.init(); } catch (e) { /* ignore */ }
        }
        if (window.CrimeBootstrap && typeof window.CrimeBootstrap.init === 'function') {
            try { window.CrimeBootstrap.init(); } catch (e) { /* ignore */ }
        }
        if (window.IndustryBootstrap && typeof window.IndustryBootstrap.init === 'function') {
            try { window.IndustryBootstrap.init(); } catch (e) { /* ignore */ }
        }
        if (window.GovernmentBootstrap && typeof window.GovernmentBootstrap.init === 'function') {
            try { window.GovernmentBootstrap.init(); } catch (e) { /* ignore */ }
        }

        // TabManager.init() was already called from the configuration
        // block. Calling again is a no-op.
        if (window.TabManager) {
            window.TabManager.init();
        }

        setTimeout(function () {
            setupSidebar();
            pickInitialSelection();

            if (!currentPlaceId && window.TabManager) {
                try { window.TabManager.renderActive('settlement'); }
                catch (e) { /* ignore */ }
            }

            var menuToggle = document.getElementById('menuToggle');
            if (menuToggle) menuToggle.addEventListener('click', toggleSidebar);
            var overlay = document.getElementById('sidebarOverlay');
            if (overlay) overlay.addEventListener('click', closeSidebar);
        }, 150);

        // React to masterData updates (same contract as before).
        if (typeof window.addEventListener === 'function') {
            window.addEventListener('masterDataUpdated', function () {
                setupSidebar();
                if (window.TabManager) {
                    try { window.TabManager.renderActive('settlement'); } catch (e) { /* ignore */ }
                }
            });

            var _crimeEvents = [
                'crimeRecorded', 'crimeSolved', 'crimeDeleted',
                'vendettaCreated', 'vendettaDeath', 'vendettaEscalated',
                'vendettaResolved', 'vendettaDeleted'
            ];
            for (var ci = 0; ci < _crimeEvents.length; ci++) {
                (function (eventName) {
                    window.addEventListener(eventName, function () {
                        if (window.SettlementUIState
                            && window.SettlementUIState.getActiveTabId
                            && window.SettlementUIState.getActiveTabId() === 'crime'
                            && window.TabManager) {
                            try { window.TabManager.renderActive('settlement'); }
                            catch (e) { /* ignore */ }
                        }
                    });
                })(_crimeEvents[ci]);
            }
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bootstrap);
    } else {
        bootstrap();
    }
})();
</script>

<!-- ================================================================
     BLOCK 36 — THEME SWITCHER UI
     (identical to Location Manager's theme switcher block)
     ================================================================ -->
<script>
(function () {
    'use strict';
    var themeBtn = document.getElementById('themeBtn');
    var themeMenu = document.getElementById('themeMenu');
    var themeName = document.getElementById('themeName');
    var switcher = window.ThemeSwitcher;
    if (!switcher) return;

    function updateLabel(id) {
        var label = id.charAt(0).toUpperCase() + id.slice(1).replace(/-/g, ' ');
        if (themeName) themeName.textContent = label;
    }
    function buildMenu() {
        var html = '';
        for (var i = 0; i < switcher.themes.length; i++) {
            var id = switcher.themes[i];
            var label = id.charAt(0).toUpperCase() + id.slice(1).replace(/-/g, ' ');
            html += '<li role="none"><button role="menuitem" type="button" data-theme-id="' + id + '">' + label + '</button></li>';
        }
        if (themeMenu) themeMenu.innerHTML = html;
    }
    function openMenu()  { if (!themeMenu) return; themeMenu.hidden = false; themeBtn.setAttribute('aria-expanded', 'true'); }
    function closeMenu() { if (!themeMenu) return; themeMenu.hidden = true; themeBtn.setAttribute('aria-expanded', 'false'); }

    if (themeBtn) themeBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        if (themeMenu.hidden) openMenu(); else closeMenu();
    });
    if (themeMenu) themeMenu.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-theme-id]');
        if (!btn) return;
        var id = btn.getAttribute('data-theme-id');
        switcher.apply(id); updateLabel(id); closeMenu();
    });
    document.addEventListener('click', function (e) {
        if (themeMenu && !themeMenu.hidden) {
            if (themeMenu.contains(e.target)) return;
            if (e.target === themeBtn) return;
            closeMenu();
        }
    });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && themeMenu && !themeMenu.hidden) closeMenu();
    });

    buildMenu();
    var saved = switcher.getSaved();
    if (saved) updateLabel(saved);
})();
</script>
