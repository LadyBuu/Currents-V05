    <!-- ============================================================ -->
    <!-- LOAD LOCALSTORAGE DATA FIRST (BEFORE ANY SYSTEMS)            -->
    <!-- ============================================================ -->
    <script>
        (function() {
            'use strict';
            try {
                var STORAGE_KEY = 'stillwaters_master';
                var stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    var parsed = JSON.parse(stored);
                    if (parsed && parsed.data) {
                        window.masterData = parsed;
                        console.log('[PRELOAD] Loaded from localStorage');
                    }
                }
            } catch(e) {
                console.warn('[PRELOAD] Failed to load from localStorage:', e.message);
            }

            if (!window.masterData || !window.masterData.data) {
                window.masterData = {
                    version: '2.0',
                    lastUpdated: new Date().toISOString(),
                    data: {
                        characters: [],
                        places: [],
                        ranks: [],
                        roles: [],
                        locationTypes: [],
                        governmentTypes: [],
                        households: [],
                        householdPositions: [],
                        householdAssignments: [],
                        residences: [],
                        currentYear: 1250
                    }
                };
                console.log('[PRELOAD] Created empty masterData');
            }

            // Ensure household-related arrays exist even if a legacy save
            // omitted them. Structural shape only — no domain defaults.
            if (!Array.isArray(window.masterData.data.households)) {
                window.masterData.data.households = [];
            }
            if (!Array.isArray(window.masterData.data.householdPositions)) {
                window.masterData.data.householdPositions = [];
            }
            if (!Array.isArray(window.masterData.data.householdAssignments)) {
                window.masterData.data.householdAssignments = [];
            }
            if (!Array.isArray(window.masterData.data.residences)) {
                window.masterData.data.residences = [];
            }
        })();
    </script>

    <!-- HOUSEHOLD SYSTEM - CONVERGED (v6.1)                          -->
    <!-- ============================================================ -->
    <!--
        Load order is critical:
          1. Foundation (constants, rules, view-models) — no state deps
          2. Storage (state) — owns canonical arrays
          3. Reads (queries) — reads state
          4. Writes (commands) — only module that persists
          5. Economy — reads/writes via commands
          6. Orchestrators (assignment, servant)
          7. Residence — canonical residence storage
          8. Bootstrap — verifies + hydrates everything above

        Every module (2-7) verifies its cross-domain deps at load.
        Bootstrap is the last line of verification + exposes window.Household.
    -->

    <!-- ============================================================ -->
    <!-- ORCHESTRATOR — Household Manager page logic                  -->
    <!-- ============================================================ -->

    <script>
        (function() {
            'use strict';

            var listContainer = document.getElementById('householdListContainer');
            var burgerBtn = document.getElementById('burgerBtn');
            var sidebar = document.getElementById('sidebar');
            var exportBtn = document.getElementById('exportBtn');
            var importBtn = document.getElementById('importBtn');
            var fileInput = document.getElementById('fileInput');
            var yearInput = document.getElementById('yearInput');
            var setYearBtn = document.getElementById('setYearBtn');

            var selectedId = null;
            var isInitialized = false;
            var _renderTimeout = null;

            // ============================================================
            // Sanity: verify the converged household modules loaded.
            // Bootstrap verifies internally; we surface the result here
            // so the page fails visibly if something is missing.
            // ============================================================
            function _verifyHouseholdModules() {
                if (typeof window.HouseholdConstants === 'undefined') {
                    console.error('[HouseholdManager] HouseholdConstants is missing. ' +
                        'Load household-constants.js before the other household modules.');
                    return false;
                }
                if (typeof window.HouseholdRules === 'undefined') {
                    console.error('[HouseholdManager] HouseholdRules is missing. ' +
                        'Load household-rules.js before the other household modules.');
                    return false;
                }
                if (typeof window.HouseholdViewModels === 'undefined') {
                    console.error('[HouseholdManager] HouseholdViewModels is missing. ' +
                        'Load household-view-models.js before the other household modules.');
                    return false;
                }
                if (typeof window.HouseholdBootstrap === 'undefined') {
                    console.error('[HouseholdManager] HouseholdBootstrap is missing. ' +
                        'Load household-bootstrap.js after the household core.');
                    return false;
                }
                if (typeof window.HouseholdQueries === 'undefined') {
                    console.error('[HouseholdManager] HouseholdQueries is missing.');
                    return false;
                }
                if (typeof window.HouseholdCommands === 'undefined') {
                    console.error('[HouseholdManager] HouseholdCommands is missing.');
                    return false;
                }
                if (typeof window.HouseholdCommands.persist !== 'function') {
                    console.error('[HouseholdManager] HouseholdCommands.persist is missing. ' +
                        'The commands module is loaded but does not expose persist(). ' +
                        'Check the load order — the commands file must be the converged version.');
                    return false;
                }
                return true;
            }

            // ============================================================
            // Add Household button
            // ============================================================
            document.getElementById('addHouseholdBtn').addEventListener('click', function() {
                if (typeof window.openCreateHouseholdModal === 'function') {
                    window.openCreateHouseholdModal(function(household) {
                        if (household) {
                            selectedId = household.id;
                            window._currentHouseholdId = selectedId;
                            renderHouseholdList();
                            renderActiveTab();
                        }
                    });
                } else {
                    window._showToast('Create household modal not available', 'error');
                }
            });

            // ============================================================
            // TAB SWITCHING
            // ============================================================
            var tabButtons = document.querySelectorAll('.tab-btn');
            var tabPanes = {
                details: document.getElementById('tab-details'),
                members: document.getElementById('tab-members'),
                economy: document.getElementById('tab-economy'),
                positions: document.getElementById('tab-positions'),
                holdings: document.getElementById('tab-holdings')
            };

            window._currentHouseholdId = null;

            function renderActiveTab() {
                if (!selectedId) {
                    Object.keys(tabPanes).forEach(function(key) {
                        if (tabPanes[key].classList.contains('active')) {
                            tabPanes[key].innerHTML = '<div class="placeholder">Select a household from the sidebar</div>';
                        }
                    });
                    return;
                }

                window._currentHouseholdId = selectedId;

                var activeTab = document.querySelector('.tab-btn.active');
                if (!activeTab) return;

                var tabId = activeTab.dataset.tab;

                if (tabId === 'details') {
                    if (typeof window.renderHouseholdOverviewTab === 'function') {
                        window.renderHouseholdOverviewTab('tab-details', selectedId);
                    } else {
                        tabPanes.details.innerHTML = '<div class="placeholder">Overview tab not loaded</div>';
                    }
                } else if (tabId === 'members') {
                    if (typeof window.renderHouseholdMembersTab === 'function') {
                        window.renderHouseholdMembersTab('tab-members', selectedId);
                    } else {
                        tabPanes.members.innerHTML = '<div class="placeholder">Members tab not loaded</div>';
                    }
                } else if (tabId === 'economy') {
                    if (typeof window.renderHouseholdEconomyTab === 'function') {
                        window.renderHouseholdEconomyTab('tab-economy', selectedId);
                    } else {
                        tabPanes.economy.innerHTML = '<div class="placeholder">Economy tab not loaded</div>';
                    }
                } else if (tabId === 'positions') {
                    if (typeof window.renderHouseholdDepartmentsTab === 'function') {
                        window.renderHouseholdDepartmentsTab('tab-positions', selectedId);
                    } else {
                        tabPanes.positions.innerHTML = '<div class="placeholder">Departments tab not loaded</div>';
                    }
                } else if (tabId === 'holdings') {
                    if (typeof window.renderHouseholdHoldingsTab === 'function') {
                        window.renderHouseholdHoldingsTab('tab-holdings', selectedId);
                    } else {
                        tabPanes.holdings.innerHTML = '<div class="placeholder">Holdings tab not loaded</div>';
                    }
                }
            }

            function switchTab(tabId) {
                tabButtons.forEach(function(btn) {
                    btn.classList.toggle('active', btn.dataset.tab === tabId);
                });

                Object.keys(tabPanes).forEach(function(key) {
                    tabPanes[key].classList.toggle('active', key === tabId);
                });

                renderActiveTab();
            }

            tabButtons.forEach(function(btn) {
                btn.addEventListener('click', function() {
                    switchTab(this.dataset.tab);
                });
            });

            // ============================================================
            // SIDEBAR TOGGLE
            // ============================================================
            function toggleSidebar() {
                sidebar.classList.toggle('open');
            }

            function closeSidebar() {
                sidebar.classList.remove('open');
            }

            burgerBtn.addEventListener('click', toggleSidebar);

            document.addEventListener('click', function(e) {
                if (window.innerWidth <= 768) {
                    if (!sidebar.contains(e.target) && e.target !== burgerBtn) {
                        closeSidebar();
                    }
                }
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeSidebar();
            });

            window.addEventListener('resize', function() {
                if (window.innerWidth > 768) closeSidebar();
            });

            // ============================================================
            // GET/SET FULL DATA
            // ============================================================
            function getFullData() {
                if (typeof window.masterData !== 'undefined' && window.masterData) {
                    return window.masterData;
                }
                return null;
            }

            function setFullData(data) {
                if (data && data.data) {
                    window.masterData = data;
                } else if (data && data.places) {
                    window.masterData = {
                        version: '2.0',
                        lastUpdated: new Date().toISOString(),
                        data: data
                    };
                } else {
                    return false;
                }

                // Ensure structural shape on household arrays — no domain defaults.
                var d = window.masterData.data;
                if (!Array.isArray(d.households)) d.households = [];
                if (!Array.isArray(d.householdPositions)) d.householdPositions = [];
                if (!Array.isArray(d.householdAssignments)) d.householdAssignments = [];
                if (!Array.isArray(d.residences)) d.residences = [];

                try {
                    localStorage.setItem('stillwaters_master', JSON.stringify(window.masterData));
                } catch(e) {}

                if (typeof window.saveMasterData === 'function') {
                    window.saveMasterData(true);
                }
                if (typeof window.invalidateAccessorCaches === 'function') {
                    window.invalidateAccessorCaches();
                }

                // Re-hydrate all household modules from the new data.
                try {
                    if (typeof window.HouseholdState !== 'undefined' &&
                        typeof window.HouseholdState.hydrateFromMasterData === 'function') {
                        window.HouseholdState.hydrateFromMasterData();
                    } else if (typeof window.HouseholdState !== 'undefined' &&
                        typeof window.HouseholdState.refresh === 'function') {
                        window.HouseholdState.refresh();
                    }
                } catch (e) {
                    console.warn('[HouseholdManager] HouseholdState hydration failed:', e);
                }

                try {
                    if (typeof window.ResidenceSystem !== 'undefined' &&
                        typeof window.ResidenceSystem.hydrateFromMasterData === 'function') {
                        window.ResidenceSystem.hydrateFromMasterData();
                    }
                } catch (e) {
                    console.warn('[HouseholdManager] ResidenceSystem hydration failed:', e);
                }

                return true;
            }

            // ============================================================
            // RENDER HOUSEHOLD LIST
            // ============================================================
            function renderHouseholdList() {
                if (!listContainer) return;

                if (_renderTimeout) {
                    clearTimeout(_renderTimeout);
                    _renderTimeout = null;
                }

                var HQ = window.HouseholdQueries;
                var HUI = window.mountHouseholdList;

                if (!HQ || typeof HUI !== 'function') {
                    listContainer.innerHTML = '<div class="loading-placeholder">Loading households...</div>';
                    return;
                }

                // Read households via Queries (not State). Queries returns
                // defensive projections, which is what the UI should render.
                var households;
                try {
                    households = HQ.getAllHouseholds();
                } catch (e) {
                    console.warn('[HouseholdManager] getHouseholds failed:', e);
                    listContainer.innerHTML = '<div class="error-state">Error loading households</div>';
                    return;
                }

                if (!households || households.length === 0) {
                    listContainer.innerHTML = '<div class="empty-state">No households found</div>';
                    // Still reset the selection so stale IDs don't persist.
                    selectedId = null;
                    window._currentHouseholdId = null;
                    return;
                }

                try {
                    HUI('householdListContainer', function(householdId) {
                        if (!householdId) return;
                        selectedId = householdId;
                        window._currentHouseholdId = householdId;
                        renderActiveTab();
                        if (window.innerWidth <= 768) closeSidebar();
                    }, {
                        preserveSelection: true,
                        selectedId: selectedId || undefined
                    });

                    // Reconcile: if the selected household no longer exists
                    // in the fresh list, clear the selection.
                    if (selectedId) {
                        var found = false;
                        for (var i = 0; i < households.length; i++) {
                            if (households[i].id === selectedId) {
                                found = true;
                                break;
                            }
                        }
                        if (!found) {
                            selectedId = null;
                            window._currentHouseholdId = null;
                        }
                    }

                    // Auto-select the first household if none is selected.
                    if (!selectedId && households.length > 0) {
                        selectedId = households[0].id;
                        window._currentHouseholdId = selectedId;
                        _renderTimeout = setTimeout(function() {
                            renderHouseholdList();
                            renderActiveTab();
                            _renderTimeout = null;
                        }, 50);
                    }
                } catch (e) {
                    console.warn('[HouseholdManager] mountHouseholdList failed:', e);
                    listContainer.innerHTML = '<div class="error-state">Error loading households</div>';
                }
            }

            // ============================================================
            // IMPORT / EXPORT
            // ============================================================
            exportBtn.addEventListener('click', function() {
                var data = getFullData();
                if (!data) {
                    alert('No data to export');
                    return;
                }
                var blob = new Blob([JSON.stringify(data, null, 2)], {
                    type: 'application/json'
                });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = 'stillwaters_households_' + Date.now() + '.json';
                a.click();
                URL.revokeObjectURL(url);
            });

            importBtn.addEventListener('click', function() {
                fileInput.value = '';
                fileInput.click();
            });

            fileInput.addEventListener('change', function() {
                var file = this.files[0];
                if (!file) return;

                var reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        var imported = JSON.parse(e.target.result);
                        var dataToImport = null;

                        if (imported.data && imported.version) {
                            dataToImport = imported;
                        } else if (imported.places || imported.characters) {
                            dataToImport = {
                                version: '2.0',
                                lastUpdated: new Date().toISOString(),
                                data: imported
                            };
                        } else if (imported.data) {
                            dataToImport = {
                                version: '2.0',
                                lastUpdated: new Date().toISOString(),
                                data: imported.data
                            };
                        }

                        if (!dataToImport) {
                            alert('Invalid format: Could not recognize data structure.');
                            return;
                        }

                        if (setFullData(dataToImport)) {
                            renderHouseholdList();
                            renderActiveTab();
                        } else {
                            alert('Import failed');
                        }
                    } catch (err) {
                        alert('Invalid JSON: ' + err.message);
                    }
                };
                reader.readAsText(file);
                this.value = '';
            });

            // ============================================================
            // YEAR SETTER
            // ============================================================
            setYearBtn.addEventListener('click', function() {
                var val = parseInt(yearInput.value, 10);
                if (isNaN(val) || !window.masterData) return;

                window.masterData.data.currentYear = val;
                try {
                    localStorage.setItem('stillwaters_master', JSON.stringify(window.masterData));
                } catch(e) {}
                if (typeof window.saveMasterData === 'function') {
                    window.saveMasterData(true);
                }

                // Refresh household state so any year-dependent queries
                // (heir discovery, historical snapshots) use the new year.
                if (typeof window.HouseholdState !== 'undefined' &&
                    typeof window.HouseholdState.refresh === 'function') {
                    try {
                        window.HouseholdState.refresh();
                    } catch (e) {
                        console.warn('[HouseholdManager] HouseholdState.refresh failed:', e);
                    }
                }

                // Re-render the active tab so year-dependent displays update.
                renderActiveTab();
            });

            // ============================================================
            // FORCE RENDER ON HOUSEHOLD SELECTION (backup path)
            // ============================================================
            // The primary path is the mountHouseholdList onSelect callback.
            // This backup listener catches the case where the click handler
            // fires before the list re-renders.
            document.addEventListener('click', function(e) {
                var item = e.target.closest('.household-item');
                if (item && item.dataset.id) {
                    var id = item.dataset.id;
                    setTimeout(function() {
                        if (selectedId === id) {
                            window._currentHouseholdId = id;
                            renderActiveTab();
                        }
                    }, 150);
                }
            });

            // ============================================================
            // DEBUG: Log module presence on load
            // ============================================================
            console.log('[HouseholdManager] Household modules:');
            console.log('  HouseholdConstants:', typeof window.HouseholdConstants);
            console.log('  HouseholdRules:', typeof window.HouseholdRules);
            console.log('  HouseholdViewModels:', typeof window.HouseholdViewModels);
            console.log('  HouseholdState:', typeof window.HouseholdState);
            console.log('  HouseholdQueries:', typeof window.HouseholdQueries);
            console.log('  HouseholdCommands:', typeof window.HouseholdCommands);
            console.log('  HouseholdCommands.persist:', window.HouseholdCommands
                ? typeof window.HouseholdCommands.persist : 'N/A');
            console.log('  HouseholdEconomy:', typeof window.HouseholdEconomy);
            console.log('  HouseholdAssignment:', typeof window.HouseholdAssignment);
            console.log('  HouseholdServant:', typeof window.HouseholdServant);
            console.log('  ResidenceSystem:', typeof window.ResidenceSystem);
            console.log('  HouseholdBootstrap:', typeof window.HouseholdBootstrap);
            console.log('  Household namespace:', typeof window.Household);
            console.log('[HouseholdManager] Tab functions:');
            console.log('  renderHouseholdOverviewTab:', typeof window.renderHouseholdOverviewTab);
            console.log('  renderHouseholdMembersTab:', typeof window.renderHouseholdMembersTab);
            console.log('  renderHouseholdEconomyTab:', typeof window.renderHouseholdEconomyTab);
            console.log('  renderHouseholdDepartmentsTab:', typeof window.renderHouseholdDepartmentsTab);
            console.log('  renderHouseholdHoldingsTab:', typeof window.renderHouseholdHoldingsTab);

            // ============================================================
            // INIT
            // ============================================================
            function init() {
                if (isInitialized) return;
                isInitialized = true;

                // Verify the converged household modules are loaded.
                // If any is missing, the page still renders — but every
                // household operation will fail with a clear error.
                if (!_verifyHouseholdModules()) {
                    console.warn('[HouseholdManager] Household modules are not fully loaded. ' +
                        'Some operations will not work.');
                }

                // Ask bootstrap to re-verify + re-hydrate. Bootstrap is
                // idempotent; if it already auto-initialized at load, this
                // is a no-op that returns {success: true, alreadyInitialized: true}.
                if (window.HouseholdBootstrap &&
                    typeof window.HouseholdBootstrap.init === 'function') {
                    try {
                        var bootResult = window.HouseholdBootstrap.init();
                        if (bootResult && bootResult.success === false) {
                            console.warn('[HouseholdManager] Bootstrap reported failure:', bootResult);
                        }
                    } catch (e) {
                        console.error('[HouseholdManager] Bootstrap.init threw:', e);
                    }
                }

                // Sync the year input with masterData.
                if (window.masterData && window.masterData.data &&
                    typeof window.masterData.data.currentYear === 'number') {
                    yearInput.value = window.masterData.data.currentYear;
                }

                // Register tab renderers if the tab modules provide a
                // registration hook. These are best-effort — the tabs also
                // work via their direct `renderHousehold*Tab` entry points.
                if (typeof window.registerOverviewTabRenderer === 'function') {
                    window.registerOverviewTabRenderer();
                }
                if (typeof window.registerMembersTabRenderer === 'function') {
                    window.registerMembersTabRenderer();
                }
                if (typeof window.registerEconomyTabRenderer === 'function') {
                    window.registerEconomyTabRenderer();
                }
                if (typeof window.registerDepartmentsTabRenderer === 'function') {
                    window.registerDepartmentsTabRenderer();
                }
                if (typeof window.registerHoldingsTabRenderer === 'function') {
                    window.registerHoldingsTabRenderer();
                }

                // Initial render.
                setTimeout(function() {
                    var HQ = window.HouseholdQueries;
                    if (HQ) {
                        var households;
                        try {
                            households = HQ.getAllHouseholds();
                        } catch (e) {
                            households = [];
                        }
                        if (households && households.length > 0 && !selectedId) {
                            selectedId = households[0].id;
                            window._currentHouseholdId = selectedId;
                        }
                    }

                    renderHouseholdList();

                    setTimeout(function() {
                        renderActiveTab();
                    }, 100);
                }, 300);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                setTimeout(init, 50);
            }

        })();
    </script>

</body>
</html>
