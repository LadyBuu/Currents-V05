<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover" />
    <title>Household Manager</title>
    <link rel="icon" href="data:," />

    <script src="js/core/theme-boot.js"></script>

    <link rel="stylesheet" href="css/common.css">

    <style>
/* ==========================================================================
   STILL WATERS — THEME SYSTEM
   ==========================================================================

   ARCHITECTURE:
     Layer 1: Default dark  (stained-glass — the former "stained-glass" theme)
     Layer 2: Default light (stained-glass light — the former light variant,
              recoloured to match stained-glass)
     Layer 3: Legacy compatibility aliases (--bg2, --text, --accent, ...)
     Layer 4: Named themes (22, ported from styles.css)
     Layer 5: Art direction per theme
     Layer 6: Accessibility

   THEME MECHANISM:
     `data-theme="<name>"` on <html> activates a named theme.
     Absence of the attribute follows the OS prefers-color-scheme.
     The default dark is stained-glass; the default light is stained-glass
     light. There is no separate `stained-glass` theme — those colours are
     now the default.

   VOCABULARY:
     Every theme defines the canonical token set (--bg, --surface, --line,
     --fg, --accent, ...) plus the legacy aliases that older stylesheets in
     this project still reference (--bg2, --bg3, --bg4, --bg-card, --text,
     --dim, --tmut, --border, --border2, --border-light, --accent-dark,
     --accent-light, --accent-dim, --accent-glow, --accent-glow-strong,
     --glow-sm, --glow-md, --glow-lg, --glow-strong, --modal-overlay,
     --modal-bg, --success, --ok, --warn, --danger, --danger-lt,
     --deceased). Those aliases are computed from the canonical tokens —
     they do not need to be redefined per theme.

     The layout tokens (--sidebar-width, --view-width, --topbar-height,
     --tab-height) are structural, not thematic. They live in :root only.

   ICON POLICY: No emojis. No icons.
   ========================================================================== */


/* ==========================================================================
   LAYER 1 — DEFAULT DARK (STAINED GLASS)
   ==========================================================================
   The default dark theme. Navy blue with cyan accent and pink secondary.
   This is the former `stained-glass` theme promoted to default.
   ========================================================================== */

:root,
[data-theme="dark"] {
    /* ---- Canonical tokens: colour ---- */
    --bg:                    #0a1520;
    --surface:               #0e1d2e;
    --surface-2:             #132a42;
    --line:                  #1d4a6e;
    --line-strong:           #3a7fa8;
    --fg:                    #eaf6ff;
    --fg-2:                  #9fc4de;
    --fg-3:                  #6e9cb8;
    --accent:                #5ee8ff;
    --accent-fg:             #04101a;
    --accent-soft:           rgba(94, 232, 255, 0.12);
    --ok:                    #3dffc0;
    --bad:                   #ff3d6e;

    /* ---- Status ---- */
    --st-idea:               #6e9cb8;
    --st-outlined:           #c77dff;
    --st-draft:              #ffd166;
    --st-revised:            #ff4fa8;
    --st-final:              #3dffc0;

    /* ---- Scrim ---- */
    --scrim:                 rgba(4, 10, 18, 0.88);

    /* ---- Timeline / version ---- */
    --v-au:                  #5ee8ff;
    --v-alt:                 #c77dff;

    /* ---- Region colours ---- */
    --r-a:                   #ff4fa8;
    --r-b:                   #5ee8ff;
    --r-c:                   #3dffc0;
    --r-d:                   #ffd166;
    --r-e:                   #c77dff;
    --r-f:                   #ff8a5c;

    /* ---- Typography ---- */
    --f-display:             'Newsreader', Georgia, 'Times New Roman', serif;
    --f-body:                'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --f-mono:                'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;

    /* ---- Shape ---- */
    --radius:                4px;
    --shadow:                0 4px 15px rgba(0, 0, 0, 0.4);

    /* ---- Chrome ---- */
    --scrollbar-track:       var(--bg);
    --scrollbar-thumb:       var(--line-strong);
    --chip-bg-subtle:        rgba(94, 232, 255, 0.08);

    /* ---- Legacy aliases (satisfy existing stylesheets) ---- */
    --bg2:                   var(--surface);
    --bg3:                   var(--surface-2);
    --bg4:                   color-mix(in srgb, var(--surface-2) 80%, var(--accent) 20%);
    --bg-card:               var(--surface);
    --bg-solid:              var(--bg);
    --text:                  var(--fg);
    --dim:                   var(--fg-2);
    --tmut:                  var(--fg-3);
    --border:                var(--line);
    --border2:               var(--line-strong);
    --border-light:          color-mix(in srgb, var(--line) 60%, transparent);
    --accent-dark:           color-mix(in srgb, var(--accent) 70%, black 30%);
    --accent-light:          color-mix(in srgb, var(--accent) 80%, white 20%);
    --accent-dim:            var(--accent-soft);
    --accent-glow:           color-mix(in srgb, var(--accent) 40%, transparent);
    --accent-glow-strong:    color-mix(in srgb, var(--accent) 60%, transparent);
    --glow-sm:               0 0 5px var(--accent-glow);
    --glow-md:               0 0 10px var(--accent-glow);
    --glow-lg:               0 0 20px var(--accent-glow);
    --glow-strong:           0 0 15px var(--accent-glow-strong);
    --modal-overlay:         rgba(0, 0, 0, 0.92);
    --modal-bg:              var(--surface);
    --success:               var(--ok);
    --warn:                  var(--st-draft);
    --danger:                #b03060;
    --danger-lt:             var(--bad);
    --deceased:              var(--fg-3);
    --info:                  var(--accent);
    --info-soft:             var(--accent-soft);
    --info-hover:            color-mix(in srgb, var(--accent) 25%, transparent);
    --danger-soft:           rgba(255, 61, 110, 0.15);
    --danger-hover:          rgba(255, 61, 110, 0.30);
    --warning:               var(--st-draft);
    --warning-soft:          rgba(255, 209, 102, 0.15);
    --warning-hover:         rgba(255, 209, 102, 0.30);

    /* ---- Structural (not thematic) ---- */
    --sidebar-width:         280px;
    --view-width:            320px;
    --topbar-height:         48px;
    --tab-height:            38px;

    color-scheme: dark;
}


/* ==========================================================================
   LAYER 2 — DEFAULT LIGHT (STAINED GLASS LIGHT)
   ==========================================================================
   The default light theme. Stained-glass palette inverted for paper.
   Cyan accent kept at a darker value for contrast on light backgrounds.
   ========================================================================== */

[data-theme="light"] {
    --bg:                    #e4eef7;
    --surface:               #f2f7fc;
    --surface-2:             #d6e4f1;
    --line:                  #7fa8c8;
    --line-strong:           #4a7aa0;
    --fg:                    #06202f;
    --fg-2:                  #2f556f;
    --fg-3:                  #5a7a94;
    --accent:                #00679a;
    --accent-fg:             #ffffff;
    --accent-soft:           rgba(0, 103, 154, 0.12);
    --ok:                    #0a8754;
    --bad:                   #b32850;

    --st-idea:               #5a7a94;
    --st-outlined:           #6f4fa8;
    --st-draft:              #a37a1e;
    --st-revised:            #b32850;
    --st-final:              #0a8754;

    --scrim:                 rgba(6, 32, 47, 0.55);

    --v-au:                  #00679a;
    --v-alt:                 #6f4fa8;

    --r-a:                   #b32850;
    --r-b:                   #00679a;
    --r-c:                   #0a8754;
    --r-d:                   #a37a1e;
    --r-e:                   #6f4fa8;
    --r-f:                   #c25e0e;

    --f-display:             'Newsreader', Georgia, 'Times New Roman', serif;
    --f-body:                'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --f-mono:                'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;

    --radius:                4px;
    --shadow:                0 4px 15px rgba(6, 32, 47, 0.10);

    --scrollbar-track:       var(--bg);
    --scrollbar-thumb:       var(--line);
    --chip-bg-subtle:        rgba(0, 0, 0, 0.05);

    --bg2:                   var(--surface);
    --bg3:                   var(--surface-2);
    --bg4:                   color-mix(in srgb, var(--surface-2) 85%, var(--accent) 15%);
    --bg-card:               var(--surface);
    --bg-solid:              var(--bg);
    --text:                  var(--fg);
    --dim:                   var(--fg-2);
    --tmut:                  var(--fg-3);
    --border:                var(--line);
    --border2:               var(--line-strong);
    --border-light:          color-mix(in srgb, var(--line) 60%, transparent);
    --accent-dark:           color-mix(in srgb, var(--accent) 80%, black 20%);
    --accent-light:          color-mix(in srgb, var(--accent) 70%, white 30%);
    --accent-dim:            var(--accent-soft);
    --accent-glow:           color-mix(in srgb, var(--accent) 30%, transparent);
    --accent-glow-strong:    color-mix(in srgb, var(--accent) 50%, transparent);
    --glow-sm:               0 0 5px var(--accent-glow);
    --glow-md:               0 0 10px var(--accent-glow);
    --glow-lg:               0 0 20px var(--accent-glow);
    --glow-strong:           0 0 15px var(--accent-glow-strong);
    --modal-overlay:         rgba(6, 32, 47, 0.55);
    --modal-bg:              var(--surface);
    --success:               var(--ok);
    --warn:                  var(--st-draft);
    --danger:                #8a2038;
    --danger-lt:             var(--bad);
    --deceased:              var(--fg-3);
    --info:                  var(--accent);
    --info-soft:             var(--accent-soft);
    --info-hover:            color-mix(in srgb, var(--accent) 20%, transparent);
    --danger-soft:           rgba(179, 40, 80, 0.12);
    --danger-hover:          rgba(179, 40, 80, 0.22);
    --warning:               var(--st-draft);
    --warning-soft:          rgba(163, 122, 30, 0.12);
    --warning-hover:         rgba(163, 122, 30, 0.22);

    --sidebar-width:         280px;
    --view-width:            320px;
    --topbar-height:         48px;
    --tab-height:            38px;

    color-scheme: light;
}


/* ==========================================================================
   LAYER 3 — ART DIRECTION: DEFAULT DARK
   ==========================================================================
   The default dark theme keeps a subtle stained-glass radial wash so it
   is not flat black. Kept minimal so it does not compete with content.
   ========================================================================== */

:root body,
[data-theme="dark"] body {
    background:
        radial-gradient(ellipse at 20% 0%, rgba(255, 79, 168, 0.06) 0%, transparent 45%),
        radial-gradient(ellipse at 80% 100%, rgba(94, 232, 255, 0.05) 0%, transparent 50%),
        var(--bg);
    background-attachment: fixed;
}

[data-theme="light"] body {
    background:
        radial-gradient(ellipse at 20% 0%, rgba(179, 40, 80, 0.05) 0%, transparent 45%),
        radial-gradient(ellipse at 80% 100%, rgba(0, 103, 154, 0.06) 0%, transparent 50%),
        var(--bg);
    background-attachment: fixed;
}


/* ==========================================================================
   LAYER 4 — NAMED THEMES
   ==========================================================================
   Ported from the previous app's styles.css. Each theme carries its own
   colour values and its own --bg2 / --bg3 / --text / --dim / --border
   aliases so the settlement stylesheets keep working without changes.
   ========================================================================== */

/* --- Salmon Lime (summer ice cream) --- */
[data-theme="salmon-lime"] {
    --bg: #fff5fb;
    --surface: #fffdf0;
    --surface-2: #ffd5e8;
    --line: #ff4f9a;
    --line-strong: #a8d900;
    --fg: #351044;
    --fg-2: #74345e;
    --fg-3: #a05b7f;
    --accent: #ff1687;
    --accent-fg: #ffffff;
    --accent-soft: rgba(255, 22, 135, 0.22);
    --ok: #a8d900;
    --bad: #ff3d54;
    --st-idea: #a05b7f;
    --st-outlined: #7c2cff;
    --st-draft: #ffb000;
    --st-revised: #ff3d91;
    --st-final: #71bd00;
    --scrim: rgba(53, 16, 68, 0.62);
    --v-au: #00cfe8;
    --v-alt: #7c2cff;
    --r-a: #ff1687;
    --r-b: #00cfe8;
    --r-c: #a8d900;
    --r-d: #ffb000;
    --r-e: #7c2cff;
    --r-f: #ff5b36;
    --shadow: 5px 5px 0 rgba(255, 22, 135, 0.28);
    --scrollbar-track: var(--bg);
    --scrollbar-thumb: var(--line);
    --chip-bg-subtle: rgba(255, 22, 135, 0.16);
    --bg2: var(--surface);
    --bg3: var(--surface-2);
    --bg4: #e8ff9e;
    --bg-card: var(--surface);
    --bg-solid: var(--bg);
    --text: var(--fg);
    --dim: var(--fg-2);
    --tmut: var(--fg-3);
    --border: var(--line);
    --border2: var(--line-strong);
    --border-light: color-mix(in srgb, var(--line) 60%, transparent);
    --accent-dark: #c90062;
    --accent-light: #ff8bc4;
    --accent-dim: var(--accent-soft);
    --accent-glow: rgba(255, 22, 135, 0.45);
    --accent-glow-strong: rgba(255, 22, 135, 0.7);
    --glow-sm: 0 0 5px var(--accent-glow);
    --glow-md: 0 0 10px var(--accent-glow);
    --glow-lg: 0 0 20px var(--accent-glow);
    --glow-strong: 0 0 15px var(--accent-glow-strong);
    --modal-overlay: var(--scrim);
    --modal-bg: var(--surface);
    --success: var(--ok);
    --warn: var(--st-draft);
    --danger: #ff3d54;
    --danger-lt: var(--bad);
    --deceased: var(--fg-3);
    --info: #00a9c7;
    --info-soft: rgba(0, 207, 232, 0.22);
    --info-hover: rgba(0, 207, 232, 0.38);
    --danger-soft: rgba(255, 61, 84, 0.16);
    --danger-hover: rgba(255, 61, 84, 0.3);
    --warning: var(--st-draft);
    --warning-soft: rgba(255, 176, 0, 0.2);
    --warning-hover: rgba(255, 176, 0, 0.35);
    --radius: 4px;
    color-scheme: light;
}
[data-theme="salmon-lime"] body {
    background:
        repeating-linear-gradient(115deg, rgba(255, 22, 135, 0.16) 0 13px, rgba(0, 207, 232, 0.15) 13px 26px, rgba(168, 217, 0, 0.16) 26px 39px, transparent 39px 52px),
        radial-gradient(ellipse at 20% 10%, #ffb6d9 0%, transparent 38%),
        radial-gradient(ellipse at 80% 85%, #dfff75 0%, transparent 42%),
        var(--bg);
    background-attachment: fixed;
}
[data-theme="salmon-lime"] .topbar,
[data-theme="salmon-lime"] .sidebar-header,
[data-theme="salmon-lime"] .manager-subtabs {
    background-image: repeating-linear-gradient(90deg, #ff1687 0 12px, #ffb000 12px 24px, #a8d900 24px 36px, #00cfe8 36px 48px);
    background-size: 100% 5px;
    background-repeat: no-repeat;
    background-position: bottom;
}
[data-theme="salmon-lime"] .tb-btn.primary,
[data-theme="salmon-lime"] .rt-btn--primary {
    box-shadow: 4px 4px 0 #a8d900;
    transform: rotate(-1deg);
}
[data-theme="salmon-lime"] h1,
[data-theme="salmon-lime"] h2,
[data-theme="salmon-lime"] h3 {
    text-shadow: 2px 2px 0 #a8d900, 4px 4px 0 #00cfe8;
}
[data-theme="salmon-lime"] .rt-panel,
[data-theme="salmon-lime"] .rt-god-card {
    border-style: dashed;
    border-width: 2px;
}

/* --- Vaporwave --- */

[data-theme="vaporwave"] {
    --bg: #100b24; --surface: #14102e; --surface-2: #1d1747;
    --line: #40316f; --line-strong: #564185;
    --fg: #f4e9ff; --fg-2: #b8a9d4; --fg-3: #8a7c9e;
    --accent: #ff4fd8; --accent-fg: #100b24; --accent-soft: rgba(255, 79, 216, 0.15);
    --info: #35e7ff; --info-soft: rgba(53, 231, 255, 0.14); --info-hover: rgba(53, 231, 255, 0.25);
    --danger: #ff557f; --danger-soft: rgba(255, 85, 127, 0.14); --danger-hover: rgba(255, 85, 127, 0.25);
    --warning: #ffd166; --warning-soft: rgba(255, 209, 102, 0.14); --warning-hover: rgba(255, 209, 102, 0.25);
    --ok: #61ffb0; --bad: #ff557f;
    --st-idea: #7d6fa0; --st-outlined: #c77dff; --st-draft: #ffd166;
    --st-revised: #ff4fd8; --st-final: #61ffb0;
    --scrim: rgba(7, 4, 18, 0.88);
    --v-au: #35e7ff; --v-alt: #c77dff;
    --r-a: #ff4fd8; --r-b: #35e7ff; --r-c: #61ffb0;
    --r-d: #ffd166; --r-e: #c77dff; --r-f: #ff9f68;
    --f-display: 'Newsreader', Georgia, serif;
    --f-body: 'Instrument Sans', system-ui, sans-serif;
    --f-mono: 'IBM Plex Mono', ui-monospace, monospace;
    --radius: 10px;
    --shadow: 0 4px 24px rgba(0, 0, 0, 0.45);
    --scrollbar-track: var(--bg); --scrollbar-thumb: #40316f;
    --chip-bg-subtle: rgba(255, 255, 255, 0.07);
    --bg2: var(--surface); --bg3: var(--surface-2); --bg4: #251e55;
    --bg-card: var(--surface); --bg-solid: var(--bg);
    --text: var(--fg); --dim: var(--fg-2); --tmut: var(--fg-3);
    --border: var(--line); --border2: var(--line-strong);
    --border-light: color-mix(in srgb, var(--line) 60%, transparent);
    --accent-dark: color-mix(in srgb, var(--accent) 70%, black);
    --accent-light: color-mix(in srgb, var(--accent) 80%, white);
    --accent-dim: var(--accent-soft);
    --accent-glow: rgba(255, 79, 216, 0.4);

    --glow-sm: 0 0 5px var(--accent-glow); --glow-md: 0 0 10px var(--accent-glow);
    --glow-lg: 0 0 20px var(--accent-glow); --glow-strong: 0 0 15px var(--accent-glow-strong);
    --modal-overlay: rgba(0, 0, 0, 0.92); --modal-bg: var(--surface);
    --success: var(--ok); --warn: var(--st-draft);
    --danger-lt: var(--bad); --deceased: var(--fg-3);
    color-scheme: dark;
}

    --info: #00e5ff; --info-soft: rgba(0, 229, 255, 0.14); --info-hover: rgba(0, 229, 255, 0.28);
    --danger: #e60033; --danger-soft: rgba(230, 0, 51, 0.16); --danger-hover: rgba(230, 0, 51, 0.28);
    --warning: #f2ce42; --warning-soft: rgba(242, 206, 66, 0.16); --warning-hover: rgba(242, 206, 66, 0.28);

    --bg: #e4eaf0; --surface: #ffffff; --surface-2: #f0f4f8;
    --line: #1a3b6b; --line-strong: #0d2342;
    --fg: #0d2342; --fg-2: #3b5b82; --fg-3: #5a7a9e;
    --accent: #1f4a8a; --accent-fg: #ffffff; --accent-soft: rgba(31, 74, 138, 0.15);
    --info: #7aa6d0; --info-soft: rgba(122, 166, 208, 0.20); --info-hover: rgba(122, 166, 208, 0.35);
    --danger: #a62c2c; --danger-soft: rgba(166, 44, 44, 0.15); --danger-hover: rgba(166, 44, 44, 0.25);
    --warning: #c49a45; --warning-soft: rgba(196, 154, 69, 0.15); --warning-hover: rgba(196, 154, 69, 0.25);
    --ok: #2c6b4a; --bad: #a62c2c;
    --st-idea: #5a7a9e; --st-outlined: #3b5b82; --st-draft: #c49a45;
    --st-revised: #a62c2c; --st-final: #2c6b4a;
    --scrim: rgba(13, 35, 66, 0.75);
    --v-au: #1f4a8a; --v-alt: #7aa6d0;
    --r-a: #1f4a8a; --r-b: #7aa6d0; --r-c: #2c6b4a;
    --r-d: #c49a45; --r-e: #3b5b82; --r-f: #a62c2c;
    --f-display: 'Playfair Display', 'Newsreader', Georgia, serif;
    --f-body: 'Newsreader', Georgia, serif;
    --f-mono: 'IBM Plex Mono', ui-monospace, monospace;
    --radius: 2px;
    --shadow: 2px 2px 0px rgba(13, 35, 66, 0.15);
    --scrollbar-track: var(--bg); --scrollbar-thumb: var(--line);
    --chip-bg-subtle: rgba(31, 74, 138, 0.08);
    --bg2: var(--surface); --bg3: var(--surface-2); --bg4: #dde6ef;
    --bg-card: var(--surface); --bg-solid: var(--bg);
    --text: var(--fg); --dim: var(--fg-2); --tmut: var(--fg-3);
    --border: var(--line); --border2: var(--line-strong);
    --border-light: color-mix(in srgb, var(--line) 60%, transparent);
    --accent-dark: color-mix(in srgb, var(--accent) 80%, black);
    --accent-light: color-mix(in srgb, var(--accent) 70%, white);
    --accent-dim: var(--accent-soft);
    --accent-glow: rgba(31, 74, 138, 0.30);
    --accent-glow-strong: rgba(31, 74, 138, 0.50);
    --glow-sm: 0 0 5px var(--accent-glow); --glow-md: 0 0 10px var(--accent-glow);
    --glow-lg: 0 0 20px var(--accent-glow); --glow-strong: 0 0 15px var(--accent-glow-strong);
    --modal-overlay: rgba(13, 35, 66, 0.75); --modal-bg: var(--surface);
    --success: var(--ok); --warn: var(--st-draft);
    --danger-lt: var(--bad); --deceased: var(--fg-3);
    color-scheme: light;
}


/* ==========================================================================
   LAYER 5 — THEME ART DIRECTION
   ==========================================================================
   Background washes and typography treatments that give each theme a
   recognisable character without touching component CSS.
   ========================================================================== */

[data-theme="vaporwave"] body {
    background:
        radial-gradient(circle at 8% 5%, rgba(255, 79, 216, 0.15) 0%, transparent 32%),
        radial-gradient(circle at 92% 18%, rgba(53, 231, 255, 0.12) 0%, transparent 34%),
        radial-gradient(circle at 50% 110%, rgba(120, 72, 220, 0.12) 0%, transparent 42%),
        var(--bg);
    background-attachment: fixed;
}

[data-theme="pastel"] body {
    background:
        radial-gradient(circle at 15% 10%, rgba(255, 182, 213, 0.55) 0%, transparent 34%),
        radial-gradient(circle at 85% 15%, rgba(177, 225, 239, 0.45) 0%, transparent 32%),
        radial-gradient(circle at 50% 100%, rgba(211, 181, 235, 0.35) 0%, transparent 38%),
        var(--bg);
    background-attachment: fixed;
}

[data-theme="carnival"] body {
    background:
        radial-gradient(circle at 20% 0%, rgba(255, 0, 127, 0.10) 0%, transparent 40%),
        radial-gradient(circle at 100% 50%, rgba(0, 229, 255, 0.06) 0%, transparent 50%),
        linear-gradient(to bottom, #060608 0%, #0a0a0f 100%);
    background-attachment: fixed;
}

[data-theme="maximal"] body {
    background:
        radial-gradient(600px 400px at 0% 0%, #ffd6f5 0%, transparent 60%),
        radial-gradient(700px 500px at 100% 10%, #d6fff7 0%, transparent 55%),
        radial-gradient(600px 400px at 50% 100%, #fff6a8 0%, transparent 55%),
        repeating-linear-gradient(45deg, #fff0fb 0 20px, #ffe0f5 20px 40px);
    background-attachment: fixed;
}

[data-theme="gits"] body {
    background:
        radial-gradient(circle at 50% 30%, rgba(0, 229, 255, 0.10) 0%, transparent 50%),
        radial-gradient(circle at 90% 50%, rgba(255, 26, 140, 0.08) 0%, transparent 40%),
        linear-gradient(90deg, rgba(255, 42, 42, 0.06) 0%, transparent 15%),
        linear-gradient(to bottom, #07080c 0%, #0a0e17 100%);
    background-attachment: fixed;
}

[data-theme="nouveau"] body {
    background:
        radial-gradient(circle at 50% 30%, rgba(196, 92, 52, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 0% 100%, rgba(107, 140, 123, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 100% 0%, rgba(107, 140, 123, 0.08) 0%, transparent 40%),
        var(--bg);
    background-attachment: fixed;
}

[data-theme="ukiyo-e"] body {
    background:
        linear-gradient(to bottom, rgba(217, 108, 92, 0.15) 0%, transparent 40%),
        linear-gradient(to bottom, transparent 70%, rgba(35, 79, 112, 0.1) 100%),
        var(--bg);
    background-attachment: fixed;
}

[data-theme="nature"] body {
    background:
        radial-gradient(ellipse at 15% 15%, rgba(201, 130, 160, 0.16), transparent 38%),
        radial-gradient(ellipse at 82% 24%, rgba(181, 174, 208, 0.20), transparent 42%),
        radial-gradient(ellipse at 60% 85%, rgba(120, 155, 145, 0.20), transparent 48%),
        var(--bg);
    background-attachment: fixed;
}

[data-theme="kmt"] body {
    background:
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to top, #3a0000 0%, #000000 40%),
        var(--bg);
    background-size: 40px 40px, 40px 40px, 100% 100%, 100% 100%;
    background-position: center top;
    background-attachment: fixed;
}

[data-theme="gaslight"] body {
    background:
        radial-gradient(circle at 20% 10%, rgba(232, 226, 212, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 90%, var(--accent-soft) 0%, transparent 50%),
        var(--bg);
    background-attachment: fixed;
}

[data-theme="grotesque"] body {
    background:
        radial-gradient(circle at 50% 10%, rgba(232, 223, 211, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 20% 40%, rgba(90, 75, 107, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 60%, rgba(122, 36, 36, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 10% 80%, rgba(74, 107, 85, 0.06) 0%, transparent 40%),
        var(--bg);
    background-attachment: fixed;
}

[data-theme="illuminated"] body {
    background:
        radial-gradient(circle at 10% 5%, rgba(122, 155, 110, 0.15) 0%, transparent 20%),
        radial-gradient(circle at 50% 2%, var(--accent-soft) 0%, transparent 25%),
        radial-gradient(circle at 90% 5%, var(--danger-soft) 0%, transparent 20%),
        var(--bg);
    background-attachment: fixed;
}

[data-theme="discowing"] body {
    background:
        radial-gradient(circle, rgba(0, 0, 0, 0.15) 1px, transparent 1px),
        var(--bg);
    background-size: 6px 6px;
    background-attachment: fixed;
}

[data-theme="choc-cake"] body {
    background:
        linear-gradient(45deg, rgba(0, 0, 0, 0.15) 25%, transparent 25%, transparent 75%, rgba(0, 0, 0, 0.15) 75%),
        linear-gradient(45deg, rgba(0, 0, 0, 0.15) 25%, transparent 25%, transparent 75%, rgba(0, 0, 0, 0.15) 75%),
        var(--bg);
    background-size: 32px 32px;
    background-position: 0 0, 16px 16px;
    background-attachment: fixed;
}

[data-theme="dada"] body {
    background:
        linear-gradient(to right, var(--info-soft) 0%, var(--info-soft) 20%, transparent 20%),
        linear-gradient(to left, var(--accent-soft) 0%, var(--accent-soft) 15%, transparent 15%),
        radial-gradient(circle, rgba(0, 0, 0, 0.06) 1px, transparent 1.5px),
        var(--bg);
    background-size: 100% 100%, 100% 100%, 5px 5px, 100% 100%;
    background-attachment: fixed;
}

[data-theme="brutalist"] body {
    background:
        repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.03) 0, rgba(0, 0, 0, 0.03) 1px, transparent 1px, transparent 4px),
        repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.03) 0, rgba(0, 0, 0, 0.03) 1px, transparent 1px, transparent 4px),
        var(--bg);
    background-attachment: fixed;
}

[data-theme="orchestrion"] body {
    background:
        repeating-linear-gradient(90deg, rgba(196, 142, 58, 0.03) 0, rgba(196, 142, 58, 0.03) 1px, transparent 1px, transparent 12px),
        repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.1) 0, rgba(0, 0, 0, 0.1) 2px, transparent 2px, transparent 8px),
        var(--bg);
    background-attachment: fixed;
}

[data-theme="rococo"] body {
    background:
        radial-gradient(circle at 10% 10%, var(--info-soft) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, var(--accent-soft) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, var(--surface) 0%, var(--bg) 100%);
    background-attachment: fixed;
}

[data-theme="nautical-tile"] body {
    background:
        linear-gradient(to right, rgba(13, 35, 66, 0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(13, 35, 66, 0.06) 1px, transparent 1px),
        var(--bg);
    background-size: 80px 80px;
    background-attachment: fixed;
}

/* Heading treatments */
[data-theme="vaporwave"] h1, [data-theme="vaporwave"] h2, [data-theme="vaporwave"] h3 { text-shadow: 0 0 7px rgba(255, 79, 216, 0.42); }
[data-theme="pastel"] h1, [data-theme="pastel"] h2, [data-theme="pastel"] h3 { text-shadow: 1px 1px 0 rgba(255, 255, 255, 0.9); }
[data-theme="carnival"] h1, [data-theme="carnival"] h2, [data-theme="carnival"] h3 { font-weight: 900; text-transform: uppercase; letter-spacing: 0.08em; text-shadow: 0 0 5px rgba(255, 0, 127, 0.8), 2px 2px 0 #000000; }
[data-theme="maximal"] h1, [data-theme="maximal"] h2, [data-theme="maximal"] h3 { text-shadow: 2px 2px 0 #fff, 3px 3px 0 var(--accent); font-weight: 900; }
[data-theme="gits"] h1, [data-theme="gits"] h2, [data-theme="gits"] h3 { font-family: var(--f-mono); letter-spacing: 0.1em; text-transform: uppercase; text-shadow: -2px 0 0 rgba(0, 229, 255, 0.7), 2px 0 0 rgba(255, 26, 140, 0.7), 0 0 10px rgba(0, 229, 255, 0.3); }
[data-theme="nouveau"] h1, [data-theme="nouveau"] h2, [data-theme="nouveau"] h3 { font-family: 'Newsreader', Georgia, serif; font-weight: 500; letter-spacing: 0.02em; }
[data-theme="ukiyo-e"] h1, [data-theme="ukiyo-e"] h2, [data-theme="ukiyo-e"] h3 { font-family: 'Newsreader', Georgia, serif; font-weight: 700; letter-spacing: 0.03em; }
[data-theme="nature"] h1, [data-theme="nature"] h2, [data-theme="nature"] h3 { font-family: 'Newsreader', Georgia, serif; font-weight: 500; letter-spacing: 0.01em; color: var(--fg); }
[data-theme="kmt"] h1, [data-theme="kmt"] h2, [data-theme="kmt"] h3 { font-family: var(--f-display); font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--fg); text-shadow: 2px 2px 0 #000000; }
[data-theme="gaslight"] h1, [data-theme="gaslight"] h2, [data-theme="gaslight"] h3 { font-family: 'Newsreader', Georgia, serif; font-weight: 700; letter-spacing: 0.02em; color: var(--accent); text-shadow: 0 0 12px var(--accent-soft); }
[data-theme="grotesque"] h1, [data-theme="grotesque"] h2, [data-theme="grotesque"] h3 { font-family: 'Newsreader', Georgia, serif; font-weight: 600; letter-spacing: 0.02em; color: var(--fg); text-shadow: 0 0 10px rgba(122, 36, 36, 0.3); }
[data-theme="illuminated"] h1, [data-theme="illuminated"] h2 { font-family: var(--f-display); color: var(--fg); }
[data-theme="discowing"] h1, [data-theme="discowing"] h2, [data-theme="discowing"] h3 { font-family: var(--f-display); text-transform: uppercase; color: var(--accent); -webkit-text-stroke: 2px #000000; text-shadow: 3px 3px 0 #000000; }
[data-theme="choc-cake"] h1, [data-theme="choc-cake"] h2, [data-theme="choc-cake"] h3 { font-family: var(--f-display); color: var(--fg); text-transform: uppercase; letter-spacing: 0.1em; text-shadow: 2px 2px 0 var(--line-strong); }
[data-theme="dada"] h1, [data-theme="dada"] h2 { font-family: var(--f-display); font-weight: 900; text-transform: uppercase; letter-spacing: -0.02em; text-shadow: 2px 2px 0 var(--accent), -1px -1px 0 var(--info); transform: rotate(-1.5deg); display: inline-block; }
[data-theme="brutalist"] h1, [data-theme="brutalist"] h2 { font-family: var(--f-display); font-weight: 900; text-transform: uppercase; letter-spacing: -0.04em; line-height: 0.9; }
[data-theme="orchestrion"] h1, [data-theme="orchestrion"] h2 { font-family: var(--f-display); text-transform: uppercase; letter-spacing: 0.05em; color: var(--line-strong); border-bottom: 2px solid var(--accent); padding-bottom: 4px; }
[data-theme="rococo"] h1, [data-theme="rococo"] h2, [data-theme="rococo"] h3 { font-family: var(--f-display); font-weight: 400; color: var(--fg); letter-spacing: 0.02em; text-shadow: 1px 1px 0 var(--gold); }
[data-theme="nautical-tile"] h1, [data-theme="nautical-tile"] h2, [data-theme="nautical-tile"] h3 { font-family: var(--f-display); color: var(--line); font-weight: 700; letter-spacing: 0.02em; }


/* ==========================================================================
   LAYER 6 — ACCESSIBILITY & MOTION
   ========================================================================== */

html, body {
    transition: background-color 0.25s ease, color 0.25s ease;
}

button, input, select, textarea, a,
.panel, .modal, .modal-content, .notification,
.activity-item, .stat-card, .quick-link,
.empty-state, .loading-state,
.list, .detail, .sheet, .row, .chip, .seg button {
    transition: background-color 0.2s ease, border-color 0.2s ease,
                color 0.2s ease, box-shadow 0.2s ease;
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
    }
}


/* --- Dating Sim: shoujo visual-novel romance --- */
[data-theme="dating-sim"] {
    --bg: #fff0f7; --surface: #fffafd; --surface-2: #ffe0ee;
    --line: #f3a1c5; --line-strong: #e45b9a;
    --fg: #54213f; --fg-2: #8d4e72; --fg-3: #b77b9c;

    --ok: #63b99a; --bad: #e94b69;

    --bg2: var(--surface); --bg3: var(--surface-2); --bg4: #ffd0e5;
    --bg-card: var(--surface); --bg-solid: var(--bg);
    --text: var(--fg); --dim: var(--fg-2); --tmut: var(--fg-3);
    --border: var(--line); --border2: var(--line-strong);
    --border-light: color-mix(in srgb, var(--line) 60%, transparent);
    --accent-dark: #c92d76; --accent-light: #ff9dca; --accent-dim: var(--accent-soft);
    --accent-glow: rgba(240,68,145,.3); --accent-glow-strong: rgba(240,68,145,.5);
    --glow-sm: 0 0 5px var(--accent-glow); --glow-md: 0 0 10px var(--accent-glow);
    --glow-lg: 0 0 20px var(--accent-glow); --glow-strong: 0 0 15px var(--accent-glow-strong);
    --modal-overlay: rgba(84,33,63,.55); --modal-bg: var(--surface);

[data-theme="dating-sim"] body {

        html, body { height: 100%; margin: 0; overflow: hidden; }

    (function () {

        var RQ = window.RelationshipQueries;
        var MAP = [
            ['createRelationship',           RC, 'create'],
            ['endRelationship',              RC, 'end'],
            ['updateRelationship',           RC, 'update'],
            ['getRelationshipBetween',       RQ, 'getBetween'],
            ['getRelationshipsForCharacter', RQ, 'getForCharacter'],
            ['getRelationshipById',          RQ, 'getById']
        ];
        for (var i = 0; i < MAP.length; i++) {
            var name = MAP[i][0], source = MAP[i][1], method = MAP[i][2];
            if (typeof window[name] === 'function') continue;
            if (source && typeof source[method] === 'function') {
                window[name] = source[method].bind(source);
            }
        }
    })();
</script>

<!-- Theme switcher uses the shared theme registry from theme-boot.js. -->
<script>
(function () {
    'use strict';
    var switcher = window.ThemeSwitcher;
    if (!switcher || !Array.isArray(switcher.themes)) return;
    var labels = {
        dark: 'Dark', light: 'Light', vaporwave: 'Vaporwave',
        'salmon-lime': 'Salmon Lime', 'dating-sim': 'Dating Sim',
        pastel: 'Pastel', carnival: 'Carnival', maximal: 'Maximal',
        gits: 'GITS', nouveau: 'Nouveau', 'ukiyo-e': 'Ukiyo-e',
        nature: 'Nature', kmt: 'KMT', gaslight: 'Gaslight',
        grotesque: 'Grotesque', illuminated: 'Illuminated',
        discowing: 'Disco Wing', 'choc-cake': 'Choc Cake', dada: 'Dada',
        brutalist: 'Brutalist', orchestrion: 'Orchestrion',
        rococo: 'Rococo', 'nautical-tile': 'Nautical Tile'
    };
    var themeBtn = document.getElementById('themeBtn');
    var themeMenu = document.getElementById('themeMenu');
    var themeName = document.getElementById('themeName');
    if (!themeBtn || !themeMenu || !themeName) return;
    function label(id) { return labels[id] || id.replace(/-/g, ' ').replace(/\b\w/g, function (x) { return x.toUpperCase(); }); }
    function apply(id) { switcher.apply(id); themeName.textContent = label(id); }
    var html = '';
    switcher.themes.forEach(function (id) {
        html += '<li role="none"><button role="menuitem" type="button" data-theme-id="' +
            id + '">' + label(id) + '</button></li>';
    });
    themeMenu.innerHTML = html;
    themeBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        themeMenu.hidden = !themeMenu.hidden;
        themeBtn.setAttribute('aria-expanded', themeMenu.hidden ? 'false' : 'true');
    });
    themeMenu.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-theme-id]');
        if (!btn) return;
        apply(btn.getAttribute('data-theme-id'));
        themeMenu.hidden = true;
        themeBtn.setAttribute('aria-expanded', 'false');
    });
    document.addEventListener('click', function (e) {
        if (!themeMenu.hidden && !themeMenu.contains(e.target) && e.target !== themeBtn) {
            themeMenu.hidden = true;
            themeBtn.setAttribute('aria-expanded', 'false');
        }
    });
    apply(switcher.getSaved() || 'dark');
})();
</script>
