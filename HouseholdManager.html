<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover" />
    <title>Household Manager</title>
    <link rel="icon" href="data:," />

    <script src="js/core/theme-boot.js"></script>

    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/common.css">

    <style>
        /* ============================================================
           Household Manager — inline CSS
           STRUCTURAL ONLY. Every visual value comes from a theme token
           in themes.css. Same shell as ReligionManager.html, CultureManager.html,
           EducationManager.html. The .hh-* rules at the bottom are the
           household tab content styles that the six household tab files
           emit.
           ============================================================ */

        html, body { height: 100%; margin: 0; overflow: hidden; }
        body {
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--text);
            font-family: var(--f-body);
            font-size: 1rem;
            line-height: var(--lh, 1.5);
            -webkit-font-smoothing: antialiased;
        }

        .topbar {
            position: relative;
            z-index: 100;
            flex-shrink: 0;
            background: var(--bg2);
            padding: 0.5rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.625rem;
            border-bottom: 1px solid var(--border);
            min-height: 3rem;
            flex-wrap: wrap;
        }
        .topbar .title {
            font-family: var(--f-display);
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--accent);
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
        }
        .topbar .title svg { width: 1em; height: 1em; fill: currentColor; }
        .topbar .spacer { flex: 1; min-width: 0.75rem; }
        .topbar .burger-menu {
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0.25rem 0.625rem;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            cursor: pointer;
        }

        .tb-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.3125rem;
            padding: 0.375rem 0.875rem;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: var(--f-body);
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            line-height: 1.2;
        }
        .tb-btn svg { width: 0.9em; height: 0.9em; fill: currentColor; }
        .tb-btn:hover {
            border-color: var(--accent);
            background: var(--accent-dim);
            color: var(--accent-light);
        }
        .tb-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--accent-fg);
        }
        .tb-btn.primary:hover { background: var(--accent-dark); }
        .tb-btn:disabled { opacity: 0.45; cursor: not-allowed; }

        .year-input {
            display: inline-flex;
            align-items: center;
            gap: 0.3125rem;
            padding: 0.1875rem 0.625rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-family: var(--f-body);
            font-size: 0.7rem;
            line-height: 1.2;
        }
        .year-input label {
            font-family: var(--f-display);
            font-size: 0.55rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--dim);
            white-space: nowrap;
        }
        .year-input input {
            width: 4rem;
            padding: 0.1875rem 0.375rem;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: var(--f-mono);
            font-size: 0.7rem;
            text-align: right;
        }
        .year-input input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .theme-toggle { position: relative; display: inline-flex; }
        .theme-toggle__menu {
            position: absolute;
            top: calc(100% + 0.25rem);
            right: 0;
            z-index: 9999;
            min-width: 10rem;
            max-height: 60vh;
            padding: 0.25rem;
            margin: 0;
            list-style: none;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow-y: auto;
        }
        .theme-toggle__menu[hidden] { display: none; }
        .theme-toggle__menu button {
            display: block;
            width: 100%;
            padding: 0.375rem 0.75rem;
            text-align: left;
            background: transparent;
            border: none;
            color: var(--text);
            font-family: var(--f-body);
            font-size: 0.7rem;
            border-radius: var(--radius);
            cursor: pointer;
        }
        .theme-toggle__menu button:hover {
            background: var(--accent-dim);
            color: var(--accent-light);
        }

        .app-layout {
            display: flex;
            flex-direction: row;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }
        .sidebar {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg2);
            border-right: 1px solid var(--border);
            width: 17.5rem;
        }
        .sidebar-header {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
            background: var(--bg3);
        }
        .sidebar-header h3 {
            margin: 0;
            font-family: var(--f-display);
            font-size: 0.65rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }
        .sidebar-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
            min-height: 0;
        }
        .main-panel {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
        }

        .manager-subtabs {
            position: sticky;
            top: 0;
            display: flex;
            align-items: stretch;
            gap: 0.25rem;
            padding: 0.5rem 1.5rem 0;
            margin: 0 0 1.25rem;
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            z-index: 10;
        }
        .manager-subtab {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.125rem 0.6875rem;
            background: transparent;
            border: 1px solid transparent;
            border-bottom: none;
            border-radius: var(--radius) var(--radius) 0 0;
            color: var(--dim);
            font-family: var(--f-display);
            font-size: 0.78rem;
            font-weight: 500;
            cursor: pointer;
        }
        .manager-subtab:hover {
            color: var(--accent-light);
            background: var(--accent-dim);
        }
        .manager-subtab.active {
            color: var(--accent);
            background: var(--bg2);
            border-color: var(--border);
            font-weight: 600;
        }
        .manager-subtab-icon {
            display: inline-flex;
            width: 1rem;
            height: 1rem;
            align-items: center;
            justify-content: center;
            color: currentColor;
        }
        .manager-subtab-icon svg { width: 100%; height: 100%; fill: currentColor; }

        .tab-content-wrapper {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 1.25rem 1.5rem;
            background: var(--bg);
        }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        .ct-hint {
            background: var(--bg2);
            border-left: 3px solid var(--accent);
            padding: 0.625rem 0.875rem;
            margin-bottom: 1rem;
            font-size: 0.7rem;
            color: var(--dim);
            line-height: 1.55;
            border-radius: 0 var(--radius) var(--radius) 0;
        }

        .ct-empty,
        .hh-empty-global {
            padding: 1.5rem;
            text-align: center;
            color: var(--dim);
            font-size: 0.8rem;
        }
        .ct-empty__sub,
        .hh-empty-global__sub {
            display: block;
            margin-top: 0.375rem;
            font-size: 0.7rem;
            color: var(--dim);
        }
        .hh-unavailable-global {
            padding: 1.5rem;
            text-align: center;
            color: var(--danger-lt);
            font-size: 0.8rem;
        }
        .loading,
        .loading-placeholder {
            padding: 1.5rem;
            text-align: center;
            color: var(--dim);
            font-size: 0.85rem;
        }
        .empty-state, .error-state {
            padding: 1.5rem;
            text-align: center;
            color: var(--dim);
            font-size: 0.8rem;
        }
        .error-state { color: var(--danger-lt); }

        /* ============================================================
           HOUSEHOLD TAB CONTENT (.hh-*)
           Emitted by the six household tab files. Mirrors the .rt-*
           pattern used by ReligionManager.html.
           ============================================================ */

        .hh-tab { display: flex; flex-direction: column; gap: 1rem; max-width: 62rem; margin: 0 auto; }
        .hh-tab-header {
            display: flex; justify-content: space-between;
            align-items: center; gap: 0.75rem; flex-wrap: wrap;
        }
        .hh-tab-title {
            font-family: var(--f-display); font-size: 0.85rem;
            font-weight: 600; color: var(--accent-light);
            display: inline-flex; align-items: center; gap: 0.375rem;
            margin: 0;
        }
        .hh-tab-actions { display: flex; gap: 0.375rem; align-items: center; flex-wrap: wrap; }
        .hh-tab-footer {
            font-family: var(--f-mono); font-size: 0.65rem;
            color: var(--dim); text-align: center;
            padding-top: 0.75rem; border-top: 1px solid var(--border);
        }

        .hh-btn {
            display: inline-flex; align-items: center; gap: 0.25rem;
            padding: 0.3125rem 0.75rem; background: var(--bg3);
            border: 1px solid var(--border); border-radius: var(--radius);
            color: var(--text); font-family: var(--f-body);
            font-size: 0.7rem; font-weight: 500; cursor: pointer;
            line-height: 1.2;
        }
        .hh-btn:hover { border-color: var(--accent); color: var(--accent-light); }
        .hh-btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
        .hh-btn-primary:hover { background: var(--accent-dark); }
        .hh-btn-accent { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
        .hh-btn-danger { border-color: var(--danger-lt); color: var(--danger-lt); }
        .hh-btn-danger:hover { background: var(--danger-soft); }
        .hh-btn-subtle { background: transparent; }

        .hh-icon-btn {
            padding: 0.25rem 0.5rem; background: transparent;
            border: 1px solid transparent; border-radius: var(--radius);
            color: var(--accent-light); font-family: var(--f-body);
            font-size: 0.65rem; cursor: pointer; line-height: 1;
        }
        .hh-icon-btn:hover { background: var(--accent-dim); border-color: var(--accent); }
        .hh-icon-btn-danger { color: var(--danger-lt); }
        .hh-icon-btn-danger:hover { background: var(--danger-soft); }
        .hh-icon-btn-success { color: var(--accent-light); }

        .hh-cell {
            padding: 0.625rem 0.75rem; background: var(--bg2);
            border: 1px solid var(--border); border-radius: var(--radius);
            text-align: center;
        }
        .hh-cell-stat, .hh-cell-detail { display: flex; flex-direction: column; gap: 0.125rem; }
        .hh-cell-label {
            font-family: var(--f-display); font-size: 0.55rem;
            text-transform: uppercase; letter-spacing: 0.06em;
            color: var(--dim);
        }
        .hh-cell-value {
            font-family: var(--f-mono); font-size: 0.9rem;
            font-weight: 600; color: var(--text);
        }
        .hh-cell-detail .hh-cell-value { font-size: 0.72rem; font-weight: 400; }

        .hh-kv-row {
            display: grid; grid-template-columns: max-content 1fr;
            gap: 0.25rem 0.625rem; font-size: 0.7rem;
            padding: 0.25rem 0; border-bottom: 1px solid var(--border);
        }
        .hh-kv-label { color: var(--dim); }
        .hh-kv-value { color: var(--text); }
        .hh-kv-list { padding: 0.625rem 0.875rem; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); }

        .hh-section-header {
            display: flex; justify-content: space-between;
            align-items: center; gap: 0.5rem; flex-wrap: wrap;
            margin-bottom: 0.5rem;
            padding-bottom: 0.375rem;
            border-bottom: 1px solid var(--border);
        }
        .hh-section-title {
            font-family: var(--f-display); font-size: 0.7rem;
            font-weight: 600; color: var(--accent-light);
            text-transform: uppercase; letter-spacing: 0.06em;
        }

        .hh-empty { padding: 1rem; text-align: center; color: var(--dim); font-size: 0.75rem; }
        .hh-failure { padding: 1rem; text-align: center; color: var(--danger-lt); font-size: 0.75rem; }

        /* Sidebar items */
        .hh-sidebar-list { display: flex; flex-direction: column; gap: 0.125rem; }
        .hh-sidebar-item {
            display: flex; flex-direction: column; gap: 0.125rem;
            padding: 0.5rem 0.625rem; border-radius: var(--radius);
            border-left: 3px solid transparent;
            cursor: pointer; font-size: 0.78rem;
        }
        .hh-sidebar-item:hover { background: var(--bg3); }
        .hh-sidebar-item.active {
            background: var(--accent-dim);
            border-left-color: var(--accent);
            color: var(--accent-light);
        }
        .hh-sidebar-item-name { font-family: var(--f-display); font-weight: 600; color: var(--text); }
        .hh-sidebar-item-meta {
            display: flex; gap: 0.625rem; flex-wrap: wrap;
            font-family: var(--f-mono); font-size: 0.6rem; color: var(--dim);
        }
        .hh-sidebar-status-active    { color: var(--accent-light); }
        .hh-sidebar-status-vacant    { color: var(--warn, #c87040); }
        .hh-sidebar-status-empty     { color: var(--dim); }
        .hh-sidebar-status-declining { color: var(--warn, #c87040); }
        .hh-sidebar-status-deprecated{ color: var(--dim); }
        .hh-sidebar-status-destroyed { color: var(--danger-lt); }
        .hh-sidebar-status-bankrupt  { color: var(--danger-lt); }
        .hh-sidebar-status-unknown   { color: var(--dim); }

        /* Overview tab */
        .hh-overview-header {
            padding: 1rem 1.25rem;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }
        .hh-overview-title {
            font-family: var(--f-display); font-size: 1.1rem;
            font-weight: 600; color: var(--accent-light); margin: 0;
        }
        .hh-overview-subtitle {
            font-family: var(--f-mono); font-size: 0.65rem;
            color: var(--dim); margin-top: 0.125rem;
        }
        .hh-overview-status { font-family: var(--f-mono); font-size: 0.7rem; font-weight: 600; text-align: right; }
        .hh-overview-status-meta { font-family: var(--f-mono); font-size: 0.6rem; color: var(--dim); }
        .hh-status-active    { color: var(--accent-light); }
        .hh-status-vacant    { color: var(--warn, #c87040); }
        .hh-status-empty     { color: var(--dim); }
        .hh-status-declining { color: var(--warn, #c87040); }
        .hh-status-abandoned { color: var(--danger-lt); }
        .hh-status-deprecated{ color: var(--dim); }
        .hh-status-destroyed { color: var(--danger-lt); }
        .hh-status-bankrupt  { color: var(--danger-lt); }
        .hh-status-unknown   { color: var(--dim); }

        .hh-overview-grid {
            display: grid; grid-template-columns: max-content 1fr;
            gap: 0.375rem 1rem; font-size: 0.7rem;
            margin: 0.75rem 0; padding: 0.75rem 0.875rem;
            background: var(--bg3); border-radius: var(--radius);
        }
        .hh-overview-grid-label { color: var(--dim); }
        .hh-overview-grid-value { color: var(--text); }
        .hh-overview-actions {
            display: flex; gap: 0.5rem; flex-wrap: wrap;
            margin-top: 0.75rem; padding-top: 0.75rem;
            border-top: 1px solid var(--border);
        }

        .hh-name-history { margin-top: 0.5rem; padding: 0.5rem 0.75rem; background: var(--bg3); border-radius: var(--radius); }
        .hh-name-history-title { font-family: var(--f-display); font-size: 0.6rem; text-transform: uppercase; color: var(--dim); margin-bottom: 0.25rem; }
        .hh-name-history-entry { font-family: var(--f-mono); font-size: 0.65rem; color: var(--dim); line-height: 1.5; }
        .hh-name-history-more { font-family: var(--f-mono); font-size: 0.6rem; color: var(--dim); margin-top: 0.25rem; }

        /* Members tab */
        .hh-member-row {
            display: flex; justify-content: space-between;
            align-items: center; gap: 0.5rem;
            padding: 0.5rem 0.75rem; background: var(--bg2);
            border: 1px solid var(--border); border-left: 3px solid var(--border);
            border-radius: var(--radius);
        }
        .hh-member-row.head { border-left-color: var(--accent); }
        .hh-member-row.deceased { opacity: 0.7; border-left-color: var(--danger-lt); }
        .hh-member-info { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; flex: 1; min-width: 0; }
        .hh-member-gender,
        .hh-member-age,
        .hh-member-joined { font-family: var(--f-mono); font-size: 0.6rem; color: var(--dim); }
        .hh-member-name { font-family: var(--f-display); font-size: 0.78rem; font-weight: 600; color: var(--text); }
        .hh-member-name.head { color: var(--accent-light); }
        .hh-member-status-living { font-family: var(--f-mono); font-size: 0.6rem; color: var(--accent-light); }
        .hh-member-status-deceased { font-family: var(--f-mono); font-size: 0.6rem; color: var(--danger-lt); }
        .hh-member-role { font-family: var(--f-mono); font-size: 0.65rem; color: var(--dim); }
        .hh-member-dept { font-family: var(--f-mono); font-size: 0.6rem; color: var(--dim); }
        .hh-member-badge {
            padding: 0.125rem 0.5rem; border-radius: var(--radius);
            font-family: var(--f-mono); font-size: 0.55rem;
        }
        .hh-member-badge.head { background: var(--accent-dim); color: var(--accent-light); }
        .hh-member-badge.family { background: var(--bg3); color: var(--dim); }
        .hh-member-badge.staff { background: var(--accent-dim); color: var(--accent-light); }
        .hh-member-actions { display: flex; gap: 0.125rem; flex-shrink: 0; }

        .hh-members-section { display: flex; flex-direction: column; gap: 0.375rem; }
        .hh-members-section-former .hh-member-row { opacity: 0.85; }

        /* Departments tab */
        .hh-dept-card {
            padding: 0.75rem 0.875rem;
            background: var(--bg2); border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            border-radius: var(--radius);
            display: flex; flex-direction: column; gap: 0.5rem;
        }
        .hh-dept-header {
            display: flex; justify-content: space-between;
            align-items: flex-start; gap: 0.5rem; flex-wrap: wrap;
        }
        .hh-dept-title-group { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
        .hh-dept-title { font-family: var(--f-display); font-size: 0.8rem; font-weight: 600; color: var(--text); }
        .hh-dept-stat,
        .hh-dept-head { font-family: var(--f-mono); font-size: 0.6rem; color: var(--dim); }
        .hh-dept-actions { display: flex; gap: 0.25rem; flex-wrap: wrap; flex-shrink: 0; }

        .hh-dept-staff-list { margin-left: 0.5rem; display: flex; flex-direction: column; gap: 0.125rem; }
        .hh-dept-staff-empty { font-family: var(--f-mono); font-size: 0.65rem; color: var(--dim); padding: 0.25rem 0.5rem; }
        .hh-dept-staff-row {
            display: flex; justify-content: space-between; align-items: center; gap: 0.5rem;
            padding: 0.25rem 0.5rem; border-radius: var(--radius); font-size: 0.7rem;
        }
        .hh-dept-staff-row.deceased { opacity: 0.55; }
        .hh-dept-staff-info { display: flex; gap: 0.25rem; flex-wrap: wrap; align-items: center; }
        .hh-dept-staff-actions { display: flex; gap: 0.125rem; flex-shrink: 0; }
        .hh-dept-staff-head { color: var(--accent-light); font-family: var(--f-mono); font-size: 0.55rem; }
        .hh-dept-staff-role { color: var(--dim); font-family: var(--f-mono); font-size: 0.6rem; }

        .hh-dept-pos-list { margin-left: 0.5rem; padding-top: 0.25rem; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 0.125rem; }
        .hh-dept-pos-row {
            display: flex; justify-content: space-between; align-items: center; gap: 0.5rem;
            padding: 0.25rem 0.5rem;
            border-left: 2px solid var(--accent); border-radius: var(--radius);
            font-size: 0.7rem;
        }
        .hh-dept-pos-row-unassigned { border-left-color: var(--warn, #c87040); }
        .hh-dept-pos-info { display: flex; gap: 0.25rem; flex-wrap: wrap; align-items: center; }
        .hh-dept-pos-name { font-family: var(--f-display); font-weight: 500; }
        .hh-dept-pos-role { color: var(--accent-light); font-family: var(--f-mono); font-size: 0.55rem; }
        .hh-dept-pos-assigned { color: var(--dim); font-family: var(--f-mono); font-size: 0.55rem; }
        .hh-dept-pos-unassigned { color: var(--warn, #c87040); font-family: var(--f-mono); font-size: 0.55rem; }
        .hh-dept-pos-actions { display: flex; gap: 0.125rem; flex-shrink: 0; }

        .hh-dept-unassigned { margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px solid var(--border); }
        .hh-dept-unassigned-title { font-family: var(--f-display); font-size: 0.6rem; text-transform: uppercase; color: var(--warn, #c87040); margin-bottom: 0.25rem; }

        /* Economy tab */
        .hh-econ-grid { display: grid; gap: 0.5rem; margin-bottom: 0.75rem; }
        .hh-econ-grid-2 { grid-template-columns: repeat(2, 1fr); }
        .hh-econ-grid-3 { grid-template-columns: repeat(3, 1fr); }

<!-- Flat-global shim — maps household-bootstrap's expected names to the
     relationship domain's actual exported names. See notes in previous
     responses. -->
<script>
    (function () {
        'use strict';
        var RC = window.RelationshipCommands;
        var RQ = window.RelationshipQueries;

        var MAP = [
            ['createRelationship',           RC, 'create'],
            ['endRelationship',              RC, 'end'],
            ['updateRelationship',           RC, 'update'],
            ['getRelationshipBetween',       RQ, 'getBetween'],
            ['getRelationshipsForCharacter', RQ, 'getForCharacter'],
            ['getRelationshipById',          RQ, 'getById']
        ];

        for (var i = 0; i < MAP.length; i++) {
            var name = MAP[i][0], source = MAP[i][1], method = MAP[i][2];
            if (typeof window[name] === 'function') continue;
            if (source && typeof source[method] === 'function') {
                window[name] = source[method].bind(source);
            }
        }
    })();
</script>

    var STORAGE_KEY = 'stillwaters_theme';
    var THEMES = [
        { id: 'dark', label: 'Dark' }, { id: 'light', label: 'Light' },
        { id: 'vaporwave', label: 'Vaporwave' }, { id: 'pastel', label: 'Pastel' },
        { id: 'carnival', label: 'Carnival' }, { id: 'maximal', label: 'Maximal' },
        { id: 'gits', label: 'GITS' }, { id: 'nouveau', label: 'Nouveau' },
        { id: 'ukiyo-e', label: 'Ukiyo-e' }, { id: 'nature', label: 'Nature' },
        { id: 'kmt', label: 'KMT' }, { id: 'gaslight', label: 'Gaslight' },
        { id: 'grotesque', label: 'Grotesque' }, { id: 'illuminated', label: 'Illuminated' },
        { id: 'discowing', label: 'Discowing' }, { id: 'choc-cake', label: 'Choc Cake' },
        { id: 'dada', label: 'Dada' }, { id: 'brutalist', label: 'Brutalist' },
        { id: 'orchestrion', label: 'Orchestrion' }, { id: 'rococo', label: 'Rococo' },
        { id: 'nautical-tile', label: 'Nautical Tile' }
    ];
    var byId = {}; for (var i = 0; i < THEMES.length; i++) byId[THEMES[i].id] = THEMES[i];
    var themeBtn = document.getElementById('themeBtn');
    var themeMenu = document.getElementById('themeMenu');
    var themeName = document.getElementById('themeName');
    function apply(id) {
        if (!byId[id]) id = 'dark';
        document.documentElement.setAttribute('data-theme', id);
        themeName.textContent = byId[id].label;
        try { localStorage.setItem(STORAGE_KEY, id); } catch (e) {}
    }
    function buildMenu() {
        var html = '';
        for (var i = 0; i < THEMES.length; i++) {
            html += '<li role="none"><button role="menuitem" type="button" data-theme-id="' +
                THEMES[i].id + '">' + THEMES[i].label + '</button></li>';
        }
        themeMenu.innerHTML = html;
    }
    if (themeBtn) themeBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        themeMenu.hidden = !themeMenu.hidden;
        themeBtn.setAttribute('aria-expanded', themeMenu.hidden ? 'false' : 'true');
    });
    if (themeMenu) themeMenu.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-theme-id]');
        if (!btn) return;
        apply(btn.getAttribute('data-theme-id'));
        themeMenu.hidden = true;
        themeBtn.setAttribute('aria-expanded', 'false');
    });
    document.addEventListener('click', function (e) {
        if (!themeMenu || themeMenu.hidden) return;
        if (themeMenu.contains(e.target)) return;
        if (e.target === themeBtn) return;
        themeMenu.hidden = true;
        themeBtn.setAttribute('aria-expanded', 'false');
    });
    var saved = null;
    try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) {}
    buildMenu();
    apply(saved && byId[saved] ? saved : 'dark');
    window.ThemeSwitcher = { apply: apply, themes: THEMES.slice() };
})();
</script>

</body>
</html>
