<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Household Manager — Still Waters</title>

    <!-- External stylesheets — ONLY these two. -->
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/common.css">

    <!-- ============================================================= -->
    <!-- Inline styles — manager layout + household-tab classes.        -->
    <!-- All colors reference theme tokens. No hardcoded hex. No font   -->
    <!-- stacks. No emoji.                                              -->
    <!-- ============================================================= -->
    <style>
        /* 1. MANAGER SHELL LAYOUT */
        body {
            margin: 0; padding: 0;
            background: var(--bg); color: var(--text);
            font-family: var(--font-body, sans-serif);
            font-size: 14px;
        }
        .topbar {
            display: flex; align-items: center; gap: 12px;
            padding: 8px 16px;
            background: var(--bg2); border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100;
        }
        .topbar .title { font-size: 0.9rem; font-weight: bold; color: var(--accent); }
        .topbar .spacer { flex: 1; }
        .topbar .year-input { display: flex; align-items: center; gap: 4px; }
        .topbar .year-input label { font-size: 0.6rem; color: var(--dim); }
        .topbar .year-input input {
            width: 60px; padding: 3px 6px;
            background: var(--bg); border: 1px solid var(--border);
            border-radius: 4px; color: var(--text); font-size: 0.65rem;
        }
        .topbar button {
            padding: 4px 10px; background: var(--bg3);
            border: 1px solid var(--border); border-radius: 4px;
            color: var(--text); font-size: 0.6rem; cursor: pointer;
            transition: background 0.1s;
        }
        .topbar button:hover { background: var(--bg2); }

        .app-layout { display: flex; min-height: calc(100vh - 40px); }
        .sidebar {
            width: 240px; min-width: 240px;
            background: var(--bg2); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; overflow: hidden;
        }
        .sidebar-header { padding: 10px 12px; border-bottom: 1px solid var(--border); }
        .sidebar-header h3 { margin: 0; font-size: 0.7rem; color: var(--accent); font-weight: bold; }
        .sidebar-list { flex: 1; overflow-y: auto; padding: 4px; }
        .main-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
        .manager-subtabs {
            display: flex; gap: 2px; padding: 6px 12px 0;
            background: var(--bg2); border-bottom: 1px solid var(--border);
            overflow-x: auto;
        }
        .manager-subtab {
            padding: 6px 14px; background: var(--bg3);
            border: 1px solid var(--border); border-bottom: none;
            border-radius: 6px 6px 0 0; color: var(--text);
            font-size: 0.6rem; cursor: pointer; white-space: nowrap;
            transition: background 0.1s, color 0.1s;
        }
        .manager-subtab:hover { background: var(--bg2); }
        .manager-subtab.active {
            background: var(--bg); color: var(--accent); font-weight: bold;
            border-color: var(--border); border-bottom: 2px solid var(--bg);
            margin-bottom: -1px;
        }
        .tab-content-wrapper { flex: 1; overflow-y: auto; padding: 0; }
        .tab-pane { display: none; padding: 16px; }
        .tab-pane.active { display: block; }

        /* 2. CELLS / KV / SECTIONS */
        .hh-cell { background: var(--bg3); padding: 6px; border-radius: 4px; text-align: center; }
        .hh-cell-label { font-size: 0.5rem; color: var(--dim); }
        .hh-cell-value { font-size: 0.85rem; font-weight: bold; }
        .hh-cell-detail { padding: 8px; border-radius: 6px; }
        .hh-cell-detail .hh-cell-value { font-size: 0.75rem; font-weight: normal; }
        .hh-kv-row {
            display: flex; justify-content: space-between; padding: 2px 0;
            font-size: 0.6rem; border-bottom: 1px solid var(--border-light);
        }
        .hh-kv-label { color: var(--dim); }
        .hh-kv-value { text-align: right; }
        .hh-kv-list { background: var(--bg2); border-radius: 6px; padding: 8px; }

        .hh-section-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 4px; flex-wrap: wrap; gap: 4px;
        }
        .hh-section-title { font-size: 0.6rem; color: var(--accent); }
        .hh-empty { text-align: center; padding: 20px; color: var(--dim); font-size: 0.65rem; }
        .hh-failure { text-align: center; padding: 20px; color: var(--danger); font-size: 0.65rem; }
        .hh-unavailable { padding: 16px; color: var(--warn); font-size: 0.65rem; }
        .hh-tab { max-width: 750px; margin: 0 auto; }
        .hh-tab-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px; flex-wrap: wrap; gap: 8px;
        }
        .hh-tab-title { font-size: 0.75rem; color: var(--accent); margin: 0; }
        .hh-tab-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .hh-tab-footer { font-size: 0.5rem; color: var(--dim); text-align: center; padding-top: 8px; }

        /* 3. BUTTONS */
        .hh-btn {
            padding: 3px 10px; background: var(--bg3);
            border: 1px solid var(--border); border-radius: 4px;
            color: var(--text); font-size: 0.55rem; cursor: pointer;
            transition: background 0.1s, border-color 0.1s;
        }
        .hh-btn:hover { background: var(--bg2); }
        .hh-btn-primary { background: var(--accent-dim); border-color: var(--accent); }
        .hh-btn-accent { background: var(--accent); border-color: var(--accent); color: var(--text-inverse); }
        .hh-btn-danger { background: var(--danger); border-color: var(--danger); color: var(--text-inverse); }
        .hh-btn-subtle { background: transparent; }
        .hh-icon-btn {
            padding: 1px 6px; background: none; border: none;
            color: var(--accent); font-size: 0.4rem; cursor: pointer;
            transition: color 0.1s;
        }
        .hh-icon-btn:hover { color: var(--accent-bright, var(--accent)); }
        .hh-icon-btn-danger { color: var(--danger); }
        .hh-icon-btn-success { color: var(--success); }

        /* 4. SIDEBAR ITEMS */
        .hh-sidebar-list { display: flex; flex-direction: column; gap: 2px; padding: 4px; }
        .hh-sidebar-item {
            padding: 8px 10px; border-radius: 4px;
            border-left: 3px solid transparent; cursor: pointer;
            background: var(--bg3); transition: background 0.1s, border-color 0.1s;
        }
        .hh-sidebar-item:hover { background: var(--bg2); }
        .hh-sidebar-item.active {
            background: var(--accent-dim); border-left-color: var(--accent);
        }
        .hh-sidebar-item-name { font-size: 0.7rem; font-weight: bold; color: var(--text); }
        .hh-sidebar-item-meta {
            display: flex; gap: 8px; margin-top: 2px;
            font-size: 0.5rem; color: var(--dim);
        }
        .hh-sidebar-status-active    { color: var(--success); }
        .hh-sidebar-status-vacant    { color: var(--warn); }
        .hh-sidebar-status-empty     { color: var(--dim); }
        .hh-sidebar-status-declining { color: var(--warn); }
        .hh-sidebar-status-deprecated{ color: var(--dim); }
        .hh-sidebar-status-destroyed { color: var(--danger); }
        .hh-sidebar-status-bankrupt  { color: var(--danger); }
        .hh-sidebar-status-unknown   { color: var(--dim); }

        /* 5. OVERVIEW */
        .hh-overview-header {
            background: var(--bg2); border: 1px solid var(--border);
            border-radius: 8px; padding: 16px; margin-bottom: 12px;
        }
        .hh-overview-title { font-size: 1rem; color: var(--accent); margin: 0; }
        .hh-overview-subtitle { font-size: 0.6rem; color: var(--dim); margin-top: 2px; }
        .hh-overview-status { font-size: 0.65rem; font-weight: bold; text-align: right; }
        .hh-overview-status-meta { font-size: 0.5rem; color: var(--dim); }
        .hh-status-active    { color: var(--success); }
        .hh-status-vacant    { color: var(--warn); }
        .hh-status-empty     { color: var(--dim); }
        .hh-status-declining { color: var(--warn); }
        .hh-status-abandoned { color: var(--danger); }
        .hh-status-deprecated{ color: var(--dim); }
        .hh-status-destroyed { color: var(--danger); }
        .hh-status-bankrupt  { color: var(--danger); }
        .hh-status-unknown   { color: var(--dim); }
        .hh-overview-grid {
            display: grid; grid-template-columns: 120px 1fr; gap: 6px 16px;
            font-size: 0.7rem; margin: 12px 0; padding: 12px;
            background: var(--bg3); border-radius: 6px;
        }
        .hh-overview-grid-label { color: var(--dim); }
        .hh-overview-grid-value { color: var(--text); }
        .hh-overview-actions {
            display: flex; gap: 8px; flex-wrap: wrap;
            margin-top: 8px; padding-top: 12px; border-top: 1px solid var(--border);
        }
        .hh-name-history { margin-top: 4px; padding: 6px; background: var(--bg3); border-radius: 4px; }
        .hh-name-history-title { font-size: 0.5rem; color: var(--dim); margin-bottom: 2px; }
        .hh-name-history-entry { font-size: 0.45rem; color: var(--dim); line-height: 1.5; }
        .hh-name-history-more { font-size: 0.45rem; color: var(--dim); margin-top: 2px; }

        /* 6. MEMBERS */
        .hh-member-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 6px 10px; background: var(--bg3); border-radius: 4px;
            margin-bottom: 2px; border-left: 3px solid var(--border);
        }
        .hh-member-row.head     { border-left-color: var(--accent); }
        .hh-member-row.deceased { opacity: 0.6; border-left-color: var(--dim); }
        .hh-member-info { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 0; }
        .hh-member-name { font-size: 0.7rem; }
        .hh-member-name.head { font-weight: bold; }
        .hh-member-gender { font-size: 0.7rem; color: var(--dim); }
        .hh-member-age { font-size: 0.5rem; color: var(--dim); }
        .hh-member-status-living   { font-size: 0.55rem; color: var(--success); }
        .hh-member-status-deceased { font-size: 0.55rem; color: var(--dim); }
        .hh-member-role { font-size: 0.5rem; color: var(--accent); }
        .hh-member-dept { font-size: 0.45rem; color: var(--dim); }
        .hh-member-joined { font-size: 0.45rem; color: var(--dim); }
        .hh-member-badge { padding: 1px 8px; border-radius: 10px; font-size: 0.45rem; }
        .hh-member-badge.head   { background: var(--accent-dim); color: var(--accent); }
        .hh-member-badge.family { background: var(--bg2); color: var(--dim); }
        .hh-member-badge.staff  { background: var(--bg2); color: var(--accent); }
        .hh-member-actions { display: flex; gap: 4px; flex-shrink: 0; }
        .hh-members-section { margin-bottom: 12px; }
        .hh-members-section-former .hh-member-list { opacity: 0.7; }

        /* 7. DEPARTMENTS */
        .hh-dept-card {
            background: var(--bg3); border: 1px solid var(--border);
            border-radius: 6px; padding: 10px 12px; margin-bottom: 8px;
        }
        .hh-dept-header {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 4px;
        }
        .hh-dept-title-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .hh-dept-title { font-size: 0.7rem; font-weight: bold; }
        .hh-dept-stat  { font-size: 0.5rem; color: var(--dim); }
        .hh-dept-head  { font-size: 0.45rem; color: var(--accent); }
        .hh-dept-actions { display: flex; gap: 4px; flex-wrap: wrap; }
        .hh-dept-staff-list   { margin-top: 4px; padding-left: 12px; }
        .hh-dept-staff-empty  { font-size: 0.5rem; color: var(--dim); padding: 4px 12px; }
        .hh-dept-staff-row    { display: flex; justify-content: space-between; align-items: center; padding: 2px 6px; font-size: 0.55rem; }
        .hh-dept-staff-row.deceased { opacity: 0.5; }
        .hh-dept-staff-info   { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
        .hh-dept-staff-actions{ display: flex; gap: 4px; }
        .hh-dept-staff-head   { color: var(--accent); font-size: 0.45rem; }
        .hh-dept-staff-role   { color: var(--dim); font-size: 0.45rem; }
        .hh-dept-pos-list { margin-top: 4px; padding-left: 12px; border-top: 1px solid var(--border-light); padding-top: 4px; }
        .hh-dept-pos-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 2px 6px; font-size: 0.5rem;
            border-left: 2px solid var(--accent-dim); margin-bottom: 2px;
        }
        .hh-dept-pos-row-unassigned { border-left-color: var(--warn); }
        .hh-dept-pos-info     { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
        .hh-dept-pos-name     { font-weight: 500; }
        .hh-dept-pos-role     { color: var(--accent); font-size: 0.4rem; }
        .hh-dept-pos-assigned { color: var(--dim); font-size: 0.4rem; }
        .hh-dept-pos-unassigned { color: var(--warn); font-size: 0.4rem; }
        .hh-dept-pos-actions  { display: flex; gap: 4px; }
        .hh-dept-unassigned { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border-light); }
        .hh-dept-unassigned-title { font-size: 0.55rem; color: var(--warn); margin-bottom: 4px; }

        /* 8. ECONOMY */
        .hh-econ-grid { display: grid; gap: 8px; margin-bottom: 12px; }
        .hh-econ-grid-2 { grid-template-columns: 1fr 1fr; }
        .hh-econ-grid-3 { grid-template-columns: 1fr 1fr 1fr; }
        .hh-econ-grid-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
        .hh-econ-grid-5 { grid-template-columns: 1fr 1fr 1fr 1fr 1fr; }
        .hh-econ-net {
            text-align: center; padding: 8px; background: var(--bg);
            border-radius: 4px; margin-bottom: 12px;
            font-size: 0.8rem; font-weight: bold;
        }
        .hh-econ-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .hh-econ-enterprise { background: var(--bg3); padding: 10px; border-radius: 6px; margin-bottom: 12px; }
        .hh-econ-enterprise-empty { background: var(--bg3); padding: 10px; border-radius: 6px; margin-bottom: 12px; font-size: 0.6rem; color: var(--dim); }
        .hh-econ-enterprise-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 6px; flex-wrap: wrap; gap: 4px;
        }
        .hh-econ-enterprise-title { font-size: 0.6rem; color: var(--accent); }
        .hh-econ-enterprise-meta  { font-size: 0.55rem; color: var(--dim); }
        .hh-econ-enterprise-total { font-size: 0.55rem; margin-bottom: 4px; }
        .hh-econ-enterprise-list  { max-height: 120px; overflow-y: auto; }
        .hh-econ-enterprise-row {
            display: flex; justify-content: space-between; padding: 4px 8px;
            background: var(--bg); border-radius: 4px; margin-bottom: 2px; font-size: 0.6rem;
        }
        .hh-econ-enterprise-name { font-size: 0.6rem; }
        .hh-econ-enterprise-more { text-align: center; font-size: 0.5rem; color: var(--dim); padding-top: 4px; }
        .hh-resource-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
        .hh-resource-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 12px; background: var(--bg2); border-radius: 6px;
        }
        .hh-resource-label    { font-size: 0.7rem; }
        .hh-resource-controls { display: flex; align-items: center; gap: 8px; }
        .hh-resource-value    { font-size: 1rem; font-weight: bold; }

        /* 9. HOLDINGS */
        .hh-holding-section { margin-bottom: 12px; }
        .hh-holding-section-meta { font-size: 0.5rem; color: var(--success); }
        .hh-holding-list { display: flex; flex-direction: column; gap: 6px; }
        .hh-holding-card {
            background: var(--bg3); border: 1px solid var(--border);
            border-radius: 6px; padding: 10px 12px;
        }
        .hh-holding-card.demolished { opacity: 0.5; }
        .hh-holding-header {
            display: flex; justify-content: space-between; align-items: flex-start;
            flex-wrap: wrap; gap: 4px;
        }
        .hh-holding-title {
            display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
            font-size: 0.75rem; font-weight: bold;
        }
        .hh-holding-type   { font-size: 0.5rem; color: var(--dim); margin-left: 4px; }
        .hh-holding-status { font-size: 0.45rem; margin-left: 4px; }
        .hh-holding-badge {
            font-size: 0.4rem; padding: 1px 6px; border-radius: 8px;
            background: var(--accent-dim); color: var(--accent); margin-left: 4px;
        }
        .hh-holding-meta {
            display: flex; flex-wrap: wrap; gap: 8px;
            font-size: 0.5rem; color: var(--dim); margin-top: 4px;
        }
        .hh-holding-meta-dim { font-size: 0.5rem; color: var(--dim); }
        .hh-holding-actions  { display: flex; gap: 4px; align-items: center; }

        /* 10. ACTIVITY */
        .hh-activity-total  { font-size: 0.55rem; color: var(--dim); }
        .hh-activity-chips {
            display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px;
            padding: 6px; background: var(--bg2); border-radius: 4px;
        }
        .hh-activity-chip { background: var(--bg3); padding: 2px 8px; border-radius: 10px; font-size: 0.5rem; }
        .hh-activity-events-section { margin-bottom: 12px; }
        .hh-activity-events { max-height: 500px; overflow-y: auto; }
        .hh-activity-event {
            display: flex; justify-content: space-between; align-items: center;
            padding: 6px 10px; background: var(--bg2); border-radius: 4px;
            margin-bottom: 2px; border-left: 3px solid var(--border);
            cursor: pointer; transition: background 0.1s;
        }
        .hh-activity-event:hover { background: var(--bg3); }
        .hh-activity-event-inner {
            display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0;
        }
        .hh-activity-icon   { font-size: 0.6rem; }
        .hh-activity-year   { font-size: 0.6rem; font-weight: bold; color: var(--dim); min-width: 40px; }
        .hh-activity-label  { font-size: 0.6rem; font-weight: bold; }
        .hh-activity-amount { font-size: 0.55rem; margin-left: 8px; }
        .hh-activity-amount-positive { color: var(--success); }
        .hh-activity-amount-negative { color: var(--danger); }
        .hh-activity-detail {
            font-size: 0.5rem; color: var(--dim); overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap; flex: 1;
        }
        .hh-activity-source { font-size: 0.4rem; color: var(--dim); }
        .hh-activity-priority-important {
            background: var(--danger); color: var(--text-inverse);
            padding: 1px 6px; border-radius: 8px; font-size: 0.4rem;
        }
        .hh-activity-priority-major {
            background: var(--warn); color: var(--text-inverse);
            padding: 1px 6px; border-radius: 8px; font-size: 0.4rem;
        }
        .hh-activity-event-actions { display: flex; gap: 4px; flex-shrink: 0; }
        .hh-activity-detail-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; padding: 12px; background: var(--bg2);
            border-radius: 8px; border-left: 4px solid var(--border);
        }
        .hh-activity-detail-title { font-size: 0.8rem; font-weight: bold; }
        .hh-activity-detail-meta  { font-size: 0.6rem; color: var(--dim); }
        .hh-activity-raw-pre {
            font-size: 0.5rem; color: var(--dim); max-height: 150px;
            overflow: auto; background: var(--bg); padding: 8px;
            border-radius: 4px; margin: 0;
        }

        /* 11. FILTER BAR */
        .hh-filter-bar {
            display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px;
            padding: 8px; background: var(--bg2); border-radius: 6px; align-items: center;
        }
        .hh-filter-search {
            flex: 2; min-width: 100px; padding: 4px 8px;
            background: var(--bg); border: 1px solid var(--border);
            border-radius: 4px; font-size: 0.6rem; color: var(--text);
        }
        .hh-filter-select {
            padding: 4px 6px; background: var(--bg);
            border: 1px solid var(--border); border-radius: 4px;
            font-size: 0.6rem; color: var(--text);
        }
        .hh-filter-year {
            width: 60px; padding: 4px 6px; background: var(--bg);
            border: 1px solid var(--border); border-radius: 4px;
            font-size: 0.6rem; color: var(--text);
        }
        .hh-filter-sep { font-size: 0.5rem; color: var(--dim); align-self: center; }

        /* 12. MODAL FORM PRIMITIVES */
        .hh-modal-form { padding: 4px; }
        .hh-modal-current {
            background: var(--bg3); padding: 8px; border-radius: 6px;
            margin-bottom: 12px; font-size: 0.6rem;
        }
        .hh-form-group { margin-bottom: 12px; }
        .hh-form-group label {
            display: block; font-size: 0.7rem;
            color: var(--accent); margin-bottom: 4px;
        }
        .hh-form-group input[type="text"],
        .hh-form-group input[type="number"],
        .hh-form-group select,
        .hh-form-group textarea {
            width: 100%; padding: 8px; background: var(--bg);
            border: 1px solid var(--border); border-radius: 6px;
            font-size: 0.8rem; color: var(--text); box-sizing: border-box;
        }
        .hh-form-group textarea { resize: vertical; min-height: 60px; }
        .hh-form-group input[readonly] { background: var(--bg2); cursor: pointer; }
        .hh-form-row {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 8px; margin-bottom: 12px;
        }
        .hh-form-hint { font-size: 0.55rem; color: var(--dim); margin-top: 4px; }
        .hh-inline-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
        .hh-inline-actions input { flex: 1; min-width: 60px; }

        /* 13. UTILITY */
        .placeholder { text-align: center; padding: 40px; color: var(--dim); font-size: 0.7rem; }
        .loading { text-align: center; padding: 20px; color: var(--dim); font-size: 0.6rem; }
    </style>
</head>
<body>

<!-- ================================================================= -->
<!-- TOPBAR                                                            -->
<!-- ================================================================= -->
<div class="topbar">
    <div class="title" id="householdManagerTitle">Household Manager</div>
    <div class="spacer"></div>
    <div class="year-input">
