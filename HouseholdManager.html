    <!-- ============================================================ -->
    <!-- LOAD LOCALSTORAGE DATA FIRST (BEFORE ANY SYSTEMS)            -->
    <!-- ============================================================ -->
    <script>
        (function() {
            'use strict';
            try {
                var STORAGE_KEY = 'stillwaters_master';
                var stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    var parsed = JSON.parse(stored);
                    if (parsed && parsed.data) {
                        window.masterData = parsed;
                        console.log('[PRELOAD] Loaded from localStorage');
                    }
                }
            } catch(e) {
                console.warn('[PRELOAD] Failed to load from localStorage:', e.message);
            }

            if (!window.masterData || !window.masterData.data) {
                window.masterData = {
                    version: '2.0',
                    lastUpdated: new Date().toISOString(),
                    data: {
                        characters: [],
                        places: [],
                        ranks: [],
                        roles: [],
                        locationTypes: [],
                        governmentTypes: [],
                        households: [],
                        residences: [],
                        currentYear: 1250
                    }
                };
                console.log('[PRELOAD] Created empty masterData');
            }
        })();
    </script>

    <script>
        (function() {
            'use strict';

            var listContainer = document.getElementById('householdListContainer');
            var burgerBtn = document.getElementById('burgerBtn');
            var sidebar = document.getElementById('sidebar');
            var exportBtn = document.getElementById('exportBtn');
            var importBtn = document.getElementById('importBtn');
            var fileInput = document.getElementById('fileInput');
            var yearInput = document.getElementById('yearInput');
            var setYearBtn = document.getElementById('setYearBtn');

            var selectedId = null;
            var isInitialized = false;
            var _renderTimeout = null;

            // ============================================================
            // Add Household button
            // ============================================================
            document.getElementById('addHouseholdBtn').addEventListener('click', function() {
                if (typeof window.openCreateHouseholdModal === 'function') {
                    window.openCreateHouseholdModal(function(household) {
                        if (household) {
                            selectedId = household.id;
                            window._currentHouseholdId = selectedId;
                            renderHouseholdList();
                            renderActiveTab();
                        }
                    });
                } else {
                    window._showToast('Create household modal not available', 'error');
                }
            });

            // ============================================================
            // TAB SWITCHING
            // ============================================================
            var tabButtons = document.querySelectorAll('.tab-btn');
            var tabPanes = {
                details: document.getElementById('tab-details'),
                members: document.getElementById('tab-members'),
                economy: document.getElementById('tab-economy'),
                positions: document.getElementById('tab-positions'),
                holdings: document.getElementById('tab-holdings')
            };

            window._currentHouseholdId = null;

            function renderActiveTab() {
                if (!selectedId) {
                    Object.keys(tabPanes).forEach(function(key) {
                        if (tabPanes[key].classList.contains('active')) {
                            tabPanes[key].innerHTML = '<div class="placeholder">Select a household from the sidebar</div>';
                        }
                    });
                    return;
                }

                window._currentHouseholdId = selectedId;

                var activeTab = document.querySelector('.tab-btn.active');
                if (!activeTab) return;

                var tabId = activeTab.dataset.tab;

                if (tabId === 'details') {
                    if (typeof window.renderHouseholdOverviewTab === 'function') {
                        window.renderHouseholdOverviewTab('tab-details', selectedId);
                    } else {
                        tabPanes.details.innerHTML = '<div class="placeholder">Overview tab not loaded</div>';
                    }
                } else if (tabId === 'members') {
                    if (typeof window.renderHouseholdMembersTab === 'function') {
                        window.renderHouseholdMembersTab('tab-members', selectedId);
                    } else {
                        tabPanes.members.innerHTML = '<div class="placeholder">Members tab not loaded</div>';
                    }
                } else if (tabId === 'economy') {
                    if (typeof window.renderHouseholdEconomyTab === 'function') {
                        window.renderHouseholdEconomyTab('tab-economy', selectedId);
                    } else {
                        tabPanes.economy.innerHTML = '<div class="placeholder">Economy tab not loaded</div>';
                    }
                } else if (tabId === 'positions') {
                    if (typeof window.renderHouseholdDepartmentsTab === 'function') {
                        window.renderHouseholdDepartmentsTab('tab-positions', selectedId);
                    } else {
                        tabPanes.positions.innerHTML = '<div class="placeholder">Departments tab not loaded</div>';
                    }
                } else if (tabId === 'holdings') {
                    if (typeof window.renderHouseholdHoldingsTab === 'function') {
                        window.renderHouseholdHoldingsTab('tab-holdings', selectedId);
                    } else {
                        tabPanes.holdings.innerHTML = '<div class="placeholder">Holdings tab not loaded</div>';
                    }
                }
            }

            function switchTab(tabId) {
                tabButtons.forEach(function(btn) {
                    btn.classList.toggle('active', btn.dataset.tab === tabId);
                });

                Object.keys(tabPanes).forEach(function(key) {
                    tabPanes[key].classList.toggle('active', key === tabId);
                });

                renderActiveTab();
            }

            tabButtons.forEach(function(btn) {
                btn.addEventListener('click', function() {
                    switchTab(this.dataset.tab);
                });
            });

            // ============================================================
            // SIDEBAR TOGGLE
            // ============================================================
            function toggleSidebar() {
                sidebar.classList.toggle('open');
            }

            function closeSidebar() {
                sidebar.classList.remove('open');
            }

            burgerBtn.addEventListener('click', toggleSidebar);

            document.addEventListener('click', function(e) {
                if (window.innerWidth <= 768) {
                    if (!sidebar.contains(e.target) && e.target !== burgerBtn) {
                        closeSidebar();
                    }
                }
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeSidebar();
            });

            window.addEventListener('resize', function() {
                if (window.innerWidth > 768) closeSidebar();
            });

            // ============================================================
            // GET/SET FULL DATA
            // ============================================================
            function getFullData() {
                if (typeof window.masterData !== 'undefined' && window.masterData) {
                    return window.masterData;
                }
                return null;
            }

            function setFullData(data) {
                if (data && data.data) {
                    window.masterData = data;
                } else if (data && data.places) {
                    window.masterData = {
                        version: '2.0',
                        lastUpdated: new Date().toISOString(),
                        data: data
                    };
                } else {
                    return false;
                }

                try {
                    localStorage.setItem('stillwaters_master', JSON.stringify(window.masterData));
                } catch(e) {}

                if (typeof window.saveMasterData === 'function') {
                    window.saveMasterData(true);
                }
                if (typeof window.invalidateAccessorCaches === 'function') {
                    window.invalidateAccessorCaches();
                }

                if (typeof window.HouseholdState !== 'undefined' &&
                    typeof window.HouseholdState.refresh === 'function') {
                    window.HouseholdState.refresh();
                }

                return true;
            }

            // ============================================================
            // RENDER HOUSEHOLD LIST
            // ============================================================
            function renderHouseholdList() {
                if (!listContainer) return;

                if (_renderTimeout) {
                    clearTimeout(_renderTimeout);
                    _renderTimeout = null;
                }

                var HS = window.HouseholdState;
                var HUI = window.renderHouseholdList;

                if (!HS || typeof HUI !== 'function') {
                    listContainer.innerHTML = '<div class="loading-placeholder">Loading households...</div>';
                    return;
                }

                var households = HS.getAllHouseholds ? HS.getAllHouseholds() : [];
                if (!households || households.length === 0) {
                    listContainer.innerHTML = '<div class="empty-state">No households found</div>';
                    return;
                }

                try {
                    HUI('householdListContainer', function(householdId) {
                        if (householdId) {
                            selectedId = householdId;
                            window._currentHouseholdId = householdId;
                            renderHouseholdList();
                            renderActiveTab();
                            if (window.innerWidth <= 768) closeSidebar();
                        }
                    }, true);

                    if (selectedId) {
                        var found = false;
                        var items = listContainer.querySelectorAll('.household-item');
                        for (var i = 0; i < items.length; i++) {
                            if (items[i].dataset.id === selectedId) {
                                found = true;
                                break;
                            }
                        }
                        if (!found) {
                            selectedId = null;
                        }
                    }

                    if (!selectedId && households.length > 0) {
                        selectedId = households[0].id;
                        window._currentHouseholdId = selectedId;
                        _renderTimeout = setTimeout(function() {
                            renderHouseholdList();
                            renderActiveTab();
                            _renderTimeout = null;
                        }, 50);
                    }

                } catch(e) {
                    console.warn('Error rendering household list:', e);
                    listContainer.innerHTML = '<div class="error-state">Error loading households</div>';
                }
            }

            // ============================================================
            // IMPORT / EXPORT
            // ============================================================
            exportBtn.addEventListener('click', function() {
                var data = getFullData();
                if (!data) {
                    alert('No data to export');
                    return;
                }
                var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = 'stillwaters_households_' + Date.now() + '.json';
                a.click();
                URL.revokeObjectURL(url);
            });

            importBtn.addEventListener('click', function() {
                fileInput.value = '';
                fileInput.click();
            });

            fileInput.addEventListener('change', function() {
                var file = this.files[0];
                if (!file) return;

                var reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        var imported = JSON.parse(e.target.result);
                        var dataToImport = null;

                        if (imported.data && imported.version) {
                            dataToImport = imported;
                        } else if (imported.places || imported.characters) {
                            dataToImport = {
                                version: '2.0',
                                lastUpdated: new Date().toISOString(),
                                data: imported
                            };
                        } else if (imported.data) {
                            dataToImport = {
                                version: '2.0',
                                lastUpdated: new Date().toISOString(),
                                data: imported.data
                            };
                        }

                        if (!dataToImport) {
                            alert('Invalid format: Could not recognize data structure.');
                            return;
                        }

                        if (setFullData(dataToImport)) {
                            renderHouseholdList();
                            renderActiveTab();
                        } else {
                            alert('Import failed');
                        }
                    } catch(err) {
                        alert('Invalid JSON: ' + err.message);
                    }
                };
                reader.readAsText(file);
                this.value = '';
            });

            // ============================================================
            // YEAR SETTER
            // ============================================================
            setYearBtn.addEventListener('click', function() {
                var val = parseInt(yearInput.value, 10);
                if (!isNaN(val) && window.masterData) {
                    window.masterData.data.currentYear = val;
                    try {
                        localStorage.setItem('stillwaters_master', JSON.stringify(window.masterData));
                    } catch(e) {}
                    if (typeof window.saveMasterData === 'function') {
                        window.saveMasterData(true);
                    }
                }
            });

            // ============================================================
            // FORCE RENDER ON HOUSEHOLD SELECTION
            // ============================================================
            document.addEventListener('click', function(e) {
                var item = e.target.closest('.household-item');
                if (item && item.dataset.id) {
                    var id = item.dataset.id;
                    setTimeout(function() {
                        if (selectedId === id) {
                            window._currentHouseholdId = id;
                            renderActiveTab();
                        }
                    }, 150);
                }
            });

            // ============================================================
            // DEBUG: Log tab functions
            // ============================================================
            console.log('[HouseholdManager] Tab functions:');
            console.log('  renderHouseholdOverviewTab:', typeof window.renderHouseholdOverviewTab);
            console.log('  renderHouseholdMembersTab:', typeof window.renderHouseholdMembersTab);
            console.log('  renderHouseholdEconomyTab:', typeof window.renderHouseholdEconomyTab);
            console.log('  renderHouseholdDepartmentsTab:', typeof window.renderHouseholdDepartmentsTab);
            console.log('  renderHouseholdHoldingsTab:', typeof window.renderHouseholdHoldingsTab);

            // Check if HouseholdEconomy is available
            console.log('[HouseholdManager] HouseholdEconomy:', typeof window.HouseholdEconomy);

            // ============================================================
            // INIT
            // ============================================================
            function init() {
                if (isInitialized) return;
                isInitialized = true;

                // Register tab renderers
                if (typeof window.registerOverviewTabRenderer === 'function') {
                    window.registerOverviewTabRenderer();
                }
                if (typeof window.registerMembersTabRenderer === 'function') {
                    window.registerMembersTabRenderer();
                }
                if (typeof window.registerEconomyTabRenderer === 'function') {
                    window.registerEconomyTabRenderer();
                }
                if (typeof window.registerDepartmentsTabRenderer === 'function') {
                    window.registerDepartmentsTabRenderer();
                }
                if (typeof window.registerHoldingsTabRenderer === 'function') {
                    window.registerHoldingsTabRenderer();
                }

                setTimeout(function() {
                    var HS = window.HouseholdState;
                    if (HS) {
                        var households = HS.getAllHouseholds ? HS.getAllHouseholds() : [];
                        if (households && households.length > 0) {
                            if (!selectedId) {
                                selectedId = households[0].id;
                                window._currentHouseholdId = selectedId;
                            }
                        }
                    }

                    renderHouseholdList();

                    setTimeout(function() {
                        renderActiveTab();
                    }, 100);

                }, 300);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                setTimeout(init, 50);
            }

        })();
    </script>

</body>
</html>
