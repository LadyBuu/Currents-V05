<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover" />
    <title>Role Manager</title>
    <link rel="icon" href="data:," />

    <script src="js/core/theme-boot.js"></script>

    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/role-manager.css">

    <style>
        /* ============================================================
           Role Manager — inline CSS (structural only).
           Every visual value comes from a theme token in themes.css.
           No hex values, no rgba() values, no hardcoded font stacks.
           Spacing uses rem. Matches ReligionManager.html's shell.

           The .role-* rules at the bottom are the shell's own bits
           (sidebar row, tab strip); each tab file injects its own
           style block on demand. Nothing here collides with those.
           ============================================================ */

        html, body { height: 100%; margin: 0; overflow: hidden; }
        body {
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--text);
            font-family: var(--f-body);
            font-size: 1rem;
            line-height: var(--lh, 1.5);
            -webkit-font-smoothing: antialiased;
        }

        .topbar {
            position: relative;
            z-index: 100;
            flex-shrink: 0;
            background: var(--bg2);
            padding: 0.5rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.625rem;
            border-bottom: 1px solid var(--border);
            min-height: 3rem;
            flex-wrap: wrap;
        }
        .topbar .title {
            font-family: var(--f-display);
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--accent);
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
        }
        .topbar .title svg { width: 1em; height: 1em; fill: currentColor; }
        .topbar .spacer { flex: 1; min-width: 0.75rem; }
        .topbar .burger-menu {
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0.25rem 0.625rem;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            cursor: pointer;
        }

        .tb-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.3125rem;
            padding: 0.375rem 0.875rem;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: var(--f-body);
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            line-height: 1.2;
        }
        .tb-btn svg { width: 0.9em; height: 0.9em; fill: currentColor; }
        .tb-btn:hover {
            border-color: var(--accent);
            background: var(--accent-dim);
            color: var(--accent-light);
        }
        .tb-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--accent-fg);
        }
        .tb-btn.primary:hover { background: var(--accent-dark); }
        .tb-btn:disabled { opacity: 0.45; cursor: not-allowed; }

        .year-input {
            display: inline-flex;
            align-items: center;
            gap: 0.3125rem;
            padding: 0.1875rem 0.625rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-family: var(--f-body);
            font-size: 0.7rem;
            line-height: 1.2;
        }
        .year-input label {
            font-family: var(--f-display);
            font-size: 0.55rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--dim);
            white-space: nowrap;
        }
        .year-input input {
            width: 4rem;
            padding: 0.1875rem 0.375rem;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: var(--f-mono);
            font-size: 0.7rem;
            text-align: right;
        }
        .year-input input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .theme-toggle { position: relative; display: inline-flex; }
        .theme-toggle__menu {
            position: absolute;
            top: calc(100% + 0.25rem);
            right: 0;
            z-index: 9999;
            min-width: 10rem;
            max-height: 60vh;
            padding: 0.25rem;
            margin: 0;
            list-style: none;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow-y: auto;
        }
        .theme-toggle__menu[hidden] { display: none; }
        .theme-toggle__menu button {
            display: block;
            width: 100%;
            padding: 0.375rem 0.75rem;
            text-align: left;
            background: transparent;
            border: none;
            color: var(--text);
            font-family: var(--f-body);
            font-size: 0.7rem;
            border-radius: var(--radius);
            cursor: pointer;
        }
        .theme-toggle__menu button:hover {
            background: var(--accent-dim);
            color: var(--accent-light);
        }

        .app-layout {
            display: flex;
            flex-direction: row;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }
        .sidebar {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg2);
            border-right: 1px solid var(--border);
            width: 17.5rem;
        }
        .sidebar-header {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
            background: var(--bg3);
        }
        .sidebar-header h3 {
            margin: 0;
            font-family: var(--f-display);
            font-size: 0.65rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }
        .sidebar-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
            min-height: 0;
        }
        .main-panel {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
        }

        .manager-subtabs {
            position: sticky;
            top: 0;
            display: flex;
            align-items: stretch;
            gap: 0.25rem;
            padding: 0.5rem 1.5rem 0;
            margin: 0 0 1.25rem;
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            z-index: 10;
        }
        .manager-subtab {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.125rem 0.6875rem;
            background: transparent;
            border: 1px solid transparent;
            border-bottom: none;
            border-radius: var(--radius) var(--radius) 0 0;
            color: var(--dim);
            font-family: var(--f-display);
            font-size: 0.78rem;
            font-weight: 500;
            cursor: pointer;
        }
        .manager-subtab:hover {
            color: var(--accent-light);
            background: var(--accent-dim);
        }
        .manager-subtab.active {
            color: var(--accent);
            background: var(--bg2);
            border-color: var(--border);
            font-weight: 600;
        }
        .manager-subtab-icon {
            display: inline-flex;
            width: 1rem;
            height: 1rem;
            align-items: center;
            justify-content: center;
            color: currentColor;
        }
        .manager-subtab-icon svg { width: 100%; height: 100%; fill: currentColor; }

        .tab-content-wrapper {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 1.25rem 1.5rem;
            background: var(--bg);
        }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        /* ---- Shared: hints, empty, loading ---- */
        .ct-hint {
            background: var(--bg2);
            border-left: 3px solid var(--accent);
            padding: 0.625rem 0.875rem;
            margin-bottom: 1rem;
            font-size: 0.7rem;
            color: var(--dim);
            line-height: 1.55;
            border-radius: 0 var(--radius) var(--radius) 0;
        }
        .ct-empty,
        .rt-empty {
            padding: 1.5rem;
            text-align: center;
            color: var(--dim);
            font-size: 0.8rem;
        }
        .ct-empty__sub,
        .rt-empty__sub {
            display: block;
            margin-top: 0.375rem;
            font-size: 0.7rem;
            color: var(--dim);
        }
        .rt-unavailable {
            padding: 1.5rem;
            text-align: center;
            color: var(--danger-lt);
            font-size: 0.8rem;
        }
        .loading,
        .loading-placeholder {
            padding: 1.5rem;
            text-align: center;
            color: var(--dim);
            font-size: 0.85rem;
        }

        /* ---- Sidebar row (fallback when RoleUI is absent) ---- */
        .role-list { display: flex; flex-direction: column; gap: 0.125rem; }
        .role-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.625rem;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 0.78rem;
            color: var(--text);
        }
        .role-row:hover { background: var(--bg3); }
        .role-row.is-selected {
            background: var(--accent-dim);
            color: var(--accent-light);
        }

        @media (max-width: 768px) {
            .topbar .burger-menu { display: inline-flex; }
            .topbar { padding: 0.375rem 0.625rem; gap: 0.375rem; min-height: 2.625rem; }
            .topbar .title { font-size: 0.75rem; }
            .topbar .tb-btn { padding: 0.1875rem 0.625rem; font-size: 0.65rem; }
            .year-input { padding: 0.125rem 0.375rem; }
            .year-input label { display: none; }
            .year-input input { width: 3.25rem; font-size: 0.65rem; }
            .app-layout { flex-direction: column; }
            .sidebar {
                position: fixed;
                top: 0; bottom: 0; left: 0;
                height: 100vh;
                width: 85%;
                max-width: 17.5rem;
                z-index: 1000;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }
            .sidebar.visible { transform: translateX(0); }
            .tab-content-wrapper { padding: 1rem; }
            .manager-subtabs { padding-left: 1rem; padding-right: 1rem; }
            .manager-subtab {
                flex: 1 1 auto; min-width: 0;
                padding: 0.625rem 0.875rem; font-size: 0.72rem;
            }
        }

        .sidebar-overlay { display: none; }
        .sidebar-overlay.active {
            display: block;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--overlay, rgba(0, 0, 0, 0.6));
            z-index: 999;
        }
    </style>
</head>
<body>

<div class="topbar">
    <button id="menuToggle" class="burger-menu" type="button" aria-label="Toggle menu">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
    </button>
    <div class="title" id="roleManagerTitle">Role Manager</div>
    <div class="spacer"></div>

    <button id="createRoleBtn" class="tb-btn primary" type="button">+ Role</button>
    <button id="editRoleBtn" class="tb-btn" type="button" disabled>Edit</button>
    <button id="deleteRoleBtn" class="tb-btn" type="button" disabled>Delete</button>

    <div class="year-input">
        <label for="yearInput">Year</label>
        <input type="number" id="yearInput" min="1" step="1">
        <button id="setYearBtn" class="tb-btn" type="button">Set</button>
    </div>

    <button id="importBtn" class="tb-btn" type="button">Import</button>
    <button id="exportBtn" class="tb-btn" type="button">Export</button>
    <button id="refreshBtn" class="tb-btn" type="button">Refresh</button>

    <input type="file" id="fileInput" accept=".json" style="display:none;" />

    <div class="theme-toggle" role="group" aria-label="Theme">
        <button class="tb-btn theme-toggle__btn" id="themeBtn" type="button" aria-haspopup="menu" aria-expanded="false">
            <span aria-hidden="true">◐</span>
            <span id="themeName">Dark</span>
        </button>
        <ul class="theme-toggle__menu" id="themeMenu" role="menu" hidden></ul>
    </div>
</div>

<div class="app-layout">
    <div class="sidebar" id="roleSidebar">
        <div class="sidebar-header"><h3 id="sidebarTitle">Roles</h3></div>
        <div class="sidebar-list" id="roleListContainer">
            <div class="loading">Loading roles…</div>
        </div>
    </div>
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <div class="main-panel">
        <div class="manager-subtabs" id="panelSubtabs" role="tablist">
            <button class="manager-subtab active" role="tab" type="button" data-tab="details" aria-selected="true" tabindex="0">
                <span class="manager-subtab-icon" data-icon="CIRCLE_DOT" aria-hidden="true"></span>
                <span>Details</span>
            </button>
            <button class="manager-subtab" role="tab" type="button" data-tab="characters" aria-selected="false" tabindex="-1">
                <span class="manager-subtab-icon" data-icon="PERSON" aria-hidden="true"></span>
                <span>Characters</span>
            </button>
            <button class="manager-subtab" role="tab" type="button" data-tab="apprenticeships" aria-selected="false" tabindex="-1">
                <span class="manager-subtab-icon" data-icon="BOOK" aria-hidden="true"></span>
                <span>Apprenticeships</span>
            </button>
            <button class="manager-subtab" role="tab" type="button" data-tab="analytics" aria-selected="false" tabindex="-1">
                <span class="manager-subtab-icon" data-icon="STAR_4" aria-hidden="true"></span>
                <span>Analytics</span>
            </button>
            <button class="manager-subtab" role="tab" type="button" data-tab="assignments" aria-selected="false" tabindex="-1">
                <span class="manager-subtab-icon" data-icon="PLUS" aria-hidden="true"></span>
                <span>Assignments</span>
            </button>
            <button class="manager-subtab" role="tab" type="button" data-tab="categories" aria-selected="false" tabindex="-1">
                <span class="manager-subtab-icon" data-icon="GEAR" aria-hidden="true"></span>
                <span>Categories</span>
            </button>
        </div>

        <div class="tab-content-wrapper" id="tabContent" role="tabpanel">
            <div class="tab-pane active" id="tab-details"          data-tab-content="details"></div>
            <div class="tab-pane"        id="tab-characters"       data-tab-content="characters"></div>
            <div class="tab-pane"        id="tab-apprenticeships"  data-tab-content="apprenticeships"></div>
            <div class="tab-pane"        id="tab-analytics"        data-tab-content="analytics"></div>
            <div class="tab-pane"        id="tab-assignments"      data-tab-content="assignments"></div>
            <div class="tab-pane"        id="tab-categories"       data-tab-content="categories"></div>
        </div>
    </div>
</div>

<!-- ================================================================
     SCRIPTS — load order

     Religion is loaded on this page despite no role tab reading it
     directly, because culture-queries.js has a LOAD-TIME dependency
     on ReligionQueries (verified by the error:

       "culture-queries.js loaded but window.ReligionQueries is
        missing. Check script tag order."

     ). Culture in turn is a load-time dependency of name-queries.js
     (via CultureQueries.getCultureForCharacter), which is a load-time
     dependency of character-factory.js. The whole chain must be
     present.

     Education and household are NOT loaded — nothing in the role
     tab dependency tree touches them.
     ================================================================ -->

<!-- Core storage + inline initializeStorage() -->
<script src="js/core/storage-schema.js"></script>
<script src="js/core/storage.js"></script>
<script>
    (function () {
        try {
            if (typeof window.initializeStorage === 'function') window.initializeStorage();
        } catch (e) { console.error('[boot] initializeStorage failed:', e); }
    })();
</script>

<!-- Core accessors + PlaceQueries façade -->
<script src="js/core/accessors.js"></script>
<script>
    (function () {
        'use strict';
        window.PlaceQueries = {
            getPlaceById: function (id) {
                if (!window.LocationState
                    || typeof window.LocationState.getPlaceById !== 'function') {
                    return null;
                }
                return window.LocationState.getPlaceById(id);
            },
            getPlaceSummaries: function () {
                return (window.LocationQueries
                    && typeof window.LocationQueries.getPlaceSummaries === 'function')
                    ? window.LocationQueries.getPlaceSummaries()
                    : [];
            },
            getAllPlaces: function () {
                return (typeof window.getPlaces === 'function') ? window.getPlaces() : [];
            }
        };
    })();
</script>

<!-- TABMANAGER SCOPE (before the role tab files register)         -->
<!-- ============================================================ -->
<script>
(function () {
    'use strict';

    if (typeof window.TabManager === 'undefined' || !window.TabManager) {
        return;
    }

    var context = {
        role: null,
        onRerender: function () {
            if (typeof window.__roleManagerRerenderActiveTab === 'function') {
                window.__roleManagerRerenderActiveTab();
            }
        }
    };
    window.RoleTabContext = context;

    window.TabManager.configure('role', {
        containerRoot: function () {
            return document.getElementById('tabContent');
        },
        buildContext: function () {
            if (!context.role) return null;
            return {
                role: context.role,
                onRerender: context.onRerender
            };
        },
        buildEmptyState: function (tabId, reason) {
            if (reason === 'no-renderer') {
                return 'The "' + tabId + '" tab is not available.';
            }
            if (reason === 'no-context') {
                return 'Select a role from the sidebar to view this tab.';
            }
            if (reason === 'no-container') {
                return '';
            }
            return '';
        }
    });
})();
</script>

<!-- ============================================================ -->
<!-- DIAGNOSTIC HOOK                                                -->
<!-- ============================================================ -->
<script>
(function () {
    'use strict';

    window.__roleDiag = {
        snapshot: function (label) {
            label = label || 'snapshot';
            console.group('[role-diag] ' + label);

            var md = window.masterData;
            console.log('masterData present:', !!md);
            console.log('masterData.data present:', !!(md && md.data));
            var inMemoryRoles = (md && md.data && md.data.roles);
            var inMemoryCats = (md && md.data && md.data.roleCategories);
            console.log('masterData.data.roles type:',
                Array.isArray(inMemoryRoles) ? 'array' : typeof inMemoryRoles);
            console.log('masterData.data.roles length:',
                Array.isArray(inMemoryRoles) ? inMemoryRoles.length : '(not array)');
            console.log('masterData.data.roleCategories type:',
                inMemoryCats && typeof inMemoryCats === 'object' && !Array.isArray(inMemoryCats)
                    ? 'object'
                    : typeof inMemoryCats);
            if (Array.isArray(inMemoryRoles)) {
                console.log('masterData.data.roles content:',
                    inMemoryRoles.map(function (r) {
                        return r && r.id ? (r.name || r.id) : '(invalid)';
                    }));
            }

            var keys = Object.keys(localStorage);
            console.log('localStorage keys:', keys);
            var storageKey = null;
            for (var i = 0; i < keys.length; i++) {
                var k = keys[i];
                var v = null;
                try { v = localStorage.getItem(k); } catch (e) {}
                if (v && v.length > 100) {
                    var parsed = null;
                    try { parsed = JSON.parse(v); } catch (e) {}
                    if (parsed && (parsed.data || parsed.schemaVersion)) {
                        storageKey = k;
                        console.log('detected save key:', k, 'length:', v.length);
                        var storageRoles = parsed && parsed.data && parsed.data.roles;
                        console.log('  storage roles type:',
                            Array.isArray(storageRoles) ? 'array' : typeof storageRoles);
                        console.log('  storage roles length:',
                            Array.isArray(storageRoles) ? storageRoles.length : '(not array)');
                        if (Array.isArray(storageRoles)) {
                            console.log('  storage roles content:',
                                storageRoles.map(function (r) {
                                    return r && r.id ? (r.name || r.id) : '(invalid)';
                                }));
                        }
                        console.log('  schemaVersion:', parsed.schemaVersion);
                        console.log('  savedAt:', parsed.savedAt);
                    }
                }
            }
            if (!storageKey) {
                console.warn('No save key detected in localStorage. ' +
                    'Nothing has been persisted under a recognizable schema.');
            }

            if (storageKey && Array.isArray(inMemoryRoles)) {
                var parsed = JSON.parse(localStorage.getItem(storageKey));
                var storageRoles = parsed && parsed.data && parsed.data.roles;
                if (Array.isArray(storageRoles)) {
                    console.log('SAME ROLE COUNT?',
                        inMemoryRoles.length === storageRoles.length,
                        '(memory:', inMemoryRoles.length,
                        'storage:', storageRoles.length, ')');
                }
            }

            console.groupEnd();
            return { storageKey: storageKey };
        },

        saveAndInspect: function () {
            console.group('[role-diag] saveAndInspect');

            if (typeof window.saveMasterData !== 'function') {
                console.error('saveMasterData is not a function. Storage module not loaded.');
                console.groupEnd();
                return;
            }

            var before = window.__roleDiag._countInStorage();
            console.log('storage role count BEFORE save:', before);

            var ok = null;
            try { ok = window.saveMasterData(); }
            catch (e) {
                console.error('saveMasterData threw:', e);
                console.groupEnd();
                return;
            }
            console.log('saveMasterData() returned:', ok);

            if (typeof window.getLastSaveError === 'function') {
                var err = window.getLastSaveError();
                console.log('getLastSaveError():', err);
            }

            var after = window.__roleDiag._countInStorage();
            console.log('storage role count AFTER save:', after);
            console.log('count increased by save?', (after - before));

            window.__roleDiag.snapshot('after-save');
            console.groupEnd();
        },

        _countInStorage: function () {
            var keys = Object.keys(localStorage);
            for (var i = 0; i < keys.length; i++) {
                var v = null;
                try { v = localStorage.getItem(keys[i]); } catch (e) {}
                if (v && v.length > 100) {
                    var parsed = null;
                    try { parsed = JSON.parse(v); } catch (e) {}
                    if (parsed && parsed.data && Array.isArray(parsed.data.roles)) {
                        return parsed.data.roles.length;
                    }
                }
            }
            return -1;
        },

        keys: function () {
            var keys = Object.keys(localStorage);
            console.table(keys.map(function (k) {
                var v = localStorage.getItem(k);
                return {
                    key: k,
                    length: v ? v.length : 0,
                    preview: v ? v.slice(0, 60) : ''
                };
            }));
        }
    };

    console.log('[role-diag] Diagnostic hook installed. ' +
        'Run one of these in the console:\n' +
        '  __roleDiag.snapshot()          — current memory vs storage\n' +
        '  __roleDiag.saveAndInspect()    — force save, then compare\n' +
        '  __roleDiag.keys()              — list localStorage keys\n' +
        '  __roleDiag._countInStorage()   — count roles in storage');

    setTimeout(function () {
        window.__roleDiag.snapshot('after-load');
    }, 500);
})();
</script>

<script>
(function () {
    'use strict';

    var roleContainer  = document.getElementById('roleListContainer');
    var sidebar        = document.getElementById('roleSidebar');
    var sidebarOverlay = document.getElementById('sidebarOverlay');
    var menuToggle     = document.getElementById('menuToggle');
    var yearInput      = document.getElementById('yearInput');
    var setYearBtn     = document.getElementById('setYearBtn');
    var exportBtn      = document.getElementById('exportBtn');
    var importBtn      = document.getElementById('importBtn');
    var fileInput      = document.getElementById('fileInput');
    var createRoleBtn  = document.getElementById('createRoleBtn');
    var editRoleBtn    = document.getElementById('editRoleBtn');
    var deleteRoleBtn  = document.getElementById('deleteRoleBtn');
    var refreshBtn     = document.getElementById('refreshBtn');

    var tabButtons = Array.prototype.slice.call(
        document.querySelectorAll('.manager-subtabs .manager-subtab')
    );

    var selectedRoleId = null;
    var activeTabId    = 'details';
    var isInitialized  = false;

    function bootstrap() {
        if (isInitialized) return;
        isInitialized = true;

        if (typeof window.loadMasterData === 'function') {
            try { window.loadMasterData(); }
            catch (e) {
                console.error('[role-manager] loadMasterData failed:', e);
            }
        }

        if (window.masterData && window.masterData.data) {
            if (!Array.isArray(window.masterData.data.roles)) {
                window.masterData.data.roles = [];
            }
            if (!window.masterData.data.roleCategories
                || typeof window.masterData.data.roleCategories !== 'object'
                || Array.isArray(window.masterData.data.roleCategories)) {
                window.masterData.data.roleCategories = {};
            }
        }

        // RoleState.init() must run AFTER masterData loads.
        if (window.RoleState && typeof window.RoleState.init === 'function') {
            try { window.RoleState.init(); }
            catch (e) {
                console.error('[role-manager] RoleState.init failed:', e);
            }
        }

        if (window.RankBootstrap && typeof window.RankBootstrap.init === 'function') {
            try { window.RankBootstrap.init(); } catch (e) { console.error(e); }
        }
        if (window.LocationBootstrap && typeof window.LocationBootstrap.init === 'function') {
            try { window.LocationBootstrap.init(); } catch (e) { console.error(e); }
        }
        if (window.CultureBootstrap && typeof window.CultureBootstrap.init === 'function') {
            try { window.CultureBootstrap.init(); } catch (e) { console.error(e); }
        }
        if (window.ReligionBootstrap && typeof window.ReligionBootstrap.init === 'function') {
            try { window.ReligionBootstrap.init(); } catch (e) { console.error(e); }
        }
        if (window.TabManager && typeof window.TabManager.init === 'function') {
            try { window.TabManager.init(); } catch (e) {
                console.error('[role-manager] TabManager.init failed:', e);
            }
        }

        // Sidebar refresh hook — tab files call this after mutations.
        window.renderRoleList = renderRoleList;

        // Re-render the current tab (used by the tab files' onRerender).
        window.__roleManagerRerenderActiveTab = function () {
            renderActiveTab();
        };

        injectIcons();
        syncYearInput();
        renderRoleList();
        pickInitialSelection();
        syncTabButtons(activeTabId);
    }

    function injectIcons() {
        if (typeof window.Icons === 'undefined') {
            setTimeout(injectIcons, 100);
            return;
        }
        var nodes = document.querySelectorAll('[data-icon]');
        for (var i = 0; i < nodes.length; i++) {
            var node = nodes[i];
            var name = node.getAttribute('data-icon');
            var svg = window.Icons[name] || window.Icons.CIRCLE || '';
            node.innerHTML = svg;
        }
    }

    function renderRoleList() {
        if (!roleContainer) return;

        var RS = window.RoleState;
        var roles = [];
        if (RS && typeof RS.getAllRoles === 'function') {
            try { roles = RS.getAllRoles() || []; }
            catch (e) {
                console.error('[role-manager] getAllRoles failed:', e);
                roleContainer.innerHTML =
                    '<div class="ct-empty">Role state not initialised.</div>';
                return;
            }
        }

        if (!roles || roles.length === 0) {
            roleContainer.innerHTML =
                '<div class="ct-empty">' +
                '<div>No roles found</div>' +
                '<div class="ct-empty__sub">Click "+ Role" to add one</div>' +
                '</div>';
            return;
        }

        var RUI = window.RoleUI;
        if (RUI && typeof RUI.renderRoleList === 'function') {
            try {
                RUI.renderRoleList(roleContainer.id, {
                    filteredRoles: roles,
                    showStats: false,
                    showActions: false,
                    selectedId: selectedRoleId,
                    rowClass: 'role-row',
                    onSelect: function (id) { selectRole(id); },
                    onEdit: null,
                    onDelete: null
                });
                _highlightSidebarSelection();
                return;
            } catch (e) {
                console.warn('[role-manager] RoleUI.renderRoleList failed, falling back:', e);
            }
        }
        renderRoleListFallback(roles);
    }

    function _highlightSidebarSelection() {
        if (!roleContainer) return;
        var rows = roleContainer.querySelectorAll('[data-role-id]');
        for (var i = 0; i < rows.length; i++) {
            rows[i].classList.toggle(
                'is-selected',
                rows[i].getAttribute('data-role-id') === selectedRoleId
            );
        }
    }

    function renderRoleListFallback(roles) {
        var sorted = roles.slice().sort(function (a, b) {
            return String(a.name || '').localeCompare(String(b.name || ''));
        });
        var html = '<div class="role-list">';
        for (var i = 0; i < sorted.length; i++) {
            var r = sorted[i];
            if (!r || !r.id) continue;
            var sel = r.id === selectedRoleId ? ' is-selected' : '';
            var catLabel = '';
            if (r.category && window.RoleConstants && window.RoleConstants.DEFAULT_ROLE_CATEGORIES
                && window.RoleConstants.DEFAULT_ROLE_CATEGORIES[r.category]) {
                catLabel = ' · ' + window.RoleConstants.DEFAULT_ROLE_CATEGORIES[r.category].name;
            }
            html += '<div class="role-row' + sel + '" data-role-id="' + escapeHtml(r.id) + '">' +
                '<span>' + escapeHtml(r.name || r.id) + '</span>' +
                (catLabel ? '<span style="font-size:0.55rem;color:var(--dim);">' + escapeHtml(catLabel) + '</span>' : '') +
                '</div>';
        }
        html += '</div>';
        roleContainer.innerHTML = html;
        var rows = roleContainer.querySelectorAll('[data-role-id]');
        for (var j = 0; j < rows.length; j++) {
            (function (row) {
                row.addEventListener('click', function () {
                    var id = row.getAttribute('data-role-id');
                    if (id) selectRole(id);
                });
            })(rows[j]);
        }
    }

    function pickInitialSelection() {
        if (selectedRoleId) return;
        var RS = window.RoleState;
        if (!RS || typeof RS.getAllRoles !== 'function') return;
        var roles = [];
        try { roles = RS.getAllRoles() || []; }
        catch (e) { return; }
        if (roles.length > 0 && roles[0] && roles[0].id) {
            selectRole(roles[0].id);
        }
    }

    function selectRole(id) {
        if (!id) return;
        selectedRoleId = id;

        if (editRoleBtn)   editRoleBtn.disabled   = false;
        if (deleteRoleBtn) deleteRoleBtn.disabled = false;

        if (window.RoleTabContext) {
            var fresh = null;
            try {
                fresh = (window.RoleState && typeof window.RoleState.getRole === 'function')
                    ? window.RoleState.getRole(id)
                    : null;
            } catch (e) {
                console.error('[role-manager] getRole failed:', e);
            }
            window.RoleTabContext.role = fresh || null;
        }

        var items = roleContainer ? roleContainer.querySelectorAll('[data-role-id]') : [];
        for (var i = 0; i < items.length; i++) {
            items[i].classList.toggle(
                'is-selected',
                items[i].getAttribute('data-role-id') === id
            );
        }

        renderActiveTab();
        if (window.innerWidth <= 768) closeSidebar();
    }

    function activateTab(tabId) {
        activeTabId = tabId;
        syncTabButtons(tabId);
        renderActiveTab();
    }

    function syncTabButtons(tabId) {
        for (var i = 0; i < tabButtons.length; i++) {
            var btn = tabButtons[i];
            var isActive = btn.dataset.tab === tabId;
            btn.classList.toggle('active', isActive);
            btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
            btn.setAttribute('tabindex', isActive ? '0' : '-1');
        }
        var panes = document.querySelectorAll('#tabContent .tab-pane');
        for (var j = 0; j < panes.length; j++) {
            panes[j].classList.toggle(
                'active',
                panes[j].getAttribute('data-tab-content') === tabId
            );
        }
    }

    for (var i = 0; i < tabButtons.length; i++) {
        (function (btn) {
            btn.addEventListener('click', function () {
                activateTab(btn.dataset.tab);
            });
        })(tabButtons[i]);
    }

    function renderActiveTab() {
        if (window.TabManager && typeof window.TabManager.has === 'function') {
            try {
                if (window.TabManager.has('role', activeTabId)) {
                    window.TabManager.activate('role', activeTabId);
                    return;
                }
                window.TabManager.render('role', activeTabId);
                return;
            } catch (e) {
                console.error(
                    '[role-manager] TabManager activate/render failed for "' +
                    activeTabId + '":', e
                );
            }
        }

        var container = document.getElementById('tab-' + activeTabId);
        if (!container) return;
        container.innerHTML =
            '<div class="ct-empty">Tab system not available. ' +
            'Load js/core/tab-manager.js.</div>';
    }

    function escapeHtml(value) {
        if (typeof window.escapeHtml === 'function') return window.escapeHtml(value);
        if (value === null || value === undefined) return '';
        return String(value)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function openSidebar() {
        if (sidebar) sidebar.classList.add('visible');
        if (sidebarOverlay) sidebarOverlay.classList.add('active');
    }
    function closeSidebar() {
        if (sidebar) sidebar.classList.remove('visible');
        if (sidebarOverlay) sidebarOverlay.classList.remove('active');
    }
    function toggleSidebar() {
        if (!sidebar) return;
        if (sidebar.classList.contains('visible')) closeSidebar();
        else openSidebar();
    }
    if (menuToggle) menuToggle.addEventListener('click', toggleSidebar);
    if (sidebarOverlay) sidebarOverlay.addEventListener('click', closeSidebar);
    window.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeSidebar();
    });

    function syncYearInput() {
        if (!yearInput) return;
        try {
            var y = (typeof window.getCurrentYear === 'function')
                ? window.getCurrentYear()
                : (window.masterData && window.masterData.data
                    ? window.masterData.data.currentYear
                    : null);
            if (typeof y === 'number' && isFinite(y)) {
                yearInput.value = String(y);
            }
        } catch (e) { /* ignore */ }
    }

    if (setYearBtn) setYearBtn.addEventListener('click', function () {
        var val = parseInt(yearInput.value, 10);
        if (!isFinite(val)) { window.alert('Enter a valid year.'); return; }
        if (typeof window.isValidYear === 'function' && !window.isValidYear(val)) {
            window.alert('Year is outside the allowed range.');
            return;
        }
        if (window.masterData && window.masterData.data) {
            window.masterData.data.currentYear = val;
        }
        if (typeof window.markDataDirty === 'function') window.markDataDirty();
        if (typeof window.saveMasterData === 'function') window.saveMasterData();
        renderActiveTab();
    });

    if (exportBtn) exportBtn.addEventListener('click', function () {
        if (typeof window.exportData === 'function') { window.exportData(); return; }
        if (typeof window.exportToJSON === 'function' && window.masterData) {
            window.exportToJSON(window.masterData, 'stillwaters'); return;
        }
        window.alert('Export module not available.');
    });

    if (importBtn && fileInput) {
        importBtn.addEventListener('click', function () {
            fileInput.value = ''; fileInput.click();
        });
        fileInput.addEventListener('change', function () {
            var file = this.files && this.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function (ev) {
                try {
                    var parsed = JSON.parse(ev.target.result);
                    var dataToInstall = null;
                    if (parsed && parsed.data && parsed.data.roles !== undefined) dataToInstall = parsed.data;
                    else if (parsed && parsed.roles !== undefined) dataToInstall = parsed;
                    else if (parsed && parsed.data) dataToInstall = parsed.data;
                    if (!dataToInstall) { window.alert('Unrecognized import format.'); return; }

                    if (typeof window.normalizeMasterData !== 'function') {
                        window.alert('Schema module not available; cannot import.'); return;
                    }
                    window.masterData = window.normalizeMasterData({
                        schemaVersion: window.STORAGE_SCHEMA_VERSION,
                        savedAt: new Date().toISOString(),
                        data: dataToInstall
                    });
                    if (typeof window.invalidateAccessorCaches === 'function') window.invalidateAccessorCaches();
                    if (typeof window.markDataDirty === 'function') window.markDataDirty();
                    if (typeof window.saveMasterData === 'function' && !window.saveMasterData()) {
                        window.alert('Save failed after import.'); return;
                    }

                    // RoleState.init() short-circuits if already
                    // initialised. There is no RoleState.reload(). Reload
                    // the page so the new role state hydrates cleanly.
                    window.alert('Import complete. Reloading to re-hydrate role state…');
                    window.location.reload();
                } catch (err) {
                    window.alert('Invalid JSON: ' + err.message);
                }
            };
            reader.onerror = function () { window.alert('Failed to read file.'); };
            reader.readAsText(file);
            this.value = '';
        });
    }

    if (refreshBtn) refreshBtn.addEventListener('click', function () {
        window.location.reload();
    });

    function openCreateRole() {
        if (typeof window.openCreateRoleModal !== 'function') {
            window.alert('Create Role modal not loaded (modals-roles.js).');
            return;
        }
        window.openCreateRoleModal(function (newRoleId) {
            renderRoleList();
            if (newRoleId) selectRole(newRoleId);
        });
    }

    function openEditRole(id) {
        if (typeof window.openEditRoleModal !== 'function') {
            window.alert('Edit Role modal not loaded (modals-roles.js).');
            return;
        }
        window.openEditRoleModal(id, function () {
            renderRoleList();
            if (window.RoleTabContext) {
                var fresh = null;
                try {
                    fresh = (window.RoleState && typeof window.RoleState.getRole === 'function')
                        ? window.RoleState.getRole(id)
                        : null;
                } catch (e) { /* ignore */ }
                window.RoleTabContext.role = fresh || null;
            }
            renderActiveTab();
        });
    }

    function openDeleteRole(id) {
        if (typeof window.openDeleteRoleModal !== 'function') {
            window.alert('Delete Role modal not loaded (modals-roles.js).');
            return;
        }
        window.openDeleteRoleModal(id, function () {
            if (selectedRoleId === id) {
                selectedRoleId = null;
                if (editRoleBtn)   editRoleBtn.disabled   = true;
                if (deleteRoleBtn) deleteRoleBtn.disabled = true;
                if (window.RoleTabContext) window.RoleTabContext.role = null;
            }
            renderRoleList();
            pickInitialSelection();
        });
    }

    if (createRoleBtn) createRoleBtn.addEventListener('click', openCreateRole);
    if (editRoleBtn)   editRoleBtn.addEventListener('click', function () {
        if (selectedRoleId) openEditRole(selectedRoleId);
    });
    if (deleteRoleBtn) deleteRoleBtn.addEventListener('click', function () {
        if (selectedRoleId) openDeleteRole(selectedRoleId);
    });

    window.addEventListener('masterDataUpdated', function () {
        renderRoleList();
        if (selectedRoleId) {
            if (window.RoleTabContext) {
                var fresh = null;
                try {
                    fresh = (window.RoleState && typeof window.RoleState.getRole === 'function')
                        ? window.RoleState.getRole(selectedRoleId)
                        : null;
                } catch (e) { /* ignore */ }
                window.RoleTabContext.role = fresh || null;
            }
            renderActiveTab();
        }
    });

    function onDomReady(fn) {
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', fn);
        } else {
            fn();
        }
    }
    onDomReady(bootstrap);
})();
</script>

<!-- THEME SWITCHER                                                -->
<!-- ============================================================ -->
<script>
(function () {
    'use strict';

    var STORAGE_KEY = 'stillwaters_theme';

    var THEMES = [
        { id: 'dark',            label: 'Dark' },
        { id: 'light',           label: 'Light' },
        { id: 'vaporwave',       label: 'Vaporwave' },
        { id: 'pastel',          label: 'Pastel' },
        { id: 'carnival',        label: 'Carnival' },
        { id: 'maximal',         label: 'Maximal' },
        { id: 'gits',            label: 'GITS' },
        { id: 'nouveau',         label: 'Nouveau' },
        { id: 'ukiyo-e',         label: 'Ukiyo-e' },
        { id: 'nature',          label: 'Nature' },
        { id: 'kmt',             label: 'KMT' },
        { id: 'gaslight',        label: 'Gaslight' },
        { id: 'grotesque',       label: 'Grotesque' },
        { id: 'illuminated',     label: 'Illuminated' },
        { id: 'discowing',       label: 'Discowing' },
        { id: 'choc-cake',       label: 'Choc Cake' },
        { id: 'dada',            label: 'Dada' },
        { id: 'brutalist',       label: 'Brutalist' },
        { id: 'orchestrion',     label: 'Orchestrion' },
        { id: 'rococo',          label: 'Rococo' },
        { id: 'nautical-tile',   label: 'Nautical Tile' }
    ];

    var byId = {};
    for (var i = 0; i < THEMES.length; i++) byId[THEMES[i].id] = THEMES[i];

    var themeBtn  = document.getElementById('themeBtn');
    var themeMenu = document.getElementById('themeMenu');
    var themeName = document.getElementById('themeName');

    function apply(id) {
        if (!byId[id]) id = 'dark';
        document.documentElement.setAttribute('data-theme', id);
        themeName.textContent = byId[id].label;
        try { localStorage.setItem(STORAGE_KEY, id); } catch (e) {}
    }

    function buildMenu() {
        var html = '';
        for (var i = 0; i < THEMES.length; i++) {
            html += '<li role="none"><button role="menuitem" type="button" data-theme-id="' +
                THEMES[i].id + '">' + THEMES[i].label + '</button></li>';
        }
        themeMenu.innerHTML = html;
    }

    function openMenu() {
        themeMenu.hidden = false;
        themeBtn.setAttribute('aria-expanded', 'true');
    }
    function closeMenu() {
        themeMenu.hidden = true;
        themeBtn.setAttribute('aria-expanded', 'false');
    }

    if (themeBtn) themeBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        if (themeMenu.hidden) openMenu(); else closeMenu();
    });

    if (themeMenu) themeMenu.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-theme-id]');
        if (!btn) return;
        apply(btn.getAttribute('data-theme-id'));
        closeMenu();
    });

    document.addEventListener('click', function (e) {
        if (!themeMenu || themeMenu.hidden) return;
        if (themeMenu.contains(e.target)) return;
        if (e.target === themeBtn) return;
        closeMenu();
    });

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && themeMenu && !themeMenu.hidden) closeMenu();
    });

    var saved = null;
    try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) {}

    buildMenu();

    if (saved && byId[saved]) {
        apply(saved);
    } else {
        var mq = window.matchMedia('(prefers-color-scheme: light)');
        apply(mq.matches ? 'light' : 'dark');
        mq.addEventListener('change', function (ev) {
            var check;
            try { check = localStorage.getItem(STORAGE_KEY); } catch (e) {}
            if (!check) apply(ev.matches ? 'light' : 'dark');
        });
    }

    window.ThemeSwitcher = { apply: apply, themes: THEMES.slice() };
})();
</script>
