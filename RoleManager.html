    <!-- ============================================================ -->
    <!-- LOAD LOCALSTORAGE DATA FIRST                                  -->
    <!-- ============================================================ -->
    <script>
        (function() {
            'use strict';
            try {
                var STORAGE_KEY = 'stillwaters_master';
                var stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    var parsed = JSON.parse(stored);
                    if (parsed && parsed.data) {
                        window.masterData = parsed;
                    }
                }
            } catch(e) {}

            if (!window.masterData || !window.masterData.data) {
                window.masterData = {
                    version: '2.0',
                    lastUpdated: new Date().toISOString(),
                    data: {
                        characters: [],
                        places: [],
                        ranks: [],
                        roles: [],
                        roleCategories: {},
                        households: [],
                        residences: [],
                        relationships: [],
                        currentYear: 1250
                    }
                };
            }
        })();
    </script>

    <!-- ============================================================ -->
    <!-- SET TAB ICONS AFTER ICONS.JS LOADS                           -->
    <!-- ============================================================ -->
    <script>
        function setTabIcons() {
            var icons = window.Icons || {};
            var detailsIcon = document.getElementById('icon-details');
            var appsIcon = document.getElementById('icon-apprenticeships');
            var statsIcon = document.getElementById('icon-statistics');
            
            if (detailsIcon && icons.CIRCLE_DOT) {
                detailsIcon.innerHTML = icons.CIRCLE_DOT;
            } else if (detailsIcon) {
                detailsIcon.textContent = '◉';
            }
            
            if (appsIcon && icons.PERSON) {
                appsIcon.innerHTML = icons.PERSON;
            } else if (appsIcon) {
                appsIcon.textContent = '⌇';
            }
            
            if (statsIcon && icons.CHART) {
                statsIcon.innerHTML = icons.CHART || icons.GEAR || '▦';
            } else if (statsIcon) {
                statsIcon.textContent = '▦';
            }
        }

        // Try immediately, and again after icons load
        if (document.readyState === 'complete') {
            setTimeout(setTabIcons, 100);
        }
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(setTabIcons, 200);
        });
    </script>

    <!-- MAIN APP SCRIPT                                              -->

    <script>
        (function() {
            'use strict';

            var sidebar = document.getElementById('sidebar');
            var burgerBtn = document.getElementById('burgerBtn');
            var roleListContainer = document.getElementById('roleListContainer');
            var exportBtn = document.getElementById('exportBtn');
            var importBtn = document.getElementById('importBtn');
            var fileInput = document.getElementById('fileInput');
            var yearInput = document.getElementById('yearInput');
            var setYearBtn = document.getElementById('setYearBtn');
            var createRoleBtn = document.getElementById('createRoleBtn');
            var refreshBtn = document.getElementById('refreshBtn');

            var isInitialized = false;

            // ============================================================
            // SIDEBAR TOGGLE
            // ============================================================
            function toggleSidebar() {
                sidebar.classList.toggle('open');
            }

            function closeSidebar() {
                sidebar.classList.remove('open');
            }

            burgerBtn.addEventListener('click', toggleSidebar);

            document.addEventListener('click', function(e) {
                if (window.innerWidth <= 768) {
                    if (!sidebar.contains(e.target) && e.target !== burgerBtn) {
                        closeSidebar();
                    }
                }
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeSidebar();
            });

            window.addEventListener('resize', function() {
                if (window.innerWidth > 768) closeSidebar();
            });

            // ============================================================
            // GET/SET FULL DATA
            // ============================================================
            function getFullData() {
                if (typeof window.masterData !== 'undefined' && window.masterData) {
                    return window.masterData;
                }
                return null;
            }

            function setFullData(data) {
                if (data && data.data) {
                    window.masterData = data;
                } else if (data && data.roles) {
                    window.masterData = {
                        version: '2.0',
                        lastUpdated: new Date().toISOString(),
                        data: data
                    };
                } else {
                    return false;
                }

                try {
                    localStorage.setItem('stillwaters_master', JSON.stringify(window.masterData));
                } catch(e) {}

                if (typeof window.saveMasterData === 'function') {
                    window.saveMasterData(true);
                }
                if (typeof window.invalidateAccessorCaches === 'function') {
                    window.invalidateAccessorCaches();
                }
                if (typeof window.RoleState !== 'undefined' &&
                    typeof window.RoleState._rebuildCaches === 'function') {
                    window.RoleState._rebuildCaches();
                }

                return true;
            }

            // ============================================================
            // RENDER ROLE LIST
            // ============================================================
            function renderRoleList() {
                if (!roleListContainer) return;

                var RQ = window.RoleQueries;
                var RUI = window.RoleUI;

                if (!RQ || !RUI || typeof RUI.renderRoleList !== 'function') {
                    roleListContainer.innerHTML = '<div style="text-align:center;padding:20px;color:var(--dim);font-size:0.7rem;">Loading roles...</div>';
                    return;
                }

                var roles = RQ.getRoles({});
                if (!roles || roles.length === 0) {
                    roleListContainer.innerHTML = 
                        '<div style="text-align:center;padding:30px;color:var(--dim);font-size:0.7rem;">' +
                        'No roles found. Click "+ Role" to create one.' +
                        '</div>';
                    document.getElementById('roleCount').textContent = '0';
                    return;
                }

                document.getElementById('roleCount').textContent = roles.length;

                var selectedId = null;
                if (typeof window.RolesTab !== 'undefined') {
                    selectedId = window.RolesTab.getSelectedRole ? window.RolesTab.getSelectedRole() : window.RolesTab._selectedRoleId;
                }
                if (!selectedId && window._selectedRoleId) {
                    selectedId = window._selectedRoleId;
                }

                try {
                    RUI.renderRoleList('roleListContainer', {
                        filteredRoles: roles,
                        selectedId: selectedId,
                        showStats: false,
                        showActions: false,
                        rowClass: 'role-sidebar-item',
                        onSelect: function(roleId) {
                            if (typeof window.RolesTab !== 'undefined') {
                                if (typeof window.RolesTab.setSelectedRole === 'function') {
                                    window.RolesTab.setSelectedRole(roleId);
                                } else {
                                    window.RolesTab._selectedRoleId = roleId;
                                    window._selectedRoleId = roleId;
                                    if (typeof window.RolesTab.renderRoleDetail === 'function') {
                                        window.RolesTab.renderRoleDetail('tab-details');
                                    }
                                }
                            } else {
                                window._selectedRoleId = roleId;
                            }
                            
                            if (typeof window.ApprenticeshipTab !== 'undefined' && 
                                typeof window.ApprenticeshipTab.setSelectedRole === 'function') {
                                window.ApprenticeshipTab.setSelectedRole(roleId);
                            }
                            
                            if (typeof window.RolesAnalyticsTab !== 'undefined' && 
                                typeof window.RolesAnalyticsTab.setSelectedRole === 'function') {
                                window.RolesAnalyticsTab.setSelectedRole(roleId);
                            } else if (typeof window.RolesAnalyticsTab !== 'undefined') {
                                window.RolesAnalyticsTab._selectedRoleId = roleId;
                                window._selectedRoleId = roleId;
                                if (typeof window.RolesAnalyticsTab.renderAnalyticsTab === 'function') {
                                    window.RolesAnalyticsTab.renderAnalyticsTab('tab-statistics');
                                }
                            }
                            
                            renderRoleList();
                            if (window.innerWidth <= 768) closeSidebar();
                        },
                        onEdit: function(roleId) {
                            if (typeof window.openEditRoleModal === 'function') {
                                window.openEditRoleModal(roleId, function() {
                                    renderRoleList();
                                    if (typeof window.RolesTab !== 'undefined' && 
                                        typeof window.RolesTab.renderRoleDetail === 'function') {
                                        window.RolesTab.renderRoleDetail('tab-details');
                                    }
                                });
                            }
                        },
                        onDelete: function(roleId) {
                            if (typeof window.openDeleteRoleModal === 'function') {
                                window.openDeleteRoleModal(roleId, function() {
                                    if (typeof window.RolesTab !== 'undefined') {
                                        window.RolesTab._selectedRoleId = null;
                                        window._selectedRoleId = null;
                                        if (typeof window.RolesTab.renderRoleDetail === 'function') {
                                            window.RolesTab.renderRoleDetail('tab-details');
                                        }
                                    }
                                    renderRoleList();
                                });
                            }
                        },
                        emptyMessage: 'No roles found'
                    });

                } catch(e) {
                    console.error('renderRoleList error:', e);
                    roleListContainer.innerHTML = '<div style="text-align:center;padding:20px;color:var(--danger);font-size:0.7rem;">Error loading roles</div>';
                }
            }

            // ============================================================
            // IMPORT / EXPORT
            // ============================================================
            exportBtn.addEventListener('click', function() {
                var data = getFullData();
                if (!data) {
                    alert('No data to export');
                    return;
                }
                var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = 'stillwaters_export_' + Date.now() + '.json';
                a.click();
                URL.revokeObjectURL(url);
            });

            importBtn.addEventListener('click', function() {
                fileInput.value = '';
                fileInput.click();
            });

            fileInput.addEventListener('change', function() {
                var file = this.files[0];
                if (!file) return;

                var reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        var imported = JSON.parse(e.target.result);
                        var dataToImport = null;

                        if (imported.data && imported.version) {
                            dataToImport = imported;
                        } else if (imported.roles || imported.characters || imported.relationships) {
                            dataToImport = {
                                version: '2.0',
                                lastUpdated: new Date().toISOString(),
                                data: imported
                            };
                        } else if (imported.data) {
                            dataToImport = {
                                version: '2.0',
                                lastUpdated: new Date().toISOString(),
                                data: imported.data
                            };
                        }

                        if (!dataToImport) {
                            alert('Invalid format: Could not recognize data structure.');
                            return;
                        }

                        if (setFullData(dataToImport)) {
                            renderRoleList();
                            if (typeof window.RolesTab !== 'undefined' && 
                                typeof window.RolesTab.renderRoleDetail === 'function') {
                                window.RolesTab.renderRoleDetail('tab-details');
                            }
                            if (typeof window.ApprenticeshipTab !== 'undefined' && 
                                typeof window.ApprenticeshipTab.renderApprenticeshipList === 'function') {
                                window.ApprenticeshipTab.renderApprenticeshipList('tab-apprenticeships');
                            }
                            if (typeof window.RolesAnalyticsTab !== 'undefined' && 
                                typeof window.RolesAnalyticsTab.renderAnalyticsTab === 'function') {
                                window.RolesAnalyticsTab.renderAnalyticsTab('tab-statistics');
                            }
                        } else {
                            alert('Import failed');
                        }
                    } catch(err) {
                        alert('Invalid JSON: ' + err.message);
                    }
                };
                reader.readAsText(file);
                this.value = '';
            });

            // ============================================================
            // YEAR SETTER
            // ============================================================
            setYearBtn.addEventListener('click', function() {
                var val = parseInt(yearInput.value, 10);
                if (!isNaN(val) && window.masterData) {
                    window.masterData.data.currentYear = val;
                    try {
                        localStorage.setItem('stillwaters_master', JSON.stringify(window.masterData));
                    } catch(e) {}
                    if (typeof window.saveMasterData === 'function') {
                        window.saveMasterData(true);
                    }
                }
            });

            // ============================================================
            // BUTTON HANDLERS
            // ============================================================
            createRoleBtn.addEventListener('click', function() {
                if (typeof window.openCreateRoleModal === 'function') {
                    window.openCreateRoleModal(function() {
                        renderRoleList();
                        if (typeof window.RolesTab !== 'undefined' && 
                            typeof window.RolesTab.renderRoleDetail === 'function') {
                            window.RolesTab.renderRoleDetail('tab-details');
                        }
                        if (typeof window.RolesAnalyticsTab !== 'undefined' && 
                            typeof window.RolesAnalyticsTab.renderAnalyticsTab === 'function') {
                            window.RolesAnalyticsTab.renderAnalyticsTab('tab-statistics');
                        }
                    });
                } else {
                    alert('Role system not loaded');
                }
            });

            refreshBtn.addEventListener('click', function() {
                renderRoleList();
                if (typeof window.RolesTab !== 'undefined' && 
                    typeof window.RolesTab.renderRoleDetail === 'function') {
                    window.RolesTab.renderRoleDetail('tab-details');
                }
                if (typeof window.ApprenticeshipTab !== 'undefined' && 
                    typeof window.ApprenticeshipTab.renderApprenticeshipList === 'function') {
                    window.ApprenticeshipTab.renderApprenticeshipList('tab-apprenticeships');
                }
                if (typeof window.RolesAnalyticsTab !== 'undefined' && 
                    typeof window.RolesAnalyticsTab.renderAnalyticsTab === 'function') {
                    window.RolesAnalyticsTab.renderAnalyticsTab('tab-statistics');
                }
            });

            // ============================================================
            // TAB CLICK HANDLERS
            // ============================================================
            document.querySelectorAll('[data-tab]').forEach(function(tabBtn) {
                tabBtn.addEventListener('click', function(e) {
                    var tabId = this.dataset.tab;
                    
                    document.querySelectorAll('[data-tab]').forEach(function(t) {
                        t.classList.remove('active');
                    });
                    this.classList.add('active');
                    
                    document.querySelectorAll('.tab-pane').forEach(function(pane) {
                        pane.classList.remove('active');
                        pane.style.display = 'none';
                    });
                    
                    var targetPane = document.getElementById('tab-' + tabId);
                    if (targetPane) {
                        targetPane.classList.add('active');
                        targetPane.style.display = 'block';
                        
                        switch (tabId) {
                            case 'details':
                                if (typeof window.RolesTab !== 'undefined' && 
                                    typeof window.RolesTab.renderRoleDetail === 'function') {
                                    window.RolesTab.renderRoleDetail('tab-details');
                                }
                                break;
                            case 'apprenticeships':
                                if (typeof window.ApprenticeshipTab !== 'undefined' && 
                                    typeof window.ApprenticeshipTab.renderApprenticeshipList === 'function') {
                                    window.ApprenticeshipTab.renderApprenticeshipList('tab-apprenticeships');
                                }
                                break;
                            case 'statistics':
                                if (typeof window.RolesAnalyticsTab !== 'undefined' && 
                                    typeof window.RolesAnalyticsTab.renderAnalyticsTab === 'function') {
                                    var roleId = window._selectedRoleId || 
                                                 (window.RolesTab ? window.RolesTab._selectedRoleId : null);
                                    if (roleId && typeof window.RolesAnalyticsTab.setSelectedRole === 'function') {
                                        window.RolesAnalyticsTab.setSelectedRole(roleId);
                                    } else {
                                        window.RolesAnalyticsTab.renderAnalyticsTab('tab-statistics');
                                    }
                                }
                                break;
                        }
                    }
                });
            });

            // ============================================================
            // INIT
            // ============================================================
            function init() {
                if (isInitialized) return;
                isInitialized = true;

                if (typeof window.RolesTab !== 'undefined' && 
                    typeof window.RolesTab.init === 'function') {
                    window.RolesTab.init('tab-details');
                }

                if (typeof window.ApprenticeshipTab !== 'undefined' && 
                    typeof window.ApprenticeshipTab.init === 'function') {
                    window.ApprenticeshipTab.init('tab-apprenticeships');
                }

                if (typeof window.RolesAnalyticsTab !== 'undefined' && 
                    typeof window.RolesAnalyticsTab.init === 'function') {
                    window.RolesAnalyticsTab.init('tab-statistics');
                }

                if (typeof window.RoleState === 'undefined' || 
                    typeof window.RoleQueries === 'undefined') {
                    roleListContainer.innerHTML = 
                        '<div style="text-align:center;padding:20px;color:var(--danger);font-size:0.7rem;">' +
                        'Role system not loaded. Check script paths.' +
                        '</div>';
                    return;
                }

                renderRoleList();

                var roles = window.RoleQueries.getRoles({});
                if (roles && roles.length > 0) {
                    var firstRoleId = roles[0].id;
                    window._selectedRoleId = firstRoleId;
                    
                    if (typeof window.RolesTab !== 'undefined') {
                        if (typeof window.RolesTab.setSelectedRole === 'function') {
                            window.RolesTab.setSelectedRole(firstRoleId);
                        } else {
                            window.RolesTab._selectedRoleId = firstRoleId;
                            if (typeof window.RolesTab.renderRoleDetail === 'function') {
                                window.RolesTab.renderRoleDetail('tab-details');
                            }
                        }
                    }
                    
                    if (typeof window.ApprenticeshipTab !== 'undefined' && 
                        typeof window.ApprenticeshipTab.setSelectedRole === 'function') {
                        window.ApprenticeshipTab.setSelectedRole(firstRoleId);
                    }
                    
                    if (typeof window.RolesAnalyticsTab !== 'undefined' && 
                        typeof window.RolesAnalyticsTab.setSelectedRole === 'function') {
                        window.RolesAnalyticsTab.setSelectedRole(firstRoleId);
                    }
                    
                    renderRoleList();
                }

                var firstTab = document.querySelector('[data-tab]');
                if (firstTab) {
                    firstTab.click();
                }
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', function() {
                    setTimeout(init, 500);
                });
            } else {
                setTimeout(init, 500);
            }

        })();
    </script>

</body>
</html>
