/* Matchmaker-specific presentation. All colours and shapes come from themes.css. */
html, body { height: 100%; overflow: auto; }

.matchmaker-topbar .tb-btn { appearance:none; color:var(--text); background:var(--bg); border:1px solid var(--border); border-radius:var(--radius); padding:.3rem .6rem; font:inherit; font-size:.72rem; cursor:pointer; }
.matchmaker-topbar .tb-btn:hover { color:var(--accent); border-color:var(--accent); }

.matchmaker-topbar .year-input label { color:var(--dim); font-size:.7rem; }

.matchmaker-topbar .spacer { flex:1; min-width:.4rem; }
.matchmaker-topbar .theme-toggle { position:relative; }
.matchmaker-topbar .theme-toggle__menu { position:absolute; z-index:1000; right:0; top:calc(100% + .35rem); min-width:10rem; max-height:65vh; overflow:auto; margin:0; padding:.3rem; list-style:none; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); }
.matchmaker-topbar .theme-toggle__menu[hidden] { display:none; }

<script>
(function () {
 'use strict';
 var $=function(id){return document.getElementById(id);};
 var yearInput=$('yearInput'),setYearBtn=$('setYearBtn'),importBtn=$('importBtn'),exportBtn=$('exportBtn');
 function toast(m,t){if(typeof window.showToast==='function')window.showToast(m,t||'info');else if(typeof window._showToast==='function')window._showToast(m,t||'info');else console[t==='error'?'error':'log'](m);}
 function syncYear(){if(!yearInput)return;var y=typeof window.getCurrentYear==='function'?window.getCurrentYear():(window.masterData&&window.masterData.data&&window.masterData.data.currentYear);yearInput.value=Number.isFinite(Number(y))?String(y):'';}
 function setYear(){var y=parseInt(yearInput&&yearInput.value,10);if(!Number.isInteger(y)||(typeof window.isValidYear==='function'&&window.isValidYear(y)!==true)){toast('Please enter a valid year.','error');syncYear();return;}if(!window.masterData||!window.masterData.data){toast('World data is not initialized.','error');return;}var old=window.masterData.data.currentYear;try{if(typeof window.setCurrentYear==='function'){var r=window.setCurrentYear(y);if(r===false||(r&&r.success===false))throw new Error(r.message||r.reason||'Year change rejected.');}window.masterData.data.currentYear=y;if(typeof window.saveMasterData==='function'&&window.saveMasterData()!==true)throw new Error(window.getLastSaveError&&window.getLastSaveError()?window.getLastSaveError().message:'Save failed.');syncYear();toast('Year set to '+y+'.','success');window.dispatchEvent(new CustomEvent('masterDataUpdated',{detail:{source:'year-change'}}));}catch(e){window.masterData.data.currentYear=old;syncYear();toast('Year was not saved: '+(e.message||e),'error');}}
 if(setYearBtn)setYearBtn.addEventListener('click',setYear);if(yearInput)yearInput.addEventListener('keydown',function(e){if(e.key==='Enter')setYear();});syncYear();
 if(exportBtn)exportBtn.addEventListener('click',function(){try{if(typeof window.exportData!=='function')throw new Error('Export utility unavailable.');if(typeof window.saveMasterData==='function'&&window.saveMasterData()!==true)throw new Error('Latest changes could not be saved.');window.exportData();toast('World data exported.','success');}catch(e){toast('Export failed: '+(e.message||e),'error');}});
 if(importBtn)importBtn.addEventListener('click',function(){if(typeof window.importData!=='function'){toast('Import utility unavailable.','error');return;}window.importData().then(function(){toast('Import complete. Reloading Matchmaker…','success');window.location.reload();}).catch(function(e){if(e&&e.message==='No file selected')return;toast('Import failed: '+(e&&e.message||e),'error');});});
 var sw=window.ThemeSwitcher,btn=$('themeBtn'),menu=$('themeMenu'),name=$('themeName');
 function label(id){return id.split('-').map(function(p){return p==='kmt'?'KMT':p==='gits'?'GITS':p.charAt(0).toUpperCase()+p.slice(1);}).join(' ');}
 function syncTheme(){var id=document.documentElement.getAttribute('data-theme')||'dark';if(name)name.textContent=label(id);if(menu)Array.prototype.forEach.call(menu.querySelectorAll('[data-theme-id]'),function(b){b.setAttribute('aria-current',b.getAttribute('data-theme-id')===id?'true':'false');});}
 if(sw&&Array.isArray(sw.themes)&&menu){menu.innerHTML=sw.themes.map(function(id){return '<li role="none"><button type="button" role="menuitem" data-theme-id="'+id+'">'+label(id)+'</button></li>';}).join('');btn.addEventListener('click',function(){menu.hidden=!menu.hidden;btn.setAttribute('aria-expanded',String(!menu.hidden));});menu.addEventListener('click',function(e){var b=e.target.closest('[data-theme-id]');if(!b)return;sw.apply(b.getAttribute('data-theme-id'));syncTheme();menu.hidden=true;btn.setAttribute('aria-expanded','false');});document.addEventListener('click',function(e){if(!menu.hidden&&!menu.contains(e.target)&&!btn.contains(e.target)){menu.hidden=true;btn.setAttribute('aria-expanded','false');}});document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!menu.hidden){menu.hidden=true;btn.setAttribute('aria-expanded','false');btn.focus();}});syncTheme();}else if(btn){btn.disabled=true;btn.title='Theme switcher unavailable';}
})();
</script>
